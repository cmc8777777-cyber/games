const EQ={filter:['Фильтр',1500,'нитраты растут на 40 % медленнее'],aer:['Аэратор',900,'вместимость по кислороду +30 %'],lamp:['Лампа',700,'растения лучше чистят воду, +5 % привлекательности'],feeder:['Автокормушка',2200,'выдаёт ровно норму корма'],decor:['Декор (замок)',1200,'+10 % привлекательности']};

// ---- слой Yandex SDK (заглушка)
/* Слой платформы: Яндекс Игры SDK (если страница запущена на площадке), пауза, реклама, облачное сохранение.
   Без SDK (сайт, артефакт, локально) все вызовы работают как заглушки, игра играбельна полностью.
   Хранилище игры ходит через PF.get/put/del: localStorage + зеркало в памяти + облако. Образец: kugosvetka\src\data\platform.js */
window.PF = (function () {
  "use strict";
  var ysdk = null, player = null;
  var sdkOk = false, cloudOk = false, gaveUp = false;
  var wantReady = false, readyDone = false;
  var adBusy = false, tabHidden = false, apiPaused = false;
  var gpOn = false, wantGp = false;
  var lastAdAt = 0, bornAt = Date.now();
  var AD_FIRST_MS = 120000, AD_GAP_MS = 180000;   // первая полноэкранная не раньше 2 минут после загрузки, дальше не чаще раза в 3 минуты
  var INIT_TIMEOUT_MS = 4000, SYNC_DELAY_MS = 2500;
  var T_KEY = "akv-syncT";
  var mem = {}, dirty = false, syncTimer = 0;
  var self = { onPause: function () {} };

  function isSynced(k) { return k === "akvarium-save-v1" || k === "akvarium-best"; }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function seedMem() {
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (isSynced(k) || k === T_KEY) mem[k] = localStorage.getItem(k); } } catch (e) {}
  }
  function localT() { return Number(mem[T_KEY]) || 0; }
  function schedule() { if (!syncTimer && player && cloudOk) syncTimer = setTimeout(function () { flush(false); }, SYNC_DELAY_MS); }
  function touch() { var t = String(Date.now()); mem[T_KEY] = t; lsSet(T_KEY, t); dirty = true; schedule(); }
  self.get = function (k) {
    if (Object.prototype.hasOwnProperty.call(mem, k)) return mem[k];
    try { return localStorage.getItem(k); } catch (e) { return null; }
  };
  self.put = function (k, raw) { mem[k] = raw; lsSet(k, raw); if (isSynced(k)) touch(); };
  self.del = function (k) { delete mem[k]; lsDel(k); if (isSynced(k)) touch(); };

  function importCloud(data) {
    var d = data && typeof data === "object" ? data : {};
    var ct = Number(d._t) || 0, blob = d.d && typeof d.d === "object" ? d.d : null;
    if (blob && ct > localT()) {
      Object.keys(mem).forEach(function (k) { if (isSynced(k)) { delete mem[k]; lsDel(k); } });
      Object.keys(blob).forEach(function (k) { if (isSynced(k) && typeof blob[k] === "string") { mem[k] = blob[k]; lsSet(k, blob[k]); } });
      mem[T_KEY] = String(ct); lsSet(T_KEY, String(ct));
      dirty = false;
    } else if (localT() > ct) { dirty = true; }
    cloudOk = true;
    if (dirty) schedule();
  }
  function flush(now) {
    clearTimeout(syncTimer); syncTimer = 0;
    if (!dirty || !player || !cloudOk) return;
    var d = {};
    Object.keys(mem).forEach(function (k) { if (isSynced(k) && mem[k] != null) d[k] = mem[k]; });
    dirty = false;
    try {
      var p = player.setData({ v: 1, _t: localT(), d: d }, !!now);
      if (p && p.catch) p.catch(function () { dirty = true; });
    } catch (e) { dirty = true; }
  }

  self.paused = function () { return adBusy || tabHidden || apiPaused; };
  function applyGp() {
    if (!sdkOk || !readyDone) return;
    var should = wantGp && !self.paused();
    if (should === gpOn) return;
    gpOn = should;
    try { var g = ysdk.features && ysdk.features.GameplayAPI; if (g) { if (should) g.start(); else g.stop(); } } catch (e) {}
  }
  function changed() { applyGp(); try { self.onPause(self.paused()); } catch (e) {} }
  function onVis() { tabHidden = !!document.hidden; if (tabHidden) flush(true); changed(); }
  self.setPlaying = function (on) { wantGp = !!on; applyGp(); };

  function tryReady() {
    if (readyDone || !wantReady || !sdkOk) return;
    readyDone = true;
    try { var l = ysdk.features && ysdk.features.LoadingAPI; if (l) l.ready(); } catch (e) {}
    applyGp();
  }
  self.ready = function () { wantReady = true; tryReady(); };
  self.init = function () {
    seedMem();
    try { document.addEventListener("visibilitychange", onVis); window.addEventListener("pagehide", function () { flush(true); }); } catch (e) {}
    if (!window.YaGames || !window.YaGames.init) return Promise.resolve();
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { gaveUp = true; resolve(); }, INIT_TIMEOUT_MS);
      function fin() { clearTimeout(timer); resolve(); }
      window.YaGames.init().then(function (sdk) {
        ysdk = sdk; sdkOk = true;
        try {
          sdk.on("game_api_pause", function () { apiPaused = true; changed(); });
          sdk.on("game_api_resume", function () { apiPaused = false; changed(); });
        } catch (e) {}
        tryReady();
        return sdk.getPlayer({ scopes: false }).then(function (p) { player = p; return p.getData(); })
          .then(function (data) { if (!gaveUp) importCloud(data); }, function () {});
      }).then(fin, fin);
    });
  };
  self.hasSdk = function () { return sdkOk; };

  function adBegin() { adBusy = true; changed(); }
  function adEnd() { adBusy = false; changed(); }
  /* Полноэкранная реклама в логической паузе; done вызывается ровно один раз (или сразу, если рекламы нет / рано). */
  self.interstitial = function (done) {
    if (adBusy) return;
    var now = Date.now(), allowedAt = lastAdAt ? lastAdAt + AD_GAP_MS : bornAt + AD_FIRST_MS;
    if (!sdkOk || !ysdk.adv || !ysdk.adv.showFullscreenAdv || now < allowedAt) { done(); return; }
    var fin = false;
    function end(shown) { if (fin) return; fin = true; if (shown) lastAdAt = Date.now(); adEnd(); done(); }
    adBegin();
    try {
      ysdk.adv.showFullscreenAdv({ callbacks: {
        onClose: function (wasShown) { end(wasShown); },
        onError: function () { end(false); },
        onOffline: function () { end(false); }
      } });
    } catch (e) { end(false); }
  };
  self.canReward = function () { return !!(sdkOk && !adBusy && ysdk.adv && ysdk.adv.showRewardedVideo); };
  /* Ролик за награду: done(got) — got === true, только если досмотрел. */
  self.rewarded = function (done) {
    if (!self.canReward()) { done(false); return; }
    var fin = false, got = false;
    function end() { if (fin) return; fin = true; if (got) lastAdAt = Date.now(); adEnd(); done(got); }
    adBegin();
    try {
      ysdk.adv.showRewardedVideo({ callbacks: { onRewarded: function () { got = true; }, onClose: end, onError: end } });
    } catch (e) { end(); }
  };
  return self;
})();

// ---- расчёты аквариума
const lpc=t=>t.salt?2:1;
const fl=t=>Object.keys(t.fish).filter(i=>t.fish[i]>0).map(i=>({sp:SP[i],i:+i,n:t.fish[i]}));
const cmTot=t=>fl(t).reduce((a,f)=>a+f.sp.cm*f.n,0);
const massTot=t=>fl(t).reduce((a,f)=>a+f.sp.mass*f.n,0);
const nPl=t=>Object.values(t.pl).reduce((a,b)=>a+b,0);
const nFish=t=>fl(t).reduce((a,f)=>a+f.n,0);
const normFeed=t=>Math.round(massTot(t)*0.02*10)/10;
function cap(t,black){return t.V/lpc(t)*(1+0.06*nPl(t))*((t.eq.aer&&!(black&&!S.battery))?1.3:1)*(black&&!S.battery?0.7:1)}
function tooSmall(t){return fl(t).some(f=>f.sp.minV>t.V)}
function load_(t,black){const c=cap(t,black);return c?cmTot(t)*(tooSmall(t)?1.3:1)/c:0}
function range(t){const f=fl(t);if(!f.length)return null;return [Math.max(...f.map(x=>x.sp.t1)),Math.min(...f.map(x=>x.sp.t2))]}
function outRange(t,eff){return fl(t).some(f=>eff<f.sp.t1||eff>f.sp.t2)}
function feedStep(n){return n<2?0.1:n<20?0.5:n<200?5:50}
function hintOK(t){return S.hint[t.id]===S.day||S.day<=10}
const rep_stars=()=>'★'.repeat(Math.round(S.rep/20))+'☆'.repeat(5-Math.round(S.rep/20));
function appeal(t){
 let s=0;fl(t).forEach(f=>{s+=f.sp.ap*(2-Math.pow(0.5,f.n-1))});
 s*=1+0.05*Math.min(nPl(t),10)+(t.eq.decor?0.1:0)+(t.eq.lamp?0.05:0);
 return s;
}
// ---- день
function weekend(){const d=S.day%7;return d===6||d===0}
function startDay(){
 S.ev=null;
 const d=S.day;
 if(d===20||d===45)S.ev={t:'expo'};
 else if(d===12||d===33)S.ev={t:'school',n:rnd(20,50),p:pick([10,20,30])};
 else if(d>=5&&Math.random()<0.25)S.ev={t:pick(['black','algae','heat','expo','school'])};
 if(S.ev&&S.ev.t==='school'&&!S.ev.n){S.ev.n=rnd(20,50);S.ev.p=pick([10,20,30])}
 if(S.ev&&S.ev.t==='algae')S.tanks.forEach(t=>t.N+=15);
 S.task=genTask();S.taskDone=false;S.evSeen=false;
}
function effTemp(t){return t.temp+(S.ev&&S.ev.t==='heat'?(S.fans?1:4):0)}
function simDay(){
 const R={day:S.day,log:[],rev:0,tic:0,fry:0,school:0,exp:{rent:RENT,power:0,feed:0},guests:0,repd:0,deaths:0};
 const black=S.ev&&S.ev.t==='black';
 let A=0;
 S.tanks.forEach((t,k)=>{
  const nm='Аквариум '+(k+1);
  const eff=effTemp(t),out=outRange(t,eff);
  const ld=load_(t,black),norm=normFeed(t),feed=t.eq.feeder?norm:t.feed;
  const ratio=norm>0?feed/norm:1;
  const hungry=norm>0&&ratio<0.7,over=Math.max(0,feed-norm*1.1);
  R.exp.feed+=feed*FEED_RUB;
  R.exp.power+=t.V*0.2+t.V*0.02*Math.max(0,t.temp-20)+Object.keys(t.eq).length*10;
  // азот
  let dN=6*ld*((t.eq.filter&&!(black&&!S.battery))?0.6:1)+over*40/t.V-nPl(t)*(t.eq.lamp?0.6:0.4);
  t.N=Math.max(0,t.N+dN);
  // хищники
  fl(t).filter(f=>f.sp.pred).forEach(pr=>{for(let q=0;q<pr.n;q++){
   const prey=fl(t).filter(f=>!f.sp.pred&&f.sp.cm<=pr.sp.cm*0.4);
   if(prey.length){const v=pick(prey);t.fish[v.i]--;R.deaths++;R.log.push('🦈 '+nm+': '+pr.sp.name+' съел рыбу «'+v.sp.name+'»')}}});
  // удушье
  if(ld>1.2){const lose=Math.ceil(nFish(t)*Math.min(0.3,(ld-1)*0.5));killRand(t,lose,R);R.log.push('😮‍💨 '+nm+': не хватает кислорода, погибло '+lose)}
  if(t.N>80){const lose=Math.ceil(nFish(t)*0.2);killRand(t,lose,R);R.log.push('☠ '+nm+': нитраты '+Math.round(t.N)+' — погибло '+lose)}
  if(t.sick){const lose=Math.max(1,Math.ceil(nFish(t)*0.2));if(nFish(t)>0){killRand(t,lose,R);R.log.push('🤒 '+nm+': болезнь не вылечили, погибло '+lose)}if(Math.random()<0.5)t.sick=false}
  // болезнь
  if(!t.sick&&nFish(t)>0){
   let p=(t.N>40?0.25:0)+(out?0.3:0)+(ld>1?0.2:0)+(hungry?0.1:0);p=Math.min(0.8,p);
   if(Math.random()<p){t.sick=true;R.log.push('🤒 '+nm+': рыбы заболели'+(out?' (температура вне нормы)':'')+(t.N>40?' (грязная вода)':'')+(ld>1?' (тесно)':''))}
  }
  if(hungry){R.repd-=1;R.log.push('🍽 '+nm+': рыбы голодные ('+f1(feed)+' г при норме '+f1(norm)+' г)')}
  if(ratio>1.1&&norm>0)R.log.push('🍽 '+nm+': перекорм ('+f1(feed)+' г при норме '+f1(norm)+' г), вода портится');
  if(out)R.log.push('🌡 '+nm+': температура '+Math.round(eff)+' °C вне нормы для части рыб');
  // мальки
  fl(t).filter(f=>f.sp.brd).forEach(f=>{const pairs=Math.floor(f.n/2);
   if(pairs&&ld<=1&&!hungry&&!fl(t).some(x=>x.sp.pred)){const r=pairs*2*f.sp.price*0.25;R.fry+=r}});
  // привлекательность
  let a=appeal(t);if(t.sick)a*=0.5;if(t.N>25)a*=0.8;if(hungry)a*=0.7;if(nFish(t)===0)a=0;
  A+=a;
  if(ld>1)R.repd-=1;
 });
 const mult=(0.6+0.6*S.rep/100)*(weekend()?1.4:1)*(S.ev&&S.ev.t==='expo'?1.8:1);
 const pf=Math.max(0.2,Math.min(1.6,1-0.8*(S.tickets/BASE_PRICE-1)));
 R.guests=Math.round(A*mult*pf*GK);
 R.tic=R.guests*S.tickets;
 if(S.ev&&S.ev.t==='school'){R.school=Math.round(S.ev.n*S.tickets*(1-S.ev.p/100))}
 R.fry=Math.round(R.fry);R.exp.power=Math.round(R.exp.power);R.exp.feed=Math.round(R.exp.feed);
 R.rev=R.tic+R.fry+R.school;
 R.expT=R.exp.rent+R.exp.power+R.exp.feed;
 R.profit=R.rev-R.expT;
 if(R.deaths===0&&R.repd===0&&!S.tanks.some(t=>t.sick))R.repd+=1;
 S.money+=R.profit;S.rep=Math.max(0,Math.min(100,S.rep+R.repd));
 S.stats.profit+=R.profit;S.stats.bestGuests=Math.max(S.stats.bestGuests,R.guests);
 S.tanks.forEach(t=>t.changed=false);
 return R;
}
function killRand(t,n,R){const ks=fl(t);for(let q=0;q<n;q++){const all=fl(t);if(!all.length)break;const tot=all.reduce((a,f)=>a+f.n,0);let r=Math.random()*tot;for(const f of all){r-=f.n;if(r<=0){t.fish[f.i]--;R.deaths++;break}}}}
function goalsCheck(){
 const m=[];const gs=[{d:10,k:'g10',txt:'30 гостей за день',ok:()=>S.stats.bestGuests>=30},{d:30,k:'g30',txt:'15 видов в коллекции',ok:()=>Object.keys(S.seen).length>=15},{d:60,k:'g60',txt:'прибыль 80 000 ₽',ok:()=>S.stats.profit>=80000}];
 gs.forEach(g=>{if(S.day===g.d&&!S.goals[g.k]){const ok=g.ok();S.goals[g.k]=ok?1:2;if(ok){S.money+=3000;S.rep=Math.min(100,S.rep+5);m.push('🎯 Цель выполнена: '+g.txt+'! +3 000 ₽, репутация +5')}else{S.rep=Math.max(0,S.rep-5);m.push('Цель не выполнена: '+g.txt+'. Репутация −5')}}});
 return m;
}
function capital(){let c=S.money;S.tanks.forEach(t=>{const tk=TANKS.find(x=>x.V===t.V);c+=(tk.p*(t.salt?1.4:1))*0.5;fl(t).forEach(f=>c+=f.sp.price*f.n*0.7)});return Math.round(c)}
// ---- задачи
function genTask(){
 const d=S.day,lv=d<=15?1:d<=35?2:3;
 const tk=pick(S.tanks)||{V:60,salt:0};
 const V=tk.V,lp=tk.salt?2:1;
 const gens=[
 ()=>{const cs=[2,4,5,10].filter(c=>lv>1||(V/lp)%c===0);const c=pick(cs.length?cs:[2]);const a=Math.floor(V/lp/c);return {q:`Аквариум ${V} л (${tk.salt?'морской: 1 см рыбы на 2 л':'пресный: 1 см рыбы на 1 л'}). Сколько рыбок длиной ${c} см можно держать?`,a,ex:`Вместимость ${V} ÷ ${lp} = ${V/lp} см. ${V/lp} ÷ ${c} = ${V/lp/c}, берём целое: ${a}.`}},
 ()=>{const p=lv===1?pick([10,25,50]):pick([15,20,30,40]);const a=V*p/100;return {q:`Нужно подменить ${p} % воды в аквариуме ${V} л. Сколько литров заменить?`,a,ex:`${V} × ${p} ÷ 100 = ${a} л.`}},
 ()=>{const m=pick([200,400,500,1000,1500]);const a=m*0.02;return {q:`Рыбы весят ${m} г. Корм — 2 % от массы. Сколько граммов корма в день?`,a,ex:`${m} × 2 ÷ 100 = ${a} г.`}},
 ()=>{const n=pick([20,30,45,60]),p=pick([60,70,80]);if(lv===1)return {q:`Пришли ${n} гостей, билет ${p} ₽. Сколько рублей выручка?`,a:n*p,ex:`${n} × ${p} = ${n*p} ₽.`};return {q:`Пришли ${n} гостей, билет ${p} ₽. Расходы за день ${RENT+120} ₽. Какова прибыль?`,a:n*p-RENT-120,ex:`Выручка ${n*p}, минус ${RENT+120} = ${n*p-RENT-120} ₽.`}},
 ()=>{const N=pick([20,40,60,80]),p=pick([25,50]);const a=N*(1-p/100);return {q:`Нитратов ${N} мг/л. Подменили ${p} % воды. Сколько мг/л стало?`,a,ex:`Остаётся ${100-p} %: ${N} × ${100-p} ÷ 100 = ${a}.`}},
 ()=>{const t=pick([100,150,200,250]);const a=t*0.6;return {q:`Из ${t} гостей 40 % — дети. Сколько взрослых?`,a,ex:`Взрослых 60 %: ${t} × 60 ÷ 100 = ${a}.`}},
 ()=>{const a0=pick([16,18,20]),b0=pick([24,26,28]),h=pick([1,2]);const a=(b0-a0)/h;return {q:`Вода ${a0} °C, нужна ${b0} °C. Нагреватель греет на ${h} °C в час. За сколько часов?`,a,ex:`Разница ${b0-a0} °C, делим на ${h}: ${a} ч.`}},
 ()=>{const n=pick([6,8,12]),c=pick([3,4,5]);return {q:`В аквариуме ${n} рыб по ${c} см. Сколько всего сантиметров рыб?`,a:n*c,ex:`${n} × ${c} = ${n*c} см.`}}
 ];
 const pool=lv===1?[0,1,2,3,7]:lv===2?[0,1,2,3,4,6,7]:[0,1,2,3,4,5,6];
 const g=gens[pick(pool)]();g.lv=lv;g.rew=lv*200;return g;
}

 const h=Math.round(w*0.66),c1=sp.c1,c2=sp.c2,st='stroke="#3b2a1a" stroke-width="2.4" stroke-linejoin="round"';

 }

 return `<svg viewBox="-8 0 72 40" width="${w}" height="${h}">${b}${eye}</svg>`;

let raf=0,last=0;

function examQs(s){
 const qs=[];
 const others=SP.filter(x=>x.i!==s.i);
 const uniq=a=>[...new Set(a)];
 const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
 const mk=(q,right,wrongs,ex)=>{const ws=shuf(uniq(wrongs).filter(w=>w!==right)).slice(0,3);return {q,opts:shuf([right,...ws]),right,ex}};
 qs.push(()=>mk(`Где в природе живёт вид «${s.name}»?`,s.reg,others.map(x=>x.reg),`«${s.name}» живёт: ${s.reg}.`));
 qs.push(()=>mk(`Чем питается «${s.name}»?`,s.diet,['всеядная','хищная','растительноядная','питается планктоном'],`Питание: ${s.diet}.`));
 qs.push(()=>{const r=s.t1+'–'+s.t2+' °C';return mk(`Какая температура воды подходит для «${s.name}»?`,r,others.map(x=>x.t1+'–'+x.t2+' °C'),`Для «${s.name}» нужна вода ${r}.`)});
 qs.push(()=>mk(`Можно ли посадить «${s.name}» вместе с мелкими рыбками (гуппи, неонами)?`,s.pred?'Нет, съест':'Да, мирная',['Нет, съест','Да, мирная'],s.pred?`«${s.name}» — хищник, мелкие рыбки для него корм.`:`«${s.name}» — мирная рыба.`));
 const pickq=s.pred?[3,pick([0,1,2])]:shuf([0,1,2,3]).slice(0,2);
 return pickq.map(i=>qs[i]());
}

    if(okc===qs.length){S.known[si]=1;save();modal(o,`<h2>🎉 Экзамен сдан!</h2><p>Вид «${s.name}» открыт — можно закупать.</p><button class="b-go" id="nx2" style="width:100%">Отлично</button>`);o.querySelector('#nx2').onclick=()=>{drawL();done()}}
    else{modal(o,`<h2>Пока не сдали</h2><p>Верно ${okc} из 2. Загляните в карточку вида и попробуйте снова — вопросы будут другие.</p><button class="b-go" id="nx2" style="width:100%">Понятно</button>`);o.querySelector('#nx2').onclick=()=>drawL()}}}
  });
 }

}
