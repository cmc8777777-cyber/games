<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Посадка на планету</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#05031a;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff}
#app{position:absolute;left:0;top:0;width:375px;height:812px;transform-origin:0 0;overflow:hidden;background:#0b0830}
canvas{position:absolute;left:0;top:0;width:375px;height:812px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:22px 16px;background:radial-gradient(ellipse at 50% 0,#3b2a8c 0,#150f4d 55%,#07041f 100%);overflow:hidden}
.screen.on{display:flex}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#ffe9a8,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 250px 60px,#bfe6ff,transparent),radial-gradient(2px 2px at 330px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 140px,#fff,transparent),radial-gradient(2px 2px at 300px 120px,#ffd1f2,transparent);background-size:360px 160px;opacity:.8}
h1{font-size:34px;margin:6px 0 0;text-align:center;line-height:1.05;color:#ffd84a;text-shadow:0 4px 0 #b34a00,0 8px 14px rgba(0,0,0,.5)}
h2{font-size:26px;margin:4px 0 10px;text-align:center;color:#ffd84a;text-shadow:0 3px 0 #b34a00}
.btn{display:block;border:0;border-radius:22px;padding:15px 18px;font:700 20px "Trebuchet MS",Arial,sans-serif;color:#fff;background:linear-gradient(#41d36b,#1fa04a);box-shadow:0 5px 0 #11662f,0 8px 14px rgba(0,0,0,.45);margin:8px 0;min-width:220px;text-align:center;cursor:pointer;position:relative;z-index:2}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #11662f}
.btn.blue{background:linear-gradient(#4fb6ff,#2276d6);box-shadow:0 5px 0 #124b8f,0 8px 14px rgba(0,0,0,.45)}
.btn.org{background:linear-gradient(#ffb43a,#f07a12);box-shadow:0 5px 0 #a24a05,0 8px 14px rgba(0,0,0,.45)}
.btn.small{font-size:16px;padding:10px 14px;min-width:0}
.sub{font-size:15px;color:#cfd6ff;text-align:center;margin:2px 0 8px;line-height:1.25;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;z-index:2}
.card{border-radius:20px;padding:10px 8px;text-align:center;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);position:relative;cursor:pointer}
.card.lock{opacity:.5;cursor:default}
.card .pl{width:70px;height:70px;border-radius:50%;margin:2px auto 6px;box-shadow:inset -10px -10px 18px rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.2)}
.card b{display:block;font-size:18px}.card i{font-style:normal;font-size:12px;color:#cfd6ff;display:block}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:10px;z-index:2}
.lv{border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 28px Arial;background:linear-gradient(#5b8cff,#2c47b8);box-shadow:0 5px 0 #1a2a78;cursor:pointer}
.lv small{font-size:14px;color:#ffd84a;letter-spacing:1px}
.lv.lock{background:#3a3a63;box-shadow:0 5px 0 #25254a;opacity:.55;cursor:default}
.panel{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:20px;padding:14px;width:100%;z-index:2;margin:6px 0}
.q{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:6px}
.ans{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;font-size:17px;border-radius:16px;background:#fff;color:#1c1c4a;font-weight:700;border:0;box-shadow:0 4px 0 #9aa;cursor:pointer;font-family:inherit}
.ans.ok{background:#7be08f;box-shadow:0 4px 0 #2b8a41}.ans.bad{background:#ff9a9a;box-shadow:0 4px 0 #b34}
.hint{font-size:16px;line-height:1.35;color:#fff}
#hud-pause{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;z-index:5;display:none}
#ctl{position:absolute;left:0;right:0;bottom:0;height:150px;display:none;z-index:4;background:linear-gradient(transparent,rgba(5,3,26,.85) 40%)}
#thrust{position:absolute;left:14px;bottom:16px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffb347,#ff5a1f 70%);border:4px solid #fff3;box-shadow:0 6px 0 #9c2a05,0 0 18px #ff7a2a88;font:700 20px Arial;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#thrust.d{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #9c2a05,0 0 28px #ffcc44}
#tilt{position:absolute;right:14px;bottom:16px;width:196px;height:104px;border-radius:52px;background:linear-gradient(#5aa7ff,#2a55c9);border:4px solid #fff3;box-shadow:0 6px 0 #17307f;display:flex}
#tilt .h{flex:1;display:flex;align-items:center;justify-content:center;font-size:44px;border-radius:52px;transition:background .05s}
#tilt .h.d{background:rgba(255,255,255,.35)}
#chute{position:absolute;left:14px;bottom:160px;margin:0;z-index:6;display:none}
#toast{position:absolute;left:16px;right:16px;top:150px;text-align:center;z-index:7;font-size:20px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:16px;padding:10px;display:none}
#pause{background:rgba(5,3,26,.85);z-index:9}
.cov{background-color:#150f4d;background-repeat:no-repeat}.cov h1{margin-top:2px}.cov .sub{display:none}.cov #m-total{display:block;margin-top:0;font-size:13px}.cov #b-play{margin-top:auto;margin-bottom:4px;font-size:24px;min-width:260px}.big{font-size:56px;letter-spacing:6px;color:#ffd84a;text-shadow:0 3px 0 #b34a00;margin:6px 0}
.ship{width:72px;height:72px;flex:none}
.row{display:flex;gap:10px;align-items:center;width:100%;z-index:2}
:root{--pm-paper:#1c1850;--pm-ink:#fff;--pm-red:#ff8a1f;--pm-redink:#1a1030;--pm-gold:#ffd84a;--pm-muted:#c6c2f0;--pm-line:#5b55b0;--pm-focus:#7fd0ff;--pm-scrim:rgba(5,3,26,.78);--pm-z:60}
body.playing .pm-corner{display:none!important}
.pm-corner{border-radius:18px!important;font-weight:800}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="750" height="1624"></canvas>
  <div id="toast"></div>
  <button id="hud-pause" data-ia="ui.pause" aria-label="Пауза">❚❚</button>
  <button id="chute" class="btn org small"><span class="ic">🪂</span> <span data-i="ui.chute">Парашют</span></button>
  <div id="ctl">
    <div id="thrust"><span style="font-size:34px">🔥</span><span data-i="ui.thrust">ТЯГА</span></div>
    <div id="tilt"><div class="h" id="tl">◀</div><div class="h" id="tr">▶</div></div>
  </div>

  <div class="screen on" id="s-menu"><div class="stars"></div>
    <div style="height:30px"></div>
    <svg width="150" height="150" viewBox="-40 -50 80 100" id="menuShip"></svg>
    <h1 data-h="menu.title">ПОСАДКА<br>НА ПЛАНЕТУ</h1>
    <div class="sub" style="margin-top:12px" data-h="menu.sub">Посади модуль мягко на площадку.<br>У каждой планеты свой вес и свой воздух!</div>
    <button class="btn" id="b-play" data-i="menu.play">▶ Играть</button>
    <div class="row" style="justify-content:center;gap:12px"><button class="btn blue small" id="b-ships" data-i="menu.ships">🚀 Корабли</button><button class="btn blue small" id="b-snd">🔊 Звук: вкл</button><button class="btn blue small" id="b-lang" style="display:none">EN</button></div>
    <div class="sub" id="m-total"></div>
  </div>

  <div class="screen" id="s-map"><div class="stars"></div>
    <h2 data-i="map.title">Куда летим?</h2>
    <div class="grid" id="mapgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="menu" data-i="nav.menu">← В меню</button>
  </div>

  <div class="screen" id="s-lv"><div class="stars"></div>
    <h2 id="lv-title"></h2>
    <div class="sub" id="lv-sub"></div>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="map" data-i="nav.planets">← К планетам</button>
  </div>

  <div class="screen" id="s-brief"><div class="stars"></div>
    <h2 data-i="brief.title">Брифинг</h2>
    <div class="sub" id="br-sub"></div>
    <div class="panel"><div class="q" id="br-q"></div><div id="br-ans"></div></div>
    <div class="panel hint" id="br-hint" style="display:none"></div>
    <button class="btn" id="b-go" style="display:none" data-i="brief.go">🚀 К посадке!</button>
    <button class="btn org small" id="b-reward" style="display:none" data-i="brief.reward">📺 Ролик: +25 % топлива</button>
    <button class="btn blue small" id="b-skip" style="margin-top:auto" data-i="brief.skip">Пропустить вопрос</button>
  </div>

  <div class="screen" id="s-res"><div class="stars"></div>
    <h2 id="r-title"></h2>
    <div class="big" id="r-stars"></div>
    <div class="panel hint" id="r-text"></div>
    <button class="btn" id="r-next">Дальше ▶</button>
    <button class="btn org" id="r-retry" data-i="res.retry">↻ Ещё раз</button>
    <button class="btn" id="r-reward" style="display:none" data-i="res.rewardRetry">📺 Ещё раз с +25 % топлива</button>
    <button class="btn blue small" data-go="lv" data-i="res.toLv">☰ К площадкам</button>
  </div>

  <div class="screen" id="s-ships"><div class="stars"></div>
    <h2 data-i="ships.title">Корабли</h2>
    <div class="sub" id="sh-sub"></div>
    <div class="grid" id="shgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="menu" data-i="nav.menu">← В меню</button>
  </div>

  <div class="screen" id="pause"><h2 data-i="ui.pause">Пауза</h2>
    <button class="btn" id="p-res" data-i="pause.resume">▶ Продолжить</button>
    <button class="btn blue small" id="p-quit" data-i="res.toLv">☰ К площадкам</button>
  </div>
</div>

<script>
/* Премиум: общий модуль для браузерных игр на Яндекс Играх.
   Платный Премиум на срок (30 дней или год), без автопродления: «используемая» покупка, срок считается по серверному
   времени Яндекса и хранится в облачных данных игрока. Подробно: README.md рядом с этим файлом.
   Модуль ничего не знает об игре: хранилище, звук и реклама подключаются через init() и несколько вызовов хозяина.
   Без SDK, без покупок или без созданных товаров в консоли кнопка и карточки скрыты, игра работает как раньше. */
window.Premium = (function () {
  "use strict";
  var DAY = 86400000;

  /* ---- Настройки: все числа и товары в одном месте ---- */
  var config = {
    adGapMs: 5 * 60 * 1000,     // интервал полноэкранной рекламы; хозяин читает его при показе (решение владельца 8 ноября: 5 минут)
    cardEvery: 3,               // карточка «Надоела реклама?» после каждой 3-й показанной полноэкранной рекламы
    remindDays: 3,              // напоминание о конце Премиума за столько дней и меньше (раз в сутки)
    pollMs: 60000,              // как часто сверять срок с серверным временем
    tokensKeep: 20,             // сколько токенов последних покупок помнить
    products: {                 // id товара в консоли Яндекса → срок
      premium_30: { days: 30 },
      premium_365: { days: 365 }
    },
    order: ["premium_30", "premium_365"],
    corner: true,               // кнопка «Премиум» в углу экрана
    zIndex: 50
  };

  /* ---- Тексты (временные, их заменит сессия «Тексты»). Подмена: Premium.init({ texts: { ru: {...}, en: {...} } }) ---- */
  var TEXTS = {
    ru: {
      btn: "Премиум", btnOn: "Премиум · {0} д.", title: "Премиум",
      activeUntil: "Активен до {0}. Осталось {1}.",
      notActive: "Сейчас Премиум не включён.",
      perks: ["Без полноэкранной рекламы и баннеров.", "Награды за ролики выдаются сразу, без просмотра.", "Правила и сложность игры не меняются: Премиум не помогает выигрывать."],
      p30: "Премиум на 30 дней", p365: "Премиум на год",
      validTo: "Будет действовать до {0}", buy: "Купить", extend: "Продлить",
      note: "Один платёж, без автопродления: больше ничего не спишется. Если Премиум уже идёт, новый срок добавится к концу.",
      close: "Закрыть", later: "Не сейчас",
      adTitle: "Надоела реклама?", adText: "Премиум: без роликов и баннеров, 30 дней за {0}, не продлевается сам.", adMore: "Узнать про Премиум",
      soonTitle: "Премиум скоро закончится", soonText: "Осталось {0}. Продлить?",
      endTitle: "Премиум закончился", endText: "Реклама вернулась. Можно включить Премиум снова.",
      busy: "Ждём подтверждения оплаты…", done: "Готово! Премиум активен до {0}.",
      fail: "Покупка не прошла. Деньги не списаны.", saveFail: "Оплата принята, но срок пока не сохранился. Не закрывайте игру, мы повторим при следующем запуске.",
      d1: "{0} день", d2: "{0} дня", d5: "{0} дней", free: "Ян", lang: "ru-RU"
    },
    en: {
      btn: "Premium", btnOn: "Premium · {0} d", title: "Premium",
      activeUntil: "Active until {0}. {1} left.",
      notActive: "Premium is not active.",
      perks: ["No full-screen ads or banners.", "Rewards for videos are given instantly, no watching.", "The rules and difficulty stay the same: Premium does not help you win."],
      p30: "Premium for 30 days", p365: "Premium for a year",
      validTo: "Will be active until {0}", buy: "Buy", extend: "Extend",
      note: "One payment, no auto-renewal: nothing else will be charged. If Premium is already running, the new period is added to the end.",
      close: "Close", later: "Not now",
      adTitle: "Tired of ads?", adText: "Premium: no videos or banners, 30 days for {0}, does not renew by itself.", adMore: "About Premium",
      soonTitle: "Premium ends soon", soonText: "{0} left. Extend?",
      endTitle: "Premium has ended", endText: "Ads are back. You can turn Premium on again.",
      busy: "Waiting for payment confirmation…", done: "Done! Premium is active until {0}.",
      fail: "The purchase did not go through. You were not charged.", saveFail: "Payment accepted, but the period is not saved yet. Keep the game open, we will retry on the next start.",
      d1: "{0} day", d2: "{0} days", d5: "{0} days", free: "Yan", lang: "en-GB"
    }
  };

  /* ---- Состояние ---- */
  var sdk = null, payments = null, store = null;
  var lang = "ru", texts = TEXTS.ru;
  var catalog = {};                   // id → описание товара из консоли
  var st = blank();
  var off = 0;                        // запасная поправка серверного времени, если serverTime() недоступен
  var ready = false, canBuy = false, busy = false, chain = Promise.resolve();
  var listeners = [], pollTimer = 0, lastActive = false;
  var ui = { corner: null, ov: null, box: null, status: "", mode: "", style: null, lastFocus: null };

  function blank() { return { until: 0, tokens: [], ads: 0, cardAt: 0, remindDay: 0, endShown: 0 }; }
  function clean(o) {
    var r = blank();
    if (!o || typeof o !== "object") return r;
    r.until = Math.max(0, Number(o.until) || 0);
    r.tokens = Array.isArray(o.tokens) ? o.tokens.filter(function (t) { return typeof t === "string"; }).slice(-config.tokensKeep) : [];
    r.ads = Math.max(0, Math.floor(Number(o.ads) || 0));
    r.cardAt = Math.max(0, Math.floor(Number(o.cardAt) || 0));
    r.remindDay = Math.max(0, Math.floor(Number(o.remindDay) || 0));
    r.endShown = Math.max(0, Number(o.endShown) || 0);
    return r;
  }
  function parse(raw) { try { return clean(typeof raw === "string" ? JSON.parse(raw) : raw); } catch (e) { return blank(); } }
  /* Слияние двух снимков (облако и устройство): срок и счётчики берём большие, токены объединяем.
     Хозяин вызывает при импорте облака, иначе срок мог бы пропасть при конфликте двух устройств. */
  function mergeState(a, b) {
    var x = parse(a), y = parse(b), r = blank(), seen = {};
    r.until = Math.max(x.until, y.until); r.ads = Math.max(x.ads, y.ads); r.cardAt = Math.max(x.cardAt, y.cardAt);
    r.remindDay = Math.max(x.remindDay, y.remindDay); r.endShown = Math.max(x.endShown, y.endShown);
    y.tokens.concat(x.tokens).forEach(function (t) { if (!seen[t]) { seen[t] = 1; r.tokens.push(t); } });
    r.tokens = r.tokens.slice(-config.tokensKeep);
    return JSON.stringify(r);
  }
  function persist() { try { if (store && store.set) store.set(JSON.stringify(st)); } catch (e) {} }
  function loadState() { try { st = parse(store && store.get ? store.get() : null); } catch (e) { st = blank(); } }

  /* ---- Серверное время: часы устройства не используем ---- */
  function now() {
    if (sdk && typeof sdk.serverTime === "function") {
      try { var t = sdk.serverTime(); if (typeof t === "number" && t > 0) { off = t - Date.now(); return t; } } catch (e) {}
    }
    return Date.now() + off;
  }
  function active() { return st.until > now(); }
  function daysLeft() { var ms = st.until - now(); return ms > 0 ? Math.ceil(ms / DAY) : 0; }
  function available() { return !!(ready && canBuy); }

  /* ---- Утилиты текста ---- */
  function fmt(s) { var a = arguments; return String(s).replace(/\{(\d)\}/g, function (m, i) { var v = a[Number(i) + 1]; return v == null ? "" : v; }); }
  function tx(k) { var v = texts[k]; return v != null ? v : (TEXTS.ru[k] != null ? TEXTS.ru[k] : k); }
  function plural(n) {
    if (lang === "en") return fmt(n === 1 ? tx("d1") : tx("d2"), n);
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return fmt(tx("d1"), n);
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return fmt(tx("d2"), n);
    return fmt(tx("d5"), n);
  }
  function dateStr(ms) {
    try { return new Date(ms).toLocaleDateString(tx("lang"), { day: "numeric", month: "long", year: "numeric" }).replace(/\s*г\.$/, ""); }   // без «г.», чтобы в конце фразы не было «г..»
    catch (e) { return new Date(ms).toISOString().slice(0, 10); }
  }
  function priceOf(id) { var c = catalog[id]; return c && c.price ? String(c.price) : ""; }
  function dayIdx() { return Math.floor(now() / DAY); }
  function emit() { var a = active(); lastActive = a; listeners.slice().forEach(function (f) { try { f(a); } catch (e) {} }); renderCorner(); if (ui.ov && ui.mode === "shop") renderShop(); }

  /* ---- Покупка и начисление: запись в облако подтверждена, и только потом consumePurchase ---- */
  function grant(p) {
    var id = p && p.productID, tok = p && p.purchaseToken, prod = config.products[id];
    if (!prod || !tok) return Promise.resolve(false);
    if (st.tokens.indexOf(tok) < 0) {
      var base = Math.max(now(), st.until);
      st.until = base + prod.days * DAY;
      st.tokens.push(tok); if (st.tokens.length > config.tokensKeep) st.tokens.shift();
      persist();
    }
    return Promise.resolve(store && store.save ? store.save() : false).then(function (ok) {
      if (!ok) { var e = new Error("save"); e.code = "save"; throw e; }
      // срок уже сохранён: если закрыть покупку не вышло, её закроют при следующем запуске, второй раз срок не начислится
      return Promise.resolve(payments.consumePurchase(tok)).then(function () {}, function () {});
    }).then(function () { emit(); return true; });
  }
  function queue(f) { var r = chain.then(f, f); chain = r.then(function () {}, function () {}); return r; }
  function checkPurchases() {
    return queue(function () {
      return payments.getPurchases().then(function (list) {
        list = Array.isArray(list) ? list : (list && list.purchases) || [];
        return list.reduce(function (p, item) { return p.then(function () { return grant(item).catch(function () {}); }); }, Promise.resolve());
      });
    }).catch(function () {}).then(function () { emit(); });
  }
  function buy(id) {
    if (busy || !canBuy || !config.products[id]) return Promise.resolve(false);
    busy = true; setStatus(tx("busy")); renderShop();
    return queue(function () {
      return payments.purchase({ id: id, developerPayload: "pm" }).then(function (p) {
        return grant(p).then(function () { setStatus(fmt(tx("done"), dateStr(st.until))); return true; }, function (e) {

var off = document.createElement('canvas'); off.width = K.W; off.height = K.H; var octx = off.getContext('2d');

function makeTerrain(b, bi, li) {
  var lv = LV[li], r = rng(bi * 1000 + li * 37 + 11), H = new Float32Array(K.W + 1);
  var p1 = r() * 6, p2 = r() * 6, p3 = r() * 6;
  for (var x = 0; x <= K.W; x++) H[x] = 575 + 22 * Math.sin(x * 0.012 + p1) + 11 * Math.sin(x * 0.031 + p2) + 5 * Math.sin(x * 0.07 + p3);

    var wd = 14 + r() * 8, dp = 30 + r() * 16;

}

var toastT = 0;

function windNow() { var b = G.body, w = b.wind * G.lv.wind; return w * (Math.sin(G.t * 0.35 + G.wphase) * 0.6 + Math.sin(G.t * 1.1 + G.wphase * 2) * 0.4) ; }

  c.strokeStyle = '#222'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(-9, 10); c.lineTo(-14, 17 + L * .3); c.moveTo(9, 10); c.lineTo(14, 17 + L * .3); c.stroke();
  c.lineWidth = 5; c.beginPath(); c.moveTo(-19, 17 + L * .3); c.lineTo(-9, 17 + L * .3); c.moveTo(9, 17 + L * .3); c.lineTo(19, 17 + L * .3); c.stroke();
  c.fillStyle = sh.col; c.strokeStyle = '#222'; c.lineWidth = 3; c.beginPath(); c.moveTo(-12, -14); c.quadraticCurveTo(0, -34, 12, -14); c.lineTo(14, 12); c.quadraticCurveTo(0, 18, -14, 12); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = sh.col2; c.fillRect(-12, 6, 24, 5); c.strokeRect(-12, 6, 24, 5);
  c.fillStyle = '#bfe9ff'; c.beginPath(); c.arc(0, -6, 6.5, 0, 6.3); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-2, -8, 2, 0, 6.3); c.fill();
  c.restore();
}
function hudText(t, x, y, col, size, al) { ctx.font = '700 ' + (size || 15) + 'px "Trebuchet MS",Arial'; ctx.textAlign = al || 'left'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(t, x, y); ctx.fillStyle = col || '#fff'; ctx.fillText(t, x, y); }
function drawHUD() {
  var fr = G.fuel / G.fuel0;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, K.W, 62);
  if (img('ic_fuel')) ctx.drawImage(img('ic_fuel'), 12, 4, 18, 18); hudText(TR('hud.fuel'), img('ic_fuel') ? 34 : 12, 20, '#fff', 12);
  ctx.fillStyle = '#222'; ctx.fillRect(12, 26, 150, 14);
  ctx.fillStyle = fr > 0.3 ? '#4bd16a' : fr > 0.12 ? '#ffb02e' : '#ff4a4a'; ctx.fillRect(12, 26, 150 * fr, 14);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(12, 26, 150, 14);
  ctx.fillStyle = '#fff8'; ctx.fillRect(12 + 150 * 0.3 - 1, 24, 2, 18);
  var alt = Math.max(0, Math.round(groundY(G.x) - G.y - 17));
  hudText(TR('hud.alt', { n: alt }), 12, 58, '#fff', 13);
  var vyOk = G.vy <= K.vy, vxOk = Math.abs(G.vx) <= K.vx;
  hudText((G.vy > 0 ? '↓ ' : '↑ ') + fmt(Math.abs(G.vy)), 178, 20, vyOk ? '#7dff9a' : '#ff7a7a', 15);
  hudText('→ ' + fmt(G.vx), 178, 40, vxOk ? '#7dff9a' : '#ff7a7a', 15);
  hudText(TR('hud.tilt', { n: fmt(Math.abs(G.ang) * 180 / Math.PI) }), 178, 58, Math.abs(G.ang) <= K.ang ? '#7dff9a' : '#ff7a7a', 13);
  if (G.body.wind > 0 && G.lv.wind > 0) { var w = G.wind || 0; if (img('ic_wind')) ctx.drawImage(img('ic_wind'), 244, 6, 18, 18); hudText(TR('hud.wind'), 266, 20, '#cfe', 12); ctx.save(); ctx.translate(290, 38); ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 3; var L = clamp(w / G.body.wind, -1.3, 1.3) * 22; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke(); var dir = L >= 0 ? 1 : -1; ctx.beginPath(); ctx.moveTo(L + dir * 7, 0); ctx.lineTo(L, -5); ctx.lineTo(L, 5); ctx.fill(); ctx.restore(); }
}
function render() {
  var b = G.body; ctx.setTransform(2, 0, 0, 2, 0, 0);
  drawSky(b); drawGround(b);
  // частицы
  G.parts.forEach(function (p) { ctx.globalAlpha = clamp(p.l / p.m, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.l / p.m + .3), 0, 6.3); ctx.fill(); }); ctx.globalAlpha = 1;
  var gone = G.over && !G.over.win;
  if (gone && img('boom')) { var bm = img('boom'), k = 1 - G.ending / 0.9, bw = 40 + k * 90; ctx.globalAlpha = clamp(1.4 - k, 0, 1); ctx.drawImage(bm, G.x - bw / 2, G.y - bw * 0.4, bw, bw * bm.naturalHeight / bm.naturalWidth); ctx.globalAlpha = 1; }
  if (!gone) drawShip(ctx, G.x, G.y, G.ang, SHIPS[save.ship], G.thrustOn && G.fuel > 0, G.chute, false);
  if (G.lv.night) {
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.clearRect(0, 0, K.W, K.H);
    octx.fillStyle = 'rgba(2,2,20,.93)'; octx.fillRect(0, 0, K.W, K.H);
    octx.globalCompositeOperation = 'destination-out';
    var gx = G.x + Math.sin(G.ang) * 0, gy = G.y;
    var rg = octx.createRadialGradient(gx, gy, 5, gx, gy, 55); rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); octx.fillStyle = rg; octx.beginPath(); octx.arc(gx, gy, 55, 0, 6.3); octx.fill();
    octx.save(); octx.translate(G.x, G.y); octx.rotate(G.ang + Math.PI); // конус вниз вдоль оси
    var cg = octx.createLinearGradient(0, 10, 0, 330); cg.addColorStop(0, 'rgba(0,0,0,1)'); cg.addColorStop(1, 'rgba(0,0,0,0)'); octx.fillStyle = cg;
    octx.beginPath(); octx.moveTo(0, -10); octx.lineTo(-95, -330); octx.lineTo(95, -330); octx.closePath(); octx.fill(); octx.restore();
    ctx.drawImage(off, 0, 0, K.W, K.H);
    // огни площадки светят всегда
    var blink = Math.sin(G.t * 6) > 0; [G.padX - G.padW / 2, G.padX + G.padW / 2].forEach(function (lx) { var gg = ctx.createRadialGradient(lx, G.padY - 20, 0, lx, G.padY - 20, 26); gg.addColorStop(0, blink ? 'rgba(255,60,60,.95)' : 'rgba(255,150,150,.5)'); gg.addColorStop(1, 'rgba(255,60,60,0)'); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(lx, G.padY - 20, 26, 0, 6.3); ctx.fill(); });
    var bi = img('beacon'); if (bi) ctx.drawImage(bi, G.padX - 9, G.padY - 66, 18, 16); else { ctx.fillStyle = '#7dff9a'; ctx.beginPath(); ctx.moveTo(G.padX, G.padY - 46); ctx.lineTo(G.padX - 8, G.padY - 60); ctx.lineTo(G.padX + 8, G.padY - 60); ctx.fill(); }
  }
  drawHUD();
  // стрелка к площадке, если она не видна по бокам: не нужна (одна сцена)
}

var last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!G.run) return;
  if (!G.paused) {
    acc += dt; var n = 0;
    while (acc >= 1 / 120 && n < 12) { step(1 / 120); acc -= 1 / 120; n++; if (!G.run) break; }
    if (acc > 0.1) acc = 0;
    G.parts = G.parts.filter(function (p) { p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (G.body ? G.body.g * 10 : 20) * dt; return p.l > 0; });
    Snd.engine(G.thrustOn && G.fuel > 0 && !G.ending);
    if (G.run && G.fuel < G.fuel0 * 0.12 && G.fuel > 0 && now - G.lastWarn > 700 && G.thrustOn) { G.lastWarn = now; Snd.warn(); }
  }
  if (G.run) render();
}
requestAnimationFrame(frame);

/* ===== Ввод ===== */
(function () {
  var th = $('thrust'), tp = $('tilt'), tl = $('tl'), tr = $('tr');
  function setTilt(e) {
    var r = tp.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, d = x < 0.5 ? -1 : 1;
    G.tilt = d; tl.classList.toggle('d', d < 0); tr.classList.toggle('d', d > 0);
  }
  function clr() { G.tilt = 0; tl.classList.remove('d'); tr.classList.remove('d'); }
  th.addEventListener('pointerdown', function (e) { Snd.init(); try { th.setPointerCapture(e.pointerId); } catch (x) {} G.thrust = true; th.classList.add('d'); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { th.addEventListener(n, function () { G.thrust = false; th.classList.remove('d'); }); });
  tp.addEventListener('pointerdown', function (e) { Snd.init(); try { tp.setPointerCapture(e.pointerId); } catch (x) {} setTilt(e); e.preventDefault(); });
  tp.addEventListener('pointermove', function (e) { if (e.buttons || e.pressure > 0) setTilt(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { tp.addEventListener(n, clr); });
  $('chute').addEventListener('click', function () {
    if (!G.run || G.chute) return; G.chute = true; this.style.opacity = .4; Snd.click(); toast(TR(G.body.chuteMsg), 2200);
  });
  $('hud-pause').onclick = function () { PF.gameplay(false); G.paused = true; $('pause').classList.add('on'); Snd.engine(false); };
  $('p-res').onclick = function () { PF.gameplay(true); G.paused = false; $('pause').classList.remove('on'); last = performance.now(); };
  $('p-quit').onclick = function () { $('pause').classList.remove('on'); show('lv'); };
  PF.onPause = function (h) { if (h && G.run && !G.paused) $('hud-pause').onclick(); };
  window.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft') G.kb.l = 1; else if (e.code === 'ArrowRight') G.kb.r = 1; else if (e.code === 'ArrowUp' || e.code === 'Space') G.kb.t = 1;
    else if (e.code === 'KeyP' && G.run) $('chute').click(); else return; e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft') G.kb.l = 0; else if (e.code === 'ArrowRight') G.kb.r = 0; else if (e.code === 'ArrowUp' || e.code === 'Space') G.kb.t = 0;
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();

/* ===== Масштаб под экран ===== */
function fit() {
  var s = Math.min(window.innerWidth / 375, window.innerHeight / 812), app = $('app');
  app.style.transform = 'translate(' + ((window.innerWidth - 375 * s) / 2) + 'px,' + ((window.innerHeight - 812 * s) / 2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
drawMenuShip();
(function () {
  var pl = ''; try { pl = (PF.lang && PF.lang()) || ''; } catch (e) {}
  var want = save.langSet ? save.lang : (pl ? (pl === 'ru' || pl === 'be' || pl === 'kk' || pl === 'uk' || pl === 'uz' ? 'ru' : 'en') : ((navigator.language || 'ru').slice(0, 2) === 'ru' ? 'ru' : 'en'));
  setLang(want, false);
  PF.onLang = function (l) { if (!save.langSet) setLang(l === 'ru' || l === 'be' || l === 'kk' || l === 'uk' || l === 'uz' ? 'ru' : 'en', false); };
})();
PF.onSdk = function (sdk) {
  if (!window.Premium) return;
  var KEY = 'posadka-premium';
  try { var m = Premium.mergeState(PF.get(KEY), PF.cloudGet('premium')); if (m) PF.put(KEY, m); } catch (e) {}
  Premium.init({
    sdk: sdk, lang: LANG, texts: PM_TEXTS,
    store: { get: function () { return PF.get(KEY); }, set: function (raw) { PF.put(KEY, raw); }, save: function () { return PF.cloudSave('premium', PF.get(KEY)); } }
  }).then(function () { pmRefresh(); calmCard(); });
  Premium.onChange(function () { pmRefresh(); });
};
PF.ready();
</script>
