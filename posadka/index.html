<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Посадка на планету</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#05031a;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff}
#app{position:absolute;left:0;top:0;width:375px;height:812px;transform-origin:0 0;overflow:hidden;background:#0b0830}
canvas{position:absolute;left:0;top:0;width:375px;height:812px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:22px 16px;background:radial-gradient(ellipse at 50% 0,#3b2a8c 0,#150f4d 55%,#07041f 100%);overflow:hidden}
.screen.on{display:flex}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#ffe9a8,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 250px 60px,#bfe6ff,transparent),radial-gradient(2px 2px at 330px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 140px,#fff,transparent),radial-gradient(2px 2px at 300px 120px,#ffd1f2,transparent);background-size:360px 160px;opacity:.8}
h1{font-size:34px;margin:6px 0 0;text-align:center;line-height:1.05;color:#ffd84a;text-shadow:0 4px 0 #b34a00,0 8px 14px rgba(0,0,0,.5)}
h2{font-size:26px;margin:4px 0 10px;text-align:center;color:#ffd84a;text-shadow:0 3px 0 #b34a00}
.btn{display:block;border:0;border-radius:22px;padding:15px 18px;font:700 20px "Trebuchet MS",Arial,sans-serif;color:#fff;background:linear-gradient(#41d36b,#1fa04a);box-shadow:0 5px 0 #11662f,0 8px 14px rgba(0,0,0,.45);margin:8px 0;min-width:220px;text-align:center;cursor:pointer;position:relative;z-index:2}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #11662f}
.btn.blue{background:linear-gradient(#4fb6ff,#2276d6);box-shadow:0 5px 0 #124b8f,0 8px 14px rgba(0,0,0,.45)}
.btn.org{background:linear-gradient(#ffb43a,#f07a12);box-shadow:0 5px 0 #a24a05,0 8px 14px rgba(0,0,0,.45)}
.btn.small{font-size:16px;padding:10px 14px;min-width:0}
.sub{font-size:15px;color:#cfd6ff;text-align:center;margin:2px 0 8px;line-height:1.25;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;z-index:2}
.card{border-radius:20px;padding:10px 8px;text-align:center;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);position:relative;cursor:pointer}
.card.lock{opacity:.5;cursor:default}
.card .pl{width:70px;height:70px;border-radius:50%;margin:2px auto 6px;box-shadow:inset -10px -10px 18px rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.2)}
.card b{display:block;font-size:18px}.card i{font-style:normal;font-size:12px;color:#cfd6ff;display:block}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:10px;z-index:2}
.lv{border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 28px Arial;background:linear-gradient(#5b8cff,#2c47b8);box-shadow:0 5px 0 #1a2a78;cursor:pointer}
.lv small{font-size:14px;color:#ffd84a;letter-spacing:1px}
.lv.lock{background:#3a3a63;box-shadow:0 5px 0 #25254a;opacity:.55;cursor:default}
.panel{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:20px;padding:14px;width:100%;z-index:2;margin:6px 0}
.q{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:6px}
.ans{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;font-size:17px;border-radius:16px;background:#fff;color:#1c1c4a;font-weight:700;border:0;box-shadow:0 4px 0 #9aa;cursor:pointer;font-family:inherit}
.ans.ok{background:#7be08f;box-shadow:0 4px 0 #2b8a41}.ans.bad{background:#ff9a9a;box-shadow:0 4px 0 #b34}
.hint{font-size:16px;line-height:1.35;color:#fff}
#hud-pause{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;z-index:5;display:none}
#ctl{position:absolute;left:0;right:0;bottom:0;height:150px;display:none;z-index:4;background:linear-gradient(transparent,rgba(5,3,26,.85) 40%)}
#thrust{position:absolute;left:14px;bottom:16px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffb347,#ff5a1f 70%);border:4px solid #fff3;box-shadow:0 6px 0 #9c2a05,0 0 18px #ff7a2a88;font:700 20px Arial;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#thrust.d{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #9c2a05,0 0 28px #ffcc44}
#tilt{position:absolute;right:14px;bottom:16px;width:196px;height:104px;border-radius:52px;background:linear-gradient(#5aa7ff,#2a55c9);border:4px solid #fff3;box-shadow:0 6px 0 #17307f;display:flex}
#tilt .h{flex:1;display:flex;align-items:center;justify-content:center;font-size:44px;border-radius:52px;transition:background .05s}
#tilt .h.d{background:rgba(255,255,255,.35)}
#chute{position:absolute;left:14px;bottom:160px;margin:0;z-index:6;display:none}
#toast{position:absolute;left:16px;right:16px;top:150px;text-align:center;z-index:7;font-size:20px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:16px;padding:10px;display:none}
#pause{background:rgba(5,3,26,.85);z-index:9}
.big{font-size:56px;letter-spacing:6px;color:#ffd84a;text-shadow:0 3px 0 #b34a00;margin:6px 0}
.ship{width:72px;height:72px;flex:none}
.row{display:flex;gap:10px;align-items:center;width:100%;z-index:2}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="750" height="1624"></canvas>
  <div id="toast"></div>
  <button id="hud-pause" aria-label="Пауза">❚❚</button>
  <button id="chute" class="btn org small">🪂 Парашют</button>
  <div id="ctl">
    <div id="thrust"><span style="font-size:34px">🔥</span>ТЯГА</div>
    <div id="tilt"><div class="h" id="tl">◀</div><div class="h" id="tr">▶</div></div>
  </div>

  <div class="screen on" id="s-menu"><div class="stars"></div>
    <div style="height:30px"></div>
    <svg width="150" height="150" viewBox="-40 -50 80 100" id="menuShip"></svg>
    <h1>ПОСАДКА<br>НА ПЛАНЕТУ</h1>
    <div class="sub" style="margin-top:12px">Посади модуль мягко на площадку.<br>У каждой планеты свой вес и свой воздух!</div>
    <button class="btn" id="b-play" style="margin-top:22px">▶ Играть</button>
    <button class="btn blue" id="b-ships">🚀 Корабли</button>
    <button class="btn blue small" id="b-snd">🔊 Звук: вкл</button>
    <div class="sub" style="margin-top:auto" id="m-total"></div>
  </div>

  <div class="screen" id="s-map"><div class="stars"></div>
    <h2>Куда летим?</h2>
    <div class="grid" id="mapgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="menu">← В меню</button>
  </div>

  <div class="screen" id="s-lv"><div class="stars"></div>
    <h2 id="lv-title"></h2>
    <div class="sub" id="lv-sub"></div>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="map">← К планетам</button>
  </div>

  <div class="screen" id="s-brief"><div class="stars"></div>
    <h2>Брифинг</h2>
    <div class="sub" id="br-sub"></div>
    <div class="panel"><div class="q" id="br-q"></div><div id="br-ans"></div></div>
    <div class="panel hint" id="br-hint" style="display:none"></div>
    <button class="btn" id="b-go" style="display:none">🚀 К посадке!</button>
    <button class="btn blue small" id="b-skip" style="margin-top:auto">Пропустить вопрос</button>
  </div>

  <div class="screen" id="s-res"><div class="stars"></div>
    <h2 id="r-title"></h2>
    <div class="big" id="r-stars"></div>
    <div class="panel hint" id="r-text"></div>
    <button class="btn" id="r-next">Дальше ▶</button>
    <button class="btn org" id="r-retry">↻ Ещё раз</button>
    <button class="btn blue small" data-go="lv">☰ К площадкам</button>
  </div>

  <div class="screen" id="s-ships"><div class="stars"></div>
    <h2>Корабли</h2>
    <div class="sub" id="sh-sub"></div>
    <div class="grid" id="shgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="menu">← В меню</button>
  </div>

  <div class="screen" id="pause"><h2>Пауза</h2>
    <button class="btn" id="p-res">▶ Продолжить</button>
    <button class="btn blue small" id="p-quit">☰ К площадкам</button>
  </div>
</div>

<script>
'use strict';
/* ===== Платформа: заглушка Яндекс Игр (без SDK всё работает как есть) ===== */
var PF = (function () {
  var ys = null, ok = false;
  var self = { onPause: function () {} };
  self.get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  self.put = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  self.ready = function () { try { if (ok && ys.features && ys.features.LoadingAPI) ys.features.LoadingAPI.ready(); } catch (e) {} };
  try {
    if (window.YaGames && window.YaGames.init) window.YaGames.init().then(function (s) { ys = s; ok = true; self.ready(); }).catch(function () {});
  } catch (e) {}
  document.addEventListener('visibilitychange', function () { self.onPause(document.hidden); });
  return self;
})();

/* ===== Данные ===== */
var BODIES = [
  { id: 'moon', name: 'Луна', g: 1.62, c: 0, T: 95, wind: 0, color: 'radial-gradient(circle at 35% 30%,#f2f2f2,#9a9a9a)', sky: ['#04030f', '#12103a'], ground: ['#b9b6c9', '#7d7a92', '#4b4960'], stars: true, chuteMsg: 'Воздуха нет — парашют не работает!', unlockNeed: 0,
    info: 'g = 1,62 м/с² (в 6 раз слабее земной)',
    qs: [
      { q: 'Во сколько раз притяжение на Луне слабее земного?', a: ['В 2 раза', 'В 6 раз', 'В 20 раз'], c: 1, hint: 'Верно! На Луне g = 1,62 м/с² — примерно 1/6 земного. Модуль падает медленно, но воздуха нет: парашют не поможет, тормозить придётся только двигателем.' },
      { q: 'Есть ли на Луне воздух?', a: ['Есть, как на Земле', 'Почти нет — там вакуум', 'Только на тёмной стороне'], c: 1, hint: 'Верно! Воздуха на Луне нет, поэтому парашют бесполезен, а небо всегда чёрное. Тормозим только двигателем!' }
    ] },
  { id: 'mars', name: 'Марс', g: 3.71, c: 0.06, T: 150, wind: 70, color: 'radial-gradient(circle at 35% 30%,#ff9a5a,#b33c14)', sky: ['#7a3b2a', '#e8a070'], ground: ['#d4743c', '#a24a25', '#6b2e18'], stars: false, chuteMsg: 'Воздух тонкий — парашют тормозит слабо.', unlockNeed: 3,
    info: 'g = 3,71 м/с² (38 % земной), воздух очень разрежен',
    qs: [
      { q: 'Почему на Марсе парашют помогает хуже, чем на Земле?', a: ['Воздух очень разрежен', 'Там нет притяжения', 'Парашют сгорает'], c: 0, hint: 'Верно! Давление на Марсе всего 0,6 % от земного. Парашют чуть помогает, но основную работу делает двигатель. g = 3,71 м/с².' },
      { q: 'Какого цвета небо над Марсом днём?', a: ['Ярко-синее', 'Розово-оранжевое от пыли', 'Зелёное'], c: 1, hint: 'Верно! Небо розово-оранжевое от мелкой пыли. Лёгкий ветер сносит модуль — следи за стрелкой ветра.' }
    ] },
  { id: 'venus', name: 'Венера', g: 8.87, c: 0.35, T: 285, wind: 20, color: 'radial-gradient(circle at 35% 30%,#fff0a0,#d09a1a)', sky: ['#7d6a10', '#d9c24a'], ground: ['#a8741f', '#7a4d12', '#4a2d0a'], stars: false, chuteMsg: 'Воздух густой — парашют сильно тормозит!', unlockNeed: 3,
    info: 'g = 8,87 м/с² (почти как на Земле), воздух в 92 раза плотнее',
    qs: [
      { q: 'Какое давление воздуха у поверхности Венеры?', a: ['Такое же, как на Земле', 'В 92 раза больше земного', 'В 10 раз меньше земного'], c: 1, hint: 'Верно! Воздух на Венере в 92 раза давит сильнее, чем на Земле — парашют тормозит отлично. Но g = 8,87 м/с², падать тяжело и ветер сильный.' },
      { q: 'Почему на Венере жарче всего (около 460 °C)?', a: ['Она ближе всех к Солнцу', 'Парниковый эффект: много углекислого газа', 'Там много вулканов-печей'], c: 1, hint: 'Верно! Углекислый газ держит тепло, как стекло теплицы. Густой воздух плотно давит на парашют — раскрой его пораньше!' }
    ] }
];
var SOON = ['Титан', 'Юпитер', 'Меркурий', 'Земля', 'Европа', 'Церера', 'Плутон'];
var SHIPS = [
  { name: 'Искра', fuel: 100, need: 0, col: '#ff5a4a', col2: '#ffd84a', leg: 0 },
  { name: 'Крошка', fuel: 110, need: 6, col: '#3fb8ff', col2: '#fff', leg: 1 },
  { name: 'Вездеход-Х', fuel: 120, need: 15, col: '#46d36a', col2: '#222', leg: 2 },
  { name: 'Звездолёт', fuel: 130, need: 30, col: '#b06bff', col2: '#ffd84a', leg: 3 }
];
var LV = [
  { padW: 96, fuel: 1.0, wind: 0,   cr: 0, night: false, txt: 'Широкая площадка' },
  { padW: 78, fuel: 1.0, wind: 0,   cr: 1, night: false, txt: 'Площадка поуже, есть кратер' },
  { padW: 64, fuel: 0.95, wind: 0.6, cr: 2, night: false, txt: 'Кратеры и ветер' },
  { padW: 54, fuel: 0.9, wind: 1,   cr: 3, night: false, txt: 'Узкая площадка, порывы ветра' },
  { padW: 52, fuel: 0.9, wind: 0.8, cr: 3, night: true,  txt: 'Ночь! Светит только прожектор' }
];
var K = { vy: 45, vx: 30, ang: 12 * Math.PI / 180, vy2: 25, ang2: 6 * Math.PI / 180, burn: 12, turn: 1.7, W: 375, H: 812 };

/* ===== Сохранение ===== */
var SAVE_KEY = 'posadka-v1';
var save = { stars: {}, snd: 1, ship: 0 };
try { var raw = PF.get(SAVE_KEY); if (raw) { var o = JSON.parse(raw); if (o && o.stars) save = o; } } catch (e) {}
function persist() { PF.put(SAVE_KEY, JSON.stringify(save)); }
function stars(b, i) { return save.stars[b + '-' + i] || 0; }
function bodySum(b) { var s = 0; for (var i = 0; i < 5; i++) s += stars(BODIES[b].id, i); return s; }
function bodyLanded(b) { var n = 0; for (var i = 0; i < 5; i++) if (stars(BODIES[b].id, i) > 0) n++; return n; }
function totalStars() { var s = 0; for (var k in save.stars) s += save.stars[k]; return s; }
function bodyOpen(b) { return b === 0 || bodyLanded(b - 1) >= BODIES[b].unlockNeed; }
function lvOpen(b, i) { return bodyOpen(b) && (i === 0 || stars(BODIES[b].id, i - 1) > 0); }

/* ===== Звук (простые сигналы WebAudio, включается после первого касания) ===== */
var Snd = (function () {
  var ac = null, eng = null, engG = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      var n = ac.createBufferSource(), buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      n.buffer = buf; n.loop = true;
      var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
      engG = ac.createGain(); engG.gain.value = 0;
      n.connect(f); f.connect(engG); engG.connect(ac.destination); n.start();
    } catch (e) { ac = null; }
  }
  function tone(f, t, type, vol, slide) {
    if (!ac || !save.snd) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      if (slide) o.frequency.linearRampToValueAtTime(slide, ac.currentTime + t);
      g.gain.value = vol || 0.15; g.gain.linearRampToValueAtTime(0.0001, ac.currentTime + t);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + t);
    } catch (e) {}
  }
  return {
    init: init,
    engine: function (on) { if (engG) engG.gain.value = (on && save.snd) ? 0.18 : 0; },
    ok: function () { tone(523, .15, 'triangle'); setTimeout(function () { tone(659, .15, 'triangle'); }, 140); setTimeout(function () { tone(784, .3, 'triangle'); }, 280); },
    boom: function () { tone(160, .6, 'sawtooth', .25, 30); },
    click: function () { tone(660, .06, 'square', .06); },
    warn: function () { tone(880, .08, 'square', .05); }
  };
})();

/* ===== Вспомогательное ===== */
function $(id) { return document.getElementById(id); }
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fmt(v, d) { return v.toFixed(d == null ? 0 : d).replace('.', ','); }

/* ===== Экраны ===== */
var cur = 'menu', selB = 0, selL = 0, bonusFuel = 0, attempts = 0;
function show(id) {
  cur = id;
  ['menu', 'map', 'lv', 'brief', 'res', 'ships'].forEach(function (s) { $('s-' + s).classList.toggle('on', s === id); });
  var play = id === 'play';
  $('ctl').style.display = play ? 'block' : 'none'; $('hud-pause').style.display = play ? 'block' : 'none'; $('chute').style.display = play ? 'block' : 'none';
  if (id === 'menu') drawMenuShip();
  if (id === 'map') buildMap();
  if (id === 'lv') buildLv();
  if (id === 'ships') buildShips();
  if (id !== 'play') { G.run = false; Snd.engine(false); }
}
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-go]') : null;
  if (t) { Snd.init(); Snd.click(); show(t.getAttribute('data-go')); }
});

function shipSVG(sh, flame) {
  return '<g><path d="M-14 22 L-26 38 M14 22 L26 38" stroke="#222" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-30 38h8M22 38h8" stroke="#222" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M-14 -22 Q0 -46 14 -22 L16 20 Q0 28 -16 20Z" fill="' + sh.col + '" stroke="#222" stroke-width="3"/>' +
    '<circle cx="0" cy="-6" r="8" fill="#bfe9ff" stroke="#222" stroke-width="3"/><circle cx="-2.5" cy="-8" r="2.5" fill="#fff"/>' +
    '<rect x="-12" y="14" width="24" height="7" rx="3" fill="' + sh.col2 + '" stroke="#222" stroke-width="2"/>' +
    (flame ? '<path d="M-7 26 Q0 50 7 26Z" fill="#ffb02e" stroke="#222" stroke-width="2"/>' : '') + '</g>';
}
function drawMenuShip() { $('menuShip').innerHTML = shipSVG(SHIPS[save.ship], true); $('m-total').textContent = 'Звёзд собрано: ' + totalStars(); $('b-snd').textContent = save.snd ? '🔊 Звук: вкл' : '🔇 Звук: выкл'; }
function buildMap() {
  var h = '';
  BODIES.forEach(function (b, i) {
    var open = bodyOpen(i);
    h += '<div class="card' + (open ? '' : ' lock') + '" data-b="' + i + '"><div class="pl" style="background:' + b.color + '"></div><b>' + b.name + '</b><i>' + (open ? '★ ' + bodySum(i) + ' / 15' : '🔒 посади ' + b.unlockNeed + ' раза на ' + BODIES[i - 1].name.replace('Луна', 'Луне').replace('Марс', 'Марсе')) + '</i></div>';
  });
  SOON.forEach(function (n) { h += '<div class="card lock"><div class="pl" style="background:#3a3a63"></div><b>' + n + '</b><i>скоро</i></div>'; });
  $('mapgrid').innerHTML = h;
  Array.prototype.forEach.call($('mapgrid').querySelectorAll('.card[data-b]'), function (el) {
    el.onclick = function () { var i = +el.getAttribute('data-b'); if (!bodyOpen(i)) return; Snd.init(); Snd.click(); selB = i; show('lv'); };
  });
}
function buildLv() {
  var b = BODIES[selB];

    octx.globalCompositeOperation = 'destination-out';
    var gx = G.x + Math.sin(G.ang) * 0, gy = G.y;
    var rg = octx.createRadialGradient(gx, gy, 5, gx, gy, 55); rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); octx.fillStyle = rg; octx.beginPath(); octx.arc(gx, gy, 55, 0, 6.3); octx.fill();
    octx.save(); octx.translate(G.x, G.y); octx.rotate(G.ang + Math.PI); // конус вниз вдоль оси
    var cg = octx.createLinearGradient(0, 10, 0, 330); cg.addColorStop(0, 'rgba(0,0,0,1)'); cg.addColorStop(1, 'rgba(0,0,0,0)'); octx.fillStyle = cg;
    octx.beginPath(); octx.moveTo(0, -10); octx.lineTo(-95, -330); octx.lineTo(95, -330); octx.closePath(); octx.fill(); octx.restore();
    ctx.drawImage(off, 0, 0, K.W, K.H);
    // огни площадки светят всегда
    var blink = Math.sin(G.t * 6) > 0; [G.padX - G.padW / 2, G.padX + G.padW / 2].forEach(function (lx) { var gg = ctx.createRadialGradient(lx, G.padY - 20, 0, lx, G.padY - 20, 26); gg.addColorStop(0, blink ? 'rgba(255,60,60,.95)' : 'rgba(255,150,150,.5)'); gg.addColorStop(1, 'rgba(255,60,60,0)'); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(lx, G.padY - 20, 26, 0, 6.3); ctx.fill(); });
    ctx.fillStyle = '#7dff9a'; ctx.beginPath(); ctx.moveTo(G.padX, G.padY - 46); ctx.lineTo(G.padX - 8, G.padY - 60); ctx.lineTo(G.padX + 8, G.padY - 60); ctx.fill();
  }
  drawHUD();
  // стрелка к площадке, если она не видна по бокам: не нужна (одна сцена)
}

var last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!G.run) return;
  if (!G.paused) {
    acc += dt; var n = 0;
    while (acc >= 1 / 120 && n < 12) { step(1 / 120); acc -= 1 / 120; n++; if (!G.run) break; }
    if (acc > 0.1) acc = 0;
    G.parts = G.parts.filter(function (p) { p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (G.body ? G.body.g * 10 : 20) * dt; return p.l > 0; });
    Snd.engine(G.thrustOn && G.fuel > 0 && !G.ending);
    if (G.run && G.fuel < G.fuel0 * 0.12 && G.fuel > 0 && now - G.lastWarn > 700 && G.thrustOn) { G.lastWarn = now; Snd.warn(); }
  }
  if (G.run) render();
}
requestAnimationFrame(frame);

/* ===== Ввод ===== */
(function () {
  var th = $('thrust'), tp = $('tilt'), tl = $('tl'), tr = $('tr');
  function setTilt(e) {
    var r = tp.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, d = x < 0.5 ? -1 : 1;
    G.tilt = d; tl.classList.toggle('d', d < 0); tr.classList.toggle('d', d > 0);
  }
  function clr() { G.tilt = 0; tl.classList.remove('d'); tr.classList.remove('d'); }
  th.addEventListener('pointerdown', function (e) { Snd.init(); try { th.setPointerCapture(e.pointerId); } catch (x) {} G.thrust = true; th.classList.add('d'); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { th.addEventListener(n, function () { G.thrust = false; th.classList.remove('d'); }); });
  tp.addEventListener('pointerdown', function (e) { Snd.init(); try { tp.setPointerCapture(e.pointerId); } catch (x) {} setTilt(e); e.preventDefault(); });
  tp.addEventListener('pointermove', function (e) { if (e.buttons || e.pressure > 0) setTilt(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { tp.addEventListener(n, clr); });
  $('chute').addEventListener('click', function () {
    if (!G.run || G.chute) return; G.chute = true; this.style.opacity = .4; Snd.click(); toast(G.body.chuteMsg, 2200);
  });
  $('hud-pause').onclick = function () { G.paused = true; $('pause').classList.add('on'); Snd.engine(false); };
  $('p-res').onclick = function () { G.paused = false; $('pause').classList.remove('on'); last = performance.now(); };
  $('p-quit').onclick = function () { $('pause').classList.remove('on'); show('lv'); };
  PF.onPause = function (h) { if (h && G.run && !G.paused) $('hud-pause').onclick(); };
  window.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft') G.kb.l = 1; else if (e.code === 'ArrowRight') G.kb.r = 1; else if (e.code === 'ArrowUp' || e.code === 'Space') G.kb.t = 1;
    else if (e.code === 'KeyP' && G.run) $('chute').click(); else return; e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft') G.kb.l = 0; else if (e.code === 'ArrowRight') G.kb.r = 0; else if (e.code === 'ArrowUp' || e.code === 'Space') G.kb.t = 0;
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();

/* ===== Масштаб под экран ===== */
function fit() {
  var s = Math.min(window.innerWidth / 375, window.innerHeight / 812), app = $('app');
  app.style.transform = 'translate(' + ((window.innerWidth - 375 * s) / 2) + 'px,' + ((window.innerHeight - 812 * s) / 2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
drawMenuShip();
window.__game = { G: G, K: K, save: save, BODIES: BODIES, step: step, start: function (b, l) { selB = b; selL = l; bonusFuel = 0; startGame(); }, show: show, groundY: groundY, finish: finish, setSel: function (b, l) { selB = b; selL = l; } };
</script>
</body>
