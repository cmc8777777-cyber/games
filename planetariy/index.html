<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>Планетарий</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{--bg:#0b1034;--bg2:#1a2160;--card:#1f2a6e;--card2:#2a378c;--ink:#fff;--muted:#a9b4ff;--gold:#ffd23f;--orange:#ff7a45;--cyan:#5ee0ff;--good:#5ce08a;--bad:#ff6b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050820;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.scroll{overflow-y:auto;flex:1;padding:12px 14px 20px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{background:linear-gradient(#ffdc5c,#ffb21f);color:#4a2a00;font-weight:800;border-radius:16px;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 #b97500}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b97500}
.btn.alt{background:linear-gradient(#5b6bff,#3a47d6);color:#fff;box-shadow:0 4px 0 #222c93}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4}
h1,h2{margin:0}
/* заставка */
#scrTitle{align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
#scrTitle .logo{font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #b97500,0 0 30px rgba(255,210,63,.5);letter-spacing:1px}
#scrTitle .sub{color:var(--muted);margin-bottom:10px}
#scrTitle .planet{font-size:92px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
#scrTitle .btn{width:240px}
/* карта уровней */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:50px}
.top h2{flex:1;font-size:18px}
.ib{background:rgba(255,255,255,.14);border-radius:12px;min-width:40px;height:40px;font-size:18px;padding:0 10px}
.world{background:var(--card);border-radius:18px;padding:12px;margin-bottom:12px}
.world h3{margin:0 0 2px;font-size:17px}
.world p{margin:0 0 10px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:14px;background:var(--card2);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv small{font-size:11px;color:var(--gold);letter-spacing:-1px;min-height:13px}
.lv.boss{background:linear-gradient(#ff8a5c,#e0452c)}
.lv.lock{opacity:.35}
.lv.next{outline:3px solid var(--gold)}
.world.soon{opacity:.5}
/* игра */
#gTop{display:flex;align-items:center;gap:8px;padding:8px 10px}
#gTitle{flex:1;font-weight:800;font-size:15px}
#bubble{display:flex;gap:8px;align-items:center;margin:0 10px;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 10px;min-height:76px}
#bubble .av{font-size:34px;line-height:1;width:64px;text-align:center}#bubble .av img{width:64px;height:72px;object-fit:contain;display:block}.pane .hero{height:110px;margin:-4px auto 0;display:block}#scrTitle.cov{background-size:cover;background-position:center;justify-content:flex-start;gap:10px;padding-top:34px}#scrTitle.cov .planet{display:none}#scrTitle.cov .sub{margin-bottom:auto;text-shadow:0 2px 6px #000}#scrTitle.cov .btn.ghost{background:rgba(10,14,60,.7)}
#bubble .tx{flex:1;font-size:15px;line-height:1.25}
#bubble .tx b{color:var(--gold)}
#stage{position:relative;flex:1;min-height:0;margin:4px 0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ctl{padding:6px 10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;justify-content:center;align-items:center}
.row .btn{padding:10px 12px;font-size:15px}
.sm{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 11px;font-weight:700;font-size:14px}
#hintBtn.on{background:var(--gold);color:#4a2a00}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ccard{background:var(--card);border-radius:16px;padding:8px;width:156px;text-align:center}
.ccard .cn{font-weight:800;font-size:14px}
.ccard .dg{font-size:28px;font-weight:900;color:var(--gold)}
.ccard svg{width:70px;height:70px}
.ccard .cr{display:flex;gap:6px;justify-content:center;margin-top:4px}
.ccard .cr button{background:rgba(255,255,255,.18);border-radius:10px;width:44px;height:36px;font-size:20px;font-weight:900}
.ccard .dy{margin-top:5px;background:rgba(255,255,255,.1);border-radius:10px;font-size:12px;padding:5px 8px;width:100%}
.ccard.ok{outline:3px solid var(--good)}.ccard.no{outline:3px solid var(--bad)}
/* результат */
.modal{background:rgba(5,8,32,.86);align-items:center;justify-content:center;padding:18px;z-index:5}
.pane{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:380px;text-align:center}
.stars{font-size:46px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.6)}
.stars i{opacity:.25;font-style:normal}
.pane .fact{background:rgba(255,255,255,.1);border-radius:14px;padding:10px;margin:12px 0;font-size:14px;text-align:left}
.pane .fact b{color:var(--cyan)}
/* викторина */
#scrQuiz .qq{font-size:20px;font-weight:800;margin:10px 4px 16px;line-height:1.25}
.opt{display:block;width:100%;background:var(--card2);border-radius:16px;padding:14px;margin-bottom:10px;font-size:16px;font-weight:700;text-align:left}
.opt.ok{background:#1f9d57}.opt.no{background:#b3304f}
#qExp{margin:6px 4px;color:var(--muted);font-size:14px;min-height:40px}
/* журнал */
.fc{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.fc b{color:var(--cyan);display:block;margin-bottom:2px}
.fc.lock{opacity:.4}
.pm-hide .pm-corner{display:none!important}
#toast{position:absolute;left:14px;right:14px;bottom:24px;z-index:9;background:#ffd23f;color:#4a2a00;font-weight:800;border-radius:14px;padding:12px 14px;text-align:center;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#toast[hidden]{display:none}
#pks .opt{padding:10px 12px;font-size:14px;margin-bottom:6px}
.world .lh{color:var(--gold);font-weight:700}
.world.wlock{opacity:.85}
.pm-on .top{padding-right:128px}
.pm-corner{--pm-paper:#1f2a6e;--pm-ink:#fff;--paper:#1f2a6e;--fg:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:88vw;background:#101a3a;color:#fff;border:1px solid #6fd3ff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}#toast.on{opacity:1}
</style></head><body><div id="toast"></div>
<div id="app">
 <div id="toast" hidden></div>
 <div class="screen" id="scrTitle">
  <div class="planet">🌍</div>
  <div class="logo" data-t="logo">ПЛАНЕТАРИЙ</div>
  <div class="sub" data-t="title.sub">Крути Землю — разгадывай космос</div>
  <button class="btn" id="bPlay" data-t="title.play">Играть</button>
  <button class="btn alt" id="bRepeat" data-t="title.repeat">Повторение</button>
  <button class="btn ghost" id="bJournal" data-t="title.journal">Журнал наблюдений</button>
  <button class="btn ghost" id="bLang" hidden style="font-size:13px;padding:8px 14px;width:auto">English</button>
  <button class="btn ghost" id="bReset" data-t="title.reset" style="font-size:13px;padding:8px 14px;width:auto">Сбросить прогресс</button>
 </div>

 <div class="screen" id="scrMap" hidden>
  <div class="top"><button class="ib" data-go="title">←</button><h2 data-t="map.title">Миры</h2><span id="mapStars" style="color:var(--gold);font-weight:800"></span></div>
  <div class="scroll" id="worlds"></div>
 </div>

 <div class="screen" id="scrGame" hidden>
  <div id="gTop"><button class="ib" id="gBack">←</button><div id="gTitle"></div><button class="ib" id="gHint">💡 <span id="hn">3</span></button></div>
  <div id="bubble"><div class="av" id="av">🧑‍🚀</div><div class="tx" id="msg"></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="ctl"></div>
 </div>

 <div class="screen" id="scrQuiz" hidden>
  <div class="top"><button class="ib" id="qBack">←</button><h2 id="qTitle" data-t="quiz.title">Викторина</h2><span id="qProg" style="color:var(--gold);font-weight:800"></span></div>
  <div class="scroll"><div class="qq" id="qq"></div><div id="qo"></div><div id="qExp"></div><button class="btn" id="qNext" hidden style="width:100%" data-t="res.next">Дальше</button></div>
 </div>

 <div class="screen" id="scrJournal" hidden>
  <div class="top"><button class="ib" data-go="title">←</button><h2 data-t="journal.title">Журнал наблюдений</h2><span id="jCnt" style="color:var(--gold);font-weight:800"></span></div>
  <div class="scroll" id="jList"></div>
 </div>

 <div class="screen modal" id="scrRes" hidden>
  <div class="pane">
   <div id="rHero"></div><h2 id="rTitle"></h2>
   <div class="stars" id="rStars"></div>
   <div class="fact" id="rFact"></div>
   <div class="row"><button class="btn ghost" id="rAgain" data-t="res.again">Ещё раз</button><button class="btn" id="rNext" data-t="res.next">Дальше</button></div>
   <div class="row" style="margin-top:8px"><button class="btn ghost" id="rMap" style="font-size:14px" data-t="res.map">К уровням</button></div>
  </div>
 </div>
</div>

 "Levels", "scene.rot": "rotation", "scene.day": "☀ day", "city.msk": "Moscow", "city.lon": "London", "city.ber": "Berlin", "city.cai": "Cairo", "city.ekb": "Yekaterinburg", "city.omsk": "Omsk", "city.vl": "Vladivostok", "city.tok": "Tokyo", "city.ny": "New York", "city.la": "L.A.", "world.1.name": "Day and Night", "world.1.sub": "Day, night, and Earth's rotation", "world.2.name": "Time Zones", "world.2.sub": "Time zones and trains", "world.3.name": "Seasons", "world.3.sub": "Earth's orbit and tilt", "world.4.name": "Polar Day", "world.4.sub": "Latitude and daylight hours", "world.5.name": "Moon", "world.5.sub": "Moon phases and eclipses", "world.6.name": "Travel", "world.6.sub": "Time zones + seasons", "world.7.name": "Astronomer's Exam", "world.7.sub": "Everything together", "lv.1.txt": "Hi! I'm Mira, and this is my cat, Comet. Spin Earth with your finger until <b>it's noon in Moscow<\/b> — when the Sun is directly above the city.", "lv.1.fact": "Earth spins on its axis. That's why day turns into night.", "lv.1.h1": "Noon is when a city faces the Sun. Spin Earth until Moscow is on the right.", "lv.2.txt": "Now <b>it's midnight in Moscow<\/b>. Where is the Sun?", "lv.2.fact": "Night happens on the side of Earth facing away from the Sun. When it's midnight here, it's noon on the other side.", "lv.2.h1": "At midnight, Moscow is on the darkest side, on the left.", "lv.3.txt": "<b>It's sunrise in Moscow<\/b> (6:00). Earth spins counterclockwise. Which way should Moscow move?", "lv.3.fact": "Earth spins from west to east. That's why the Sun rises in the east.", "lv.3.h1": "At sunrise, a city moves out of the dark and into the light. Moscow should be at the bottom, where day meets night.", "lv.4.txt": "<b>It's sunset in Moscow<\/b> (18:00).", "lv.4.fact": "Sunset happens when a city moves into Earth's shadow as Earth spins. The Sun seems to go down.", "lv.4.h1": "At sunset, Moscow is at the top, where day meets night.", "lv.5.txt": "<b>It's daytime in Tokyo, but nighttime in London.<\/b> Yes, that can happen!", "lv.5.fact": "When it's daytime on one side of Earth, it's nighttime on the other. That's why people in different countries have different times.", "lv.5.h1": "Tokyo and London are far apart, almost on opposite sides of Earth.", "lv.6.txt": "<b>It's noon in New York.<\/b> Look at the time in London!", "lv.6.fact": "The farther east a city is, the later its time. The Sun appears to move from east to west.", "lv.6.h1": "New York should be on the right, facing the Sun. London is farther east, so it's already evening there.", "lv.7.txt": "<b>It's noon in London.<\/b> Look at Moscow: it's already past 13:00 there!", "lv.7.fact": "Every 15° of longitude makes about one hour of difference in solar time. Moscow is 37.6° east of London. That's about 2.5 hours.", "lv.7.h1": "London should be on the right, facing the Sun.", "lv.8.txt": "<b>It's midnight in London.<\/b> London is on the prime (Greenwich) meridian.", "lv.8.fact": "The prime (Greenwich) meridian passes through Greenwich, an area of London. We use it to measure longitude and count time zones.", "lv.8.h1": "London should be on the darkest side, on the left.", "lv.9.txt": "<b>It's sunset in Moscow and morning in Los Angeles.<\/b> Set Moscow to sunset and look at Los Angeles.", "lv.9.fact": "Earth makes one full turn in 24 hours: 360° ÷ 24 = 15° per hour.", "lv.9.h1": "Moscow should be at the top, where day meets night.", "lv.10.txt": "<b>Boss quiz!<\/b> Five questions about day and night. Get at least 4 right.", "lv.10.fact": "You know how day and night work: Earth spins, and the Sun lights up one side.", "lv.11.txt": "It's <b>12:00<\/b> in Moscow. Set the clock in <b>London<\/b>.", "lv.11.fact": "Time zones help large areas use the same time.", "lv.11.h1": "London is 3 hours behind Moscow. Look at Earth to see which city is closer to the Sun.", "lv.12.txt": "It's <b>12:00<\/b> in Moscow. What time is it in <b>Vladivostok<\/b>?", "lv.12.fact": "Vladivostok is 7 hours ahead of Moscow. It's already evening there.", "lv.12.h1": "Vladivostok is farther east, so its time is later.", "lv.13.txt": "It's <b>12:00<\/b> in Moscow. What time is it in <b>New York<\/b>?", "lv.13.fact": "Earth has 24 main time zones. Each zone is 15° wide.", "lv.13.h1": "New York is 8 hours behind Moscow.", "lv.14.txt": "It's <b>12:00<\/b> in Moscow. What time is it in <b>Yekaterinburg<\/b>?", "lv.14.fact": "Russia has 11 time zones, more than any other country.", "lv.14.h1": "Yekaterinburg is 2 hours ahead of Moscow.", "lv.15.txt": "It's <b>8:00<\/b> in London. Set the clocks in <b>Berlin<\/b> and <b>Cairo<\/b>.", "lv.15.fact": "Greenwich in London is the starting point for time zones. Berlin is 1 hour ahead, and Cairo is 2 hours ahead.", "lv.15.h1": "Berlin is one time zone east of London. Cairo is two.", "lv.16.txt": "A train leaves Moscow at <b>10:00<\/b> and crosses <b>3 time zones east<\/b> to Omsk. What time is it in Omsk?", "lv.16.fact": "When you travel east, clocks move forward. Each time zone adds one hour.", "lv.16.h1": "Each time zone east adds one hour. Three zones add three hours.", "lv.17.txt": "A train leaves Moscow at <b>15:00<\/b> Moscow time. What time is it in <b>Vladivostok<\/b> at that moment?", "lv.17.fact": "The Trans-Siberian Railway crosses 7 time zones. The trip from Moscow to Vladivostok takes 7 days.", "lv.17.h1": "Vladivostok is 7 hours ahead of Moscow.", "lv.18.txt": "It's <b>8:00<\/b> in Tokyo. Set the clock in <b>Los Angeles<\/b>. Don't forget the day!", "lv.18.fact": "The International Date Line is between Tokyo and Los Angeles. Los Angeles is 17 hours behind Tokyo, so it's still yesterday there.", "lv.18.h1": "Tokyo is 17 hours ahead of L.A. Subtract 17 hours. You'll go back past midnight.", "lv.19.txt": "Spin Earth until <b>it's 9:00 in Moscow<\/b> by the clock (time zone time).", "lv.19.fact": "Moscow uses UTC+3. That's 3 hours ahead of Greenwich.", "lv.19.h1": "It's morning in Moscow. The city is still near the dark side, close       if (!ok) { var e = new Error("save"); e.code = "save"; throw e; }
      // срок уже сохранён: если закрыть покупку не вышло, её закроют при следующем запуске, второй раз срок не начислится
      return Promise.resolve(payments.consumePurchase(tok)).then(function () {}, function () {});
    }).then(function () { emit(); return true; });
  }
  function queue(f) { var r = chain.then(f, f); chain = r.then(function () {}, function () {}); return r; }
  function checkPurchases() {
    return queue(function () {
      return payments.getPurchases().then(function (list) {
        list = Array.isArray(list) ? list : (list && list.purchases) || [];
        return list.reduce(function (p, item) { return p.then(function () { return grant(item).catch(function () {}); }); }, Promise.resolve());
      });
    }).catch(function () {}).then(function () { emit(); });
  }
  function buy(id) {
    if (busy || !canBuy || !config.products[id]) return Promise.resolve(false);
    busy = true; setStatus(tx("busy")); renderShop();
    return queue(function () {
      return payments.purchase({ id: id, developerPayload: "pm" }).then(function (p) {
        return grant(p).then(function () { setStatus(fmt(tx("done"), dateStr(st.until))); return true; }, function (e) {
          setStatus(e && e.code === "save" ? tx("saveFail") : tx("fail")); return false;
        });
      }, function () { setStatus(tx("fail")); return false; });
    }).then(function (r) { busy = false; renderShop(); return r; }, function () { busy = false; renderShop(); return false; });
  }

  /* ---- Вызовы хозяина ---- */
  function noteFullscreen() { st.ads++; persist(); }
  /* ---- Подарок дня: раз в сутки, пока Премиум активен. Не кнопка ролика, значка рекламы нет. ---- */
  function giftAvailable() { return !!(gift && active() && st.giftDay !== dayIdx()); }
  function giftText() { var g = gift && gift.text; var s = g && (g[lang] || g.ru); return s || tx("giftText"); }
  /* Забрать подарок. true, если выдан сейчас (один раз за календарный день); хозяин применяет подарок в gift.grant(). День помечается и сохраняется ДО выдачи, повторить нельзя. */
  function claimGift() {
    if (!giftAvailable()) return false;
    st.giftDay = dayIdx(); persist();
    try { if (store && store.save) Promise.resolve(store.save()).then(function () {}, function () {}); } catch (e) {}
    try { gift.grant(); } catch (e) {}
    emit();
    return true;
  }
  /* Показать карточку на спокойном экране (меню, результат). Возвращает true, если карточка открыта. */
  function maybeCard() {
    if (!available() || ui.ov) return false;
    if (active()) {
      if (giftAvailable()) { openCard("gift"); return true; }
      if (daysLeft() <= config.remindDays && st.remindDay !== dayIdx()) { st.remindDay = dayIdx(); persist(); openCard("soon"); return true; }
      return false;
    }
    if (st.until > 0 && st.endShown !== st.until) { st.endShown = st.until; persist(); openCard("end"); return true; }
    if (config.cardEvery > 0 && Math.floor(st.ads / config.cardEvery) > Math.floor(st.cardAt / config.cardEvery)) { st.cardAt = st.ads; persist(); openCard("ad"); return true; }
    return false;
  }

  /* ---- Интерфейс ---- */
  var CSS = ".pm-corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));z-index:var(--pm-z,50);display:inline-flex;align-items:center;gap:5px;" +
    "min-height:40px;padding:0 12px;border-radius:20px;border:1.5px solid var(--pm-ink,var(--fg,#22304a));background:var(--pm-gold,#f2c14e);color:#2a2110;font:600 14px/1 var(--f-display,system-ui,sans-serif);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)}" +
    ".pm-corner[hidden]{display:none}.pm-corner.on{background:var(--pm-paper,var(--paper,#f4edd9));color:var(--pm-ink,var(--fg,#22304a))}" +
    ".pm-corner:focus-visible,.pm-btn:focus-visible,.pm-x:focus-visible{outline:3px solid var(--pm-focus,var(--focus,#1d5cc0));outline-offset:2px}" +
    ".pm-ov{position:fixed;inset:0;z-index:calc(var(--pm-z,50) + 10);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:var(--pm-scrim,rgba(20,18,12,.5))}" +
    ".pm-ov[hidden]{display:none}.pm-box{position:relative;box-sizing:border-box;width:100%;max-width:420px;max-height:calc(100% - 8px);overflow-y:auto;background:var(--pm-paper,var(--paper,#f4edd9));color:var(--pm-ink,var(--fg,#22304a));" +
    "border:1.5px solid var(--pm-ink,var(--fg,#22304a));border-radius:12px;padding:18px 18px 16px;box-shadow:0 10px 34px rgba(0,0,0,.4);font:15px/1.4 var(--f-body,system-ui,sans-serif);-webkit-user-select:none;user-select:none}" +
    ".pm-box h2{margin:0 36px 8px 0;font:600 22px/1.2 var(--f-display,system-ui,sans-serif);text-wrap:balance}.pm-box p{margin:0 0 10px}.pm-sub{color:var(--pm-muted,var(--muted,#615d4f));font-size:14px}" +
    ".pm-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--pm-ink,var(--fg,#22304a));background:transparent;color:inherit;font-size:20px;line-height:1;cursor:pointer}" +
    ".pm-perks{margin:0 0 12px;padding-left:20px}.pm-perks li{margin:0 0 4px}" +
    ".pm-prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;margin:0 0 10px;border:1.5px solid var(--pm-line,var(--line,#b9ab86));border-radius:10px;background:var(--pm-paper2,var(--paper-2,#ebe1c6))}" +
    ".pm-prod b{font:600 17px/1.2 var(--f-display,system-ui,sans-serif)}.pm-prod .pm-price{font:600 17px/1 var(--f-display,system-ui,sans-serif);font-variant-numeric:tabular-nums;white-space:nowrap}" +
    ".pm-prod .pm-sub{grid-column:1 / -1}.pm-btn{box-sizing:border-box;min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--pm-ink,var(--fg,#22304a));background:transparent;color:inherit;font:600 16px/1 var(--f-display,system-ui,sans-serif);cursor:pointer}" +
    ".pm-btn.main{background:var(--pm-red,var(--red,#b3352b));border-color:var(--pm-red,var(--red,#b3352b));color:var(--pm-redink,var(--red-ink,#fff7ea))}.pm-btn:disabled{opacity:.55;cursor:default}" +
    ".pm-prod .pm-btn{grid-column:1 / -1;width:100%}.pm-row{display:flex;gap:10px;flex-wrap:wrap}.pm-row .pm-btn{flex:1 1 140px}" +
    ".pm-status{min-height:20px;margin:6px 0 0;font-size:14px;font-style:italic}@media (prefers-reduced-motion:no-preference){.pm-box{animation:pmIn .2s ease-out}}@keyframes pmIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}";

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ensureUi() {
    if (ui.style) return;
    ui.style = el("style"); ui.style.textContent = CSS; document.head.appendChild(ui.style);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ui.ov) closeOv(); });
  }
  function renderCorner() {
    if (!config.corner || typeof document === "undefined") return;
    var show = ready && (canBuy || active());
    try { document.documentElement.classList.toggle("pm-on", !!show); } catch (e) {}
    if (!show) { if (ui.corner) ui.corner.hidden = true; return; }
    ensureUi();
    if (!ui.corner) {
      ui.corner = el("button", "pm-corner"); ui.corner.type = "button"; ui.corner.id = "pmCorner";
      ui.corner.addEventListener("click", function () { openShop(); });
      document.body.appendChild(ui.corner);
    }
    var on = active();
    ui.corner.hidden = false;
    ui.corner.classList.toggle("on", on);
    // звезда и подпись отдельными элементами: хозяин может скрыть подпись на тесном экране (.pm-lbl), кнопка остаётся звездой
    ui.corner.textContent = "";
    ui.corner.appendChild(el("span", "pm-st", "★"));
    ui.corner.appendChild(el("span", "pm-lbl", on ? fmt(tx("btnOn"), daysLeft()) : tx("btn")));
    ui.corner.setAttribute("aria-label", on ? fmt(tx("activeUntil"), dateStr(st.until), plural(daysLeft())) : tx("btn"));
  }
  function setStatus(s) { ui.status = s || ""; var n = ui.box && ui.box.querySelector(".pm-status"); if (n) n.textContent = ui.status; }
  function mountOv() {
    ensureUi(); closeOv(true);
    ui.lastFocus = document.activeElement;
    ui.ov = el("div", "pm-ov"); ui.ov.setAttribute("role", "dialog"); ui.ov.setAttribute("aria-modal", "true");
    ui.box = el("div", "pm-box"); ui.ov.appendChild(ui.box);
    ui.ov.addEventListener("click", function (e) { if (e.target === ui.ov) closeOv(); });
    document.body.appendChild(ui.ov);
  }
  function closeOv(quiet) {
    if (ui.ov && ui.ov.parentNode) ui.ov.parentNode.removeChild(ui.ov);
    ui.ov = null; ui.box = null; ui.mode = ""; ui.status = "";
    if (!quiet && ui.lastFocus && ui.lastFocus.focus) { try { ui.lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }
  function xBtn() { var b = el("button", "pm-x", "×"); b.type = "button"; b.setAttribute("aria-label", tx("close")); b.addEventListener("click", function () { closeOv(); }); return b; }

    var days = config.products[id].days, c = el("div", "pm-prod");
    var base = Math.max(now(), st.until);
    c.appendChild(el("b", "", id === "premium_365" ? tx("p365") : tx("p30")));
    c.appendChild(el("span", "pm-price", priceOf(id) || ""));
    c.appendChild(el("span", "pm-sub", fmt(tx("validTo"), dateStr(base + days * DAY))));
    var b = el("button", "pm-btn main", active() ? tx("extend") : tx("buy")); b.type = "button"; b.disabled = busy; b.setAttribute("data-pm-buy", id);
    b.addEventListener("click", function () { buy(id); });
    c.appendChild(b);
    return c;
  }
  function renderShop() {
    if (!ui.box || ui.mode !== "shop") return;
    var b = ui.box; b.textContent = "";
    b.appendChild(xBtn());
    var h = el("h2", "", tx("title")); h.id = "pmTitle"; b.appendChild(h);
    ui.ov.setAttribute("aria-labelledby", "pmTitle");
    b.appendChild(el("p", "", active() ? fmt(tx("activeUntil"), dateStr(st.until), plural(daysLeft())) : tx("notActive")));
    var ul = el("ul", "pm-perks"); texts.perks.forEach(function (s) { ul.appendChild(el("li", "", s)); }); b.appendChild(ul);
    if (gift && active()) {
      if (giftAvailable()) {
        b.appendChild(el("p", "pm-sub", giftText()));
        var gb = el("button", "pm-btn main", tx("giftBtn")); gb.type = "button"; gb.setAttribute("data-pm-gift", "1"); gb.style.marginBottom = "12px";
        gb.addEventListener("click", function () { if (claimGift()) setStatus(tx("giftDone")); });
        b.appendChild(gb);
      } else b.appendChild(el("p", "pm-sub", tx("giftWait")));
    }
    config.order.forEach(function (id) { if (catalog[id]) b.appendChild(productCard(id)); });
    b.appendChild(el("p", "pm-sub", tx("note")));
    var s = el("p", "pm-status", ui.status); s.setAttribute("role", "status"); s.setAttribute("aria-live", "polite"); b.appendChild(s);
  }
  function openShop() {
    if (!ready || (!canBuy && !active())) return;
    mountOv(); ui.mode = "shop"; renderShop();
    var f = ui.box.querySelector(".pm-prod .pm-btn") || ui.box.querySelector(".pm-x"); if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
  }
  function openCard(kind) {
    mountOv(); ui.mode = "card:" + kind;
    var b = ui.box, p30 = priceOf("premium_30");
    var title = kind === "gift" ? tx("giftTitle") : kind === "ad" ? tx("adTitle") : kind === "soon" ? tx("soonTitle") : tx("endTitle");
    var text = kind === "gift" ? giftText() : kind === "ad" ? fmt(tx("adText"), p30 || ("99 " + tx("free"))) : kind === "soon" ? fmt(tx("soonText"), plural(daysLeft())) : tx("endText");
    b.appendChild(xBtn());
    var h = el("h2", "", title); h.id = "pmTitle"; b.appendChild(h); ui.ov.setAttribute("aria-labelledby", "pmTitle");
    b.appendChild(el("p", "", text));
    var row = el("div", "pm-row");
    var go = el("button", "pm-btn main", kind === "gift" ? tx("giftBtn") : kind === "ad" ? tx("adMore") : (kind === "soon" ? tx("extend") : tx("endBuy"))); go.type = "button";
    if (kind === "gift") go.setAttribute("data-pm-gift", "1");
    go.addEventListener("click", function () { if (kind === "gift") { claimGift(); closeOv(); } else openShop(); });
    var no = el("button", "pm-btn", kind === "gift" ? tx("giftLater") : tx("later")); no.type = "button"; no.addEventListener("click", function () { closeOv(); });
    row.appendChild(go); row.appendChild(no); b.appendChild(row);
    try { no.focus({ preventScroll: true }); } catch (e) {}
  }

  /* ---- Запуск ---- */
  function setLang(l) {
    lang = l === "en" ? "en" : "ru"; texts = Object.assign({}, TEXTS.ru, TEXTS[lang] || {});
    renderCorner(); if (ui.ov) { if (ui.mode === "shop") renderShop(); else { var m = ui.mode.split(":")[1]; openCard(m); } }
  }
  function tick() {
    var a = active();
    if (a !== lastActive) emit(); else renderCorner();
  }
  function init(o) {
    o = o || {};
    if (o.config) Object.keys(o.config).forEach(function (k) { config[k] = o.config[k]; });
    if (o.texts) Object.keys(o.texts).forEach(function (l) { TEXTS[l] = Object.assign(TEXTS[l] || {}, o.texts[l]); });
    sdk = o.sdk || null; store = o.store || null; gift = o.gift && typeof o.gift.grant === "function" ? o.gift : null;
    setLang(o.lang || lang);
    loadState();
    ready = true; lastActive = active();
    try { document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); }); } catch (e) {}
    clearInterval(pollTimer); pollTimer = setInterval(tick, config.pollMs);
    renderCorner();
    if (!sdk || typeof sdk.getPayments !== "function") return Promise.resolve(false);
    return sdk.getPayments({ signed: false }).then(function (pay) {
      payments = pay;
      return pay.getCatalog();
    }).then(function (list) {
      list = Array.isArray(list) ? list : [];
      list.forEach(function (c) { if (c && config.products[c.id]) catalog[c.id] = c; });
      canBuy = !!(store && store.save && config.order.some(function (id) { return catalog[id]; }));
      renderCorner();
      return canBuy ? checkPurchases().then(function () { return true; }) : false;
    }).catch(function () { canBuy = false; renderCorner(); return false; });
  }

  return {
    config: config,
    init: init, setLang: setLang,
    active: active, until: function () { return st.until; }, daysLeft: daysLeft, available: available,
    noteFullscreen: noteFullscreen, maybeCard: maybeCard, openShop: openShop,
    giftAvailable: giftAvailable, claimGift: claimGift,
    onChange: function (f) { if (typeof f === "function") listeners.push(f); },
    mergeState: mergeState,
    refresh: function () { return canBuy ? checkPurchases() : Promise.resolve(); },
    _state: function () { return JSON.parse(JSON.stringify(st)); }
  };
})();

</script>

var CUM=[0,31,59,90,120,151,181,212,243,273,304,334,365];
function mon(N){N=Math.round(mod(N-1,365))+1;var m=0;while(m<11&&N>CUM[m+1])m++;return m;}
function dnum(N){N=Math.round(mod(N-1,365))+1;return N-CUM[mon(N)];}
function decl(N){return -23.44*Math.cos(2*Math.PI*(N+10)/365);}
function dayLen(N,lat){var d=decl(N)*Math.PI/180;
 if(Math.abs(lat)>=89.9){var s=lat>0?1:-1;return d*s>0.001?24:(d*s<-0.001?0:12);}
 var x=-Math.tan(lat*Math.PI/180)*Math.tan(d);if(x<=-1)return 24;if(x>=1)return 0;return 2*Math.acos(x)*180/Math.PI/15;}
function inN(N,a,b){N=mod(N-1,365)+1;return a<=b?(N>=a&&N<=b):(N>=a||N<=b);}
function dN(a,b,m){var d=mod(a-b,m);return Math.min(d,m-d);}

PF.mergers[SK]=function(a,b){var x=JSON.parse(a),y=JSON.parse(b);if(!x||!y||x.v!==1||y.v!==1)return null;
 var rx=x.rst||0,ry=y.rst||0;if(rx!==ry)return rx>ry?a:b;
 var o={v:1,stars:{},journal:{},err:{day:0,zones:0}};if(rx)o.rst=rx;
 [x,y].forEach(function(s){var st=s.stars||{},jn=s.journal||{},er=s.err||{};for(var k in st)o.stars[k]=Math.max(o.stars[k]||0,st[k]);for(var j in jn)if(jn[j])o.journal[j]=1;for(var e in er)o.err[e]=Math.max(o.err[e]||0,er[e]);});
 var lg=x.lang||y.lang;if(lg)o.lang=lg;var fa=Math.max(x.fa||0,y.fa||0);if(fa)o.fa=fa;return JSON.stringify(o);};

function solve(L){
 var best=1e9,bt=0;
 for(var t=0;t<24;t+=1/60){var e=0;L.conds.forEach(function(c){var cl=localT(c.c,t,L.mode),h=c.h!=null?c.h:mod((c.from+(mod(c.to-c.from,24))/2),24);e=Math.max(e,cd(cl,h)*60);});
  if(e<best-1e-6){best=e;bt=t;}}
 return bt;
}

 if(L.t==='spin'){G.sol=solve(L);G.t=mod(G.sol+7.3+id*1.7,24);}
 else if(L.t==='clock'){var g=L.given;G.t=mod(g.h-CITIES[g.c].off,24);G.ans=L.items.map(function(it){return {h:mod(it.h+5,24),day:0};});}

 var w=mod(c.to-c.from,24),p=mod(cl-c.from,24);if(p<=w)return 0;return Math.min(cd(cl,c.from),cd(cl,c.to))*60;}
function baseStars(e){return e<=20?3:e<=40?2:e<=60?1:0;}
function check(){

 var L=G.L,st=0;G.tries++;
 if(L.t==='spin'){
