<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Космическая станция</title>
<style>
:root{--ink:#0e1230;--paper:#e9f1ff;--paper2:#cfe0ff;--sun:#ffb703;--red:#ef476f;--blue:#3a86ff;--green:#2fbf71;--bg:#0b1030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:5px 7px 6px;gap:5px}
#hud{display:flex;gap:5px;flex:none}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:4px 8px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #000;display:flex;align-items:center;white-space:nowrap;color:var(--ink);font-family:inherit}
#hDay{flex:1.1}#hMoney{flex:1.5;justify-content:center;color:#1e6b2c;font-size:15px}#hCoin{flex:.8;justify-content:center;color:#6b3fb3;cursor:pointer}
#btnMenu{font-size:19px;padding:2px 11px;cursor:pointer}
#mapWrap{flex:none;border:3px solid var(--ink);border-radius:13px;background:#0b1030;overflow:hidden;box-shadow:0 0 0 2px #35408a}
canvas#map{display:block;width:100%;height:auto}
#gauges{flex:none;display:flex;gap:4px}
.g{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px 0;text-align:center;font-weight:800;font-size:12px;line-height:1.15}
.g i{font-style:normal;display:block;font-size:15px;height:20px}.g i .ic{width:20px;height:20px}
.g.warn{background:#ffe08a}.g.bad{background:#ff9d9d}
#info{flex:none;background:var(--paper2);border:3px solid var(--ink);border-radius:11px;padding:3px 9px;font-size:12.5px;line-height:1.3;min-height:36px;display:flex;align-items:center}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#pcontent{flex:1;min-height:0;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:13px;padding:7px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.35}
#pcontent>*{flex-shrink:0}
#pfoot{flex:none;display:flex;gap:6px}#pfoot .btn{flex:1}#pfoot .btn.go{flex:1.6}
#tabs{flex:none;display:flex;gap:4px}
.tab{flex:1;font:inherit;font-weight:800;font-size:11.5px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:3px 0;min-height:42px;cursor:pointer;box-shadow:0 2px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tab b{font-size:16px}
.tab.on{background:var(--sun);transform:translateY(1px);box-shadow:0 1px 0 #000}
.btn{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:13px;padding:8px 12px;min-height:44px;box-shadow:0 4px 0 #000;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:17px}
.btn.alt{background:var(--paper2)}.btn.red{background:var(--red);color:#fff}.btn.sm{min-height:34px;padding:3px 10px;font-size:14px;box-shadow:0 3px 0 #000}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:6px;align-items:center}.row>.grow{flex:1}
.head{font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed #a9bde6;padding:2px 0}.kv b{text-align:right}
.hint{font-size:12.5px;opacity:.85;line-height:1.35}
.warn{color:#b8321f;font-weight:800}.good{color:#1e6b2c;font-weight:800}
.box{background:#fff;border:3px solid var(--ink);border-radius:11px;padding:6px 8px}
.bar{height:12px;background:#c9d4ee;border:2px solid var(--ink);border-radius:8px;overflow:hidden}.bar>div{height:100%;background:var(--green)}
.bar.r>div{background:var(--red)}.bar.y>div{background:var(--sun)}
.cr{display:flex;align-items:center;gap:7px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:3px 7px}
.cr .pic{width:34px;height:34px;flex:none;font-size:26px;text-align:center;line-height:34px}.cr img.pic{object-fit:contain}
.cart{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:3px 7px}
.cart .nm{flex:1;font-size:12.5px;line-height:1.2}.cart .nm b{font-size:13.5px}.cart .nm small{display:block;opacity:.8}
.step{display:flex;align-items:center;gap:5px}.step b{min-width:34px;text-align:center;font-size:16px}
.step .btn{min-height:34px;width:36px;padding:0;font-size:18px;box-shadow:0 3px 0 #000}
.exp{background:#fff;border:3px solid var(--ink);border-radius:11px;padding:5px 8px;display:flex;flex-direction:column;gap:3px}
.exp.lock{opacity:.5}
#ov{position:fixed;inset:0;background:rgba(5,8,30,.7);display:flex;align-items:center;justify-content:center;padding:8px;z-index:10;overflow:auto}
#ov.hidden{display:none}
#card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 #000;padding:12px;width:100%;max-width:400px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px}
#card h2{margin:0;font-size:21px}#card p{margin:0;line-height:1.4;font-size:14.5px}
.q{font-size:16px;line-height:1.4;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:1px 8px}
.ok{background:#dff3d2;border:3px solid var(--ink);border-radius:11px;padding:8px}.bad{background:#ffdcd3;border:3px solid var(--ink);border-radius:11px;padding:8px}
.opt{font:inherit;font-weight:700;font-size:15px;text-align:left;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:11px;padding:8px 10px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 #000}
.opt.right{background:#bfe8a8}.opt.wrong{background:#ffb4a6}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad .btn{font-size:20px;padding:4px 0;min-height:44px}
.calcin{font-size:26px;font-weight:800;text-align:right;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:4px 10px;min-height:44px}
.stars{font-size:36px;text-align:center;letter-spacing:6px;color:#e5a600;text-shadow:0 2px 0 var(--ink)}
.cover{width:100%;max-height:44dvh;object-fit:cover;border-radius:12px;border:3px solid var(--ink);display:block}
.ic{width:22px;height:22px;object-fit:contain;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#000;color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:92%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

    <div id="tabs"></div>

</div>
<div id="ov" class="hidden"><div id="card"></div></div>
<div id="toast"></div>

/* Слой платформы: Яндекс Игры SDK (на площадке подключается /sdk.js). Без SDK (сайт, артефакт, локально) — заглушки,
   игра играбельна полностью; ролик за награду без SDK имитируется (для просмотра). */
const PF=(function(){
  let ysdk=null,sdkOk=false,wantReady=false,readyDone=false,adBusy=false,hidden=false,apiPaused=false,gpOn=false,wantGp=false,lastAdAt=0,player=null,cloudOk=false,dirtyP=false;
  const PKEY='kosmos-premium-v1';
  const born=Date.now(),FIRST=120000,GAP=300000,TMO=4000,self={onPause(){}};
  const apply=()=>{if(!sdkOk||!readyDone)return;const on=wantGp&&!self.paused();if(on===gpOn)return;gpOn=on;try{const g=ysdk.features&&ysdk.features.GameplayAPI;if(g){on?g.start():g.stop();}}catch(e){}};
  const changed=()=>{apply();try{self.onPause(self.paused());}catch(e){}};
  const tryReady=()=>{if(readyDone||!wantReady||!sdkOk)return;readyDone=true;try{const l=ysdk.features&&ysdk.features.LoadingAPI;if(l)l.ready();}catch(e){}apply();};
  self.paused=()=>adBusy||hidden||apiPaused;
  self.setPlaying=on=>{wantGp=!!on;apply();};
  self.ready=()=>{wantReady=true;tryReady();};
  const importCloud=d=>{try{const c=d&&typeof d.premium==='string'?d.premium:null;let l=null;try{l=localStorage.getItem(PKEY);}catch(e){}
    cloudOk=true;const cg=Number(d&&d.gift)||0;if(cg>self.giftDay())try{localStorage.setItem(GKEY,String(cg));}catch(e){}else if(self.giftDay()>cg)dirtyP=true;
    if(!c&&!l)return;const m=window.Premium?Premium.mergeState(l,c):(c||l);try{localStorage.setItem(PKEY,m);}catch(e){}if(m!==c)dirtyP=true;}catch(e){}};
  /* хранилище для Премиума: локально + облако игрока (целый снимок, подтверждение записи) */
  self.store={get:()=>{try{return localStorage.getItem(PKEY);}catch(e){return null;}},
    set:raw=>{try{localStorage.setItem(PKEY,raw);}catch(e){}dirtyP=true;},
    save:()=>{if(!player||!cloudOk)return Promise.resolve(false);try{return Promise.resolve(player.setData({premium:self.store.get(),gift:self.giftDay()},true)).then(()=>{dirtyP=false;return true;},()=>false);}catch(e){return Promise.resolve(false);}}};
  /* ежедневный подарок Премиума: номер последних суток (серверное время), локально + облако (берём большее) */
  const GKEY='kosmos-gift-v1';
  self.srvDay=()=>{let n=Date.now();try{if(sdkOk&&typeof ysdk.serverTime==='function'){const s=ysdk.serverTime();if(s>0)n=s;}}catch(e){}return Math.floor(n/864e5);};
  self.giftDay=()=>{try{return Number(localStorage.getItem(GKEY))||0;}catch(e){return 0;}};
  self.setGiftDay=d=>{try{localStorage.setItem(GKEY,String(d));}catch(e){}dirtyP=true;};
  self.sdk=()=>ysdk;self.pdirty=()=>dirtyP;
  self.hasSdk=()=>sdkOk;
  self.lang=()=>{try{return sdkOk&&ysdk.environment&&ysdk.environment.i18n?String(ysdk.environment.i18n.lang||''):'';}catch(e){return '';}};
  self.init=()=>{
    try{document.addEventListener('visibilitychange',()=>{hidden=!!document.hidden;changed();});}catch(e){}
    if(!window.YaGames||!window.YaGames.init)return Promise.resolve();
    return new Promise(res=>{
      const t=setTimeout(res,TMO);
      window.YaGames.init().then(sdk=>{
        ysdk=sdk;sdkOk=true;
        try{sdk.on('game_api_pause',()=>{apiPaused=true;changed();});sdk.on('game_api_resume',()=>{apiPaused=false;changed();});}catch(e){}
        tryReady();
        return sdk.getPlayer({scopes:false}).then(p=>{player=p;return p.getData();}).then(importCloud,()=>{});
      }).then(()=>{clearTimeout(t);res();},()=>{clearTimeout(t);res();});
    });
  };
  const gap=()=>(window.Premium&&Premium.config&&Premium.config.adGapMs)||GAP;
  const begin=()=>{adBusy=true;changed();},end=()=>{adBusy=false;changed();};
  /* полноэкранная реклама: не раньше 2 мин после загрузки и не чаще раза в 5 мин; done вызывается один раз */
  self.canReward=()=>!window.__GP||!!(window.GPAdapter&&window.GPAdapter.enabled);
  self.interstitial=done=>{
    if(adBusy)return;
    if(window.__GP){try{window.GPAdapter&&window.GPAdapter.enabled?window.GPAdapter.interstitial(done):done();}catch(e){done();}return;}
    if(window.Premium&&Premium.active()){done();return;}   /* Премиум: полноэкранной рекламы нет */
    const now=Date.now(),at=lastAdAt?lastAdAt+gap():born+FIRST;
    if(!sdkOk||!ysdk.adv||!ysdk.adv.showFullscreenAdv||now<at){done();return;}
    let fin=false;const e=shown=>{if(fin)return;fin=true;if(shown){lastAdAt=Date.now();try{window.Premium&&Premium.noteFullscreen();}catch(x){}}end();done();};
    begin();
    try{ysdk.adv.showFullscreenAdv({callbacks:{onClose:e,onError:()=>e(false),onOffline:()=>e(false)}});}catch(x){e(false);}
  };
  /* ролик за награду: done(true) только если награда засчитана */
  self.rewarded=done=>{
    if(window.__GP){try{window.GPAdapter&&window.GPAdapter.enabled?window.GPAdapter.rewarded(done):done(false);}catch(e){done(false);}return;}
    if(!sdkOk){toast(T("kd65c88"));begin();setTimeout(()=>{end();done(true);},900);return;}
    if(adBusy||!ysdk.adv||!ysdk.adv.showRewardedVideo){done(false);return;}
    let fin=false,got=false;const e=()=>{if(fin)return;fin=true;if(got)lastAdAt=Date.now();end();done(got);};
    begin();
    try{ysdk.adv.showRewardedVideo({callbacks:{onRewarded:()=>{got=true;},onClose:e,onError:e}});}catch(x){e();}
  };
  return self;
})();

function power(){
  const C=S.mods.reduce((a,m)=>a+(m.b?0:MOD[m.t].pw),0);
  const P=cnt('panel'),B=cnt('batt'),R=cnt('rad');
  const gen=P*PANEL_KW,genE=gen*NIGHT_H,needE=C*ORBIT_H,batCap=B*BATT_KWH,batNeed=C*NIGHT_H;
  const g=C?Math.min(1,genE/needE):1,b=C?Math.min(1,batCap/batNeed):1;
  const radCap=R*RAD_KW;
  return{C,P,B,R,gen,genE,needE,batCap,batNeed,g,b,sup:Math.min(g,b),over:C>radCap,radCap};
}
const needFor=(crew,regen)=>({o2:crew*O2D,water:crew*WATD*(regen?.5:1),food:crew*FOODD,waste:crew*WASTE_D});
const need=()=>needFor(S.crew,S.regen);
const greenKg=()=>cnt('green')*GREEN_KG*power().sup;
function daysLeft(k){const nd=need();let d=nd[k];if(k==='food')d-=greenKg();return d<=1e-9?99:S.st[k]/d;}

function breakRandom(filter){
  const c=S.mods.filter(m=>m.t!=='core'&&!m.b&&(!filter||filter(m)));
  if(!c.length)return null;const m=pick(c);m.b=1;return m;
}
function stepDay(){
  const news=[],pw=power(),n=S.crew,nd=need(),flare=S.flare>0;
  if(flare)S.flare=0;
  S.st.food+=greenKg();
  const sh=[];
  for(const k of['o2','water','food']){if(S.st[k]>=nd[k]-1e-9)S.st[k]-=nd[k];else{S.st[k]=0;sh.push(k);}}
  S.st.waste+=nd.waste;
  const labs=cnt('lab');
  S.act.forEach((a,i)=>{if(i<labs&&!flare)a.left-=pw.sup*(pw.over?.5:1)*(S.health<30?.5:1);});
  const fin=S.act.filter(a=>a.left<=1e-9);S.act=S.act.filter(a=>a.left>1e-9);
  fin.forEach(a=>{const e=EXP[a.id];S.money+=e.rew;S.sci+=e.sc;S.done++;S.stats.earned+=e.rew;
    news.push({h:T("k7b7a15"),t:T("k6a7770",[e.n,fm(e.rew),e.sc])});log(T("k2e7a65",[e.n,fm(e.rew)]));});
  S.money-=n*SAL;
  S.walkCd=Math.max(0,S.walkCd-1);S.debris=Math.min(60,S.debris+.3);
  let dh=0;const why=[];
  if(sh.includes('o2')){dh-=35;why.push(T("kd5e3b1"));}
  if(sh.includes('water')){dh-=20;why.push(T("k7d20c1"));}
  if(sh.includes('food')){dh-=10;why.push(T("k4eab3b"));}
  if(pw.sup<.5){dh-=10;why.push(T("k04153e"));}
  if(S.st.waste>250){dh-=5;why.push(T("k618f08"));}
  if(n>beds()){dh-=10;why.push(T("ke29907",[beds()]));}
  S.health=clamp(S.health+(dh<0?dh:4),0,100);
  if(dh<0){news.push({h:T("k7ba58b"),t:T("k08e71c",[why.join(', '),Math.round(S.health)]),bad:1});log(T("k34d8be",[why.join(', ')]));}
  // случайные события
  const r=Math.random(),pB=pw.over?.08:.04,pD=.02+S.debris/1000,pF=.02;
  if(r<pB){const m=breakRandom();if(m){news.push({h:T("k992694"),t:T("k979204",[MOD[m.t].n,EXTERNAL.includes(m.t)?T("k4e5fbc"):'']),bad:1});log(T("kff1c00",[MOD[m.t].n]));}}
  else if(r<pB+pD)S.event={t:'debris'};
  else if(r<pB+pD+pF){S.flare=1;news.push({h:T("k523c7b"),t:T("k8b5f2d")});log(T("k6a647f"));}
  S.day++;
  // предупреждения о запасах
  if(S.day<=DAYS)for(const k of['o2','water','food']){const dl=daysLeft(k);
    if(dl<=3&&(S.warned[k]===undefined||S.day-S.warned[k]>=4)){S.warned[k]=S.day;news.push({h:T("k79dded"),t:T("k26540c",[RES[k].n,fmt(dl,1),nextDock()]),bad:1});}}
  if(S.health<=0)S.over='health';else if(S.money<-20000)S.over='money';else if(S.day>DAYS)S.over='done';
  else if(DOCKS.includes(S.day)){S.dock=true;S.money+=GRANT;S.quiz=null;S.capBonus=0;S.rush=false;news.push({h:T("ka2ac23"),t:T("k510650",[fm(GRANT)])});log(T("kc554ca",[fm(GRANT)]));}
  save();return news;
}
function resolveEvent(c){
  const e=S.event;if(!e)return'';let t='';
  if(e.t==='debris'){
    if(c==='move'&&S.st.fuel>=10){S.st.fuel-=10;t=T("ke5545c");}
    else{
      if(Math.random()<.4){const m=breakRandom(x=>EXTERNAL.includes(x.t))||breakRandom();
        t=m?T("kfb144e",[MOD[m.t].n]):T("k8f1d9f");}
      else t=T("k89c49d");
    }
    log(t);
  }
  S.event=null;save();return t;
}
function startExp(id){

  S.st.kit-=e.kit;S.act.push({id,left:e.d,c:e.c});save();render();
}
function repair(i){
  const m=S.mods[i];if(!m||!m.b)return;
  if(EXTERNAL.includes(m.t)&&cnt('lock')<1)return toast(T("kde6517"));

function cartInfo(){
  const c=S.cart;let mass=0,cost=LAUNCH;
  RKEYS.forEach(k=>{mass+=c[k]*RES[k].m;cost+=c[k]*RES[k].p;});
  mass+=c.regen*REGEN_MASS;cost+=c.regen*REGEN_COST;cost+=c.crew*CREW_COST;
  let add=0;BUY.forEach(t=>{const q=c.mods[t]||0;mass+=q*MOD[t].mass;cost+=q*MOD[t].cost;add+=q;});
  const cap=CAP+S.capBonus+(S.rush?100:0),slots=S.mods.length+add,bedsAfter=beds()+3*(c.mods.hab||0);
  const errs=[];
  if(mass>cap)errs.push(T("ke47132",[fmt(mass,0),cap]));
  if(cost>S.money)errs.push(T("kdbb313",[fm(cost)]));
  if(slots>SLOTS)errs.push(T("k6080da",[slots,SLOTS]));
  if(S.crew+c.crew>MAXCREW)errs.push(T("k8175df",[MAXCREW]));
  else if(S.crew+c.crew>bedsAfter)errs.push(T("k8ea203",[bedsAfter]));
  return{mass,cost,cap,slots,errs,pct:mass/cap*100};
}
function cartAdd(k,d){
  const c=S.cart;

  else c.mods[k]=Math.max(0,(c.mods[k]||0)+d);
  save();render();
}

  const cxm=x+w/2,cym=y+h/2;
  if(t==='panel'){rr(c,x+4,y+6,w-8,h-12,6);c.fillStyle=night?'#2b4a9a':'#3a86ff';c.fill();c.stroke();
    c.lineWidth=2;c.strokeStyle='#bcd6ff';for(let i=1;i<3;i++){c.beginPath();c.moveTo(x+4+(w-8)*i/3,y+6);c.lineTo(x+4+(w-8)*i/3,y+h-6);c.stroke();}
    c.beginPath();c.moveTo(x+4,cym);c.lineTo(x+w-4,cym);c.stroke();if(!night){c.fillStyle='rgba(255,230,120,.5)';c.fillRect(x+10,y+10,16,8);}}
  else if(t==='batt'){rr(c,x+12,y+12,w-24,h-24,10);c.fillStyle='#2fbf71';c.fill();c.stroke();
    c.fillStyle='#fff';c.beginPath();c.moveTo(cxm+4,y+18);c.lineTo(cxm-10,cym+4);c.lineTo(cxm-1,cym+4);c.lineTo(cxm-5,y+h-18);c.lineTo(cxm+10,cym-4);c.lineTo(cxm+1,cym-4);c.closePath();c.fill();}
  else if(t==='rad'){rr(c,x+8,y+6,w-16,h-12,6);c.fillStyle='#f4f7ff';c.fill();c.stroke();
    c.strokeStyle='#ff7a3d';c.lineWidth=4;for(let i=1;i<5;i++){c.beginPath();c.moveTo(x+12,y+6+(h-12)*i/5);c.lineTo(x+w-12,y+6+(h-12)*i/5);c.stroke();}}
  else if(t==='hab'){rr(c,x+4,y+10,w-8,h-20,18);c.fillStyle='#f2c28a';c.fill();c.stroke();
    [-1,1].forEach(s=>{c.beginPath();c.arc(cxm+s*14,cym,8,0,7);c.fillStyle='#9fd8ff';c.fill();c.lineWidth=3;c.stroke();});}
  else if(t==='lab'){rr(c,x+4,y+10,w-8,h-20,18);c.fillStyle='#cfe6ff';c.fill();c.stroke();
    c.beginPath();c.moveTo(cxm-5,cym-14);c.lineTo(cxm+5,cym-14);c.lineTo(cxm+5,cym-4);c.lineTo(cxm+14,cym+13);c.lineTo(cxm-14,cym+13);c.lineTo(cxm-5,cym-4);c.closePath();c.fillStyle='#b266ff';c.fill();c.lineWidth=3;c.stroke();}
  else if(t==='green'){rr(c,x+4,y+10,w-8,h-20,18);c.fillStyle='#8be08b';c.fill();c.stroke();
    c.beginPath();c.ellipse(cxm,cym,10,15,.7,0,7);c.fillStyle='#2e9e4a';c.fill();c.lineWidth=3;c.stroke();}
  else if(t==='lock'){rr(c,x+6,y+10,w-12,h-20,12);c.fillStyle='#b8c2d6';c.fill();c.stroke();
    c.beginPath();c.arc(cxm,cym,14,0,7);c.fillStyle='#6b7a99';c.fill();c.lineWidth=3;c.stroke();c.beginPath();c.moveTo(cxm-10,cym);c.lineTo(cxm+10,cym);c.stroke();}
  else{c.beginPath();c.arc(cxm,cym,Math.min(w,h)/2-8,0,7);c.fillStyle='#dfe6f5';c.fill();c.stroke();c.beginPath();c.ellipse(cxm,cym,Math.min(w,h)/2-4,10,0,0,7);c.lineWidth=3;c.stroke();}
}
function draw(ts){
  if(S){
    const c=cx,ph=(ts/16000)%1,night=ph>=.5;
    const g=c.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#050a26');g.addColorStop(1,'#1b2a6e');c.fillStyle=g;c.fillRect(0,0,CW,CH);
    if(IMG.bg_earth){const im=IMG.bg_earth,k=Math.max(CW/im.width,CH/im.height);c.drawImage(im,(CW-im.width*k)/2,(CH-im.height*k)/2,im.width*k,im.height*k);}
    else{
      c.fillStyle='#fff';STARS.forEach(s=>{c.globalAlpha=.5+.5*Math.sin(ts/600+s.x);c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill();});c.globalAlpha=1;
      const eg=c.createRadialGradient(375,430,60,375,430,300);eg.addColorStop(0,'#2a7fe0');eg.addColorStop(.85,'#1a5fc0');eg.addColorStop(1,'#7fc4ff');
      c.fillStyle=eg;c.beginPath();c.arc(375,430,300,0,7);c.fill();
      c.fillStyle='#3fae5a';[[260,215,50,16],[420,205,60,14],[560,240,40,12],[150,255,36,12]].forEach(b=>{c.beginPath();c.ellipse(b[0],b[1],b[2],b[3],-.2,0,7);c.fill();});
    }
    if(night){c.fillStyle='rgba(0,0,30,.4)';c.fillRect(0,0,CW,CH);}
    // ферма
    c.fillStyle='#8895b8';c.fillRect(10,96,CW-20,12);c.strokeStyle='#0e1230';c.lineWidth=3;c.strokeRect(10,96,CW-20,12);
    const cw=CW/8;
    for(let i=0;i<SLOTS;i++){
      const col=i%8,row=Math.floor(i/8),x=col*cw+6,y=row?116:12,w=cw-12,h=78,m=S.mods[i];
      if(!m){c.setLineDash([6,5]);c.lineWidth=2;c.strokeStyle='rgba(180,200,255,.45)';rr(c,x,y,w,h,10);c.stroke();c.setLineDash([]);continue;}
      drawMod(c,m.t,x,y,w,h,night,ts);
      if(m.b){c.fillStyle='rgba(239,71,111,'+(.3+.2*Math.sin(ts/200))+')';rr(c,x,y,w,h,10);c.fill();c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.moveTo(x+14,y+14);c.lineTo(x+w-14,y+h-14);c.moveTo(x+w-14,y+14);c.lineTo(x+14,y+h-14);c.stroke();}
    }
    if(S.dock){const tx=CW-120+Math.sin(ts/500)*4;c.fillStyle='#fff';rr(c,tx,300,100,22,8);c.fill();c.strokeStyle='#0e1230';c.lineWidth=3;c.stroke();c.fillStyle='#ef476f';c.fillRect(tx+70,303,8,16);}
    // индикатор орбиты
    c.font='bold 22px sans-serif';c.fillStyle='#fff';c.textAlign='left';
    const mins=Math.floor((ph%.5)*90);
    c.fillText((night?T("k5d2ee4",[mins]):T("k0cf67e",[mins])),10,CH-8);
    c.textAlign='start';
  }
  requestAnimationFrame(draw);
}

/* ================= УПРАВЛЕНИЕ ================= */
function runDays(n){
  if(busy||!S||S.dock||S.over)return;
  busy=true;auto=n;tick();
}
function tick(){
  if(PF.paused()&&auto>0){setTimeout(tick,300);return;}
  if(auto<=0){busy=false;render();return;}
  const news=stepDay();auto--;renderHud();
  if(news.length||S.event||S.dock||S.over){auto=0;busy=false;render();if(news.length)newsModal(news);else flow();return;}
  setTimeout(tick,120);
}
const ACT={
  close(){closeModal();render();},
  flow(){flow();},
  tab(d){tab=d.t;render();},
  day(){runDays(1);},
  days5(){runDays(5);},
  exp(d){startExp(+d.i);},
  walk(){doWalk();},
  repair(d){repair(+d.i);},
  cart(d){cartAdd(d.k,+d.d);},
  coach(){coachCart();},
  deliver(){deliver();},
  godock(){if(S.quiz&&S.quiz.done){tab='cargo';render();}else if(S.quiz){quizShow();}else dockStart();},
  quizgo(){quizGo();},
  ans(d){quizAnswer(+d.i);},
  qnext(){quizNext();},
  key(d){const z=S.quiz;if(d.k==='⌫')z.input=z.input.slice(0,-1);else if(d.k===DS){if(!z.input.includes(DS))z.input+=z.input?DS:'0'+DS;}else if(z.input.length<7)z.input+=d.k;$('#calcIn').innerHTML=(z.input||'&nbsp;')+' <small>'+z.calc.u+'</small>';},
  calcok(){calcOk();},
  toorder(){closeModal();tab='cargo';render();},
  ev(d){const t=resolveEvent(d.c);render();modal(T("k291055",[t]));},
  newgame(){startShown=false;S=newState();lsSet(SAVE_KEY,S);tab='st';PF.setPlaying(true);render();flow();},
  newgame2(){modal(T("ka4ff70"));},
  cont(){startShown=false;S=lsGet(SAVE_KEY);tab='st';PF.setPlaying(true);render();flow();},
  gift(){if(!S||!giftReady())return;PF.setGiftDay(PF.srvDay());S.coins+=2;S.st.spare+=1;save();PF.store.save();renderHud();render();menuCard();toast(PXT('giftGot'));},
  prem(){try{Premium.openShop();}catch(e){}},
  lang(){try{if(S&&S.quiz&&!S.quiz.done)S.quiz=null;save();localStorage.setItem(LANG_KEY,LANG==='ru'?'en':'ru');}catch(e){}location.reload();},
  rules(){rulesCard('startback');},
  rules2(){rulesCard('menu');},
  startback(){startCard();},
  menu(){menuCard();},
  rush(){PF.rewarded(ok=>{if(!ok)return toast(T("k04a4ae"));S.rush=true;save();render();toast(T("kb2524d"));});},
  reward(){PF.rewarded(ok=>{if(!ok)return toast(T("k04a4ae"));S.coins++;save();renderHud();toast(T("k0d71b4"));});}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.a];if(f)f(b.dataset);
});
$('#btnMenu').onclick=()=>{if(S)menuCard();};
$('#hCoin').onclick=()=>{if(S)toast(T("kfac284"));};

/* ================= СТАРТ ================= */

document.documentElement.lang=LANG;document.title=T("ke291c3");
$('#hCoin').setAttribute('aria-label',T("k94394b"));$('#btnMenu').setAttribute('aria-label',T("kdd904b"));
PF.init().then(()=>{
  try{Premium.init({sdk:PF.sdk(),lang:LANG,store:PF.store,texts:PREMIUM_TEXTS,config:{corner:false}}).then(()=>{if(PF.pdirty())PF.store.save();if(startShown&&!$('#ov').classList.contains('hidden'))startCard();});}catch(e){}
  /* язык от платформы: если игрок сам язык не выбирал и платформа говорит другое — запомнить и перезагрузить один раз */
  try{const pl=PF.lang().slice(0,2).toLowerCase();if(pl&&HASEN&&!localStorage.getItem(LANG_KEY)){const want=RU_FAM.includes(pl)?'ru':'en';localStorage.setItem(LANG_KEY,want);if(want!==LANG){location.reload();return;}}}catch(e){}
  S=newState();render();requestAnimationFrame(draw);startCard();PF.ready();});
</script>
