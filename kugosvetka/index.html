    t.qs.map((_, i) => '<i class="' + (i < t.i ? "done" : i === t.i ? "now" : "") + '"></i>').join("") + "</div></div>";
  html += questionHTML(q, { act: "tans", wrong: done && t.pick !== q.answer ? [t.pick] : [], right: done ? q.answer : "", locked: done });
  if (done) {
    const ok = t.pick === q.answer, ans = q.options.find(o => o.key === q.answer);
    html += '<p class="fb' + (ok ? "" : " bad") + '" role="status">' + (ok ? "Верно." : "Неверно. Правильный ответ: " + esc(ans ? ans.label : q.answer) + ".") + "</p>" +
      '<div class="row-btns" style="margin-top:12px"><button class="btn primary" data-act="trainNext" data-autofocus>' + (t.i + 1 < t.qs.length ? "Дальше" : "Итог") + "</button></div>";
  }
  html += "</div></div>";
  $("scrTrain").innerHTML = html;
  const f = $("scrTrain").querySelector("[data-autofocus]"); if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
}
function trainAnswer(key) {
  const t = train; if (!t || t.pick !== null || t.i >= t.qs.length) return;
  const it = t.qs[t.i], ok = key === it.q.answer;
  t.pick = key;
  if (ok) t.right++; else buzz();
  const closed = notebookAnswer(notebook, it.id, ok, it.q.kind);
  saveNotebook(); refreshNbBadge();
  if (closed) { t.closed.push(it.id); toast("«" + W.byId[it.id].name + "» — закрыто", 2200); }
  renderTrain();
}

function renderDailyRecords() {
  const rows = [], d0 = new Date();
  for (let i = 0; i < 14; i++) {
    const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() - i);
    const ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const best = LS.get(dailyKey(ds), null), rt = best && WB.byId[best.from] && WB.byId[best.to] ? best : routeFor(ds);
    rows.push('<tr class="' + (i === 0 ? "me" : "") + '"><td>' + esc(dayLabel(ds)) + "</td><td>" + (rt ? esc(WB.byId[rt.from].capital) + " → " + esc(WB.byId[rt.to].capital) : "—") +
      (best ? "<small>" + esc(best.name) + "</small>" : "") + "</td><td>" + (best ? best.countries : "—") + "</td><td>" + (best ? fmtMoney(best.money) : "") + "</td></tr>");
  }
  return '<table class="rec daily-rec"><thead><tr><th>Дата</th><th>Маршрут</th><th>Стран</th><th>Остаток</th></tr></thead><tbody>' + rows.join("") + "</tbody></table>" +
    '<p style="font-size:14px;color:var(--muted);font-style:italic">Последние 14 дней. На каждый день хранится лучшая попытка.</p>';
}
function renderRules() {
  const D = pageBack === "game" && run ? diffOf(run) : DIFF[selDiff];
  const qn = D.questions === 4 ? "четыре вопроса: флаг, столица и два вопроса из пула (соседи, площадь, «кто севернее» и т. п.)" : "три вопроса: флаг, столица и вопрос из пула (соседи, площадь, «кто севернее» и т. п.)";
  const html = '<div class="page-in">' + pageHead("Правила") +
    '<p class="owner" style="margin-bottom:0">Уровень «' + esc(D.name) + "»</p>" +
    "<p>Вы стартуете из дома с " + fmtMoney(D.money) + " и " + D.days + " днями. Задача — объехать как можно больше стран и вернуться домой. Счёт — число посещённых стран, при равенстве выше тот, у кого осталось больше денег, затем — меньше потрачено дней.</p>" +
    '<ul class="rules"><li>В каждую страну можно въехать один раз. Дом — только последним ходом, без вопросов на границе.</li>' +
    "<li>На каждой границе " + qn + ", " + D.options + " варианта ответа.</li>" +
    "<li>Ошибка: −" + fmtMoney(D.wrong) + " и +1 день, вопрос задают снова. " + (D.hints ? "Подсказка (" + fmtMoney(D.hint) + ") убирает " + (D.options > 3 ? "два неверных ответа" : "один неверный ответ") + "." : "Подсказок на этом уровне нет.") + "</li>" +
    "<li>" + (D.maxWrong === 2 ? "Две ошибки" : "Три ошибки") + " на одной границе — вас разворачивают: билет пропал, +1 день, страна закрыта до конца поездки.</li>" +
    "<li>Граница без единой ошибки — сувенир страны. Сувенир можно продать за " + fmtMoney(SOUVENIR_PRICE) + " (меню).</li>" +
    "<li>После прибытия иногда случаются события в пути: шторм, забастовка, горящий билет и другие.</li>" +
    "<li>Если дни кончились до возвращения — поездка не засчитана. Если не хватает денег ни на один билет, можно вызвать консульство (SOS).</li>" +
    "<li>В верхней строке видно, сколько минимум стоит дорога домой через ещё не посещённые страны.</li></ul>" +
    "<h2>Цены</h2><table class=\"prices\"><tbody>" +
    "<tr><td>" + ICON.bus + "Автобус к соседу по суше</td><td>" + fmtMoney(RULES.bus) + " · 1 день</td></tr>" +
    "<tr><td>" + ICON.bus + "Автобус в огромную страну</td><td>" + fmtMoney(RULES.busHuge) + " · 2 дня</td></tr>" +
    "<tr><td>" + ICON.ferry + "Паром по морской линии</td><td>" + fmtMoney(RULES.ferryBase) + " + 15 ₽/км · 2 дня</td></tr>" +
    "<tr><td>" + ICON.plane + "Самолёт до столицы не дальше 5 000 км</td><td>" + fmtMoney(RULES.flightBase) + " + 25 ₽/км · 1 день</td></tr>" +
    "<tr><td>Ошибка на границе</td><td>−" + fmtMoney(D.wrong) + " · +1 день</td></tr>" +
    "<tr><td>Подсказка</td><td>" + (D.hints ? "−" + fmtMoney(D.hint) : "нет") + "</td></tr></tbody></table>" +
    "<h2>Уровни</h2><table class=\"prices\"><tbody>" + DIFF_ORDER.map(k => { const x = DIFF[k]; return "<tr><td>" + esc(x.name) + "</td><td>" + fmtMoney(x.money) + " · " + x.days + " дн. · " + x.questions + " вопр. · ошибка −" + fmtMoney(x.wrong) + "</td></tr>"; }).join("") + "</tbody></table>" +
    "<h2>Звания</h2><p>Звание даётся при возвращении домой и навсегда остаётся в паспорте. Почти все требуют не меньше 20 стран; одно — секретное. " + (D.ach ? "" : "На уровне «Турист» звания не присуждаются — они начинаются с «Путешественника».") + "</p>" +
    '<div class="row-btns"><button class="btn" data-act="pageBack">Назад</button></div></div>';
  $("scrRules").innerHTML = html;
}
function openPage(name) {
  if (screen !== name) pageBack = ["passport", "records", "rules", "notebook", "train"].includes(screen) ? pageBack : screen;
  if (name === "passport") renderPassport();
  if (name === "records") renderRecords();
  if (name === "rules") renderRules();
  if (name === "notebook") renderNotebook();
  closeSheet(); show(name);
  $("scr" + name[0].toUpperCase() + name.slice(1)).scrollTop = 0;
}

/* ---- Меню ---- */
function openMenu(confirmGiveUp) {
  let html = '<div class="sheet-head"><h2 id="sheetTitle">Меню</h2>' + closeBtn + "</div>";
  if (confirmGiveUp) {
    html += '<p class="reason">Сдаться? Поездка закончится и не попадёт в рекорды. Штампы в паспорте останутся.</p>' +
      '<div class="row-btns"><button class="btn primary" data-act="giveUpYes">Да, сдаться</button><button class="btn" data-act="menu" data-autofocus>Нет, ехать дальше</button></div>';
  } else {
    html += '<div style="display:grid;gap:8px;margin-top:8px">' +
      '<button class="btn" data-act="mute">' + (muted ? "Включить звук" : "Выключить звук") + "</button>" +
      '<button class="btn" data-act="rules">Правила и цены</button>' +
      '<button class="btn" data-act="passport">Паспорт</button>' +
      (run && run.souvenirs && run.souvenirs.length ? '<button class="btn" data-act="sell">Продать сувенир</button>' : '<button class="btn" disabled>Нечего продавать</button>') +
      '<button class="btn" data-act="toStart">На главную (поездка сохранится)</button>' +
      '<button class="btn" data-act="giveUp" ' + (run && run.status === "play" && !run.border ? "" : "disabled") + ">Сдаться</button></div>";
  }
  openSheet(html);
}

/* ---- Продажа сувениров ---- */
function openSell(askId) {
  const list = (run && run.souvenirs) || [];
  let html = '<div class="sheet-head"><div><h2 id="sheetTitle">Продать сувенир</h2><p class="sub">За каждый — ' + fmtMoney(SOUVENIR_PRICE) + ". Проданный сувенир уйдёт и с витрины.</p></div>" + closeBtn + "</div>";
  if (!list.length) html += '<p class="empty">Нечего продавать: в этой поездке сувениров нет.</p>';
  html += list.map(id => {
    const nm = esc(svName(id)), cn = esc(W.byId[id] ? W.byId[id].name : "");
    if (id === askId) return '<div class="sell-ask"><p>Продать «' + nm + "» за " + fmtMoney(SOUVENIR_PRICE) + '?</p><div class="row-btns"><button class="btn primary" data-act="sellYes" data-id="' + esc(id) + '" data-autofocus>Продать</button><button class="btn" data-act="sell">Оставить</button></div></div>';
    return '<button class="sell" data-act="sellAsk" data-id="' + esc(id) + '">' + svIcon(id) + "<span><b>" + nm + "</b><small>" + cn + '</small></span><span class="pr">+' + fmtMoney(SOUVENIR_PRICE) + "</span></button>";
  }).join("");
  html += '<div class="row-btns"><button class="btn ghost" data-act="menu">Назад в меню</button></div>';
  openSheet(html);
}

/* ---- Старт ---- */
function refreshStart() {
  refreshNbBadge();
  const saved = LS.get(K.run, null);
  const canCont = (run && run.mode !== "daily" && run.status === "play") || (saved && saved.status === "play");
  // маршрут дня
  const today = todayStr(), rt = routeFor(today);
  let sd = LS.get(K.runDaily, null);
  if (sd && (sd.started !== today || sd.status !== "play")) { LS.del(K.runDaily); sd = null; }
  $("dailyCard").hidden = !rt;
  if (rt) {
    const best = LS.get(dailyKey(today), null);
    $("dailyKick").textContent = "Маршрут дня · " + dayLabel(today) + ":";
    $("dailyRoute").textContent = WB.byId[rt.from].capital + " → " + WB.byId[rt.to].capital + " · " + rt.days + "\u00A0" + plural(rt.days, "день", "дня", "дней");
    $("dailyBest").textContent = best ? "Лучший сегодня: " + best.countries + "\u00A0" + plural(best.countries, "страна", "страны", "стран") : "Попыток — сколько угодно, засчитывается лучшая";
    $("btnDaily").textContent = sd ? "Продолжить" : "Играть";
  }
  $("btnCont").hidden = !canCont;
  $("btnNew").textContent = canCont ? "Новая поездка" : "В путь";
  const D = DIFF[selDiff];
  $("tkMoney").textContent = fmtMoney(D.money);
  $("tkDays").textContent = D.days + "\u00A0" + plural(D.days, "день", "дня", "дней");
  $("pitch").textContent = "Объехать как можно больше стран на " + fmtMoney(D.money) + " за " + D.days + " дней и вернуться домой.";
  document.querySelectorAll('[data-act="setDiff"]').forEach(b => b.setAttribute("aria-checked", String(b.dataset.diff === selDiff)));
  $("diffNote").textContent = {
    tourist: "3 варианта ответа, ошибка −2 000 ₽, подсказка −1 000 ₽. Звания — от Путешественника.",
    traveler: "4 варианта ответа, ошибка −3 000 ₽, подсказка −2 000 ₽.",
    magellan: "4 вопроса на границе, без подсказок, ошибка −5 000 ₽, две ошибки — разворот."
  }[selDiff].replace(/(\d) (\d{3})/g, "$1" + NBSP + "$2");
  $("tkFrom").textContent = WB.byId[WB.home] ? WB.byId[WB.home].capital : "—";
}
function startNew() {
  useWorldFor(null);
  run = newRun(W, { date: new Date().toISOString().slice(0, 10), seed: (Math.random() * 1e9) >>> 0, diff: selDiff });
  lastResult = null;
  saveRun(); enterGame(true);
}
/* Маршрут дня: продолжить сохранённый на сегодня или начать новую попытку */
function startDaily(forceNew) {
  const today = todayStr(), rt = routeFor(today);
  if (!rt) { toast("Маршрут дня сегодня недоступен"); return; }
  const sd = LS.get(K.runDaily, null);
  if (!forceNew && sd && sd.v === 2 && sd.status === "play" && sd.started === today) { run = sd; useWorldFor(run); lastResult = null; enterGame(false); return; }
  useWorldFor({ mode: "daily", target: rt.to });
  run = newRun(W, { mode: "daily", start: rt.from, days: rt.days, date: today, seed: (Math.random() * 1e9) >>> 0, diff: selDiff });
  lastResult = null;
  saveRun(); enterGame(true);
}
function enterGame(fresh) {
  closeSheet(); $("evCard").hidden = true; evNext = null; show("game");
  resize();
  updateHUD();
  focusCountry(run.cur, fresh ? 700 : 0);
  if (run.border) setTimeout(() => renderBorder(), 50);
  else if (run.pendingEvent) setTimeout(() => showEvent(checkStuck), 300);
  else setTimeout(checkStuck, 400);
}

/* ---- Обработчики ---- */
const ACT = {
  newGame: () => startNew(),
  continue: () => { if (!run || run.mode === "daily" || run.status !== "play") run = LS.get(K.run, null); useWorldFor(run); if (run && run.status === "play") enterGame(false); },
  daily: () => startDaily(screen === "result"),
  passport: () => openPage("passport"),
  records: () => openPage("records"),
  rules: () => openPage("rules"),
  pageBack: () => {
    const to = pageBack || "start";
    if (to === "game" && run && run.status === "play") enterGame(false);
    else if (to === "result" && lastResult) { renderResult(); show("result"); }
    else { refreshStart(); show("start"); }
  },
  toStart: () => { closeSheet(); refreshStart(); show("start"); requestDraw(); },
  moves: () => run && run.status === "play" && !run.border && !anim && openMoves(),
  go: el => doMove(el.dataset.to, el.dataset.type),
  closeSheet: () => closeSheet(),
  scrim: () => { if (sheetOpts && sheetOpts.dismiss) closeSheet(); },
  zoomIn: () => zoomAt(VW / 2, VH / 2, 1.6),
  zoomOut: () => zoomAt(VW / 2, VH / 2, 1 / 1.6),
  whereAmI: () => run && focusCountry(run.cur, 500),
  menu: () => openMenu(false),
  giveUp: () => openMenu(true),
  giveUpYes: () => finish("gaveup"),
  mute: () => { muted = !muted; LS.set(K.mute, muted); openMenu(false); toast(muted ? "Звук выключен" : "Звук включён", 1500); },
  sos: () => openSOS(),
  sosYes: () => finish("sos"),
  ans: el => onAnswer(el.dataset.key),
  hint: () => { if (useHint(run, Math.random)) { saveRun(); renderBorder(); } },
  setTitle: el => { if (passport.ach.includes(el.dataset.id)) { passport.active = passport.active === el.dataset.id ? "" : el.dataset.id; savePassport(); renderPassport(); } },
  skipStamp: () => { if (stampDone) stampDone(); },
  skipSv: () => { if (svDone) svDone(); },
  evNext: () => closeEvent(),
  setDiff: el => { selDiff = el.dataset.diff; LS.set(K.diff, selDiff); recTab = ""; refreshStart(); },
  recTab: el => { recTab = el.dataset.tab; renderRecords(); },
  notebook: () => openPage("notebook"),
  trainStart: () => trainStart(),
  tans: el => trainAnswer(el.dataset.key),
  trainNext: () => { if (train) { train.i++; train.pick = null; renderTrain(); $("scrTrain").scrollTop = 0; } },
  trainBack: () => { train = null; openPage("notebook"); },
  trainQuit: () => { train = null; refreshStart(); show("start"); requestDraw(); },
  passTab: el => { passTab = el.dataset.tab; renderPassport(); },
  sell: () => openSell(""),
  sellAsk: el => openSell(el.dataset.id),
  sellYes: el => {
    if (run && sellSouvenir(run, shelf, el.dataset.id)) { saveShelf(); saveRun(); updateHUD(); toast("Продано: +" + fmtMoney(SOUVENIR_PRICE), 2000); }
    openSell("");
  }
};
function onMapTap(x, y) {
  if (!run || screen !== "game" || run.status !== "play" || run.border || anim) return;
  const id = hitTest(x, y);
  if (id === null) { if (!$("sheet").hidden && sheetOpts && sheetOpts.dismiss) closeSheet(); return; }
  openCountry(id);
}

/* ===================================================================
   Запуск
   =================================================================== */
function init(s) {
  s = s || {};
  if (!window.GEO || !window.GEO.countries) { document.getElementById("app").innerHTML = '<p style="padding:24px">Данные игры не загрузились.</p>'; return; }
  WB = W = buildWorld(window.GEO);
  ctx = cv().getContext("2d");
  EMOJI_OK = detectEmojiFlags();
  readTokens();
  loadMap();
  COLORS = mapColors(W, 8);
  buildLabelOrder();
  $("mapNotice").hidden = MAP.ok;
  passport = Object.assign({ stamps: [], ach: [], active: "" }, LS.get(K.pass, {}) || {});
  for (const d of DIFF_ORDER) { const l = LS.get(recKey(d), []); records[d] = Array.isArray(l) ? l : []; }
  selDiff = DIFF[LS.get(K.diff, "traveler")] ? LS.get(K.diff, "traveler") : "traveler";
  shelf = LS.get(K.shelf, []); if (!Array.isArray(shelf)) shelf = [];
  notebook = LS.get(K.nb, {}); if (!notebook || typeof notebook !== "object" || Array.isArray(notebook)) notebook = {};
  for (const id of Object.keys(notebook)) if (!W.byId[id] || !notebook[id] || !(notebook[id].n > 0)) delete notebook[id];
  playerName = LS.get(K.name, "") || "";
  muted = !!LS.get(K.mute, false);
  $("pname").value = playerName;
  $("pname").addEventListener("input", e => { playerName = e.target.value.trim().slice(0, 24); LS.set(K.name, playerName); });

  // снимок от горячего обновления важнее сохранённого
  run = (s.run && s.run.v === 2) ? s.run : null;
  lastResult = s.lastResult || null;
  if (!run) { const saved = LS.get(K.run, null); if (saved && saved.v === 2 && saved.status === "play" && saved.cur && W.byId[saved.cur]) run = saved; }
  if (run && run.mode === "daily" && !W.byId[run.target]) run = null;
  useWorldFor(run);

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (f) f(el);
  });
  document.addEventListener("pointerdown", () => { if (!muted && !AC) audio(); }, { once: true });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!$("stampFx").hidden && stampDone) stampDone(); else if (!$("svCard").hidden && svDone) svDone(); else if (!$("evCard").hidden) closeEvent(); else if (!$("sheet").hidden && sheetOpts && sheetOpts.dismiss) closeSheet(); }
  });
  bindMap();
  try { new ResizeObserver(resize).observe(cv()); } catch (e) { window.addEventListener("resize", resize); }
  const onTheme = () => { readTokens(); requestDraw(); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme); } catch (e) {}
  try { new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class", "style"] }); } catch (e) {}
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestDraw());

  // флаги встроены в страницу (window.FLAG_IMG); CDN-загрузка больше не нужна

  // начальная камера: дом
  resize();
  const hp = MAP.pos[W.home] || [MAP.MW / 2, MAP.MH / 2];
  cam.x = hp[0]; cam.y = hp[1]; cam.z = Math.max(zMin(), Math.min(VW, VH) / 70);
  clampCam();
  refreshStart();
  const scr = s.screen;
  if (run && scr === "game") enterGame(false);
  else if (scr === "result" && lastResult) { renderResult(); show("result"); }
  else if (scr === "passport" || scr === "records" || scr === "rules" || scr === "notebook" || scr === "train") openPage(scr === "train" ? "notebook" : scr);
  else show("start");
  requestDraw();
  syncState();
}
window.claude?.hot?.snapshot?.(() => currentState);
const start = s => init(s);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
