<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1d14">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Кругосветка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* ===== Токены: светлая «бумажная» палитра ===== */
:root{
  --bg:#e7dec4; --paper:#f4edd9; --paper-2:#ebe1c6; --fg:#22304a; --muted:#615d4f; --line:#b9ab86;
  --sea:#c6d4cb; --grat:#93aa9c; --coast:#34405a;
  --land-eu:#ecdba8; --land-as:#eccaa5; --land-af:#e0d297; --land-na:#d2dca8; --land-sa:#e2c2b4; --land-oc:#c9d7c4; --land-x:#dcd4bc;
  --reach:#fbf4d9; --visited:#e8a26c; --closed:#b5af9f;
  --red:#b3352b; --red-ink:#fff7ea; --stamp:#47388a; --ok:#2c6a48; --focus:#1d5cc0;
  --shade:rgba(34,48,74,.18); --scrim:rgba(34,30,20,.28); --shadow:rgba(30,25,15,.35);
  --f-display:"Oswald","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"Lora",Georgia,"Times New Roman",serif;
  /* Карта: одна сепия-палитра для обеих тем (в тёмной теме не переопределяется) */
  --map-sea:#2b2019; --map-sea-edge:#17110c; --map-grat:#e8d6b0; --map-border:#26180f; --map-neutral:#5e4a3b;
  --map-c1:#bf9a55; --map-c2:#cbb082; --map-c3:#9c5a39; --map-c4:#ad6e52; --map-c5:#7c5d42; --map-c6:#ab7d47; --map-c7:#a8807a; --map-c8:#857a4d;
  --map-ink:#f0e2c3; --map-halo:#1e140d; --map-route:#e0523f; --map-glow:#f6e7c4;
  --f-map:"Playfair Display","Oranienbaum",Georgia,"Times New Roman",serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
/* ===== Ночная палитра: тёмная бумага, кремовые чернила ===== */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a202d; --paper:#242b3b; --paper-2:#2c3446; --fg:#eee3c6; --muted:#b0a78c; --line:#46506a;
    --sea:#131a26; --grat:#2b3a4b; --coast:#d7cdb0;
    --land-eu:#4a4535; --land-as:#4e3e33; --land-af:#4a4932; --land-na:#3c4735; --land-sa:#4d3a38; --land-oc:#38443c; --land-x:#393935;
    --reach:#665d44; --visited:#9b5934; --closed:#2c2d31;
    --red:#e26a5c; --red-ink:#1a202d; --stamp:#b4a6ef; --ok:#7cc59b; --focus:#8fb8ff;
    --shade:rgba(0,0,0,.35); --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a202d; --paper:#242b3b; --paper-2:#2c3446; --fg:#eee3c6; --muted:#b0a78c; --line:#46506a;
  --sea:#131a26; --grat:#2b3a4b; --coast:#d7cdb0;
  --land-eu:#4a4535; --land-as:#4e3e33; --land-af:#4a4932; --land-na:#3c4735; --land-sa:#4d3a38; --land-oc:#38443c; --land-x:#393935;
  --reach:#665d44; --visited:#9b5934; --closed:#2c2d31;
  --red:#e26a5c; --red-ink:#1a202d; --stamp:#b4a6ef; --ok:#7cc59b; --focus:#8fb8ff;
  --shade:rgba(0,0,0,.35); --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.6);
  color-scheme: dark;
}

html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;width:100%;overflow:hidden;
  padding-left:var(--gl);padding-right:var(--gr)}

/* ===== Карта ===== */
#mapLayer{position:absolute;inset:0;perspective:900px;perspective-origin:50% 40%;background:var(--map-sea);overflow:hidden}
#stage{position:absolute;inset:0;transform-origin:50% 55%;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
#stage.tilt{transform:rotateX(32deg) scale(1.28)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.vehicle{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
.vehicle .v-shadow,.vehicle .v-body{position:absolute;left:-24px;top:-24px;width:48px;height:48px}
.vehicle .v-shadow{color:var(--shadow);filter:blur(2.5px);opacity:.75}
.vehicle .v-body{color:var(--fg);filter:drop-shadow(0 0 1px var(--paper))}
.vehicle svg{width:100%;height:100%;display:block}

/* ===== Общие кнопки ===== */
.btn{min-height:48px;padding:0 20px;border-radius:6px;border:1.5px solid var(--fg);background:var(--paper);
  font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.02em;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--fg);background:var(--paper);
  display:inline-grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:hover{background:var(--paper-2)}

/* ===== Флаги ===== */
.flag{display:inline-grid;place-items:center;flex:none;line-height:1;overflow:hidden}
.flag svg{width:100%;height:100%;display:block}
.flag img{width:100%;height:100%;display:block;object-fit:contain}
.flag.svg,.flag.img{border-radius:2px;box-shadow:0 0 0 1px var(--shade)}
.flag.xl.img{box-shadow:0 0 0 1px var(--shade),0 6px 18px var(--shade)}
.flag.emoji{font-family:var(--f-emoji)}
.flag.badge{font-family:var(--f-display);font-weight:600;border:1.5px solid currentColor;border-radius:3px;letter-spacing:.06em}
.flag.sm{width:27px;height:18px;font-size:18px}
.flag.sm.badge{font-size:10px}
.flag.md{width:42px;height:28px;font-size:28px}
.flag.md.badge{font-size:13px}
.flag.xl{width:min(66vw,240px);height:min(44vw,160px);font-size:96px}
.flag.xl.svg{box-shadow:0 0 0 1px var(--shade),0 6px 18px var(--shade)}
.flag.xl.badge{font-size:44px;border-width:3px}

/* ===== Экран старта ===== */
.screen{position:absolute;inset:0;z-index:5}
#scrGame{pointer-events:none}
.mapctl,.notice{pointer-events:auto}
.start{display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 28px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gl);
  background:linear-gradient(180deg, color-mix(in srgb,var(--bg) 82%,transparent) 0%, color-mix(in srgb,var(--bg) 30%,transparent) 45%, color-mix(in srgb,var(--bg) 88%,transparent) 100%)}
.start > *{pointer-events:auto}
.title-block{max-width:640px}
.title{font-family:var(--f-display);font-weight:600;font-size:clamp(46px,13.5vw,124px);line-height:.92;margin:0;letter-spacing:-.01em}
.title-route{display:block;width:min(100%,520px);height:34px;margin:4px 0 10px;color:var(--red)}
.pitch{font-style:italic;font-size:clamp(17px,4.4vw,21px);line-height:1.45;margin:0;max-width:30ch}
.ticket{position:relative;background:var(--paper);border:1.5px solid var(--fg);border-radius:10px;max-width:520px;width:100%;
  box-shadow:0 10px 30px var(--shade)}
.ticket-top{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1.5px dashed var(--line)}
.ticket-top div{padding:12px 14px;border-right:1px solid var(--line)}
.ticket-top div:last-child{border-right:0}
.ticket-top small{display:block;font-size:13px;color:var(--muted);font-style:italic}
.ticket-top b{font-family:var(--f-display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ticket::before,.ticket::after{content:"";position:absolute;top:62px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--fg)}
.ticket::before{left:-10px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-10px;clip-path:inset(0 50% 0 0)}
.ticket-body{padding:14px 16px 16px;display:grid;gap:12px}
.sign{display:grid;gap:2px}
.sign label{font-size:14px;color:var(--muted);font-style:italic}
.sign input{border:0;border-bottom:1.5px solid var(--fg);background:transparent;font-family:var(--f-body);font-style:italic;font-size:20px;padding:6px 2px;min-height:44px;border-radius:0}
.start-actions{display:flex;gap:10px;flex-wrap:wrap}
.start{overflow-y:auto;overscroll-behavior:contain;gap:16px}
.start-bottom{display:grid;gap:10px;max-width:520px;width:100%}
.daily{display:flex;gap:12px;align-items:center;background:var(--paper);border:1.5px dashed var(--fg);border-radius:10px;padding:10px 10px 10px 14px;box-shadow:0 6px 18px var(--shade)}
.daily-txt{flex:1;min-width:0}
.daily-txt small{display:block;font-size:13px;color:var(--muted);font-style:italic;line-height:1.3}
.daily-txt b{display:block;font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.2;margin:1px 0}
.daily .btn{flex:none;padding:0 16px;border-color:var(--red);color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--fg);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;padding:0 2px;
  font-family:var(--f-display);font-weight:500;font-size:clamp(13px,3.6vw,16px);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--paper)}
.diff-note{margin:6px 0 0;font-size:14px;line-height:1.35;color:var(--muted);font-style:italic}
.start-actions .btn.primary{flex:1 1 160px}
.start-links{display:flex;gap:4px;flex-wrap:wrap;margin:0 -10px}
.start-links .btn{min-height:44px;padding:0 10px;font-size:16px}

/* ===== HUD ===== */
.hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:4;
  padding:10px var(--gr) 0 var(--gl);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.hud-card{flex:1;max-width:560px;background:var(--paper);border:1.5px solid var(--fg);border-radius:8px;
  box-shadow:0 4px 14px var(--shade);overflow:hidden}
.hud-row{display:grid;grid-template-columns:auto auto 1fr}
.hud-row div{padding:6px 9px 4px;border-right:1px solid var(--line);min-width:0}
.hud-row div:last-child{border-right:0}
.hud-row small{display:block;font-size:12px;color:var(--muted);font-style:italic;line-height:1.2}
.hud-row b{font-family:var(--f-display);font-weight:500;font-size:clamp(16px,4.6vw,20px);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-home{border-top:1.5px dashed var(--line);padding:5px 10px 6px;font-size:14px;font-variant-numeric:tabular-nums}
.hud-home.danger{color:var(--red);font-weight:600}
.hud-home svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

.mapctl{position:absolute;right:var(--gr);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:4;display:grid;gap:8px}
.notice{position:absolute;left:var(--gl);right:var(--gr);top:calc(env(safe-area-inset-top,0px) + 112px);z-index:4;
  font-size:14px;font-style:italic;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 12px;max-width:520px}

.bar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 var(--gr) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gl);pointer-events:none}
.bar-inner{pointer-events:auto;max-width:560px;display:flex;gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--fg);
  border-radius:10px;padding:10px 10px 10px 14px;box-shadow:0 -2px 18px var(--shade)}
.here{flex:1;min-width:0;display:flex;gap:10px;align-items:center}
.here-txt{min-width:0}
.here-txt small{display:block;font-size:13px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.here-txt b{display:block;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.bar .btn.primary{padding:0 14px;flex:none}

/* ===== Нижний лист ===== */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
@media (min-width:900px){.scrim{background:transparent}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:86%;display:flex;flex-direction:column;
  background:var(--paper);border-top:1.5px solid var(--fg);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px var(--shade);
  padding:0 var(--gr) 0 var(--gl);animation:sheetIn .28s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
.sheet-grip{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:24px;margin:6px 0 2px;line-height:1.15}
.sheet .sub{color:var(--muted);font-style:italic;font-size:15px;margin:0 0 10px}
.sheet-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.close-x{flex:none;margin-top:2px}
@media (min-width:900px){
  .sheet{left:auto;right:calc(var(--gr) + 64px);top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;width:440px;max-height:calc(100% - 24px);
    border:1.5px solid var(--fg);border-radius:12px;padding:0 18px}
  .sheet-grip{display:none}
  .hud-card{max-width:520px}
  .bar-inner{max-width:520px}
}
.group-h{font-family:var(--f-display);font-weight:500;font-size:16px;color:var(--muted);margin:14px 0 6px;display:flex;gap:8px;align-items:center}
.group-h svg{width:20px;height:20px}
.move{width:100%;display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;text-align:left;
  min-height:56px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;margin-bottom:6px}
.move:hover:not(:disabled){background:var(--paper-2);border-color:var(--fg)}
.move:disabled{opacity:.5;cursor:not-allowed}
.move.home{border:1.5px solid var(--red)}
.move .ico svg{width:24px;height:24px;display:block}
.move .nm{min-width:0}
.move .nm b{display:block;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.move .nm small{display:block;font-size:13px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.move .pr{text-align:right;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.move .pr small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.empty{font-style:italic;color:var(--muted);padding:12px 0}
.reason{border-left:3px solid var(--red);padding:6px 12px;margin:10px 0;font-style:italic}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 10px;font-size:15px}
.facts dt{color:var(--muted);font-style:italic}
.facts dd{margin:0}

/* ===== Пограничный контроль ===== */
.border-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qprog{display:flex;gap:6px}
.qprog i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.qprog i.done{background:var(--ok)}
.qprog i.now{background:var(--fg)}
.qbox{display:grid;place-items:center;min-height:170px;margin:10px 0 8px}
.qtext{font-family:var(--f-display);font-weight:500;font-size:22px;margin:4px 0 6px}
.qlead{font-style:italic;color:var(--muted);font-size:17px;margin:10px 0 0}
.qcountry{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,9vw,42px);line-height:1.05;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans.tile{min-height:120px;display:grid;place-items:center;padding:10px;text-align:center}
.ans.tile .flag.tile{width:min(100%,144px);height:96px;font-size:96px}
.ans.tile .flag.tile.badge{font-size:30px;width:96px;height:64px}
.ans.tile.wrong{text-decoration:none;opacity:.4}
.ans.row{display:flex;gap:12px;align-items:center}
.answers{display:grid;gap:8px}
.ans{min-height:54px;padding:8px 14px;border:1.5px solid var(--fg);border-radius:8px;background:var(--paper);text-align:left;
  font-size:17px;cursor:pointer;font-family:var(--f-body)}
.ans:hover:not(:disabled){background:var(--paper-2)}
.ans.wrong{border-color:var(--red);color:var(--red);text-decoration:line-through;opacity:.75}
.ans.gone{opacity:.25;border-style:dashed}
.ans.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper));color:var(--fg)}
.ans.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-variant-numeric:tabular-nums;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:3px 9px;animation:pillIn .3s}
@keyframes pillIn{from{transform:scale(.6);opacity:0}}
.strikes{font-size:14px;color:var(--muted);font-style:italic}

/* ===== Штамп ===== */
.stampfx{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 25%,transparent);cursor:pointer}
.stampfx svg{width:min(72vw,300px);height:auto;color:var(--stamp);animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) both}
.stampfx.out{animation:fadeOut .35s forwards}
@keyframes stampIn{0%{transform:scale(2.3) rotate(-28deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:.92}}
@keyframes fadeOut{to{opacity:0}}

/* ===== Страницы: итог, паспорт, рекорды, правила ===== */
.page{position:absolute;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.page-in{max-width:720px;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 32px) var(--gl)}
.page-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.page h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,8vw,44px);margin:0;line-height:1}
.page h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:26px 0 8px}
.page p{line-height:1.55;max-width:62ch}
.big{font-family:var(--f-display);font-weight:600;font-size:clamp(96px,30vw,180px);line-height:.85;font-variant-numeric:tabular-nums;margin:18px 0 0}
.big-cap{font-style:italic;font-size:19px;margin:6px 0 16px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1.5px solid var(--fg);border-radius:8px;background:var(--paper);max-width:520px}
.stats div{padding:10px 14px;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){border-right:1px solid var(--line)}
.stats div:nth-last-child(-n+2){border-bottom:0}
.stats small{display:block;color:var(--muted);font-style:italic;font-size:14px}
.stats b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.verdict{border-left:3px solid var(--red);padding:4px 12px;font-style:italic;margin:16px 0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ach{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);
  width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;min-height:56px}
.ach:disabled{cursor:default}
.ach .seal{width:44px;height:44px;color:var(--stamp)}
.ach.locked .seal{color:var(--line)}
.ach b{font-family:var(--f-display);font-weight:500;font-size:19px}
.ach small{display:block;color:var(--muted);font-style:italic;font-size:14px;line-height:1.35}
.ach .act{color:var(--red);font-style:normal;font-family:var(--f-display);font-size:14px;margin-left:8px}
.owner{font-family:var(--f-body);font-style:italic;font-size:20px;margin:4px 0 0}
.owner em{font-style:normal;font-family:var(--f-display);color:var(--stamp);margin-left:6px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stampcell{border:1.5px dashed var(--line);border-radius:8px;padding:10px 6px 8px;display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px;line-height:1.2}
.stampcell.got{border:1.5px solid var(--stamp);color:var(--fg);transform:rotate(var(--r,0deg))}
.stampcell:not(.got){opacity:.42;filter:grayscale(1)}
.cont-h{font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--muted);margin:18px 0 8px}
table.rec{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--paper);border:1.5px solid var(--fg)}
table.rec th,table.rec td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
table.rec th{font-family:var(--f-display);font-weight:500;color:var(--muted);font-size:14px}
table.rec td:nth-child(2),table.rec th:nth-child(2){text-align:left}
table.rec td:first-child{font-family:var(--f-display);font-size:18px}
table.daily-rec td:first-child{font-size:15px;white-space:nowrap;text-align:left}
table.daily-rec th:first-child{text-align:left}
table.rec tr.me{background:color-mix(in srgb,var(--red) 12%,var(--paper))}
table.rec small{display:block;color:var(--stamp);font-style:italic;font-size:13px}
.prices{width:100%;border-collapse:collapse;max-width:560px}
.prices td{padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top;font-size:15px}
.prices td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prices svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.rules li{margin:6px 0;line-height:1.5}

/* ===== Сувениры ===== */
svg.sv{width:24px;height:24px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.svcard{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:12;max-width:380px;margin:0 auto;
  display:flex;gap:14px;align-items:center;background:var(--paper);border:1.5px solid var(--fg);border-radius:10px;padding:12px 16px;
  box-shadow:0 10px 30px var(--shade);animation:svUp .4s cubic-bezier(.2,.8,.3,1);cursor:pointer}
.svcard .sv{width:44px;height:44px}
.svcard small{display:block;color:var(--muted);font-style:italic;font-size:14px}
.svcard b{display:block;font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.15}
.svcard.out{animation:fadeOut .25s forwards}
@keyframes svUp{from{transform:translateY(70px);opacity:0}}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:14px 0 10px;overflow-x:auto;scrollbar-width:none}
.tab{min-height:44px;padding:0 12px;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;background:none;cursor:pointer;
  font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
.shelf-n{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;margin:4px 0 0}
.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
@media (min-width:600px){.shelf{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}}
.svslot{border:1.5px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 2px 5px;display:grid;justify-items:center;align-content:start;gap:4px;
  min-height:76px;text-align:center;font-size:9px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto;letter-spacing:-.01em}
.svslot .sv{width:28px;height:28px}
.svslot span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.svslot.empty{border-style:dashed;background:transparent;color:var(--muted);opacity:.7}
.svslot.empty .sv{color:var(--line) !important}
@media (min-width:600px){.svslot{font-size:12px}.svslot .sv{width:34px;height:34px}}
.sell{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;min-height:58px;padding:8px 10px;margin-bottom:6px;text-align:left;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.sell:hover{background:var(--paper-2);border-color:var(--fg)}
.sell .sv{width:36px;height:36px}
.sell b{display:block;font-weight:600;font-size:16px}
.sell small{display:block;color:var(--muted);font-style:italic;font-size:13px}
.sell .pr{font-family:var(--f-display);font-size:17px;white-space:nowrap;color:var(--ok)}
.sell-ask{border:1.5px solid var(--red);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.sell-ask p{margin:0 0 8px}
.sell-ask .row-btns{margin-top:0}
/* ===== Дорожные события: открытка ===== */
.evwrap{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:20px var(--gr) 20px var(--gl);background:var(--scrim)}
.postcard{position:relative;width:min(100%,400px);background:var(--paper);border:1.5px solid var(--fg);border-radius:6px;padding:18px 18px 16px;
  box-shadow:0 18px 50px var(--shadow);transform:rotate(-1.2deg);animation:cardIn .45s cubic-bezier(.2,1.2,.4,1) both}
.postcard::before{content:"";position:absolute;inset:6px;border:1px dashed var(--line);border-radius:3px;pointer-events:none}
@keyframes cardIn{from{transform:translateY(40px) rotate(4deg);opacity:0}}
.pc-stamp{float:right;width:58px;height:66px;margin:0 0 8px 12px;display:grid;place-items:center;color:var(--stamp);
  border:2px dotted var(--stamp);border-radius:3px;background:var(--paper-2)}
.pc-stamp svg{width:34px;height:34px}
.pc-kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display);margin:0}
.postcard h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;margin:4px 0 10px}
.postcard p.txt{font-style:italic;font-size:17px;line-height:1.5;margin:0 0 14px;clear:none}
.pc-fx{clear:both;display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pc-fx span{font-size:14px;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.postcard .btn{width:100%;position:relative}
.hud-fx{display:flex;gap:5px;flex-wrap:wrap;padding:0 8px 6px}
.hud-fx span{font-size:12px;line-height:1.2;color:var(--stamp);border:1px solid var(--stamp);border-radius:999px;padding:2px 8px;white-space:nowrap}
.move .nm small.mod{color:var(--red);font-style:normal}
/* ===== Тетрадь и тренировка ===== */
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:var(--red-ink);
  font-size:13px;font-family:var(--f-display);text-decoration:none}
.nb-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.nb-row b{display:block;font-weight:600;font-size:17px}
.nb-row .cnt{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--red);text-align:right;line-height:1}
.nb-row .cnt small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-style:italic}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tags span.ok{border-color:var(--ok);color:var(--ok)}
.train-card{background:var(--paper);border:1.5px solid var(--fg);border-radius:12px;padding:12px 14px 16px;max-width:560px;box-shadow:0 6px 20px var(--shade)}
.train-card .answers{margin-top:6px}
.fb{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--ok);font-style:italic}
.fb.bad{border-left-color:var(--red)}
.ans.right:disabled{opacity:1}

.toast{position:absolute;left:var(--gl);right:var(--gr);top:calc(env(safe-area-inset-top,0px) + 120px);z-index:13;max-width:460px;
  background:var(--fg);color:var(--bg);border-radius:8px;padding:12px 14px;font-size:15px;box-shadow:0 8px 24px var(--shade);animation:sheetIn .25s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:760px){.title{font-size:clamp(40px,11vw,96px)}.title-route{height:24px;margin:2px 0 6px}.pitch{font-size:16px}}
@media (prefers-reduced-motion: reduce){
  #stage{transition:none}
  .sheet,.toast,.pill,.svcard,.postcard{animation:none}
  .stampfx svg{animation-duration:.01s}
}
</style>

<div id="app">
  <div id="mapLayer">
    <div id="stage"><canvas id="map" aria-label="Карта мира. Нажмите на страну, чтобы узнать, как туда добраться"></canvas></div>
    <div class="vehicle" id="vehicle" hidden><div class="v-shadow"></div><div class="v-body"></div></div>
  </div>

  <!-- Старт -->
  <section class="screen start" id="scrStart" aria-labelledby="ttl">
    <div class="title-block">
      <h1 class="title" id="ttl">Кругосветка</h1>
      <svg class="title-route" viewBox="0 0 520 34" fill="none" aria-hidden="true">
        <path d="M6 26 C 120 2, 230 34, 330 14 S 470 8, 500 22" stroke="currentColor" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round"/>
        <circle cx="6" cy="26" r="5" fill="currentColor"/>
        <path d="M500 22 l-12 -7 l3 7 l-3 7 z" fill="currentColor"/>
      </svg>
      <p class="pitch" id="pitch">Объехать как можно больше стран на 300&nbsp;000&nbsp;₽ за 60 дней и вернуться домой.</p>
    </div>
    <div class="start-bottom">
    <div class="daily" id="dailyCard" hidden>
      <div class="daily-txt"><small id="dailyKick">Маршрут дня</small><b id="dailyRoute"></b><small id="dailyBest"></small></div>
      <button class="btn" data-act="daily" id="btnDaily">Играть</button>
    </div>
    <div class="ticket">
      <div class="ticket-top">
        <div><small>Бюджет</small><b class="num" id="tkMoney">300 000 ₽</b></div>
        <div><small>Срок</small><b class="num" id="tkDays">60 дней</b></div>
        <div><small>Отправление</small><b id="tkFrom">—</b></div>
      </div>
      <div class="ticket-body">
        <div class="diff-sel">
          <div class="seg" role="radiogroup" aria-label="Сложность">
            <button role="radio" data-act="setDiff" data-diff="tourist" aria-checked="false">Турист</button>
            <button role="radio" data-act="setDiff" data-diff="traveler" aria-checked="true">Путешественник</button>
            <button role="radio" data-act="setDiff" data-diff="magellan" aria-checked="false">Магеллан</button>
          </div>
          <p class="diff-note" id="diffNote"></p>
        </div>
        <div class="sign">
          <label for="pname">Подпись путешественника</label>
          <input id="pname" maxlength="24" autocomplete="nickname" placeholder="Ваше имя">
        </div>
        <div class="start-actions">
          <button class="btn primary" data-act="newGame" id="btnNew">В путь</button>
          <button class="btn" data-act="continue" id="btnCont" hidden>Продолжить</button>
        </div>
        <div class="start-links">
          <button class="btn ghost" data-act="passport">Паспорт</button>
          <button class="btn ghost" data-act="records">Рекорды</button>
          <button class="btn ghost" data-act="rules">Правила</button>
          <button class="btn ghost" data-act="notebook">Тетрадь<span class="badge num" id="nbBadge" hidden></span></button>
        </div>
      </div>
    </div>
    </div>
  </section>

  <!-- Игра -->
  <section class="screen" id="scrGame" hidden>
    <header class="hud">
      <button class="icon-btn" data-act="menu" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="hud-card" aria-live="polite">
        <div class="hud-row">
          <div><small>Деньги</small><b id="hMoney" class="num"></b></div>
          <div><small>Осталось</small><b id="hDays" class="num"></b></div>
          <div><small>Стран</small><b id="hCount" class="num"></b></div>
        </div>
        <div class="hud-home" id="hHome"></div>
        <div class="hud-fx" id="hFx" hidden></div>
      </div>
    </header>
    <div class="notice" id="mapNotice" hidden>Карта не загрузилась, страны показаны точками</div>
    <div class="mapctl">
      <button class="icon-btn" data-act="zoomIn" aria-label="Приблизить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" data-act="zoomOut" aria-label="Отдалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="icon-btn" data-act="whereAmI" aria-label="Где я"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <footer class="bar">
      <div class="bar-inner">
        <div class="here"><span id="bFlag"></span><div class="here-txt"><small id="bSmall">Вы находитесь</small><b id="bName"></b></div></div>
        <button class="btn" data-act="sos" id="btnSos" hidden>SOS</button>
        <button class="btn primary" data-act="moves" id="btnMoves">Куда дальше?</button>
      </div>
    </footer>
  </section>

  <section class="page" id="scrResult" hidden></section>
  <section class="page" id="scrPassport" hidden></section>
  <section class="page" id="scrRecords" hidden></section>
  <section class="page" id="scrRules" hidden></section>
  <section class="page" id="scrNotebook" hidden></section>
  <section class="page" id="scrTrain" hidden></section>

  <div class="scrim" id="scrim" hidden data-act="scrim"></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-scroll" id="sheetBody"></div>
  </div>
  <div class="stampfx" id="stampFx" hidden data-act="skipStamp"></div>
  <div class="evwrap" id="evCard" hidden role="dialog" aria-modal="true" aria-labelledby="evTitle"></div>
  <div class="svcard" id="svCard" hidden data-act="skipSv" role="status"></div>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

<script>
/* Геометрия карты (jsvectormap world, MIT). Перехватываем addMap до загрузки скрипта. */
window.jsVectorMap = { addMap: function(name, data){ window.WORLD_MAP = data; } };

const RULES = {
  money: 300000, days: 60, flightMaxKm: 5000,
  bus: 1500, busHuge: 3000, busDays: 1, busHugeDays: 2,
  ferryBase: 1500, ferryKm: 15, ferryDays: 2,
  flightBase: 10000, flightKm: 25, flightDays: 1,
  wrong: 3000, hint: 2000, maxWrong: 3
};
/* Уровни сложности. Всё, что зависит от уровня (бюджет, срок, штрафы, число вопросов), берётся отсюда. */
const DIFF = {
  tourist:  { id: "tourist",  name: "Турист",         money: 400000, days: 70, options: 3, questions: 3, wrong: 2000, hint: 1000, hints: true,  maxWrong: 3, ach: false },
  traveler: { id: "traveler", name: "Путешественник", money: 300000, days: 60, options: 4, questions: 3, wrong: 3000, hint: 2000, hints: true,  maxWrong: 3, ach: true },
  magellan: { id: "magellan", name: "Магеллан",       money: 200000, days: 50, options: 4, questions: 4, wrong: 5000, hint: 0,    hints: false, maxWrong: 2, ach: true }
};
const DIFF_ORDER = ["tourist", "traveler", "magellan"];
function diffOf(run) { return DIFF[run && run.diff] || DIFF.traveler; }
const CONTINENTS = ["Европа", "Азия", "Африка", "Северная Америка", "Южная Америка", "Океания"];

function haversineKm(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(a)));
}

/* Индекс мира: страны по id, симметричные соседства, паромы в обе стороны. */
function buildWorld(geo) {
  const list = geo.countries.slice();
  const byId = Object.create(null);
  list.forEach(c => { byId[c.id] = c; });
  const nb = Object.create(null);
  list.forEach(c => { nb[c.id] = new Set(); });
  list.forEach(c => (c.neighbors || []).forEach(o => {
    if (byId[o] && o !== c.id) { nb[c.id].add(o); nb[o].add(c.id); }
  }));
  const ferry = Object.create(null);
  (geo.ferries || []).forEach(f => {
    if (!byId[f.a] || !byId[f.b] || f.a === f.b) return;
    [[f.a, f.b], [f.b, f.a]].forEach(([x, y]) => {
      const k = x + "|" + y;
      if (!ferry[k] || ferry[k].km > f.km) ferry[k] = f;
    });
  });
  return { list, byId, nb, ferry, home: geo.home, _dist: new Map(), _edge: new Map() };
}

function distKm(W, a, b) {
  const k = a < b ? a + "|" + b : b + "|" + a;
  let d = W._dist.get(k);
  if (d === undefined) {
    const A = W.byId[a], B = W.byId[b];
    d = haversineKm(A.lat, A.lon, B.lat, B.lon);
    W._dist.set(k, d);
  }
  return d;
}

/* Все способы добраться из from в to (без проверки «посещена/закрыта»). */
function moveOptions(W, from, to) {
  const out = [];
  if (from === to || !W.byId[to] || !W.byId[from]) return out;
  const dest = W.byId[to];
  const km = distKm(W, from, to);
  if (W.nb[from].has(to)) out.push({ type: "bus", to, cost: dest.huge ? RULES.busHuge : RULES.bus, days: dest.huge ? RULES.busHugeDays : RULES.busDays, km: Math.round(km) });
  const f = W.ferry[from + "|" + to];
  if (f) out.push({ type: "ferry", to, cost: RULES.ferryBase + Math.round(RULES.ferryKm * f.km), days: RULES.ferryDays, km: f.km, label: f.label || "" });
  if (km <= RULES.flightMaxKm) out.push({ type: "plane", to, cost: RULES.flightBase + Math.round(RULES.flightKm * km), days: RULES.flightDays, km: Math.round(km) });
  return out;
}

function bestEdge(W, from, to) {
  const k = from + ">" + to;
  if (W._edge.has(k)) return W._edge.get(k);
  let best = null;
  for (const o of moveOptions(W, from, to)) if (!best || o.cost < best.cost || (o.cost === best.cost && o.days < best.days)) best = o;
  W._edge.set(k, best);
  return best;
}

/* Можно ли въехать в страну: не текущая, не посещена, не закрыта; дом — только финальным ходом. */
function canEnter(W, run, to) {
  if (!W.byId[to] || to === run.cur) return false;
  if (run.start && to === run.start) return false;          // маршрут дня: в стартовую страну не возвращаемся
  if (to === W.home) return run.cur !== W.home;
  return !run.visited.includes(to) && !run.closed.includes(to);
}

function whyNot(W, run, to) {
  if (!W.byId[to]) return "Эта территория в игре не участвует";
  if (to === run.cur) return "Вы здесь";
  if (to === W.home && run.cur === W.home) return "Это дом. Вернуться сюда можно только в конце пути";
  if (run.start && to === run.start) return "Отсюда начался маршрут";
  if (run.visited.includes(to)) return "Уже посещена";
  if (run.closed.includes(to)) return "Закрыта: здесь вас развернули на границе";
  if (!moveOptions(W, run.cur, to).length) return "Нет прямого рейса — дальше 5 000 км";
  return "";
}

/* Список ходов: группы автобус → паром → самолёт, внутри по цене. ok=false — не хватает денег или дней. */
function listMoves(W, run) {
  const res = [];
  for (const c of W.list) {
    if (!canEnter(W, run, c.id)) continue;
    for (const o0 of moveOptions(W, run.cur, c.id)) {
      const o = applyEffects(run, o0);
      o.home = c.id === W.home;
      o.noMoney = o.cost > run.money;
      o.noTime = o.home ? o.days > run.daysLeft : o.days >= run.daysLeft;
      o.ok = !o.noMoney && !o.noTime;
      res.push(o);
    }
  }
  const order = { bus: 0, ferry: 1, plane: 2 };
  res.sort((a, b) => order[a.type] - order[b.type] || a.cost - b.cost || a.days - b.days);
  return res;
}

/* Активные дорожные эффекты меняют цену/срок ближайшего хода (исходные значения — в o.base, пометки — в o.mods). */
function applyEffects(run, o) {
  const fx = run.effects || [], m = Object.assign({}, o), notes = [];
  if (fx.includes("storm") && o.type === "ferry") { m.days += 2; notes.push("шторм +2 дн."); }
  if (fx.includes("strike") && o.type === "plane") { m.cost = Math.round(m.cost * 1.5); notes.push("забастовка +50%"); }
  if (fx.includes("hot")) { m.cost = Math.round(m.cost * 0.7); notes.push("−30%"); }
  if (notes.length) { m.base = { cost: o.cost, days: o.days }; m.mods = notes; }
  return m;
}

/* Дейкстра: самый дешёвый путь домой через непосещённые страны. Ребро = самый дешёвый транспорт. */
function cheapestHome(W, run) {
  const home = W.home, cur = run.cur;
  const blocked = new Set(run.visited.concat(run.closed, [cur]));
  const nodes = W.list.map(c => c.id).filter(id => id === home || !blocked.has(id));
  const dist = new Map(), days = new Map(), prev = new Map(), done = new Set();
  for (const id of nodes) {
    if (id === home && cur === home) continue;
    const e = bestEdge(W, cur, id);
    if (e) { dist.set(id, e.cost); days.set(id, e.days); prev.set(id, cur); }
  }
  for (;;) {
    let u = null, best = Infinity;
    for (const [id, d] of dist) if (!done.has(id) && d < best) { best = d; u = id; }
    if (u === null) return null;
    if (u === home) break;
    done.add(u);
    for (const v of nodes) {
      if (v === u || done.has(v)) continue;
      const e = bestEdge(W, u, v);
      if (!e) continue;
      const nd = best + e.cost, ndays = days.get(u) + e.days, old = dist.get(v);
      if (old === undefined || nd < old || (nd === old && ndays < days.get(v))) { dist.set(v, nd); days.set(v, ndays); prev.set(v, u); }
    }
  }
  const path = [home];
  let p = home, guard = 0;
  while (p !== cur && guard++ < 1000) { p = prev.get(p); path.unshift(p); }
  return { cost: dist.get(home), days: days.get(home), path };
}

/* Случайность с сидом (для повторяемых тестов). */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
/* Кандидаты в «неправильные» варианты: сначала тот же континент, потом остальные. */
function distractorPool(W, refContinent, rng, filter) {
  const same = [], other = [];
  for (const c of W.list) { if (!filter(c)) continue; (c.continent === refContinent ? same : other).push(c); }
  return shuffle(same, rng).concat(shuffle(other, rng));
}
/* Вопрос с вариантами-странами (флаг, силуэт, сосед, «чья это столица»). */
function countryOptions(W, answer, ref, rng, filter) {
  const opts = [answer], names = new Set([answer.name]);
  for (const c of distractorPool(W, ref.continent, rng, c => c.id !== answer.id && c.id !== ref.id && filter(c))) {
    if (opts.length >= 4) break;
    if (names.has(c.name)) continue;

  if (EMOJI_OK && /^[A-Z]{2}$/.test(iso) && iso !== "XK") return '<span class="flag emoji ' + size + '" aria-hidden="true">' + String.fromCodePoint(0x1F1E6 + iso.charCodeAt(0) - 65, 0x1F1E6 + iso.charCodeAt(1) - 65) + "</span>";
  return '<span class="flag badge ' + size + '" aria-hidden="true">' + esc(iso) + "</span>";
}

/* ===================================================================
   Карта: Canvas 2D, мировые единицы jsvectormap (900 × 440.7), оборот по долготе
   =================================================================== */
const MAP = { ok: false, P: Object.assign({}, MAP_P), MW: MAP_P.MW, MH: MAP_P.MH, shapes: Object.create(null), extra: [], pos: Object.create(null) };
const cv = () => $("map");
let ctx = null, dpr = 1, VW = 300, VH = 300;
const cam = { x: 450, y: 150, z: 2 };
let T = {};                       // цвета из токенов
let grainPat = null, hatchCanvas = null;
let hitCtx = null;
let anim = null;                  // анимация переезда
let camAnim = null;               // плавный перелёт камеры
let rafId = 0;

function loadMap() {
  const wm = window.WORLD_MAP;
  MAP.ok = false;
  if (wm && wm.paths) {
    try {
      const ins = wm.insets && wm.insets[0];
      if (ins && ins.bbox && ins.bbox.length === 2) {
        MAP.P = Object.assign({}, MAP_P, { X0: ins.bbox[0].x, Y0: ins.bbox[0].y, X1: ins.bbox[1].x, Y1: ins.bbox[1].y, MW: ins.width || MAP_P.MW, MH: ins.height || MAP_P.MH });
      }
      MAP.MW = MAP.P.MW; MAP.MH = MAP.P.MH;
      for (const key of Object.keys(wm.paths)) {
        const d = wm.paths[key] && wm.paths[key].path;
        if (!d) continue;
        const info = shapeInfo(parsePath(d));
        if (!info) continue;
        info.p2d = new Path2D(d);
        const id = key === "_1" ? "xk" : key.toLowerCase();
        if (W.byId[id] && !key.startsWith("_") || id === "xk" && W.byId.xk) { info.id = id; MAP.shapes[id] = info; }
        else MAP.extra.push(info);
      }
      MAP.ok = Object.keys(MAP.shapes).length > 0;
    } catch (e) { MAP.ok = false; }
  }
  for (const c of W.list) MAP.pos[c.id] = proj(c.lon, c.lat, MAP.P);
}
const hasShape = id => !!(MAP.ok && MAP.shapes[id]);
const labelPos = id => (hasShape(id) ? MAP.shapes[id].ctr : MAP.pos[id]);

function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  T = { fg: g("--fg"), paper: g("--paper"), red: g("--red"),
    sea: g("--map-sea"), seaEdge: g("--map-sea-edge"), grat: g("--map-grat"), border: g("--map-border"), neutral: g("--map-neutral"),
    pal: [1, 2, 3, 4, 5, 6, 7, 8].map(i => g("--map-c" + i)), ink: g("--map-ink"), halo: g("--map-halo"), route: g("--map-route"), glow: g("--map-glow"),
    fMap: g("--f-map"), fBody: g("--f-body") };
  // зерно бумаги для океана: процедурный шум
  const n = document.createElement("canvas"); n.width = n.height = 180;
  const nx = n.getContext("2d");
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2200; i++) { nx.fillStyle = rnd() < .5 ? T.grat : T.seaEdge; nx.globalAlpha = 0.03 + rnd() * 0.06; nx.fillRect(rnd() * 180, rnd() * 180, 1, 1); }
  nx.strokeStyle = T.grat; nx.lineWidth = 0.5;
  for (let i = 0; i < 18; i++) { nx.globalAlpha = 0.035; nx.beginPath(); const x = rnd() * 180, y = rnd() * 180; nx.moveTo(x, y); nx.quadraticCurveTo(x + rnd() * 24 - 12, y + rnd() * 24 - 12, x + rnd() * 36 - 18, y + rnd() * 36 - 18); nx.stroke(); }
  grainPat = ctx ? ctx.createPattern(n, "repeat") : null;
  // штриховка посещённых стран — «красный карандаш» поверх собственного тона
  hatchCanvas = document.createElement("canvas"); hatchCanvas.width = hatchCanvas.height = 7;
  const hx = hatchCanvas.getContext("2d");
  hx.strokeStyle = T.route; hx.globalAlpha = 0.75; hx.lineWidth = 1.2;
  hx.beginPath(); hx.moveTo(-1, 8); hx.lineTo(8, -1); hx.moveTo(-1, 1); hx.lineTo(1, -1); hx.moveTo(6, 8); hx.lineTo(8, 6); hx.stroke();
}
let COLORS = {};
const landColor = id => T.pal[(COLORS[id] || 0) % T.pal.length];

function zMin() { return Math.max(VH / MAP.MH, VW / MAP.MW * 0.5, 0.2); }
const Z_MAX = 60;
function clampCam() {
  cam.z = Math.min(Z_MAX, Math.max(zMin(), cam.z));
  cam.x = ((cam.x % MAP.MW) + MAP.MW) % MAP.MW;
  const half = VH / 2 / cam.z;
  if (MAP.MH * cam.z <= VH) cam.y = MAP.MH / 2;
  else cam.y = Math.min(MAP.MH - half, Math.max(half, cam.y));
}
const toScreen = (mx, my) => [(mx - cam.x) * cam.z + VW / 2, (my - cam.y) * cam.z + VH / 2];
const toMap = (sx, sy) => [(sx - VW / 2) / cam.z + cam.x, (sy - VH / 2) / cam.z + cam.y];
const wrapNear = (x, ref) => x + MAP.MW * Math.round((ref - x) / MAP.MW);

function resize() {
  const c = cv(); if (!c) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  VW = Math.max(1, c.clientWidth); VH = Math.max(1, c.clientHeight);
  c.width = Math.round(VW * dpr); c.height = Math.round(VH * dpr);
  clampCam(); requestDraw();
}
function requestDraw() { if (!rafId) rafId = requestAnimationFrame(frame); }

/* Состояние страны для раскраски */
function countryState(id) {
  if (!run) return "idle";
  if (id === run.cur) return "cur";
  if (run.visited.includes(id)) return "visited";
  if (run.closed.includes(id)) return "closed";
  if (run.status === "play" && W.nb[run.cur] && W.nb[run.cur].has(id) && canEnter(W, run, id)) return "reach";
  return "idle";
}

/* Контрольная точка дуги маршрута (единая для анимации и нарисованного пути). */
function legCurve(a, b, type) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
  const k = type === "plane" ? 0.22 : type === "ferry" ? 0.12 : 0.06;
  let nx = -dy / len, ny = dx / len;
  if (ny > 0) { nx = -nx; ny = -ny; }       // выгибаем дугу к северу

const bez = (a, c, b, t) => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];

function legPoints(leg) {
  const a = MAP.pos[leg.from].slice();
  const b = MAP.pos[leg.to].slice();
  b[0] = wrapNear(b[0], a[0]);
  // Паром между Америкой и Азией/Россией/Океанией идёт через Тихий океан (шов карты), а не через Атлантику.
  if (leg.type === "ferry") {
    const amer = c => /Америка/.test(c.continent), A = W.byId[leg.from], B = W.byId[leg.to];
    const pac = c => !amer(c) && (c.continent === "Азия" || c.continent === "Океания" || c.huge);   // огромные (Россия) — через Берингов пролив
    if ((amer(A) && pac(B)) || (amer(B) && pac(A))) {
      const eastward = amer(B);                       // из Азии в Америку — на восток
      if (eastward && b[0] < a[0]) b[0] += MAP.MW;
      if (!eastward && b[0] > a[0]) b[0] -= MAP.MW;
    }
  }
  return [a, legCurve(a, b, leg.type), b];
}

function frame(now) {
  rafId = 0;
  if (anim) stepAnim(now);
  if (camAnim) stepCamAnim(now);
  draw();
  if (anim || camAnim) requestDraw();
}

function draw() {
  if (!ctx) return;
  const z = cam.z, MW = MAP.MW;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // океан: заливка, зерно, виньетка (всё — до суши, так что ложится только на воду)
  ctx.fillStyle = T.sea; ctx.fillRect(0, 0, VW, VH);
  if (grainPat) { ctx.fillStyle = grainPat; ctx.fillRect(0, 0, VW, VH); }
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.hypot(VW, VH) * 0.62);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, T.seaEdge);
  ctx.globalAlpha = 0.7; ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1;
  const viewL = cam.x - VW / 2 / z, viewR = cam.x + VW / 2 / z, viewT = cam.y - VH / 2 / z, viewB = cam.y + VH / 2 / z;
  const k0 = Math.floor(viewL / MW), k1 = Math.floor(viewR / MW);
  const setT = off => ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * ((off - cam.x) * z + VW / 2), dpr * (VH / 2 - cam.y * z));

  // градусная сетка (каждые 20°), едва заметная
  ctx.save();
  ctx.strokeStyle = T.grat; ctx.globalAlpha = 0.09; ctx.lineWidth = 0.7;
  ctx.beginPath();
  for (let lat = -40; lat <= 80; lat += 20) { const y = toScreen(0, proj(0, lat, MAP.P)[1])[1]; if (y > -2 && y < VH + 2) { ctx.moveTo(0, y); ctx.lineTo(VW, y); } }
  const lonStep = MW / 18, x0 = proj(-180 + 1e-9, 0, MAP.P)[0];
  for (let x = x0 + Math.floor((viewL - x0) / lonStep) * lonStep; x <= viewR; x += lonStep) { const sx = toScreen(x, 0)[0]; ctx.moveTo(sx, 0); ctx.lineTo(sx, VH); }
  ctx.stroke(); ctx.restore();

  const hatch = hatchCanvas ? ctx.createPattern(hatchCanvas, "repeat") : null;
  if (hatch && hatch.setTransform) hatch.setTransform(new DOMMatrix().scale(1 / z));
  const curShape = run && hasShape(run.cur) ? MAP.shapes[run.cur] : null;
  const px = 1 / z;                          // 1 экранный пиксель в единицах карты

  for (let k = k0; k <= k1; k++) {
    const off = k * MW;
    setT(off);
    const vis = b => b[2] + off >= viewL && b[0] + off <= viewR && b[3] >= viewT && b[1] <= viewB;
    const all = [];
    for (const s of MAP.extra) if (vis(s.bbox)) all.push(s);
    if (MAP.ok) for (const id in MAP.shapes) if (vis(MAP.shapes[id].bbox)) all.push(MAP.shapes[id]);
    ctx.lineJoin = "round";
    // 1) толстый тёмный контур под всеми странами → после заливки остаётся только у берега
    ctx.strokeStyle = T.border; ctx.lineWidth = 2 * px;
    for (const s of all) ctx.stroke(s.p2d);
    // 2) заливка
    for (const s of all) {
      if (!s.id) { ctx.fillStyle = T.neutral; ctx.fill(s.p2d); continue; }
      const st = countryState(s.id);
      ctx.fillStyle = landColor(s.id); ctx.fill(s.p2d);
      if (st === "visited" || (st === "cur" && run.cur !== W.home)) {
        ctx.globalAlpha = 0.28; ctx.fillStyle = T.route; ctx.fill(s.p2d); ctx.globalAlpha = 1;
        if (hatch) { ctx.fillStyle = hatch; ctx.fill(s.p2d); }
      } else if (st === "closed") { ctx.globalAlpha = 0.55; ctx.fillStyle = T.halo; ctx.fill(s.p2d); ctx.globalAlpha = 1; }
      else if (st === "reach") { ctx.globalAlpha = 0.16; ctx.fillStyle = T.glow; ctx.fill(s.p2d); ctx.globalAlpha = 1; }
    }
    // 3) тонкие границы
    ctx.strokeStyle = T.border; ctx.lineWidth = 0.8 * px;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawLabels(k0, k1);
  drawMarkers(k0, k1);
}

/* Красный карандашный маршрут. Каждая нога рисуется во всех копиях мира, попадающих в кадр (k0..k1). */
function drawRoute(k0, k1) {
  if (!run) return;
  const z = cam.z;
  const legs = run.legs.slice();
  if (anim && anim.leg) legs.push(Object.assign({ partial: anim.t }, anim.leg));
  if (!legs.length) return;
  ctx.save();
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (VW / 2 - cam.x * z), dpr * (VH / 2 - cam.y * z));
  ctx.strokeStyle = T.route; ctx.lineWidth = 2.2 / z; ctx.setLineDash([7 / z, 5 / z]); ctx.lineCap = "round";
  ctx.beginPath();
  for (const leg of legs) {
    const [A, C, B] = legPoints(leg);
    for (let k = k0 - 1; k <= k1 + 1; k++) {
      const s = k * MAP.MW;
      ctx.moveTo(A[0] + s, A[1]);
      if (leg.partial != null) {
        const N = 24;
        for (let i = 1; i <= N; i++) { const p = bez(A, C, B, leg.partial * i / N); ctx.lineTo(p[0] + s, p[1]); }
      } else ctx.quadraticCurveTo(C[0] + s, C[1], B[0] + s, B[1]);
    }
  }
  ctx.stroke();
  ctx.restore();
}

function drawHouse(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = T.ink; ctx.strokeStyle = T.halo; ctx.lineWidth = 1.6; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(-s, -s * 0.1); ctx.lineTo(0, -s * 1.05); ctx.lineTo(s, -s * 0.1); ctx.lineTo(s * 0.75, -s * 0.1); ctx.lineTo(s * 0.75, s * 0.8); ctx.lineTo(-s * 0.75, s * 0.8); ctx.lineTo(-s * 0.75, -s * 0.1); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = T.route; ctx.fillRect(-s * 0.22, s * 0.25, s * 0.44, s * 0.55);
  ctx.restore();
}

function eachCopy(mx, k0, k1, fn) { for (let k = k0; k <= k1; k++) { const s = toScreen(mx + k * MAP.MW, 0)[0]; if (s > -40 && s < VW + 40) fn(s); } }

function drawMarkers(k0, k1) {
  // страны без контура (микрогосударства или карта не загрузилась) — кружки у столиц
  for (const c of W.list) {
    if (hasShape(c.id)) continue;
    const [mx, my] = MAP.pos[c.id];
    const sy = toScreen(0, my)[1]; if (sy < -20 || sy > VH + 20) continue;
    const st = countryState(c.id);
    eachCopy(mx, k0 - 1, k1 + 1, sx => {
      ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2);
      ctx.fillStyle = landColor(c.id); ctx.fill();
      if (st === "visited" || st === "cur") { ctx.globalAlpha = .5; ctx.fillStyle = T.route; ctx.fill(); ctx.globalAlpha = 1; }
      if (st === "closed") { ctx.globalAlpha = .6; ctx.fillStyle = T.halo; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.lineWidth = st === "cur" ? 2.5 : 1.2; ctx.strokeStyle = st === "cur" ? T.glow : T.border; ctx.stroke();
    });
  }
  if (!run) return;
  // посещённые столицы — точки на маршруте
  ctx.fillStyle = T.route;
  for (const id of run.visited) {
    const [mx, my] = MAP.pos[id]; const sy = toScreen(0, my)[1];
    eachCopy(mx, k0 - 1, k1 + 1, sx => { ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, Math.PI * 2); ctx.fill(); });
  }
  // дом
  const hp = MAP.pos[W.home];
  if (hp) { const sy = toScreen(0, hp[1])[1]; eachCopy(hp[0], k0 - 1, k1 + 1, sx => drawHouse(sx, sy - 4, 8)); }
  // текущая точка — булавка (во время переезда её заменяет транспорт)
  if (!anim && run.cur !== W.home) {
    const [mx, my] = MAP.pos[run.cur]; const sy = toScreen(0, my)[1];
    eachCopy(mx, k0 - 1, k1 + 1, sx => {
      ctx.save(); ctx.fillStyle = T.route; ctx.strokeStyle = T.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy - 14, 7, Math.PI * 0.85, Math.PI * 0.15); ctx.lineTo(sx, sy); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle = T.ink; ctx.arc(sx, sy - 14, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });

/* Порядок подписей: по площади (крупные первыми). Считается один раз после загрузки карты. */
let LABEL_ORDER = [];
function buildLabelOrder() {
  const area = id => (hasShape(id) ? (MAP.shapes[id].lbbox[2] - MAP.shapes[id].lbbox[0]) * (MAP.shapes[id].lbbox[3] - MAP.shapes[id].lbbox[1]) : 0);
  LABEL_ORDER = W.list.map(c => c.id).sort((a, b) => area(b) - area(a));
}
function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
  ctx.lineWidth = 2; ctx.strokeStyle = T.halo; ctx.stroke(); ctx.fillStyle = T.ink; ctx.fill();
}
/* Подписи стран (капителью, размер — по ширине страны на экране) и столиц (звезда + имя). */
function drawLabels(k0, k1) {
  const z = cam.z, boxes = [];
  const hit = b => boxes.some(o => o[0] < b[2] && o[2] > b[0] && o[1] < b[3] && o[3] > b[1]);
  const inView = b => !(b[2] < 0 || b[0] > VW || b[3] < 0 || b[1] > VH);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const cur = run && run.cur;
  const placed = new Set();
  // 1) страны
  for (const id of LABEL_ORDER) {
    const c = W.byId[id], s = hasShape(id) ? MAP.shapes[id] : null;
    if (!s) continue;
    const name = c.name.toUpperCase();
    const wPx = (s.lbbox[2] - s.lbbox[0]) * z, hPx = (s.lbbox[3] - s.lbbox[1]) * z;
    const spacing = 0.12;
    let fs = Math.min(26, wPx * 0.7 / (name.length * (0.72 + spacing)), hPx * 0.45);
    if (fs < 10) { if (id !== cur) continue; fs = 10; }
    ctx.font = "700 " + fs.toFixed(1) + "px " + T.fMap;
    try { ctx.letterSpacing = (fs * spacing).toFixed(1) + "px"; } catch (e) {}
    const w = ctx.measureText(name).width;
    const [mx, my] = s.ctr, sy = toScreen(0, my)[1];
    eachCopy(mx, k0, k1, sx => {
      const box = [sx - w / 2 - 2, sy - fs * 0.62, sx + w / 2 + 2, sy + fs * 0.62];
      if (box[0] < 4 || box[2] > VW - 4 || box[1] < 0 || box[3] > VH || hit(box)) return;
      boxes.push(box); placed.add(id);
      ctx.lineWidth = Math.max(2.5, fs * 0.22); ctx.strokeStyle = T.halo; ctx.strokeText(name, sx, sy);
      ctx.fillStyle = T.ink; ctx.fillText(name, sx, sy);
    });
  }
  try { ctx.letterSpacing = "0px"; } catch (e) {}
  // 2) столицы: звезда на средних масштабах, имя — если есть место
  if (z < 2.2) return;
  const capFs = 11;
  ctx.font = capFs + "px " + T.fBody;
  for (const id of LABEL_ORDER) {
    const c = W.byId[id], s = hasShape(id) ? MAP.shapes[id] : null;
    const shown = placed.has(id);
    if (s && !shown && z < 5) continue;                   // у мелких стран звезда — только вблизи
    if (!s && z < 4 && id !== cur) continue;
    const [mx, my] = MAP.pos[id], sy = toScreen(0, my)[1];
    const label = s ? c.capital : c.name;                 // для микрогосударств — имя страны
    const w = ctx.measureText(label).width;
    eachCopy(mx, k0, k1, sx => {
      const star = [sx - 4, sy - 4, sx + 4, sy + 4];
      if (!inView(star) || hit(star)) return;           // звезда не налезает на подписи
      drawStar(sx, sy, 4.2);
      if (z < 3.2 && id !== cur) return;                   // одна звезда, без имени
      let box = [sx + 6, sy - 7, sx + 8 + w, sy + 7], tx = sx + 7;
      if (hit(box)) { box = [sx - 8 - w, sy - 7, sx - 6, sy + 7]; tx = sx - 7 - w; if (hit(box)) return; }
      boxes.push(box);
      ctx.textAlign = "left";
      ctx.lineWidth = 2.5; ctx.strokeStyle = T.halo; ctx.strokeText(label, tx, sy);
      ctx.fillStyle = T.ink; ctx.fillText(label, tx, sy);
      ctx.textAlign = "center";
    });
  }
}

/* ---- Попадание тапом ---- */
function hitTest(sx, sy) {
  const [mx0, my] = toMap(sx, sy);
  // 1) маленькие страны и точки: радиус 24 px вокруг столицы/центра
  let best = null, bd = 24;
  for (const c of W.list) {
    const s = hasShape(c.id) ? MAP.shapes[c.id] : null;
    if (s && Math.max(s.lbbox[2] - s.lbbox[0], s.lbbox[3] - s.lbbox[1]) * cam.z > 14) continue;
    const p = s ? s.ctr : MAP.pos[c.id];
    const px = wrapNear(p[0], mx0);
    const d = Math.hypot((px - mx0) * cam.z, (p[1] - my) * cam.z);
    if (d < bd) { bd = d; best = c.id; }
  }
  if (best) return best;
  if (!MAP.ok) return null;
  // 2) точное попадание в контур
  if (!hitCtx) hitCtx = document.createElement("canvas").getContext("2d");
  const mx = ((mx0 % MAP.MW) + MAP.MW) % MAP.MW;
  for (const id in MAP.shapes) {
    const s = MAP.shapes[id];
    for (const tx of [mx, mx - MAP.MW, mx + MAP.MW]) {
      if (tx < s.bbox[0] || tx > s.bbox[2] || my < s.bbox[1] || my > s.bbox[3]) continue;
      if (hitCtx.isPointInPath(s.p2d, tx, my)) return id;
    }
  }
  for (const s of MAP.extra) if (hitCtx.isPointInPath(s.p2d, mx, my)) return "";
  return null;
}

/* ---- Жесты: перетаскивание, щипок, колесо ---- */
const ptrs = new Map();
let drag = null, pinch = null;
function zoomAt(sx, sy, f) {
  const [mx, my] = toMap(sx, sy);
  cam.z = Math.min(Z_MAX, Math.max(zMin(), cam.z * f));
  cam.x = mx - (sx - VW / 2) / cam.z; cam.y = my - (sy - VH / 2) / cam.z;
  clampCam(); requestDraw();
}
function localXY(e) { const r = cv().getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function bindMap() {
  const c = cv();
  c.addEventListener("pointerdown", e => {
    if (anim) return;
    camAnim = null;
    try { c.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, localXY(e));
    if (ptrs.size === 1) { const [x, y] = localXY(e); drag = { x, y, cx: cam.x, cy: cam.y, t: performance.now(), moved: false }; pinch = null; }
    else if (ptrs.size === 2) {
      const [a, b] = Array.from(ptrs.values());
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z: cam.z, m: toMap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2) };
      if (drag) drag.moved = true;
    }
  });
  c.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, localXY(e));
    if (pinch && ptrs.size >= 2) {
      const [a, b] = Array.from(ptrs.values());
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      cam.z = Math.min(Z_MAX, Math.max(zMin(), pinch.z * d / pinch.d));
      cam.x = pinch.m[0] - (mid[0] - VW / 2) / cam.z; cam.y = pinch.m[1] - (mid[1] - VH / 2) / cam.z;
      clampCam(); requestDraw();
    } else if (drag) {
      const [x, y] = localXY(e);
      if (Math.hypot(x - drag.x, y - drag.y) > 7) drag.moved = true;
      if (drag.moved) { cam.x = drag.cx - (x - drag.x) / cam.z; cam.y = drag.cy - (y - drag.y) / cam.z; clampCam(); requestDraw(); }
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (drag && !drag.moved && ptrs.size === 0 && e.type === "pointerup" && performance.now() - drag.t < 600) {
      const [x, y] = localXY(e); onMapTap(x, y);
    }
    if (ptrs.size === 0) { drag = null; pinch = null; }
    else if (ptrs.size === 1) { const [p] = Array.from(ptrs.values()); drag = { x: p[0], y: p[1], cx: cam.x, cy: cam.y, t: 0, moved: true }; pinch = null; }
  };
  c.addEventListener("pointerup", up);
  c.addEventListener("pointercancel", up);
  c.addEventListener("wheel", e => { e.preventDefault(); if (anim) return; const [x, y] = localXY(e); zoomAt(x, y, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
}

/* Плавно подвести камеру к точке */
function flyTo(mx, my, z, ms) {
  const tx = wrapNear(mx, cam.x);
  if (REDUCED || !ms) { cam.x = tx; cam.y = my; cam.z = z; clampCam(); requestDraw(); return; }
  camAnim = { t0: performance.now(), ms, from: { x: cam.x, y: cam.y, z: cam.z }, to: { x: tx, y: my, z } };
  requestDraw();
}
function stepCamAnim(now) {
  const a = camAnim, t = Math.min(1, (now - a.t0) / a.ms), e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  cam.x = a.from.x + (a.to.x - a.from.x) * e; cam.y = a.from.y + (a.to.y - a.from.y) * e;
  cam.z = Math.exp(Math.log(a.from.z) + (Math.log(a.to.z) - Math.log(a.from.z)) * e);
  clampCam();
  if (t >= 1) camAnim = null;
}
function zoomFor(id) {
  const s = hasShape(id) ? MAP.shapes[id] : null;
  const span = s ? Math.max(s.lbbox[2] - s.lbbox[0], (s.lbbox[3] - s.lbbox[1]) * 1.3, 6) : (W.byId[id] && W.byId[id].huge ? 70 : MAP.ok ? 10 : 30);
  return Math.min(Z_MAX, Math.max(zMin(), Math.min(VW, VH) * 0.42 / span, Math.min(VW, VH) / 140));
}
/* Камера на страну: центр — столица (там стоит игрок), масштаб — по размеру страны (для огромных стран не мельче, чем нужно для соседей). */
function focusCountry(id, ms) {
  const p = MAP.pos[id], c = W.byId[id];
  const z = c && c.huge ? Math.max(zoomFor(id), Math.min(VW, VH) / 110) : zoomFor(id);
  flyTo(p[0], p[1], z, ms == null ? 600 : ms);
}

/* ===================================================================
   Анимация переезда: наклон 2.5D, отъезд камеры, движение по дуге
   =================================================================== */
function startTravel(leg, done) {
  const [a, c, b] = legPoints(leg);
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const kmish = len * 44;
  const dur = REDUCED ? 500 : Math.min(2500, 1500 + kmish / 6);
  const zEnd = zoomFor(leg.to);
  const zMid = Math.max(zMin(), Math.min(cam.z, zEnd, Math.min(VW, VH) * 0.55 / Math.max(len, 1)));
  anim = { leg, a, c, b, t: 0, t0: performance.now(), dur, z0: cam.z, zMid, zEnd, cam0: { x: wrapNear(cam.x, a[0]), y: cam.y }, done };
  const v = $("vehicle");
  v.querySelector(".v-body").innerHTML = SPRITE[leg.type];
  v.querySelector(".v-shadow").innerHTML = SPRITE[leg.type];
  v.hidden = false;
  if (!REDUCED) $("stage").classList.add("tilt");
  if (leg.type === "plane") whoosh();
  requestDraw();
}
function stepAnim(now) {
  const A = anim;
  const t = Math.min(1, (now - A.t0) / A.dur);
  const e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  A.t = e;
  const p = bez(A.a, A.c, A.b, e);
  const blend = Math.min(1, t / 0.18);
  cam.x = A.cam0.x + (p[0] - A.cam0.x) * blend;
  cam.y = A.cam0.y + (p[1] - A.cam0.y) * blend;
  const lz = t < .5 ? Math.log(A.z0) + (Math.log(A.zMid) - Math.log(A.z0)) * (t / .5) : Math.log(A.zMid) + (Math.log(A.zEnd) - Math.log(A.zMid)) * ((t - .5) / .5);
  cam.z = Math.exp(lz);
  clampCam();
  // направление движения
  const p2 = bez(A.a, A.c, A.b, Math.min(1, e + 0.02)), p1 = bez(A.a, A.c, A.b, Math.max(0, e - 0.02));
  const ang = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
  const alt = A.leg.type === "plane" ? Math.sin(Math.PI * t) : 0;
  const scale = 0.9 + alt * 0.55;
  const sh = 3 + alt * 22;
  const v = $("vehicle");
  v.querySelector(".v-body").style.transform = "translate(" + (-sh * 0.4) + "px," + (-sh) + "px) rotate(" + ang + "rad) scale(" + scale + ")";
  v.querySelector(".v-shadow").style.transform = "rotate(" + ang + "rad) scale(" + (0.9 + alt * 0.15) + ")";
  if (t > 0.72) $("stage").classList.remove("tilt");
  if (t >= 1) {
    const d = A.done;
    anim = null;
    v.hidden = true;
    $("stage").classList.remove("tilt");
    if (d) setTimeout(d, REDUCED ? 0 : 120);
  }
}

/* ===================================================================
   Звук (WebAudio): только после первого жеста пользователя
   =================================================================== */

  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);

}

let answering = false;
function onAnswer(key) {
  if (answering || !run || !run.border) return;
  const res = answerBorder(W, run, key);
  if (res.ignored) return;
  saveRun();
  if (res.correct) {
    answering = true;
    const btn = $("sheetBody").querySelector('[data-key="' + CSS.escape(key) + '"]');
    if (btn) btn.classList.add("right");
    setTimeout(() => {
      answering = false;
      if (res.passed) { closeSheet(); onArrived(res.leg, res.clean); }
      else renderBorder();
    }, REDUCED ? 150 : 420);
    return;
  }
  buzz();
  if (res.q) { notebookAdd(notebook, res.q.subject, res.q.kind); saveNotebook(); }
  if (res.turnedBack) {
    closeSheet(); updateHUD();
    const c = W.byId[res.leg.to];
    toast("Вас развернули. Граница «" + c.name + "» закрыта для этой поездки, билет пропал, ещё +1 день.", 4500);
    focusCountry(run.cur, 900);
    if (res.failed) return setTimeout(() => finish("fail"), 1200);
    setTimeout(checkStuck, 1000);
    return;
  }
  if (res.failed) { closeSheet(); return finish("fail"); }
  renderBorder({ key, cls: "shake" });
}

let stampDone = null;
/* Шаги после штампа выполняются по очереди: сувенир → событие → проверка «застрял». */
function chain(steps, done) { const s = steps.shift(); if (!s) { if (done) done(); return; } s(() => chain(steps, done)); }
/* Новые «витринные» звания (Коллекционер, Музей) — сразу при подборе сувенира */
function checkShelfAch() {
  if (!run || !diffOf(run).ach) return [];
  const got = shelfAchievements(shelf.length).filter(a => !passport.ach.includes(a));
  if (got.length) { passport.ach = passport.ach.concat(got); if (!passport.active) passport.active = got[0]; savePassport(); }
  return got;
}
let svDone = null, svTimer = 0;
function showSouvenir(id, next) {
  const el = $("svCard");
  el.innerHTML = svIcon(id) + "<div><small>Сувенир · " + esc(W.byId[id] ? W.byId[id].name : "") + "</small><b>" + esc(svName(id)) + "</b></div>";
  el.classList.remove("out"); el.hidden = false;
  const fin = () => {
    if (!svDone) return; svDone = null; clearTimeout(svTimer);
    el.classList.add("out");
    setTimeout(() => { el.hidden = true; el.classList.remove("out"); next(); }, REDUCED ? 0 : 240);
  };
  svDone = fin;
  svTimer = setTimeout(fin, 1200 + (REDUCED ? 0 : 400));
}
function onArrived(leg, clean) {
  if (!passport.stamps.includes(leg.to)) passport.stamps.push(leg.to);
  const post = arrivalOutcome(leg, clean);
  savePassport(); saveRun(); updateHUD();
  const fx = $("stampFx");
  fx.classList.remove("out");
  fx.innerHTML = stampSVG(W.byId[leg.to].name, gameDate());
  fx.hidden = false;
  setTimeout(thud, REDUCED ? 0 : 300);
  const finishStamp = () => {
    if (!stampDone) return; stampDone = null;
    fx.classList.add("out");
    setTimeout(() => { fx.hidden = true; fx.classList.remove("out"); chain(post, checkStuck); }, REDUCED ? 0 : 330);
  };
  stampDone = finishStamp;
  setTimeout(finishStamp, REDUCED ? 900 : 1600);
}
/* Что происходит после прохождения границы; возвращает шаги показа. */
function arrivalOutcome(leg, clean) {
  const steps = [];
  const out = afterBorder(W, run, shelf, clean, mulberry32((run.seed * 31 + run.quizN * 977 + 5) >>> 0));
  if (out.souvenir || out.eventSouvenir) saveShelf();
  const ach = checkShelfAch();
  if (out.souvenir) steps.push(next => showSouvenir(out.souvenir, next));
  if (out.event) steps.push(next => showEvent(next));
  if (ach.length) steps.push(next => { toast("Новое звание: " + ach.map(achTitle).join(", "), 3500); next(); });

}
/* Открытка с событием. Эффект уже применён; «Дальше» только закрывает её. */
let evNext = null;

/* ---- Финал ---- */
function finish(kind) {
  if (!run) return;
  if (kind === "sos") run.status = "sos";
  if (kind === "gaveup") run.status = "gaveup";
  if (kind === "fail") run.status = "fail";
  const r = run;
  const res = { kind, countries: r.visited.length, money: r.money, daysUsed: (r.days0 || RULES.days) - r.daysLeft, mistakes: r.mistakes, flights: r.flights, newAch: [], rank: -1, souvenirs: (r.souvenirs || []).length, diff: r.diff || "traveler" };
  if (kind === "win") {
    const got = checkAchievements(r);
    res.newAch = got.filter(a => !passport.ach.includes(a));
    passport.ach = passport.ach.concat(res.newAch);
    if (!passport.active && res.newAch.length) passport.active = res.newAch[0];
    savePassport();
    const d = res.diff;
    const rec = { name: playerName || "Путешественник", title: DIFF[d].ach ? passport.active || "" : "", countries: res.countries, money: res.money, daysUsed: res.daysUsed, date: new Date().toISOString().slice(0, 10), diff: d };
    if (r.mode === "daily") {
      const prev = LS.get(dailyKey(r.started), null);
      res.bestDay = betterDaily(prev, rec);
      if (res.bestDay) LS.set(dailyKey(r.started), Object.assign(rec, { from: r.start, to: r.target }));
    } else {
      const ins = insertRecord(records[d] || [], rec);
      records[d] = ins.list; res.rank = ins.rank; LS.set(recKey(d), records[d]);
    }
  }
  if (r.mode === "daily") res.daily = { date: r.started, from: r.start, to: r.target };
  lastResult = res;
  LS.del(slotOf(r));
  closeSheet();
  renderResult(); show("result");
}

    if (t.closed.length) html += '<p class="verdict">Закрыты: ' + t.closed.map(id => esc(W.byId[id].name)).join(", ") + ".</p>";
    html += '<div class="row-btns"><button class="btn primary" data-act="trainStart">Ещё</button><button class="btn" data-act="trainQuit">В меню</button></div></div>';
