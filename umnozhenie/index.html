<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Таблица умножения: Битва отрядов</title>
<style>
:root{
  --ink:#2b1b3d; --ink2:#5a4a73; --cream:#fff8e8; --white:#fff;
  --yellow:#ffd23f; --orange:#ff8a3d; --green:#43c463; --red:#ff4d5e; --blue:#3d8bff; --purple:#7b4dff; --pink:#ff6fb5;
  --bg:#2b1b5e; --shadow:0 4px 0 rgba(43,27,61,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#79c8ff}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}
.art{display:inline-block;line-height:0}
.art img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.ic{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center}
.ic svg{width:100%;height:100%}

/* кнопки */
.btn{min-height:60px;padding:10px 22px;border-radius:20px;font-weight:900;font-size:22px;background:var(--yellow);box-shadow:var(--shadow),inset 0 -5px 0 rgba(0,0,0,.12);border:3px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,27,61,.35)}
.btn.big{min-height:76px;font-size:30px;border-radius:26px;padding:10px 40px}
.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.gray{background:#e9e2f5}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-ic{width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.btn-ic:active{transform:translateY(3px)}
.btn-ic .ic{width:30px;height:30px}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:100%;width:100%;background:rgba(61,139,255,.45);transform-origin:left;animation:holdfill var(--d,1500ms) linear forwards}
@keyframes holdfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* старт */
#s-start{background:linear-gradient(#5fd0ff,#b9f0ff 45%,#9be86a 46%,#4fbf4a);align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#s-start.cov{background-color:#3f9a3a;background-repeat:no-repeat;background-size:100% auto,100% 100%;background-position:center 100px,0 0}
#s-start.cov .cast{visibility:hidden}
#s-start .logo{margin-top:6px;text-align:center;font-weight:900;line-height:1;color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink)}
#s-start .logo small{display:block;font-size:22px;letter-spacing:2px;margin-bottom:6px}
#s-start .logo b{display:block;font-size:50px}
#s-start .logo i{display:block;font-style:normal;font-size:26px;color:var(--yellow);margin-top:6px}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:0;height:200px;width:100%;position:relative}
.cast .art{width:132px;height:132px}
.cast .art.mid{width:156px;height:156px;z-index:2}
.cast .art.mon{transform:scaleX(1)}
.sbtns{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.srow{display:flex;gap:14px;align-items:center;justify-content:center}
.holdhint{font-size:12px;font-weight:700;color:var(--ink2);margin-top:-4px;text-align:center}

/* карта */
#s-map{background:linear-gradient(#7bd8ff,#c5f2ff)}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:30px;padding:4px 14px 4px 8px;font-weight:900;font-size:22px;min-height:44px}
.pill .ic{width:26px;height:26px}
.sp{flex:1}
#map-scroll{flex:1;overflow-y:auto;padding:0 0 40px;-webkit-overflow-scrolling:touch}
.world{margin:10px 12px 0;border-radius:26px;padding:12px 8px 18px;border:3px solid var(--ink);position:relative}
.world h2{margin:0 0 6px;text-align:center;font-size:22px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.world.soon{opacity:.85}
.lrow{display:flex;padding:0 34px;margin:4px 0}
.lnode{width:76px;height:76px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);box-shadow:var(--shadow);font-weight:900;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;position:relative}
.lnode:active{transform:translateY(3px)}
.lnode.boss{width:92px;height:92px;background:var(--red);color:#fff;font-size:34px}
.lnode.lock{background:#cfc6e0;color:#7a6c96}
.lnode.done{background:var(--green);color:#fff}
.lnode .stars{position:absolute;bottom:-14px;display:flex;gap:1px;left:50%;transform:translateX(-50%)}
.lnode .stars .ic{width:20px;height:20px}
.lnode .crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:34px;height:34px}
.lnode.cur{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.lnode small{font-size:11px;font-weight:700;margin-top:2px}

/* бой */
#s-battle{background:#1d1240}
.btop{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;flex:none;background:#2b1b5e;color:#fff}
.btop .ttl{flex:1;line-height:1.15}
.btop .ttl b{display:block;font-size:19px}
.btop .ttl span{font-size:13px;opacity:.85}
.combo{min-width:90px;text-align:center;font-weight:900;font-size:18px;color:var(--yellow);opacity:0;transition:opacity .2s}
.combo.on{opacity:1;animation:pop .25s}
.combo small{display:block;font-size:11px;color:#fff;opacity:.8}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage{position:relative;flex:1 1 auto;min-height:230px;overflow:hidden;background-size:cover;background-position:center 20%}
.stage .bgsvg{position:absolute;inset:0}
.stage .bgsvg svg{width:100%;height:100%;display:block}
.unit{position:absolute;width:150px;display:flex;flex-direction:column;align-items:center}
.unit .spr{width:130px;height:130px;position:relative;transition:transform .2s}
.unit .spr .art{width:100%;height:100%}
.unit::after{content:"";position:absolute;bottom:-4px;width:100px;height:20px;border-radius:50%;background:rgba(0,0,0,.28);z-index:0}
.unit .spr{z-index:1}
#b-enemy{right:6px;top:10px}
#b-hero{left:6px;bottom:6px}
#b-enemy.boss{width:190px}#b-enemy.boss .spr{width:170px;height:170px}
.nm{font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink);margin-bottom:2px;text-align:center;max-width:180px;line-height:1.05}
.unit .spr .mk{position:absolute;left:69%;top:14%;width:21%;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--red);z-index:3;line-height:1}
.hpbar{width:120px;height:14px;border-radius:9px;background:#3b2a50;border:3px solid var(--ink);overflow:hidden;margin-bottom:4px}
.hpbar i{display:block;height:100%;background:linear-gradient(#ff7a85,#ff3b4e);transition:width .35s}
#b-enemy.boss .hpbar{width:160px;height:18px}
.hearts{display:flex;gap:2px;margin-bottom:4px;justify-content:center;flex-wrap:wrap;max-width:150px}
.hearts .ic{width:24px;height:24px;filter:drop-shadow(0 2px 0 rgba(43,27,61,.6))}
.hearts .lost{opacity:.3;filter:grayscale(1)}
.atk-h{animation:atkh .55s}
.atk-e{animation:atke .55s}
@keyframes atkh{30%{transform:translate(50px,-36px) scale(1.1)}50%{transform:translate(100px,-70px) scale(1.15) rotate(8deg)}100%{transform:none}}
@keyframes atke{30%{transform:translate(-40px,30px) scale(1.1)}50%{transform:translate(-100px,70px) scale(1.15) rotate(-8deg)}100%{transform:none}}
.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.die{animation:die .5s forwards}
@keyframes die{to{transform:scale(.1) rotate(200deg);opacity:0}}
.enter{animation:enter .45s}
@keyframes enter{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
.fx{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;font-weight:900;font-size:30px;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);animation:fl .95s forwards;white-space:nowrap;transform:translateX(-50%)}
.float.crit{font-size:40px;color:var(--yellow)}
.float.bad{color:#ff8b95}
@keyframes fl{0%{transform:translate(-50%,10px) scale(.5);opacity:0}20%{transform:translate(-50%,0) scale(1.2);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:34px;color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink);pointer-events:none;opacity:0}
.banner small{display:block;font-size:18px;color:var(--yellow)}
.banner.on{animation:ban 1.3s}
@keyframes ban{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.stage.flash::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.7);animation:fade .35s forwards;pointer-events:none}
@keyframes fade{to{opacity:0}}
.timer{height:16px;background:#3b2a50;flex:none;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#43c463,#b6e84c);transform-origin:left}
.timer.low i{background:linear-gradient(90deg,#ff4d5e,#ff8a3d)}
.qbox{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;background:#2b1b5e;padding:8px 12px;min-height:88px;position:relative}
#b-q{font-weight:900;font-size:48px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);letter-spacing:1px;text-align:center}
#b-q.ok{color:#8dff9f}#b-q.bad{color:#ffd23f}
#b-hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:none;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:13px;padding:0}
#b-hint.on{display:flex}
#b-hint .ic{width:26px;height:26px}
.answers{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:#2b1b5e}
.ans{min-height:76px;border-radius:22px;font-size:38px;font-weight:900;color:#fff;border:3px solid var(--ink);box-shadow:var(--shadow),inset 0 -6px 0 rgba(0,0,0,.15);transition:transform .08s}
.ans:active{transform:translateY(3px)}
.ans:nth-child(1){background:var(--blue)}.ans:nth-child(2){background:var(--purple)}.ans:nth-child(3){background:var(--orange)}.ans:nth-child(4){background:var(--pink)}
.ans.right{background:var(--green)!important;animation:pop .3s}
.ans.wrong{background:var(--red)!important;animation:hit .4s}
.ans.gone{visibility:hidden}
.ans[disabled]{pointer-events:none}
.answers.three{grid-template-columns:1fr 1fr 1fr}
.answers.three .ans{min-height:84px;font-size:36px}

/* итог, герои, родители */
.panel{margin:auto 14px;background:var(--cream);border:4px solid var(--ink);border-radius:30px;padding:18px 16px;text-align:center;box-shadow:0 8px 0 rgba(43,27,61,.4)}
#s-result{background:linear-gradient(#ffd86b,#ff9d4d);justify-content:center}
#s-result h1{margin:0 0 4px;font-size:36px}
.rstars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.rstars .ic{width:78px;height:78px;transform:scale(0);opacity:.2}
.rstars .ic.on{animation:starin .5s forwards}
.rstars .ic.off{transform:scale(1);filter:grayscale(1) brightness(1.5);opacity:.45}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1);opacity:1}}
.rstat{font-size:17px;font-weight:700;color:var(--ink2);margin:4px 0}
.again{font-size:15px;margin:8px 0;padding:8px;background:#fff;border-radius:14px;font-weight:700}
.again b{display:block;color:var(--red)}
.newhero{margin:8px 0;padding:8px;background:var(--yellow);border-radius:16px;font-weight:900}
.rbtns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
#s-heroes,#s-parent{background:linear-gradient(#c9b6ff,#ffd9f0)}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 30px}
.hcard{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:10px;margin-bottom:12px;box-shadow:var(--shadow);min-height:100px}
.hcard.sel{background:#fff6c4;border-color:var(--orange)}
.hcard .art{width:84px;height:84px;flex:none}
.hcard.lockd .art{filter:grayscale(1) brightness(.6)}
.hcard h3{margin:0;font-size:20px}
.hcard p{margin:2px 0 6px;font-size:14px;color:var(--ink2);font-weight:700}
.hcard .btn{min-height:56px;font-size:18px;padding:6px 16px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:8px 0}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border-radius:5px;background:#e5e0ee;color:var(--ink2)}
.grid .h{background:none;font-size:13px;color:var(--ink)}
.grid .c0{background:#e5e0ee}.grid .cR{background:#ff6b78;color:#fff}.grid .cO{background:#ffa64d}.grid .cY{background:#ffe14d}.grid .cL{background:#a6e86b}.grid .cG{background:#43c463;color:#fff}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.tabs{display:flex;gap:8px;margin:6px 0}
.tabs .btn{flex:1;min-height:56px;font-size:18px}
.tabs .btn.act{background:var(--blue);color:#fff}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px}
.weak{display:flex;justify-content:space-between;font-weight:800;padding:6px 0;border-bottom:1px dashed #d4cce5;font-size:16px}
.weak:last-child{border:0}
.weak span{color:var(--ink2);font-weight:700;font-size:14px}
.note{font-size:13px;color:var(--ink2);font-weight:700}
/* пауза */
#pause{position:absolute;inset:0;background:rgba(20,10,50,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50}
#pause.on{display:flex}
#pause h2{color:#fff;font-size:38px;margin:0 0 6px}
#pause .btn{width:260px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s;z-index:60;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <section class="scr" id="s-start"></section>
  <section class="scr" id="s-map"></section>
  <section class="scr" id="s-battle">
    <div class="btop">
      <button class="btn-ic" id="b-pause" aria-label="Пауза"></button>
      <div class="ttl"><b id="b-title"></b><span id="b-sub"></span></div>
      <div class="combo" id="b-combo"></div>
    </div>
    <div class="stage" id="b-stage">
      <div class="bgsvg" id="b-bg"></div>
      <div class="unit" id="b-enemy"><div class="nm"></div><div class="hpbar"><i></i></div><div class="spr"></div></div>
      <div class="unit" id="b-hero"><div class="hearts"></div><div class="spr"></div></div>
      <div class="fx" id="b-fx"></div>
      <div class="banner" id="b-banner"></div>
    </div>
    <div class="timer" id="b-timerbox"><i id="b-timer"></i></div>
    <div class="qbox"><div id="b-q"></div><button id="b-hint" aria-label="Подсказка"></button></div>
    <div class="answers" id="b-ans"></div>
  </section>
  <section class="scr" id="s-result"></section>
  <section class="scr" id="s-heroes"></section>
  <section class="scr" id="s-parent"></section>
  <div id="pause"></div>
  <div id="toast"></div>
</div>

<script>
'use strict';

    h += '<div class="world" style="background:' + W.col + '"><h2>' + W.nm + '</h2>';
    LV.filter(function (l) { return l.w === wi; }).forEach(function (l) {
      var op = unlocked(l), st = SAVE.stars[l.n] || 0;
      h += '<div class="lrow" style="justify-content:' + aligns[l.j % 4] + '"><button class="lnode' + (l.boss ? ' boss' : '') + (!op ? ' lock' : '') + (st ? ' done' : '') + (l.n === curN && !st ? ' cur' : '') + '" data-n="' + l.n + '">' +
        (l.boss ? '<span class="crown">' + icon('crown', 34) + '</span>' : '') + (op ? l.n : icon('lock', 34)) + (op && l.boss ? '<small>БОСС</small>' : '') +
        (st ? '<span class="stars">' + starsRow(st, 20) + '</span>' : '') + '</button></div>';
    });
    h += '</div>';
  });
  h += '<div class="world soon" style="background:#8a7fb0"><h2>Космос и Вулкан — скоро!</h2><p class="note" style="text-align:center;color:#fff;margin:0">Столбцы ×8 и ×9, боссы и новые герои</p></div><div style="height:14px"></div></div>';
  var s = $('s-map'); s.innerHTML = h;
  $('mp-back').onclick = renderStart; $('mp-heroes').onclick = renderHeroes;
  s.querySelectorAll('.lnode').forEach(function (b) { b.onclick = function () { var n = Number(b.getAttribute('data-n')); if (!unlocked(LV[n - 1])) { toast('Сначала пройди предыдущий уровень'); return; } SFX.tap(); startLevel(n); }; });
  swapArt(s); show('s-map');
  var cur = s.querySelector('.cur') || s.querySelector('.lnode.done:last-of-type');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
}
function renderResult() {
  if (!B || !B.result) return;
  var r = B.result, lv = B.lv, next = LV[lv.n], s = $('s-result');
  var h = '<div class="panel"><h1>' + (r.won ? (lv.boss ? 'Босс побеждён!' : 'Победа!') : 'Не вышло…') + '</h1>';
  if (r.won) { h += '<div class="rstars">'; for (var i = 0; i < 3; i++) h += '<span class="ic art ' + (i < r.stars ? 'on' : 'off') + '" data-art="ic_star" style="width:78px;height:78px;' + (i < r.stars ? 'animation-delay:' + (i * .35 + .2) + 's' : '') + '"><svg viewBox="0 0 24 24">' + ICONS.star + '</svg></span>'; h += '</div>'; }
  else h += '<p class="rstat">Не страшно! Эти примеры теперь будут попадаться чаще.</p>';
  h += '<div class="rstat">Верно: ' + B.oks + ' · Ошибок: ' + B.errs + ' · Лучшее комбо: ×' + B.best + '</div>';
  if (B.errList.length) h += '<div class="again">Повторим:<b>' + B.errList.slice(0, 4).join('<br>') + '</b></div>';
  r.newHeroes.forEach(function (hh) { h += '<div class="newhero">Новый герой открыт: ' + hh.nm + '!</div>'; });
  h += '<div class="rbtns">';
  if (r.won && next && unlocked(next)) h += '<button class="btn green" id="rs-next">Дальше</button>';
  h += '<button class="btn ' + (r.won ? 'gray' : 'green') + '" id="rs-again">Ещё раз</button>';
  if (!r.won && PF.canReward()) h += '<button class="btn blue" id="rs-heart">+1 сердце за ролик</button>';
  h += '<button class="btn gray" id="rs-map">Карта</button></div></div>';
  s.innerHTML = h; swapArt(s); show('s-result');
  var lvn = lv.n;
  var nx = $('rs-next'); if (nx) nx.onclick = function () { PF.interstitial(function () { startLevel(lvn + 1); }); };
  $('rs-again').onclick = function () { startLevel(lvn); };
  $('rs-map').onclick = function () { PF.interstitial(renderMap); };
  var hb = $('rs-heart'); if (hb) hb.onclick = function () { PF.rewarded(function (ok) { if (ok) toast('Награда получена'); }); };
}
function renderHeroes() {
  var h = '<div class="topbar"><button class="btn-ic" id="he-back" aria-label="Назад">' + icon('back') + '</button><span class="pill">' + icon('star') + totalStars() + '</span></div><div class="scroll">';
  HEROES.forEach(function (hh) {
    var open = heroOpen(hh), sel = SAVE.hero === hh.id;
    h += '<div class="hcard' + (sel ? ' sel' : '') + (open ? '' : ' lockd') + '">' + art('hero_' + hh.id, heroSvg(hh.id)) + '<div style="flex:1"><h3>' + hh.nm + '</h3><p>' + hh.perk + '</p>' +
      (open ? '<button class="btn ' + (sel ? 'gray' : 'green') + '" data-h="' + hh.id + '">' + (sel ? 'Выбран' : 'Выбрать') + '</button>' : '<span class="pill" style="min-height:44px">' + icon('lock', 26) + ' нужно ' + hh.need + ' ' + icon('star', 22) + '</span>') + '</div></div>';
  });
  h += '</div>';
  var s = $('s-heroes'); s.innerHTML = h;
  $('he-back').onclick = renderStart;
  s.querySelectorAll('[data-h]').forEach(function (b) { b.onclick = function () { SAVE.hero = b.getAttribute('data-h'); save(); SFX.tap(); renderHeroes(); }; });
  swapArt(s); show('s-heroes');
}
var parTab = 'm';
function masteryClass(st) { if (!st) return 'c0'; if (st.x >= 4) return 'cG'; if (st.x === 3) return 'cL'; if (st.x === 2) return 'cY'; if (st.x === 1) return 'cO'; return st.w > 0 ? 'cR' : 'cY'; }
function renderParent() {
  var h = '<div class="topbar"><button class="btn-ic" id="pa-back" aria-label="Назад">' + icon('back') + '</button><b style="font-size:22px">Для родителей</b></div><div class="scroll">';
  var tot = SAVE.ans || 0, okc = SAVE.okc || 0;
  h += '<div class="card"><h3>Итого</h3><div class="note" style="font-size:16px;color:var(--ink)">Ответов: ' + tot + (tot ? ' · Верных: ' + Math.round(okc / tot * 100) + ' %' : '') + ' · Звёзд: ' + totalStars() + '</div></div>';
  h += '<div class="tabs"><button class="btn ' + (parTab === 'm' ? 'act' : '') + '" data-t="m">Умножение</button><button class="btn ' + (parTab === 'd' ? 'act' : '') + '" data-t="d">Деление</button></div>';
  h += '<div class="card"><h3>' + (parTab === 'm' ? 'Таблица умножения' : 'Деление (строка ÷ столбец)') + '</h3><div class="grid"><div class="h"></div>';
  for (var c = 2; c <= 10; c++) h += '<div class="h">' + c + '</div>';
  for (var r = 2; r <= 10; r++) {
    h += '<div class="h">' + r + '</div>';
    for (c = 2; c <= 10; c++) {
      var f = parTab === 'm' ? { o: 'm', a: r, b: c } : { o: 'd', a: c, b: r }, st = SAVE.stats[factKey(f)];
      h += '<div class="' + masteryClass(st) + '" data-k="' + factKey(f) + '">' + (st ? st.n : '') + '</div>';
    }
  }
  h += '</div><div class="legend"><span><i style="background:#e5e0ee"></i>не было</span><span><i style="background:#ff6b78"></i>западает</span><span><i style="background:#ffa64d"></i>учится</span><span><i style="background:#ffe14d"></i>почти</span><span><i style="background:#43c463"></i>выучено</span></div><div class="note" id="pa-info">Цифра в клетке — сколько раз встретился пример. Нажмите на клетку.</div></div>';
  var weak = [];
  for (var k in SAVE.stats) { var s = SAVE.stats[k]; if (s.w > 0 && s.x <= 2) weak.push(s); }
  weak.sort(function (a, b) { return (b.w - a.w) || (a.x - b.x); });
  h += '<div class="card"><h3>Что западает</h3>';
  if (!weak.length) h += '<div class="note">Пока нет ошибок. Играйте — здесь появятся примеры, которые вызывают трудности.</div>';
  weak.slice(0, 5).forEach(function (s) { h += '<div class="weak"><div>' + factFull(s) + '</div><span>ошибок ' + s.w + ' из ' + s.n + (s.t ? ' · ' + fmtT(s.t) : '') + '</span></div>'; });
  h += '</div><button class="btn red" id="pa-reset" style="width:100%">Сбросить прогресс</button></div>';
  var el = $('s-parent'); el.innerHTML = h;
  $('pa-back').onclick = renderStart;
  el.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { parTab = b.getAttribute('data-t'); renderParent(); }; });
  el.querySelectorAll('[data-k]').forEach(function (d) { d.onclick = function () { var st = SAVE.stats[d.getAttribute('data-k')]; $('pa-info').textContent = st ? factFull(st) + ': встретился ' + st.n + ' р., ошибок ' + st.w + (st.t ? ', ср. время ' + fmtT(st.t) : '') : 'Пока не встречался'; }; });
  $('pa-reset').onclick = function () { if (confirm('Сбросить все звёзды и статистику?')) { SAVE = freshSave(); save(); renderStart(); } };
  show('s-parent');
}

/* ===== Пауза и события ===== */
function openPause() {
  if (!B || B.phase === 'end' || B.paused) return; B.paused = true;
  var p = $('pause'); p.innerHTML = '<h2>Пауза</h2><button class="btn green" id="pz-go">Продолжить</button><button class="btn gray" id="pz-re">Заново</button><button class="btn gray" id="pz-map">На карту</button>';
  p.classList.add('on');
  $('pz-go').onclick = closePause;
  $('pz-re').onclick = function () { var n = B.lv.n; B.phase = 'end'; p.classList.remove('on'); startLevel(n); };
  $('pz-map').onclick = function () { B.phase = 'end'; B = null; renderMap(); };
}
function closePause() { $('pause').classList.remove('on'); if (B) { B.paused = false; B.lastTs = 0; } }
PF.onPause = function (on) { if (on && B && B.phase === 'ask') openPause(); };
document.addEventListener('visibilitychange', function () { if (document.hidden && curScreen === 's-battle') openPause(); });

function init() {
  loadSave();
  $('b-ans').addEventListener('click', onAnswerClick);
  $('b-pause').onclick = openPause;
  $('b-hint').onclick = function () {
    if (!B || B.phase !== 'ask' || B.hints <= 0 || B.hintUsedQ === B.qn) return;
    B.hints--; B.hintUsedQ = B.qn; $('b-hn').textContent = B.hints;
    var btns = $('b-ans').querySelectorAll('.ans'), wr = [];
    for (var i = 0; i < btns.length; i++) if (B.q.opts[i] !== B.q.ans) wr.push(btns[i]);
    shuffle(wr); wr.slice(0, Math.min(2, wr.length - 1)).forEach(function (b) { b.classList.add('gone'); b.disabled = true; });
    SFX.tap();
  };
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  PF.init().then(function () { loadSave(); renderStart(); PF.ready(); }, function () { renderStart(); });
}
window.__game = {
  get SAVE() { return SAVE; }, get B() { return B; }, LV: LV, WORLDS: WORLDS, startLevel: startLevel, resolve: resolve,
  makeOptions: makeOptions, buildPools: buildPools, factKey: factKey, renderParent: renderParent, renderMap: renderMap, save: save, nextQuestion: nextQuestion
};
init();
</script>
