<style>

<body>

<script>
/* ===== Премиум (общий модуль publish\shared\premium\premium.js, копия tools\premium.js, без правок) ===== */
/* Премиум: общий модуль для браузерных игр на Яндекс Играх.
   Платный Премиум на срок (30 дней или год), без автопродления: «используемая» покупка, срок считается по серверному
   времени Яндекса и хранится в облачных данных игрока. Подробно: README.md рядом с этим файлом.
   Модуль ничего не знает об игре: хранилище, звук и реклама подключаются через init() и несколько вызовов хозяина.
   Без SDK, без покупок или без созданных товаров в консоли кнопка и карточки скрыты, игра работает как раньше. */
window.Premium = (function () {
  "use strict";
  var DAY = 86400000;

  /* ---- Настройки: все числа и товары в одном месте ---- */
  var config = {
    adGapMs: 5 * 60 * 1000,     // интервал полноэкранной рекламы; хозяин читает его при показе (решение владельца 8 ноября: 5 минут)
    cardEvery: 3,               // карточка «Надоела реклама?» после каждой 3-й показанной полноэкранной рекламы
    remindDays: 3,              // напоминание о конце Премиума за столько дней и меньше (раз в сутки)
    pollMs: 60000,              // как часто сверять срок с серверным временем
    tokensKeep: 20,             // сколько токенов последних покупок помнить
    products: {                 // id товара в консоли Яндекса → срок
      premium_30: { days: 30 },
      premium_365: { days: 365 }
    },
    order: ["premium_30", "premium_365"],
    corner: true,               // кнопка «Премиум» в углу экрана
    zIndex: 50
  };

  /* ---- Тексты по умолчанию (нейтральные; не обещать отсутствие чужих блоков рекламы, платформа может показывать свои). Игра подставляет свои финальные тексты. Подмена: Premium.init({ texts: { ru: {...}, en: {...} } }) ---- */
  var TEXTS = {
    ru: {
      btn: "Премиум", btnOn: "Премиум · {0} д.", title: "Премиум",
      activeUntil: "Активен до {0}. Осталось {1}.",
      notActive: "Сейчас Премиум не включён.",
      perks: ["Полноэкранная реклама отключается.", "Награды за ролики выдаются сразу, без просмотра.", "Правила и сложность игры не меняются: Премиум не помогает выигрывать."],
      p30: "Премиум на 30 дней", p365: "Премиум на год",
      validTo: "Будет действовать до {0}", buy: "Купить", endBuy: "Купить Премиум", extend: "Продлить",
      note: "Один платёж, без автопродления: больше ничего не спишется. Если Премиум уже идёт, новый срок добавится к концу.",
      close: "Закрыть", later: "Не сейчас",
      adTitle: "Надоела реклама?", adText: "Премиум отключает полноэкранную рекламу, а награды за ролики выдаёт сразу. 30 дней за {0}, не продлевается сам.", adMore: "Узнать про Премиум",
      soonTitle: "Премиум скоро закончится", soonText: "Осталось {0}. Продлить?",
      endTitle: "Премиум закончился", endText: "Реклама вернулась. Можно включить Премиум снова.",
      busy: "Ждём подтверждения оплаты…", done: "Готово! Премиум активен до {0}.",
      fail: "Покупка не прошла. Деньги не списаны.", saveFail: "Оплата принята, но срок пока не сохранился. Не закрывайте игру, мы повторим при следующем запуске.",
      d1: "{0} день", d2: "{0} дня", d5: "{0} дней", free: "Ян", lang: "ru-RU"
    },
    en: {
      btn: "Premium", btnOn: "Premium · {0} d", title: "Premium",
      activeUntil: "Active until {0}. {1} left.",
      notActive: "Premium is not active.",
      perks: ["Full-screen ads are disabled.", "Rewards for videos are given instantly, no watching.", "The rules and difficulty stay the same: Premium does not help you win."],
      p30: "Premium for 30 days", p365: "Premium for a year",
      validTo: "Will be active until {0}", buy: "Buy", endBuy: "Buy Premium", extend: "Extend",
      note: "One payment, no auto-renewal: nothing else will be charged. If Premium is already running, the new period is added to the end.",
      close: "Close", later: "Not now",
      adTitle: "Tired of ads?", adText: "Premium removes full-screen ads and gives video rewards instantly. 30 days for {0}, no auto-renewal.", adMore: "About Premium",
      soonTitle: "Premium ends soon", soonText: "{0} left. Extend?",
      endTitle: "Premium has ended", endText: "Ads are back. You can turn Premium on again.",
      busy: "Waiting for payment confirmation…", done: "Done! Premium is active until {0}.",
      fail: "The purchase did not go through. You were not charged.", saveFail: "Payment accepted, but the period is not saved yet. Keep the game open, we will retry on the next start.",
      d1: "{0} day", d2: "{0} days", d5: "{0} days", free: "Yan", lang: "en-GB"
    }
  };

  /* ---- Состояние ---- */
  var sdk = null, payments = null, store = null;
  var lang = "ru", texts = TEXTS.ru;
  var catalog = {};                   // id → описание товара из консоли
  var st = blank();
  var off = 0;                        // запасная поправка серверного времени, если serverTime() недоступен
  var ready = false, canBuy = false, busy = false, chain = Promise.resolve();
  var listeners = [], pollTimer = 0, lastActive = false;
  var ui = { corner: null, ov: null, box: null, status: "", mode: "", style: null, lastFocus: null };

  function blank() { return { until: 0, tokens: [], ads: 0, cardAt: 0, remindDay: 0, endShown: 0 }; }
  function clean(o) {
    var r = blank();
    if (!o || typeof o !== "object") return r;
    r.until = Math.max(0, Number(o.until) || 0);
    r.tokens = Array.isArray(o.tokens) ? o.tokens.filter(function (t) { return typeof t === "string"; }).slice(-config.tokensKeep) : [];
    r.ads = Math.max(0, Math.floor(Number(o.ads) || 0));
    r.cardAt = Math.max(0, Math.floor(Number(o.cardAt) || 0));
    r.remindDay = Math.max(0, Math.floor(Number(o.remindDay) || 0));
    r.endShown = Math.max(0, Number(o.endShown) || 0);
    return r;
  }
  function parse(raw) { try { return clean(typeof raw === "string" ? JSON.parse(raw) : raw); } catch (e) { return blank(); } }
  /* Слияние двух снимков (облако и устройство): срок и счётчики берём большие, токены объединяем.
     Хозяин вызывает при импорте облака, иначе срок мог бы пропасть при конфликте двух устройств. */
  function mergeState(a, b) {
    var x = parse(a), y = parse(b), r = blank(), seen = {};
    r.until = Math.max(x.until, y.until); r.ads = Math.max(x.ads, y.ads); r.cardAt = Math.max(x.cardAt, y.cardAt);
    r.remindDay = Math.max(x.remindDay, y.remindDay); r.endShown = Math.max(x.endShown, y.endShown);
    y.tokens.concat(x.tokens).forEach(function (t) { if (!seen[t]) { seen[t] = 1; r.tokens.push(t); } });
    r.tokens = r.tokens.slice(-config.tokensKeep);
    return JSON.stringify(r);
  }
  function persist() { try { if (store && store.set) store.set(JSON.stringify(st)); } catch (e) {} }
  function loadState() { try { st = parse(store && store.get ? store.get() : null); } catch (e) { st = blank(); } }

  /* ---- Серверное время: часы устройства не используем ---- */
  function now() {
    if (sdk && typeof sdk.serverTime === "function") {
      try { var t = sdk.serverTime(); if (typeof t === "number" && t > 0) { off = t - Date.now(); return t; } } catch (e) {}
    }
    return Date.now() + off;
  }
  function active() { return st.until > now(); }
  function daysLeft() { var ms = st.until - now(); return ms > 0 ? Math.ceil(ms / DAY) : 0; }
  function available() { return !!(ready && canBuy); }

  /* ---- Утилиты текста ---- */
  function fmt(s) { var a = arguments; return String(s).replace(/\{(\d)\}/g, function (m, i) { var v = a[Number(i) + 1]; return v == null ? "" : v; }); }
  function tx(k) { var v = texts[k]; return v != null ? v : (TEXTS.ru[k] != null ? TEXTS.ru[k] : k); }
  function plural(n) {
    if (lang === "en") return fmt(n === 1 ? tx("d1") : tx("d2"), n);
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return fmt(tx("d1"), n);
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return fmt(tx("d2"), n);
    return fmt(tx("d5"), n);
  }
  function dateStr(ms) {
    try { return new Date(ms).toLocaleDateString(tx("lang"), { day: "numeric", month: "long", year: "numeric" }).replace(/\s*г\.$/, ""); }   // без «г.», чтобы в конце фразы не было «г..»
    catch (e) { return new Date(ms).toISOString().slice(0, 10); }
  }
  function priceOf(id) { var c = catalog[id]; return c && c.price ? String(c.price) : ""; }
  function dayIdx() { return Math.floor(now() / DAY); }
  function emit() { var a = active(); lastActive = a; listeners.slice().forEach(function (f) { try { f(a); } catch (e) {} }); renderCorner(); if (ui.ov && ui.mode === "shop") renderShop(); }

  /* ---- Покупка и начисление: запись в облако подтверждена, и только потом consumePurchase ---- */
  function grant(p) {
    var id = p && p.productID, tok = p && p.purchaseToken, prod = config.products[id];
    if (!prod || !tok) return Promise.resolve(false);
    if (st.tokens.indexOf(tok) < 0) {
      var base = Math.max(now(), st.until);
      st.until = base + prod.days * DAY;
      st.tokens.push(tok); if (st.tokens.length > config.tokensKeep) st.tokens.shift();
      persist();
    }
    return Promise.resolve(store && store.save ? store.save() : false).then(function (ok) {
      if (!ok) { var e = new Error("save"); e.code = "save"; throw e; }
      // срок уже сохранён: если закрыть покупку не вышло, её закроют при следующем запуске, второй раз срок не начислится
      return Promise.resolve(payments.consumePurchase(tok)).then(function () {}, function () {});
    }).then(function () { emit(); return true; });
  }
  function queue(f) { var r = chain.then(f, f); chain = r.then(function () {}, function () {}); return r; }
  function checkPurchases() {
    return queue(function () {
      return payments.getPurchases().then(function (list) {
        list = Array.isArray(list) ? list : (list && list.purchases) || [];
        return list.reduce(function (p, item) { return p.then(function () { return grant(item).catch(function () {}); }); }, Promise.resolve());
      });
    }).catch(function () {}).then(function () { emit(); });
  }
  function buy(id) {
    if (busy || !canBuy || !config.products[id]) return Promise.resolve(false);
    busy = true; setStatus(tx("busy")); renderShop();
    return queue(function () {
      return payments.purchase({ id: id, developerPayload: "pm" }).then(function (p) {
        return grant(p).then(function () { setStatus(fmt(tx("done"), dateStr(st.until))); return true; }, function (e) {
          setStatus(e && e.code === "save" ? tx("saveFail") : tx("fail")); return false;
        });
      }, function () { setStatus(tx("fail")); return false; });
    }).then(function (r) { busy = false; renderShop(); return r; }, function () { busy = false; renderShop(); return false; });

ble Stars (watch video)", "🎉 Финал": "🎉 Finale", "💎 Забрать осколок": "💎 Collect Shard", "▶️ Следующий уровень": "▶️ Next Level", "🔄 Переиграть": "🔄 Play Again", "🗺️ Карта": "🗺️ Map", "Да": "Yes", "Отмена": "Cancel", "Понятно": "Got it", "Нужно {0} звёзд. Сейчас у тебя {1}.": "You need {0} stars. You currently have {1}.", "Открыть героя «{0}» за {1} звёзд?": "Unlock hero \"{0}\" for {1} stars?", "Удалить все звёзды, уровни и статистику?": "Delete all stars, levels, and statistics?", "Выйти из боя? Текущий бой начнётся заново.": "Leave the battle? The current battle will restart.", "Умножение в столбик — Кристалл Умножения": "Long Multiplication Quest — Crystal of Multiplication", "В полночь Кристалл Умножения раскололся. Шесть осколков исчезли.": "At midnight, the Crystal of Multiplication shattered. Six shards vanished.", "Я сотру все числа! Тогда никто больше не потеряет того, кто ему дорог.": "I'll erase every number! Then no one will ever lose someone they love again.", "Мы вернём осколки. Но почему он говорит о потере?": "We'll recover the shards. But why is he talking about losing someone?", "Потому что однажды исчезла Единица. И кто-то из нас знает правду.": "Because the One disappeared long ago. And someone among us knows the truth.", "Замок Искр — Площадь погасших фонарей": "Castle of Sparks — Square of Darkened Lanterns", "На площади гаснут фонари. Жители прячут последние светящиеся числа.": "The lanterns in the square are going out. The townspeople hide the last glowing numbers.", "Семизуб украл огонь! Без него город скоро замёрзнет.": "Sevenfang stole the fire! Without it, the city will soon freeze.", "Странно. На стене знак тайного хранителя. Я уже видел его.": "Strange. There's a secret guardian's symbol on the wall. I've seen it before.", "У фонаря плачет маленький торговец. Что сделаем?": "A little merchant is crying beside a lantern. What should we do?", "Помочь торговцу зажечь фонарь": "Help the merchant light the lantern", "Спасибо! Возьми искру жизни. Она защитит тебя!": "Thank you! Take this spark of life. It will protect you!", "Забрать волшебный фонарь для похода": "Take the magic lantern on our journey", "Его свет покажет слабое место врага.": "Its light will reveal the enemy's weak spot.", "Замок Искр — Улица семи колоколов": "Castle of Sparks — Street of Seven Bells", "Семь колоколов звонят сами. Каждый удар превращает камень в пепел.": "Seven bells ring on their own. Each chime turns stone to ash.", "Семизуб расставил ловушку. Но под мостом застрял мальчик!": "Sevenfang set a trap. But a boy is stuck under the bridge!", "Колокола уже просыпаются. Нужно решать быстро.": "The bells are already waking up. We need to act fast.", "Как пройти через улицу?": "How should we cross the street?", "Сначала спасти мальчика": "Save the boy first", "Ты не оставил его! Он дарит нам защитный талисман.": "You didn't leave him behind! He gives us a protective charm.", "Пройти тайным ходом и не рисковать": "Take the secret passage and avoid the danger", "Я знаю ритм колоколов. Подскажу, когда двигаться.": "I know the bells' rhythm. I'll tell you when to move.", "Замок Искр — Рынок украденных ответов": "Castle of Sparks — Market of Stolen Answers", "На рынке торговцы продают ответы, украденные из школьных тетрадей.": "At the market, merchants sell answers stolen from school notebooks.", "Без ответов дети забудут, как умножать!": "Without their answers, the children will forget how to multiply!", "Семизуб платит за каждую ошибку. Но я могу помочь вам.": "Sevenfang pays for every mistake. But I can help you.", "Торговец предлагает сделку. Что выберем?": "A merchant offers us a deal. What should we choose?", "Вернуть детям украденные тетради": "Return the stolen notebooks to the children", "Дети благодарят нас и дарят сердечный оберег.": "The children thank us and give us a heart charm.", "Обменять монеты на секретный ответ": "Trade coins for a secret answer", "Торговец рассказал, как распознать обман Семизуба.": "The merchant tells us how to spot Sevenfang's tricks.", "Замок Искр — Мост сломанных обещаний": "Castle of Sparks — Bridge of Broken Promises", "На мосту висит портрет Нульморта. Рядом нарисован сияющий друг.": "A portrait of Nulmort hangs on the bridge. A glowing friend is painted beside him.", "Это Единица! Они когда-то вместе охраняли Кристалл.": "That's the One! They used to guard the Crystal together.", "Не трогайте портрет! В нём заперта память.": "Don't touch the portrait! A memory is trapped inside it.", "Портрет начинает рассыпаться. Как поступим?": "The portrait begins to crumble. What should we do?", "Сохранить портрет и память о друге": "Save the portrait and the memory of their friendship", "Память согрела мост. Нам досталась частица защиты.": "The memory warms the bridge. We receive a spark of protection.", "Изучить тайный знак на обратной стороне": "Study the secret symbol on the back", "Знак открывает секрет боевого построения Семизуба.": "The symbol reveals the secret of Sevenfang's battle formation.", "Замок Искр — Семизуб и первый осколок": "Castle of Sparks — Sevenfang and the First Shard", "Семь зубцов моей короны раздавят ваши жалкие надежды!": "The seven spikes of my crown will crush your pathetic hopes!", "Верни осколок! Мы знаем, что Нульморт скрывает правду.": "Give back the shard! We know Nulmort is hiding the truth.", "Он не уничтожил Единицу. Он сам запер её, испугавшись потери!": "He didn't destroy the One. He locked her away himself because he was afraid of losing her!", "Семизуб побеждён, но просит пощады. Что ответим?": "Sevenfang is defeated, but he begs for mercy. What should we say?", "Пощадить Семизуба и выслушать его": "Spare Sevenfang and hear him out", "Первый осколок ваш. Берегите тех, кто ещё вам верит.": "The first shard is yours. Take care of those who still believe in you.", "Потребовать осколок и секрет следующего замка": "Demand the shard and the next castle's secret", "Забирайте! Двурог прячет слабость в зеркальных рядах.": "Take it! Twin-Horn hides his weakness in the mirrored rows.", "Замок Двух Рядов — Зеркальная площадь": "Castle of Two Rows — Mirror Square", "На площади каждое отражение живёт собственной жизнью.": "In the square, every reflection has a life of its own.", "В зеркале я вижу себя рядом с Нульмортом. Это невозможно!": "I can see myself standing beside Nulmort in the mirror. That's impossible!", "Или зеркало показывает то, что ты скрываешь.": "Or maybe the mirror shows what you're hiding.", "Зеркальный Байт просит выпустить его. Что сделаем?": "Mirror Byte asks us to set him free. What should we do?", "Выслушать отражение и помочь ему": "Listen to the reflection and help him", "Оно показало мне защитный код. Я стал сильнее!": "He showed me a protective code. I'm stronger now!", "Закрыть зеркало и изучить его механизм": "Close the mirror and study how it works", "Механизм выдаёт полезную подсказку для боя.": "The mechanism gives us a useful battle hint.", "Замок Двух Рядов — Переулок двойников": "Castle of Two Rows — Alley of Doubles", "Из тумана выходят две одинаковые феи Цифры.": "Two identical Tsifra fairies emerge from the fog.", "Одна из нас подделка! Не верьте её словам!": "One of us is a fake! Don't believe a word she says!", "Настоящая фея знает: Нульморт когда-то спас весь мир.": "The real fairy knows that Nulmort once saved the entire world.", "Как проверить двойников?": "How can we tell which fairy is real?", "Дать обеим феям шанс объясниться": "Give both fairies a chance to explain", "Добро разрушило чары. Настоящая фея дарит сердце.": "Kindness breaks the spell. The real fairy gives us a heart.", "Использовать проверку Робота Байта": "Use Byte the Robot's scanner", "Подделка найдена. Я вычислил её боевой секрет.": "Fake detected. I've figured out her battle secret.", "Замок Двух Рядов — Улица исчезнувших имён": "Castle of Two Rows — Street of Forgotten Names", "Жители забывают свои имена. На дверях остаются пустые таблички.": "The townspeople are forgetting their names. Blank signs hang on their doors.", "Двурог стирает память, чтобы никто не помнил Единицу.": "Twin-Horn is erasing memories so no one will remember the One.", "Некоторые воспоминания опасны. Особенно мои.": "Some memories are dangerous. Especially mine.", "Старушка просит вернуть ей имя. Как поступим?": "An old woman asks us to help her remember her name. What should we do?", "Помочь ей вспомнить прошлое": "Help her remember her past", "Она вспомнила своё имя и вручила нам оберег.": "She remembers her name and gives us a protective charm.", "Сначала найти источник заклинания": "Find the source of the spell first", "Я раскрыла секрет чар и получила подсказку.": "I've uncovered the spell's secret and gained a hint.", "Замок Двух Рядов — Башня двух дверей": "Castle of Two Rows — Tower of Two Doors", "Перед героями две двери: одна ведёт к пленникам, другая к Двурогу.": "Two doors stand before the heroes. One leads to prisoners, the other to Twin-Horn.", "Слышите? За первой дверью зовут на помощь!": "Do you hear that? Someone is calling for help behind the first door!", "Если задержимся, Двурог узнает о нашем приближении.": "If we take too long, Twin-Horn will know we're coming.", "Какую дверь откроем первой?": "Which door should we open first?", "Освободить пленников": "Free the prisoners", "Мы спасли жителей! Они подарили нам сердце.": "We saved the townspeople! They give us a heart.", "Открыть проход к Двурогу": "Open the passage to Twin-Horn", "Мы нашли тайный чертёж его доспехов.": "We found a secret blueprint of his armor.", "Замок Двух Рядов — Двурог и второе отражение": "Castle of Two Rows — Twin-Horn and the Second Reflection", "Вы видели двойников, но не заметили предателя рядом!": "You saw the doubles, but you failed to notice the traitor right beside you!", "Он лжёт! Мои воспоминания повреждены, но я верен друзьям.": "He's lying! My memories are damaged, but I'm loyal to my friends.", "Твой создатель служил Нульморту. А Пифагор знает гораздо больше!": "Your creator served Nulmort. And Pythagoras knows much more than he's telling you!", "Двурог отдаёт осколок и предлагает тайный договор.": "Twin-Horn hands over the shard and offers a secret deal.", "Отказаться от сделки и простить его": "Refuse the deal and forgive him", "Второй осколок ваш. Пифагор когда-то охранял Единицу.": "The second shard is yours. Pythagoras once guarded the One.", "Потребовать доказательства против Пифагора": "Demand proof against Pythagoras", "Вот запись: Пифагор открывал Нульморту тайный проход.": "Here's a recording: Pythagoras opened a secret passage for Nulmort.", "Замок Переносов — Площадь падающих цифр": "Castle of Carries — Square of Falling Digits", "С неба падают тяжёлые каменные цифры. Улицы рушатся.": "Heavy stone digits fall from the sky. The streets crumble.", "Переносий превратил ошибки вычислений в настоящие камни!": "Carrymaster turned math mistakes into real stones!", "Я служил Нульморту. Но это было задолго до его злодеяний.": "I once served Nulmort. But that was long before he turned evil.", "Герои требуют объяснений. Что скажем Пифагору?": "The heroes demand an explanation. What should we say to Pythagoras?", "Дать Пифагору возможность рассказать правду": "Give Pythagoras a chance to tell the truth", "Спасибо за доверие. Я сохраню вам сердце.": "Thank you for trusting me. I'll protect one of your hearts.", "Потребовать раскрыть все секреты немедленно": "Demand that he reveal all his secrets right now", "Я расскажу, как обезвредить ближайшую ловушку.": "I'll tell you how to disable the next trap.", "Замок Переносов — Улица украденных разрядов": "Castle of Carries — Street of Stolen Place Values", "На улице пропадают десятки и сотни. Дома становятся крошечными.": "Tens and hundreds are disappearing from the street. Houses are shrinking.", "Я обнаружил тайный сигнал. Его отправляют из нашей команды!": "I've detected a secret signal. Someone on our team is sending it!", "Но кто передаёт Нульморту сведения о каждом нашем шаге?": "But who's telling Nulmort about our every move?", "На крыше найден передатчик. Что с ним сделать?": "A transmitter is found on a rooftop. What should we do with it?", "Отключить его и предупредить жителей": "Turn it off and warn the townspeople", "Мы защитили город. Жители дарят нам сердце.": "We protected the city. The townspeople give us a heart.", "Перехватить сигнал и прочитать сообщение": "Intercept the signal and read the message", "В сообщении указана слабость следующего врага.": "The message reveals the next enemy's weakness.", "Замок Переносов — Подземелье потерянных друзей": "Castle of Carries — Dungeon of Lost Friends", "Под площадью герои находят камеру с призрачным силуэтом Единицы.": "Beneath the square, the heroes find a cell holding the ghostly figure of the One.", "Нульморт не потерял меня. Он сам закрыл дверь между нами.": "Nulmort didn't lose me. He closed the door between us himself.", "Я помог ему запечатать её. И до сих пор жалею об этом.": "I helped him seal her away. And I still regret it.", "Призрак Единицы просит передать Нульморту послание.": "The One's ghost asks us to deliver a message to Nulmort.", "Пообещать передать послание": "Promise to deliver the message", "Скажите ему, что я всё ещё жду. Возьмите моё сердце света.": "Tell him I'm still waiting. Take my heart of light.", "Сначала спросить, как разрушить печать": "First ask how to break the seal", "Шесть осколков откроют дверь. Я покажу её слабое место.": "The six shards will open the door. I'll show you its weak spot.", "Замок Переносов — Мост предательства": "Castle of Carries — Bridge of Betrayal", "В полночь Пифагор исчезает с двумя осколками.": "At midnight, Pythagoras disappears with two shards.", "Он предал нас! Я видела, как он вошёл в портал Нульморта!": "He betrayed us! I saw him enter Nulmort's portal!", "Пифагор оставил записку: «Не ищите меня до рассвета».": "Pythagoras left a note: \"Don't look for me until dawn.\"", "Как поступим после исчезновения Пифагора?": "What should we do after Pythagoras disappears?", "Поверить, что у него есть причина": "Believe that he has a good reason", "Надежда поддерживает нас. Я создам защитное сердце.": "Hope keeps us going. I'll create a protective heart.", "Найти след портала и подготовить засаду": "Track the portal and prepare an ambush", "Я восстановил маршрут и узнал секрет стражей.": "I've traced his route and discovered the guardians' secret.", "Замок Переносов — Переносий и третий осколок": "Castle of Carries — Carrymaster and the Third Shard", "Пифагор уже отдал вашему врагу два осколка! Вы проиграли!": "Pythagoras has already given your enemy two shards! You've lost!", "Даже без них мы не позволим тебе уничтожить город.": "Even without them, we won't let you destroy the city.", "Нульморт запер Единицу, чтобы спасти её от древнего Пустоцвета!": "Nulmort locked away the One to save her from the ancient Hollowbloom!", "Переносий побеждён и отдаёт третий осколок. Что дальше?": "Carrymaster is defeated and hands over the third shard. What next?", "Освободить Переносия от проклятия": "Free Carrymaster from the curse", "Спасибо. Пустоцвет питается страхом. Я дарю вам защиту.": "Thank you. Hollowbloom feeds on fear. I'll give you protection.", "Заставить его раскрыть путь к Нульморту": "Make him reveal the path to Nulmort", "Через Большие Числа идёт секретный тоннель.": "A secret tunnel runs through the Land of Large Numbers.", "Замок Больших Чисел — Проспект великанов": "Castle of Large Numbers — Avenue of Giants", "Гигантские стражи шагают по проспекту. Каждый несёт украденное число.": "Giant guardians march down the avenue. Each carries a stolen number.", "Они слишком велики даже для меня. Но я знаю, как их остановить.": "They're too big even for me. But I know how to stop them.", "Смотрите! Один великан плачет. Его заставили служить Трёхглаву.": "Look! One of the giants is crying. He was forced to serve Three-Head!", "Перед нами заколдованный великан. Что сделаем?": "An enchanted giant stands before us. What should we do?", "Помочь великану освободиться": "Help the giant break free", "Он благодарен и делится своей силой защиты.": "He's grateful and shares his protective power with us.", "Обойти великана и найти слабое место": "Go around the giant and find a weak spot", "Его броня скрывает секретную схему. Я её запомнил.": "His armor hides a secret diagram. I've memorized it.", "Замок Больших Чисел — Библиотека запретной истории": "Castle of Large Numbers — Library of Forbidden History", "В библиотеке лежит книга, которую Нульморт приказал уничтожить.": "In the library lies a book that Nulmort ordered destroyed.", "Здесь сказано: Пустоцвет родился из первой неправильной клятвы.": "It says here that Hollowbloom was born from the first broken oath.", "Нульморт поклялся никогда не терять Единицу. Клятва стала ловушкой.": "Nulmort swore he would never lose the One. His oath became a trap.", "Книга начинает гореть холодным пламенем. Что спасём?": "The book begins to burn with cold flames. What should we save?", "Сохранить историю Единицы": "Save the story of the One", "Истина уцелела. Магия книги дарит нам сердце.": "The truth survives. The book's magic gives us a heart.", "Скопировать страницу о слабости Пустоцвета": "Copy the page about Hollowbloom's weakness", "Теперь мы знаем, как защититься от его обмана.": "Now we know how to protect ourselves from his tricks.", "Замок Больших Чисел — Площадь трёх корон": "Castle of Large Numbers — Square of Three Crowns", "На площади стоят три трона. Каждый обещает герою власть.": "Three thrones stand in the square. Each promises power to a hero.", "Кто сядет на трон, станет сильнее. Но забудет одного друга!": "Anyone who sits on a throne will become stronger. But they'll forget one friend!", "Никакая сила не стоит памяти о друзьях.": "No amount of power is worth forgetting your friends.", "Троны предлагают опасный подарок. Что выберем?": "The thrones offer a dangerous gift. What should we choose?", "Разрушить чары и освободить пленников": "Break the spell and free the prisoners", "Ты выбрал друзей. Освобождённые дарят нам сердце.": "You chose your friends. The freed prisoners give us a heart.", "Исследовать троны, не принимая их дар": "Study the thrones without accepting their gift", "Я нашёл механизм, управляющий защитой Трёхглава.": "I've found the mechanism that controls Three-Head's defenses.", "Замок Больших Чисел — Возвращение предателя": "Castle of Large Numbers — Return of the Traitor", "Пифагор возвращается раненым. Двух осколков при нём больше нет.": "Pythagoras returns wounded. The two shards are gone.", "Я отдал их Нульморту. Он обещал показать мне живую Единицу.": "I gave them to Nulmort. He promised to show me the One alive.", "Ты продал нашу надежду! Почему мы должны тебе верить?": "You betrayed our hopes! Why should we trust you?", "Пифагор просит остаться с командой. Что решим?": "Pythagoras asks to rejoin the team. What should we decide?", "Простить Пифагора и дать ему шанс": "Forgive Pythagoras and give him another chance", "Я верну доверие делом. Примите моё защитное сердце.": "I'll earn back your trust through my actions. Please accept my protective heart.", "Оставить его под наблюдением": "Let him stay, but keep an eye on him", "Справедливо. Я раскрою секрет доспехов Трёхглава.": "Fair enough. I'll reveal the secret of Three-Head's armor.", "Замок Больших Чисел — Трёхглав и четвёртый осколок": "Castle of Large Numbers — Three-Head and the Fourth Shard", "Три головы знают три истины. Ваш друг предал вас ради Единицы!": "Three heads know three truths. Your friend betrayed you for the One!", "Да. Но Нульморт обманул меня. Единица заперта в самом Кристалле.": "Yes. But Nulmort tricked me. The One is trapped inside the Crystal itself.", "Четвёртый осколок ваш. Но Пустоцвет уже просыпается!": "The fourth shard is yours. But Hollowbloom is already awakening!", "Трёхглав просит снять проклятие с его трёх голов.": "Three-Head asks us to lift the curse from his three heads.", "Освободить Трёхглава от проклятия": "Free Three-Head from the curse", "Я снова могу думать сам. Примите дар трёх сердец.": "I can think for myself again. Accept the gift of three hearts.", "Потребовать карту последнего убежища": "Demand a map to the final hideout", "Вот путь к Замку Процентов и тайна его стражей.": "Here's the path to the Castle of Percents and the secret of its guardians.", "Замок Процентов — Площадь отнятых долей": "Castle of Percents — Square of Stolen Shares", "Процентор забирает у жителей долю их сил. Город слабеет.": "Percentor steals part of the townspeople's strength. The city grows weaker.", "Он крадёт даже радость. Люди перестали улыбаться!": "He even steals their joy. People have stopped smiling!", "Пустоцвет растёт. Он питается каждым несправедливым поступком.": "Hollowbloom is growing. Every unfair act makes him stronger.", "Жители просят вернуть украденную силу.": "The townspeople ask us to restore their stolen strength.", "Поделиться с жителями запасом магии": "Share our magic supplies with the townspeople", "Их благодарность вернулась к нам защитным сердцем.": "Their gratitude returns to us as a protective heart.", "Найти устройство, собирающее силу": "Find the device that collects their strength", "Я вычислил, как устроена защита Процентора.": "I've figured out how Percentor's defenses work.", "Замок Процентов — Улица честных сделок": "Castle of Percents — Street of Honest Deals", "Торговец предлагает вернуть городу свет за половину запасов.": "A merchant offers to restore the city's light in exchange for half its supplies.", "Он выглядит испуганным. Возможно, Процентор заставил его обманывать.": "He looks frightened. Maybe Percentor forced him to cheat people.", "За лавкой прячутся голодные дети. Им нужна помощь.": "Hungry children are hiding behind the shop. They need help.", "Как поступим с торговцем?": "What should we do about the merchant?", "Накормить детей и помочь торговцу": "Feed the children and help the merchant", "Торговец раскаялся и подарил нам сердце.": "The merchant regrets his actions and gives us a heart.", "Разоблачить обман и забрать схему машины": "Expose the trick and take the machine's blueprint", "Схема показывает секрет защитного поля врага.": "The blueprint reveals the secret of the enemy's protective field.", "Замок Процентов — Зал разделённых сердец": "Castle of Percents — Hall of Divided Hearts", "В зале висит портрет Нульморта и Единицы до их ссоры.": "A portrait of Nulmort and the One before their argument hangs in the hall.", "Я был свидетелем. Нульморт испугался, что Единица уйдёт навсегда.": "I was there. Nulmort was afraid the One would leave forever.", "Он запер друга ради защиты. Но этим создал Пустоцвета.": "He locked his friend away to protect her. But that created Hollowbloom.", "Магия позволяет услышать голос прошлого. Что спросим?": "Magic lets us hear a voice from the past. What should we ask?", "Спросить, чего на самом деле хотела Единица": "Ask what the One really wanted", "Я хотела быть свободной и остаться другом. Возьмите мою защиту.": "I wanted to be free and still be his friend. Take my protection.", "Спросить, как разрушить печать Нульморта": "Ask how to break Nulmort's seal", "Шесть осколков и верный расчёт откроют путь ко мне.": "Six shards and the correct calculation will open the way to me.", "Замок Процентов — Ночь тайного послания": "Castle of Percents — Night of the Secret Message", "Ночью Байт перехватывает сообщение Нульморта, адресованное Пифагору.": "At night, Byte intercepts a message from Nulmort addressed to Pythagoras.", "Приведи героев в Цитадель. Только их сила сможет открыть Кристалл.": "Bring the heroes to the Citadel. Only their power can open the Crystal.", "Он использует нас! Но внутри Кристалла действительно жива Единица.": "He's using us! But the One really is alive inside the Crystal.", "Нульморт предлагает обменять осколки на свободу Единицы.": "Nulmort offers to trade the shards for the One's const PATS=[];
Object.keys(EN).forEach(k=>{
 if(!/\{\d+\}/.test(k))return;
 const parts=k.split(/(\{\d+\})/),order=[];
 const re="^"+parts.map(x=>{if(/^\{\d+\}$/.test(x)){order.push(+x.slice(1,-1));return "(.+?)"}return x.replace(/[.*+?^$()|[\]\\{}]/g,"\\$&")}).join("")+"$";
 PATS.push({re:new RegExp(re),order,to:EN[k],lit:k.replace(/\{\d+\}/g,"").length});
});
PATS.sort((a,b)=>b.lit-a.lit);
function t(s){
 if(LANG!=="en"||typeof s!=="string")return s;
 if(Object.prototype.hasOwnProperty.call(EN,s))return EN[s];
 for(const p of PATS){
  const m=p.re.exec(s);
  if(m){const v={};p.order.forEach((n,j)=>v[n]=m[j+1]);return p.to.replace(/\{(\d+)\}/g,(_,i)=>t(v[i]===undefined?"":v[i]))}
 }
 return s;
}
function trDom(root){
 if(LANG!=="en")return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];
 while((n=w.nextNode()))list.push(n);
 list.forEach(n=>{const v=n.nodeValue,c=v.trim();if(!c||!/[А-Яа-яЁё]/.test(c))return;const r=t(c);if(r!==c)n.nodeValue=v.replace(c,r)});
}

function load(){
 try{
  const raw=JSON.parse(PF.get(KEY)||PF.get("stolbik-save"));
  if(!raw||typeof raw!=="object")return fresh();
  const d=fresh();
  const s={...d,...raw};
  s.stats={...d.stats,...(raw.stats||{})};
  for(const t of types)s.stats[t]={...d.stats[t],...(s.stats[t]||{})};
  s.leitner=raw.leitner||{};
  s.stars=raw.stars||{};
  s.owned=Array.isArray(raw.owned)?raw.owned:[0,1];
  s.scenes=raw.scenes||{};
  s.karma={good:0,sly:0,...(raw.karma||{})};
  s.seen=raw.seen||{};
  s.lang=raw.lang==="en"||raw.lang==="ru"?raw.lang:"";
  s.best=raw.best||{};
  s.unlocked=Math.max(1,Math.min(31,Number(s.unlocked)||1));
  return s;
 }catch(e){return fresh()}
}

function beep(f=520,d=.08){
 if(!save.sound||PF.paused())return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(.06,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+d);
 }catch(e){}
}

function questionBank(n){
 const w=worldOf(n),local=(n-1)%5,boss=local===4;

 const ratio=(part,base)=>bank.push({type:"percent",kind:"ratio",part,base,mode:"mental"});
 if(w===0){
  [[34,7],[26,4],[48,3],[63,2],[72,4],[19,6],[125,4]].forEach(x=>add(...x,"mental"));
  [40,80,200,240].forEach(x=>[10,25,50].forEach(p=>pct(p,x)));
 }else if(w===1){
  [[12,22],[13,23],[24,12],[21,32],[31,21],[42,12],[23,13]].forEach(x=>add(...x));
 }else if(w===2){
  [[46,38],[27,34],[58,47],[67,29],[39,46],[76,58],[84,37]].forEach(x=>add(...x));
 }else if(w===3){
  [[125,4],[213,24],[342,16],[306,27],[407,35],[128,6],[504,18],[215,32]].forEach(x=>add(...x,x[1]<10?"mental":"column"));
 }else if(w===4){
  [120,160,200,240,320,400].forEach(x=>[10,15,20,25,50].forEach(p=>pct(p,x)));
  [[30,120],[45,300],[24,120],[60,240],[36,180]].forEach(x=>ratio(...x));
 }else{
  [[324,26],[475,38],[306,47],[508,29],[213,64],[407,58],[625,34]].forEach(x=>add(...x));
  pct(15,240);ratio(30,120);
 }
 if(boss&&w===5){
  [[324,26],[475,38],[608,47],[735,29]].forEach(x=>add(...x));
 }
 return bank;
}
function questionKey(q){
 return q.type==="percent"?
  (q.kind==="of"?`p:${q.p}:${q.base}`:`r:${q.part}:${q.base}`):
  `m:${q.a}:${q.b}`;
}
function chooseQuestion(n,used){
 const bank=questionBank(n);
 const weak=bank.filter(q=>{
  const x=save.leitner[questionKey(q)];
  return x&&x.box<5&&!used.has(questionKey(q));
 });
 const available=bank.filter(q=>!used.has(questionKey(q)));
 const q=pick(weak.length&&Math.random()<.3?weak:(available.length?available:bank));
 return {...q};
}
function answerOf(q){
 if(q.type==="percent"){
  return q.kind==="of"?q.base*q.p/100:q.part*100/q.base;
 }
 return q.a*q.b;
}
function mentalHint(q){
 if(q.type==="percent"){
  if(q.kind==="ratio")return `${q.part} ÷ ${q.base} × 100 = ${answerOf(q)}%.`;
  if(q.p===10)return `10% — это одна десятая: ${q.base} ÷ 10 = ${answerOf(q)}.`;
  if(q.p===25)return `25% — четверть: ${q.base} ÷ 4 = ${answerOf(q)}.`;
  if(q.p===50)return `50% — половина: ${q.base} ÷ 2 = ${answerOf(q)}.`;
  return `${q.base} × ${q.p} ÷ 100 = ${answerOf(q)}.`;
 }
 const tens=Math.floor(q.a/10)*10,rest=q.a-tens;
 if(q.b<10)return `${tens}×${q.b}=${tens*q.b}, ${rest}×${q.b}=${rest*q.b}. Всего ${answerOf(q)}.`;
 return `${q.a}×(${Math.floor(q.b/10)*10}+${q.b%10}) = ${q.a*Math.floor(q.b/10)*10}+${q.a*(q.b%10)} = ${answerOf(q)}.`;
}
function createColumn(a,b){
 // Each step is computed from a single decimal column, never from
 // string concatenation. Zero digits and zero carries are valid.
 const ad=String(a).split("").reverse().map(Number);
 const bd=String(b).split("").reverse().map(Number);
 const steps=[],rows=[];
 const width=String(a*b).length+2;
 const addStep=(kind,row,col,value,desc,skill,extra={})=>{
  steps.push({kind,row,col,value,desc,skill,...extra});
 };
 bd.forEach((digit,r)=>{
  let carry=0,raw=[];
  for(let i=0;i<ad.length;i++){
   const total=ad[i]*digit+carry;
   const value=total%10,next=Math.floor(total/10);
   const expr=`${ad[i]}×${digit}${carry?` + ${carry}`:""} = ${total}`;
   addStep("digit",r,i+r,value,`${expr}. Запиши ${value}${next?`, ${next} перенеси`:""}.`,r?"shift":"carry",{carry:next,operand:ad[i],multiplier:digit,incoming:carry});
   raw.push(value);
   if(i<ad.length-1){
    if(next>0)addStep("carry",r,i+r+1,next,`${expr}. Перенос в следующий разряд — ${next}.`,"carry",{isCarry:true});
   }else if(next>0){
    addStep("digit",r,i+r+1,next,`Оставшийся перенос ${next} запиши слева.`,"carry",{leading:true});
    raw.push(next);
   }
   carry=next;
  }
  const value=Number(raw.slice().reverse().join(""))*10**r;
  rows.push(value);
 });
 // For a one-digit multiplier, the single partial product is the answer.
 // For multiple multiplier digits, calculate column sums with carries.
 if(bd.length>1){
  let carry=0;
  const max=Math.max(String(a*b).length,...rows.map(x=>String(x).length));
  for(let c=0;c<max;c++){
   const digits=rows.map(x=>Math.floor(x/10**c)%10);
   const total=digits.reduce((x,y)=>x+y,carry);
   const value=total%10,next=Math.floor(total/10);
   const expr=digits.join(" + ")+(carry?` + ${carry}`:"");
   addStep("sum",bd.length,c,value,`${expr} = ${total}. Запиши ${value}${next?`, перенеси ${next}`:""}.`,"addition",{carry:next});
   if(next&&c<max-1)addStep("sumCarry",bd.length,c+1,next,`Перенос при сложении — ${next}.`,"addition");
   carry=next;
  }
 }
 return {a,b,ad,bd,rows,width,steps,values:{},index:0,wrong:false};
}

function stepPrompt(s){
 if(!s)return "";
 if(s.kind==="sum"||s.kind==="sumCarry")return `Сложение по разрядам: ${s.desc.split(" = ")[0]} = ?`;
 if(s.kind==="carry"||s.kind==="sumCarry")return "Какую цифру перенести?";
 if(s.leading)return "Запиши оставшийся перенос.";
 return `${s.operand} × ${s.multiplier}${s.incoming?" + "+s.incoming:""} = ? Запиши цифру разряда.`;
}
function renderColumn(c){
 const rows=c.bd.length,cols=c.width;
 const cells=new Map();
 const put=(r,col,text,cl="digit")=>{
  if(col>=0&&col<cols)cells.set(`${r}:${col}`,{text,cl});
 };
 const top=1,mid=2,partialStart=3,sumRow=partialStart+rows+1;
 // Logical column zero is the units column on the right.
 c.ad.forEach((d,i)=>put(top,i,d));
 c.bd.forEach((d,i)=>put(mid,i,d));
 put(mid,c.bd.length,"×","operator");
 for(let i=0;i<cols;i++)put(mid+0.5,i,"","line");
 c.bd.forEach((digit,r)=>{
  for(let k=0;k<r;k++)put(partialStart+r,k,"0","shift");
 });
 const steps=c.steps;
 steps.forEach((s,i)=>{
  const isCarry=s.kind==="carry"||s.kind==="sumCarry";
  const rr=isCarry?(s.kind==="sumCarry"?sumRow-1:0):s.kind==="sum"?sumRow:partialStart+s.row;
  const key=`${rr}:${s.col}`;
  if(i<c.index)put(rr,s.col,String(s.value),isCarry?"carry":"digit");
  else if(i===c.index)put(rr,s.col,c.wrong?String(s.value):"?",`active ${c.wrong?"wrong":""}`);
  else if(!cells.has(key))put(rr,s.col,"·",isCarry?"carry edit":"edit");
 });
 // The final sum line is separated from partial products.
 if(rows>1){
  for(let i=0;i<cols;i++)put(sumRow-0.5,i,"","line");
 }
 const maxRow=sumRow;
 let html=`<div class="column" style="--cols:${cols}">`;
 for(let r=0;r<=maxRow;r++){
  if(r===mid+0.5||r===sumRow-0.5){
   for(let col=cols-1;col>=0;col--)html+=`<div class="cell line"></div>`;
   continue;
  }
  if(!Number.isInteger(r))continue;
  for(let col=cols-1;col>=0;col--){
   const v=cells.get(`${r}:${col}`)||{text:"",cl:"blank"};
   html+=`<div class="cell ${v.cl}">${esc(v.text)}</div>`;
  }
 }
 html+="</div>";
 return html;
}

function stat(t,good){
 if(!types.includes(t))return;
 save.stats[t][good?"ok":"bad"]++;
 persist();
}
function skillOf(q){

function updateLeitner(q,good){

}

function checkInput(){
 const b=battle;
 if(!b||b.defeated)return;
 if(b.col){
  const s=currentStep();
  if(!s)return;
  if(b.input===""){b.feedback="Введи цифру.";render();return}
  const value=Number(b.input);
  b.input="";
  if(value===s.value)advanceStep(false);
  else wrongAnswer(s.value,s.desc,s.skill);
 }else{
  if(b.input==="")return;
  const value=Number(b.input),expected=answerOf(b.q);
  b.input="";
  if(value===expected){
   stat(skillOf(b.q),true);finishQuestion();
  }else wrongAnswer(expected,`Правильный ответ: ${expected}. ${mentalHint(b.q)}`,skillOf(b.q));
 }
}
function advanceStep(auto=false){
 const b=battle,c=b.col;
 if(!c)return false;
 const s=currentStep();
 if(!s)return false;
 c.values[c.index]=s.value;
 c.index++;c.wrong=false;
 stat(s.skill,true);
 b.feedback=auto?`✨ ${s.desc}`:`✅ ${s.desc}`;
 b.feedbackType="good";
 beep(590,.06);
 if(c.index>=c.steps.length){
  finishQuestion();
 }else render();
 return true;
}
function finishQuestion(){
 const b=battle;

 beep(720,.12);
 if(b.correct>=b.total){
  victory();return;
 }
 b.index++;
 initQuestion();
 b.feedback="⚔️ Попадание! Монстр потерял здоровье.";
 b.feedbackType="good";

}

}

 if(screen==="start")html=renderStart();
 if(screen==="map")html=renderMap();
 if(screen==="levels")html=renderLevels();
 if(screen==="heroes")html=renderHeroes();
 if(screen==="settings")html=renderSettings();
 if(screen==="parents")html=renderParents();
 if(screen==="scene")html=renderScene();
 if(screen==="choice")html=renderChoice();
 if(screen==="battle")html=renderBattle();
 if(screen==="defeat")html=renderDefeat();
 if(screen==="result")html=renderResult();
 app.innerHTML=html;setBg();PF.setPlaying(screen==="battle");trDom(app);if(screen==="parents"){try{if(window.Premium)Premium.maybeCard()}catch(e){}}
}
function hint(){
 const b=battle;
 if(!b)return;
 if(b.freeHints>0)b.freeHints--;else b.hints++;
 if(b.col){
  const s=currentStep();
  b.feedback=s?`💡 ${s.desc}`:"Готово!";
 }else b.feedback=`💡 ${mentalHint(b.q)}`;
 b.feedbackType="good";render();
}
function useAbility(){
 const b=battle;
 if(!b||b.abilityUsed)return;
 const h=save.hero;
 b.abilityUsed=true;
 b.hints++;
 const s=currentStep();
 if(h===0){
  b.hearts=Math.min(4,b.hearts+1);
  b.feedback="🛡️ Артём добавил одно сердце!";
 }else if(h===1){
  b.feedback=s?`🦊 Алиса: ${s.desc}`:`🦊 ${mentalHint(b.q)}`;
 }else if(h===2){
  b.feedback=s?`🤖 Проверка без штрафа: следующая цифра ${s.value}.`:`🤖 Ответ: ${answerOf(b.q)}.`;
 }else if(h===3){
  b.feedback=s?`🪄 Сейчас работаем с разрядом 10^${s.col}. ${s.desc}`:"🪄 Смотри на разряды числа.";
 }else if(h===4){
  if(s){advanceStep(true);return}
  b.feedback="🐲 В уме: "+mentalHint(b.q);
 }else if(h===5){
  b.feedback=(b.col&&b.q.b>=10)?`🐱 ${b.q.a}×${b.q.b} = ${b.q.a}×${Math.floor(b.q.b/10)*10} + ${b.q.a}×${b.q.b%10}`:"🐱 "+mentalHint(b.q);
 }else if(h===6){
  b.shield=true;b.feedback="⚡ Щит поглотит следующую потерю сердца.";
 }else if(h===7){
  b.feedback=s?`🧚 Следующая цифра: ${s.value}`:`🧚 Ответ: ${answerOf(b.q)}`;
 }
 b.feedbackType="good";render();
}
function keyPress(k){
 if(!battle||screen!=="battle")return;
 if(k==="✓"){checkInput();return}
 if(k==="←")battle.input=battle.input.slice(0,-1);
 else if(/^[0-9]$/.test(String(k))){
  const max=battle.col?1:9;
  if(battle.input.length<max)battle.input+=k;
  if(battle.col){
   checkInput();return;
  }
 }
 render();
}
function showRewarded(cb){PF.rewarded(ok=>{if(ok&&typeof cb==="function")cb()})}
function continueGame(){
 const n=battle.level,w=worldOf(n);
 if(n===30){
  openScene("end",5,showMap);
 }else if(n%5===0){
  openScene("world",w,()=>playLevel(n+1));
 }else playLevel(n+1);
}
function ask(text,ok,only){
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div class="box"><p>${esc(text)}</p>${only?"":`<button class="btn" data-m="ok">Да</button>`}<button class="btn ghost" data-m="no">${only?"Понятно":"Отмена"}</button></div>`;
 d.addEventListener("click",e=>{const x=e.target.closest("[data-m]");if(!x)return;d.remove();if(x.dataset.m==="ok"&&ok)ok()});
 app.appendChild(d);trDom(d);
}
function chooseHero(i){
 const h=heroes[i];
 if(!heroOwned(i)){ask(`Откроется, когда соберёшь ${h.cost} ⭐. Сейчас у тебя ${save.wallet}.`,null,true);return}
 save.hero=i;persist();render();
}
function reset(){
 ask("Удалить все звёзды, уровни и статистику?",()=>{save=fresh();persist();start()});
}
function holdParents(button){
 clearTimeout(holdTimer);
 holdTimer=setTimeout(()=>{
  holdTimer=null;
  if(button)button.dataset.held="1";
  nav("parents");
 },1500);
}
function stopHold(){clearTimeout(holdTimer);holdTimer=null}
app.addEventListener("pointerdown",e=>{
 const el=e.target.closest('[data-action="parentsHold"]');
 if(el)holdParents(el);
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>
 app.addEventListener(ev,stopHold)
);
app.addEventListener("contextmenu",e=>{
 if(e.target.closest('[data-action="parentsHold"]'))e.preventDefault();
});
app.addEventListener("click",e=>{
 const key=e.target.closest("[data-key]");
 if(key){keyPress(key.dataset.key);return}
 const world=e.target.closest("[data-world]");
 if(world){const wi=Number(world.dataset.world);if(save.unlocked<wi*5+1){ask(`🔒 Откроется после: ${worlds[wi-1].name}`,null,true);return}selectedWorld=wi;nav("levels");return}
 const level=e.target.closest("[data-level]");
 if(level){const ln=Number(level.dataset.level);if(ln>save.unlocked){ask(`Откроется после уровня ${ln-1}.`,null,true);return}playLevel(ln);return}
 const ch=e.target.closest("[data-choice]");
 if(ch){chooseOption(Number(ch.dataset.choice));return}
 const lg=e.target.closest("[data-lang]");
 if(lg){save.lang=lg.dataset.lang;setLang(save.lang);persist();render();return}
 const hero=e.target.closest("[data-hero]");
 if(hero){chooseHero(Number(hero.dataset.hero));return}
 const button=e.target.closest("[data-action]");
 if(!button)return;
 const a=button.dataset.action;
 if(a==="start")start();
 else if(a==="play"){
  if(!save.scenes.intro){
   save.scenes.intro=true;persist();
   openScene("intro",0,()=>playLevel(save.unlocked<=30?save.unlocked:30));
  }else playLevel(save.unlocked<=30?save.unlocked:30);
 }
 else if(a==="map")showMap();
 else if(a==="heroes")nav("heroes");
 else if(a==="settings")nav("settings");
 else if(a==="sound"){save.sound=!save.sound;persist();beep();render()}
 else if(a==="parentsHold"){}
 else if(a==="resetAsk")reset();
 else if(a==="premium"){try{Premium.openShop()}catch(e){}}
 else if(a==="sceneNext")nextScene();
 else if(a==="sceneSkip")nextScene(true);
 else if(a==="nextAvailable")playLevel(Math.min(save.unlocked,selectedWorld*5+5));
 else if(a==="exitBattle"){
  ask("Выйти из боя? Текущий бой начнётся заново.",showMap);
 }
 else if(a==="battle")nav("battle");
 else if(a==="hint")hint();
 else if(a==="ability")useAbility();
 else if(a==="retry")startLevel(battle.level);
 else if(a==="continue")continueGame();
 else if(a==="reward"){if(battle.heartAd)return;showRewarded(()=>{
  battle.heartAd=true;battle.hearts=1;battle.defeated=false;
  battle.mistakesThis=0;
  battle.feedback="❤️ Сердце восстановлено!";
  screen="battle";render();
 });
}
 else if(a==="x2"){if(battle.doubled||!battle.newStars)return;showRewarded(()=>{battle.doubled=true;save.wallet+=battle.newStars;battle.newStars*=2;persist();render()})}
});
document.addEventListener("keydown",e=>{
 if(screen!=="battle")return;
 if(/^[0-9]$/.test(e.key))keyPress(e.key);
 if(e.key==="Backspace")keyPress("←");
 if(e.key==="Enter")keyPress("✓");
});
PF.init().then(()=>{
 save=load();setLang(save.lang||detectLang());render();PF.ready();
 try{Premium.onChange(()=>{if(screen==="parents")render()});Premium.init({sdk:PF.sdk(),lang:LANG,config:{corner:false},texts:{"ru": {"title": "Премиум для родителей", "perks": ["Награды за ролики выдаются сразу, без просмотра.", "Оплачивает взрослый, через родительский экран.", "Один платёж. Автопродления и повторных списаний нет."], "p30": "Премиум на 30 дней", "p365": "Премиум на год", "note": "Оплата один раз. Премиум действует 30 дней или год. Автопродления и повторных списаний нет.", "later": "Не сейчас", "extend": "Продлить", "endBuy": "Купить Премиум", "soonTitle": "Премиум скоро закончится", "soonText": "Осталось {0}. Премиум закончится сам, без повторных списаний. Если вам удобно, вы сможете купить его снова для игры ребёнка.", "endTitle": "Премиум закончился", "endText": "Награды снова требуют просмотра роликов. Ребёнок может продолжать решать примеры в столбик и играть."}, "en": {"title": "Premium for Parents", "perks": ["Video rewards are instant, no watching.", "An adult pays, via the parent screen.", "One-time payment. No automatic renewal or recurring charges."], "p30": "30-Day Premium", "p365": "1-Year Premium", "note": "One-time payment. Premium lasts 30 days or 1 year. No automatic renewal or recurring charges.", "later": "Not Now", "extend": "Renew", "endBuy": "Buy Premium", "soonTitle": "Premium Is Ending Soon", "soonText": "{0} left. Premium ends automatically, with no further charges. You can purchase it again for your child's game if you wish.", "endTitle": "Premium Has Ended", "endText": "Video rewards require watching ads again. Your child can keep solving long multiplication and playing."}},store:{get:()=>PF.get("stb-premium"),set:r=>PF.put("stb-premium",r),save:()=>PF.saveNow()}}).then(()=>{if(screen==="parents")render()})}catch(e){}
},()=>{render()});
})();
</script>
</body>
