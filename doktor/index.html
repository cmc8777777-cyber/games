<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Доктор</title>
<style>
:root{--bg:#e9f8f4;--ink:#23364a;--teal:#1fae9d;--teal2:#14867a;--red:#ff6b6b;--yel:#ffd23f;--card:#fff;--line:#cfe9e3;--mut:#6a7f8f;--ok:#2fb35a;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfeee8;color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scr[hidden],.modal[hidden]{display:none}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--teal);color:#fff;font-weight:700}
.top .sp{flex:1}
.pill{background:rgba(255,255,255,.22);border-radius:14px;padding:3px 10px;font-size:14px;white-space:nowrap}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--yel);transition:width .1s linear}
.bar.low i{background:var(--red)}
.body{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
.btn{display:block;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--teal2);margin:8px 0}
.btn.alt{background:#fff;color:var(--teal2);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--red);box-shadow:0 3px 0 #c94b4b}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.sm{display:inline-block;width:auto;min-height:40px;font-size:15px;margin:0}
.card{background:var(--card);border-radius:16px;padding:10px;margin:0 0 10px;box-shadow:0 2px 0 var(--line);position:relative}
.pt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card)}
.av{flex:0 0 76px;height:76px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av b{position:absolute;right:-2px;bottom:-2px;font-size:22px}
.pt h3{margin:0;font-size:17px}
.pt .say{margin:2px 0 4px;color:var(--mut);font-style:italic;font-size:14px}
.sym{display:flex;flex-wrap:wrap;gap:4px}
.sym span{background:#fff4c9;border-radius:10px;padding:2px 8px;font-size:13px}
.tag{position:absolute;top:8px;right:8px;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff}
.tag.ok{background:var(--ok)}.tag.bad{background:var(--bad)}.tag.wait{background:var(--teal)}
.pt.done{opacity:.7}
.modal{position:absolute;inset:0;background:rgba(20,40,60,.55);display:flex;align-items:flex-end;z-index:20}
.modal.mid{align-items:center;padding:0 14px}
.sheet{background:var(--bg);width:100%;max-height:92%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden}
.mid .sheet{border-radius:20px}
.sheet .hd{display:flex;align-items:center;padding:10px 12px;font-weight:800;background:#fff;gap:8px}
.sheet .hd .sp{flex:1}
.x{background:#eef;border-radius:50%;width:36px;height:36px;font-size:18px}
.sheet .bd{overflow:auto;padding:10px 12px;flex:1}
.sheet .ft{padding:6px 12px 12px;background:#fff}
input[type=search],input[type=text]{width:100%;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:8px 12px;font:inherit;margin:0 0 8px}
.lst{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;text-align:left;min-height:44px}
.opt.sel{border-color:var(--teal);background:#dff7f2;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 10px;font-size:14px;min-height:40px}
.chip.sel{border-color:var(--teal);background:#dff7f2;font-weight:700}
.chip.hint{box-shadow:0 0 0 3px var(--yel)}
h2{margin:6px 0}
.step{font-weight:800;margin:8px 0 6px;color:var(--teal2)}
.big{font-size:56px;text-align:center;margin:6px 0}
.die{font-size:96px;text-align:center;line-height:1}
.die.roll{animation:sh .25s infinite}
@keyframes sh{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.1)}100%{transform:rotate(-12deg)}}
.center{text-align:center}.mut{color:var(--mut);font-size:14px}
.ent{background:#fff;border-radius:12px;padding:8px 10px;margin:0 0 8px;box-shadow:0 2px 0 var(--line)}
.ent b{display:block}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.start{justify-content:center;align-items:center;text-align:center;padding:24px;background:linear-gradient(#bff0e6,#e9f8f4)}
.logo{font-size:84px}
.start h1{margin:0 0 4px;font-size:40px;color:var(--teal2)}
.start .btn{max-width:300px}
.note{font-size:12px;color:var(--mut);margin-top:12px;max-width:300px}
.rank{font-size:26px;font-weight:800;color:var(--teal2);text-align:center;margin:4px 0}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.acc{background:#fff;border-radius:12px;margin:0 0 6px;box-shadow:0 2px 0 var(--line);overflow:hidden}
.acc>button{width:100%;text-align:left;background:#fff;padding:10px 12px;font-weight:700;min-height:46px}
.acc .in{padding:0 12px 10px;font-size:14px}
.acc .in p{margin:4px 0}
.ic{height:1.2em;width:auto;vertical-align:-0.2em}
.ico{height:1.5em;width:auto;vertical-align:-0.4em}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hdav{width:40px;height:40px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.hdav img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.docimg{display:block;margin:0 auto;height:96px;width:auto}
.dieimg{height:100px;width:auto;margin:0 auto;display:block}
.start.art{background-size:cover;background-position:center top}
.start.art .logo,.start.art h1,.start.art>p{display:none}
.start.art{justify-content:flex-end;padding-bottom:20px}
.start.art .btn{box-shadow:0 3px 0 rgba(0,0,0,.18)}
.start.art .stt{margin:24px 0 auto}
.row3{display:flex;gap:6px;width:100%;max-width:300px}
.row3 .btn{flex:1;min-height:42px;padding:6px 4px;font-size:13px;margin:6px 0}
.start.art .btn{min-height:44px;margin:5px 0}
.start.art .note{background:rgba(255,255,255,.8);border-radius:10px;padding:4px 8px;margin-top:6px}
.stt{font-size:44px;font-weight:800;color:#fff;text-shadow:0 3px 0 var(--teal2),0 0 12px rgba(0,0,0,.25);margin:0}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:14px;z-index:40;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <section class="scr start" id="scrStart"></section>
  <section class="scr" id="scrPlay" hidden></section>
  <section class="scr" id="scrEnd" hidden></section>
  <div class="modal" id="mdl" hidden></div>
</div>

</script>

    '<div class="row3"><button class="btn alt" id="sBook">' + img('ic_book', '📖', 'ic') + ' Справочник</button><button class="btn alt" id="sNote">' + img('ic_notes', '📓', 'ic') + ' Тетрадь</button><button class="btn alt" id="sHow">Как играть</button></div>' +
    '<div class="note">Игра учит основам первой помощи. Она не заменяет врача: если плохо себя чувствуешь, скажи взрослым.</div>';
  if (has) $('sCont').onclick = () => startShift();
  $('sNew').onclick = () => { S = fresh(); save(); startShift(); };
  $('sBook').onclick = () => openBook(); $('sNote').onclick = () => openNotes(); $('sHow').onclick = () => howTo();
  const sc = $('scrStart');
  if (ART.cover) { sc.className = 'scr start art'; sc.style.backgroundImage = 'url(img/cover.webp)'; sc.insertAdjacentHTML('afterbegin', '<div class="stt">Доктор</div>'); }
  show('scrStart');
}
PF.onPause = function () {};
window.__game = { get S() { return S; }, get G() { return G; }, DIS, ACT, judge, startShift, finishPt, endShift, timeUp, score, rankName, rankIdx, fresh, setS: o => { S = Object.assign(fresh(), o); }, openTreat, submitTreat, get T() { return T; } };
PF.init().then(function () { startScr(); PF.ready(); });
})();
</script>
