<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Доктор</title>
<style>
:root{--bg:#e9f8f4;--ink:#23364a;--teal:#1fae9d;--teal2:#14867a;--red:#ff6b6b;--yel:#ffd23f;--card:#fff;--line:#cfe9e3;--mut:#6a7f8f;--ok:#2fb35a;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfeee8;color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scr[hidden],.modal[hidden]{display:none}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--teal);color:#fff;font-weight:700}
.top .sp{flex:1}
.pill{background:rgba(255,255,255,.22);border-radius:14px;padding:3px 10px;font-size:14px;white-space:nowrap}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--yel);transition:width .1s linear}
.bar.low i{background:var(--red)}
.body{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
.btn{display:block;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--teal2);margin:8px 0}
.btn.alt{background:#fff;color:var(--teal2);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--red);box-shadow:0 3px 0 #c94b4b}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.gift{background:#ffd54a;color:#5a3b00;box-shadow:0 3px 0 #d9a400}
.btn.gift small{display:block;font-size:12px;font-weight:600;opacity:.85}
.btn.sm{display:inline-block;width:auto;min-height:40px;font-size:15px;margin:0}
.card{background:var(--card);border-radius:16px;padding:10px;margin:0 0 10px;box-shadow:0 2px 0 var(--line);position:relative}
.pt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card)}
.av{flex:0 0 76px;height:76px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av b{position:absolute;right:-2px;bottom:-2px;font-size:22px}
.pt h3{margin:0;font-size:17px}
.pt .say{margin:2px 0 4px;color:var(--mut);font-style:italic;font-size:14px}
.sym{display:flex;flex-wrap:wrap;gap:4px}
.sym span{background:#fff4c9;border-radius:10px;padding:2px 8px;font-size:13px}
.tag{position:absolute;top:8px;right:8px;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff}
.tag.ok{background:var(--ok)}.tag.bad{background:var(--bad)}.tag.wait{background:var(--teal)}
.pt.done{opacity:.7}
.modal{position:absolute;inset:0;background:rgba(20,40,60,.55);display:flex;align-items:flex-end;z-index:20}
.modal.mid{align-items:center;padding:0 14px}
.sheet{background:var(--bg);width:100%;max-height:92%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden}
.mid .sheet{border-radius:20px}
.sheet .hd{display:flex;align-items:center;padding:10px 12px;font-weight:800;background:#fff;gap:8px}
.sheet .hd .sp{flex:1}
.x{background:#eef;border-radius:50%;width:36px;height:36px;font-size:18px}
.sheet .bd{overflow:auto;padding:10px 12px;flex:1}
.sheet .ft{padding:6px 12px 12px;background:#fff}
input[type=search],input[type=text]{width:100%;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:8px 12px;font:inherit;margin:0 0 8px}
.lst{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;text-align:left;min-height:44px}
.opt.sel{border-color:var(--teal);background:#dff7f2;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 10px;font-size:14px;min-height:40px}
.chip.sel{border-color:var(--teal);background:#dff7f2;font-weight:700}
.chip.hint{box-shadow:0 0 0 3px var(--yel)}
h2{margin:6px 0}
.step{font-weight:800;margin:8px 0 6px;color:var(--teal2)}
.big{font-size:56px;text-align:center;margin:6px 0}
.die{font-size:96px;text-align:center;line-height:1}
.die.roll{animation:sh .25s infinite}
@keyframes sh{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.1)}100%{transform:rotate(-12deg)}}
.center{text-align:center}.mut{color:var(--mut);font-size:14px}
.ent{background:#fff;border-radius:12px;padding:8px 10px;margin:0 0 8px;box-shadow:0 2px 0 var(--line)}
.ent b{display:block}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.start{justify-content:center;align-items:center;text-align:center;padding:24px;background:linear-gradient(#bff0e6,#e9f8f4)}
.logo{font-size:84px}
.start h1{margin:0 0 4px;font-size:40px;color:var(--teal2)}
.start .btn{max-width:300px}
.note{font-size:12px;color:var(--mut);margin-top:12px;max-width:300px}
.rank{font-size:26px;font-weight:800;color:var(--teal2);text-align:center;margin:4px 0}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.acc{background:#fff;border-radius:12px;margin:0 0 6px;box-shadow:0 2px 0 var(--line);overflow:hidden}
.acc>button{width:100%;text-align:left;background:#fff;padding:10px 12px;font-weight:700;min-height:46px}
.acc .in{padding:0 12px 10px;font-size:14px}
.acc .in p{margin:4px 0}
.ic{height:1.2em;width:auto;vertical-align:-0.2em}
.ico{height:1.5em;width:auto;vertical-align:-0.4em}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hdav{width:40px;height:40px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.hdav img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.docimg{display:block;margin:0 auto;height:96px;width:auto}
.dieimg{height:100px;width:auto;margin:0 auto;display:block}
.start.art{background-size:cover;background-position:center top}
.start.art .logo,.start.art h1,.start.art>p{display:none}
.start.art{justify-content:flex-end;padding-bottom:20px}
.start.art .btn{box-shadow:0 3px 0 rgba(0,0,0,.18)}
.start.art .stt{margin:24px 0 auto}
.row3{display:flex;gap:6px;width:100%;max-width:300px}
.row3 .btn{flex:1;min-height:42px;padding:6px 4px;font-size:13px;margin:6px 0}
.start.art .btn{min-height:44px;margin:5px 0}
.start.art .note{background:rgba(255,255,255,.8);border-radius:10px;padding:4px 8px;margin-top:6px}
.stt{font-size:44px;font-weight:800;color:#fff;text-shadow:0 3px 0 var(--teal2),0 0 12px rgba(0,0,0,.25);margin:0}
.lang{display:inline-flex;gap:0;margin-left:auto;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.25);font-size:13px;min-height:28px}
.lang b{padding:5px 9px;color:inherit;opacity:.7}
.lang b.on{background:#fff;color:var(--teal2);opacity:1}
.start>.lang{position:absolute;top:10px;left:10px;right:auto;z-index:5;background:rgba(0,0,0,.28);color:#fff}
:root{--pm-red:var(--teal2)}
.inplay .pm-corner{display:none}
.pm-on #scrEnd .top{padding-right:124px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:14px;z-index:40;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <section class="scr start" id="scrStart"></section>
  <section class="scr" id="scrPlay" hidden></section>
  <section class="scr" id="scrEnd" hidden></section>
  <div class="modal" id="mdl" hidden></div>
</div>

<script>

window.PF = (function () {
  'use strict';
  var ysdk = null, player = null, sdkOk = false, cloudOk = false, adBusy = false, tabHidden = false, apiPaused = false;
  var lastAdAt = 0, bornAt = Date.now(), AD_FIRST_MS = 120000, AD_GAP_MS = 300000, mem = {}, syncT = 0;
  var self = { onPause: function () {}, lang: '' };
  function isK(k) { return k.indexOf('doktor-') === 0; }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  self.get = function (k) { if (k in mem) return mem[k]; try { return localStorage.getItem(k); } catch (e) { return null; } };
  self.put = function (k, v) { v = String(v); mem[k] = v; lsSet(k, v); if (isK(k) && player && cloudOk) { clearTimeout(syncT); syncT = setTimeout(flush, 2500); } };
  self.del = function (k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  var KEYS = ['doktor-save', 'doktor-lang', 'doktor-premium'];
  function snapshot() { var d = {}; KEYS.forEach(function (k) { var v = self.get(k); if (v != null) d[k] = v; }); return d; }
  function flush() { if (!player || !cloudOk) return; try { var p = player.setData({ v: 1, d: snapshot() }, false); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  /* запись всего снимка в облако с подтверждением (нужна Премиуму: сначала срок в облаке, потом закрытие покупки) */
  self.saveNow = function () { if (!player || !cloudOk) return Promise.resolve(false); try { return Promise.resolve(player.setData({ v: 1, d: snapshot() }, true)).then(function () { return true; }, function () { return false; }); } catch (e) { return Promise.resolve(false); } };
  self.sdk = function () { return sdkOk ? ysdk : null; };
  function prem() { try { return !!(window.Premium && window.Premium.active()); } catch (e) { return false; } }
  self.premium = prem;
  self.paused = function () { return adBusy || tabHidden || apiPaused; };
  function changed() { try { self.onPause(self.paused()); } catch (e) {} }
  self.init = function () {

    if (!window.YaGames || !window.YaGames.init) return Promise.resolve();
    return new Promise(function (resolve) {
      var timer = setTimeout(resolve, 4000);
      window.YaGames.init().then(function (sdk) {

        try { self.lang = String(sdk.environment.i18n.lang || ''); } catch (e) {}
        try { sdk.on('game_api_pause', function () { apiPaused = true; changed(); }); sdk.on('game_api_resume', function () { apiPaused = false; changed(); }); } catch (e) {}
        return sdk.getPlayer({ scopes: false }).then(function (p) { player = p; return p.getData(); }).then(function (data) {
          var d = data && data.d;
          if (d && typeof d === 'object') {
            var fresh = !self.get('doktor-save');
            Object.keys(d).forEach(function (k) {
              if (!isK(k) || typeof d[k] !== 'string') return;
              if (k === 'doktor-premium') { var loc = self.get(k), v = d[k]; try { if (loc && window.Premium) v = window.Premium.mergeState(loc, d[k]); } catch (e) {} mem[k] = v; lsSet(k, v); }
              else if (fresh) { mem[k] = d[k]; lsSet(k, d[k]); }
            });
          }
          cloudOk = true;
        }, function () {});
      }).then(function () { clearTimeout(timer); resolve(); }, function () { clearTimeout(timer); resolve(); });
    });
  };
  self.ready = function () { try { var l = sdkOk && ysdk.features && ysdk.features.LoadingAPI; if (l) l.ready(); } catch (e) {} };
  self.setPlaying = function (on) { try { var g = sdkOk && ysdk.features && ysdk.features.GameplayAPI; if (g) { if (on) g.start(); else g.stop(); } } catch (e) {} };

    var fin = false; function end(s) { if (fin) return; fin = true; if (s) { lastAdAt = Date.now(); try { window.Premium && window.Premium.noteFullscreen(); } catch (e) {} } adBusy = false; changed(); done(); }

  };
  self.canReward = function () { return !!(sdkOk && !adBusy && ysdk.adv && ysdk.adv.showRewardedVideo); };
  self.rewarded = function (done) {
    if (!self.canReward()) { done(false); return; }

  return self;

й пластырь: внутри жидкость, под которой кожа заживает.","dis.24.s.0":"пузырёк на пятке","dis.24.s.1":"больно при ходьбе","dis.24.s.2":"новая обувь","dis.24.s.3":"кожа красная"},"en":{"title":"Doctor","start.sub":"Treat patients in 90 seconds and become a Professor!","start.cont":"▶ Continue (Shift {n})","start.new":"New Game","start.play":"▶ Play","start.note":"This game teaches basic first aid. It does not replace a doctor. If you feel sick, tell an adult.","btn.book":"Guidebook","btn.notes":"Notebook","btn.how":"How to Play","btn.close":"Close","play.shift":"Shift {n}/{m}","unit.sec":"s","tag.wait":"waiting","tag.ok":"treated","tag.worse":"worse","tag.gone":"left","treat.go":"Treat","treat.step1":"1. What's wrong?","treat.search":"Search by name","treat.step2":"2. Choose treatments (up to {n})","treat.hint":"Hint ({n})","treat.change":"↩ Change Diagnosis","treat.none":"Nothing found","toast.max":"No more than {n}","toast.nohints":"No hints left. Get more by watching a video or in a new season","toast.nohints2":"No hints left. New ones come in a new season","toast.allchosen":"You've picked everything needed","toast.timeup":"Time's up!","die.title":"Almost Right!","die.text":"Your diagnosis is correct, but some treatments are missing or extra. Roll the die to decide: <b>even = treated</b>, odd = gets worse.","die.roll":"🎲 Roll the Die","die.reroll":"🎬 Roll Again (Ad)","die.next":"Next","die.even":"You rolled {n} — even! Patient treated!","die.odd":"You rolled {n} — odd! Patient got worse.","fb.full":"🎉 Patient Treated!","fb.lucky":"😅 Lucky! Patient treated","fb.worse":"😣 Got worse","fb.gone":"🚪 Went to another doctor","fb.rep":"Reputation {n}","fb.diagok":"Correct diagnosis: {name}","fb.diagbad":"Wrong diagnosis.","fb.was":"It was: <b>{name}</b>","fb.chosen":"(you chose: {name})","fb.need":"Needed","fb.extra":"Extra or harmful: {list}","fb.dont":"What not to do:","fb.next":"Next","end.title":"Shift {n} Results","end.cured":"Treated: {k} of {n}","end.rank":"Current  to blue, green, and yellow as your body clears away the blood under your skin.","dis.1.s.0":"pain where the bump happened","dis.1.s.1":"bump or bruise","dis.1.s.2":"hurts to touch","dis.1.s.3":"can move it, but it hurts","dis.2.n":"Scrape","dis.2.c":"I fell off my scooter and scraped my elbow.","dis.2.w":"Rubbing against the ground scraped off the top layer of skin.","dis.2.x":"Don't pick at the scab or touch it with dirty hands. See a doctor if the wound is deep or gets redder and more painful.","dis.2.f":"Skin is the body's largest organ. It renews itself about once a month.","dis.2.s.0":"scraped skin","dis.2.s.1":"stinging and burning","dis.2.s.2":"dirt around the scrape","dis.2.s.3":"tiny drops of blood","dis.3.n":"Nosebleed","dis.3.c":"Blood is dripping from my nose!","dis.3.w":"Your nose has many tiny blood vessels near the surface. Dry air or a small bump can damage them.","dis.3.x":"Don't tilt your head back or lie down. See a doctor if the bleeding lasts more than 15–20 minutes.","dis.3.f":"Your nose warms and moistens the air you breathe, so it has lots of blood vessels.","dis.3.s.0":"blood dripping from nose","dis.3.s.1":"started after sneezing, heat, or nose picking","dis.3.s.2":"not feeling dizzy","dis.3.s.3":"bleeding from one nostril","dis.4.n":"Splinter","dis.4.c":"Ouch! I have a splinter in my finger!","dis.4.w":"A tiny piece of wood got stuck under the skin.","dis.4.x":"Don't dig deep with a needle. See a doctor if you can't remove it or your finger turns red.","dis.4.f":"People used to remove splinters with a needle heated over a flame. Today, clean tweezers and handwashing are enough.","dis.4.s.0":"pain in fingertip","dis.4.s.1":"dark dot under the skin","dis.4.s.2":"touched a wooden fence","dis.4.s.3":"hurts when pressed","dis.5.n":"Minor Burn","dis.5.c":"I grabbed a hot mug!","dis.5.w":"Hot water, steam, or an object damaged the top layer of skin.","dis.5.x":"Don't put oil or ice on the burn or pop blisters. See a doctor right away for a large burn or blisters.","dis.5.f":"Cool a burn under cool (not icy!) water for 10–15 minutes.","dis.5.s.0":"red skin","dis.5.s.1":"burning feeling","dis.5.s.2":"small affected area","dis.5.s.3":"no blisters","dis.6.n":"Bee Sting","dis.6.c":"A bee stung me!","dis.6.w":"The bee left its stinger and a little venom in the skin.","dis.6.x":"Don't squeeze the stinger or scratch the area. If the face swells or breathing becomes difficult, call emergency services (112) right away.","dis.6.f":"A bee dies after stinging, so it only stings to protect itself.","dis.6.s.0":"sharp pain in one spot","dis.6.s.1":"red spot and swelling","dis.6.s.2":"tiny stinger visible","dis.6.s.3":"burning and itching","dis.7.n":"Sunstroke","dis.7.c":"I feel sick... I've been in the sun all day.","dis.7.w":"The head got too hot from being in the sun.","dis.7.x":"Don't stay in the sun. If the person gets worse or faints, call emergency services (112).","dis.7.f":"Wearing a sun hat or cap greatly lowers the risk of sunstroke.","dis.7.s.0":"headache and dizziness","dis.7.s.1":"red face and feeling hot","dis.7.s.2":"feeling sick to the stomach","dis.7.s.3":"spent a long time in the sun without a hat","dis.8.n":"Food Poisoning","dis.8.c":"My stomach hurts after eating a wrap from a street food stand.","dis.8.w":"Germs or their toxins in spoiled or poorly washed food.","dis.8.x":"Don't eat fatty or spicy foods or take medicine without an adult. See a doctor if you have a fever, blood in your stool, or symptoms that won't go away.","dis.8.f":"Washing your hands before eating is the best way to protect against many stomach germs.","dis.8.s.0":"feeling nauseous","dis.8.s.1":"stomachache","dis.8.s.2":"weakness","dis.8.s.3":"ate something suspicious","dis.9.n":"Toothache","dis.9.c":"My tooth hurts! I can't eat!","dis.9.w":"Germs in your mouth turn sugar into acid. The acid damages tooth enamel and causes cavities.","dis.9.x":"Don't heat your cheek or put off seeing a dentist.","dis.9.f":"Tooth enamel is the hard function startShift() {
  const tier = tierOf(S.shift), pool = poolOf(tier), n = countOf(S.shift), picks = [];
  let first = pool[rnd(pool.length)]; picks.push(first);
  while (picks.length < n) {
    let cand = null;
    if (tier > 1 && Math.random() < 0.55) { const sim = pool.filter(d => d.g === picks[picks.length - 1].g && !picks.includes(d)); if (sim.length) cand = sim[rnd(sim.length)]; }
    if (!cand) { const rest = pool.filter(d => !picks.includes(d)); cand = rest[rnd(rest.length)]; }
    picks.push(cand);
  }
  const used = [], pts = picks.map(d => {
    const male = !!d.m;
    let opts = PAT.filter(p => !used.includes(p[0]) && (!male || p[2] === 'm'));
    if (!opts.length) opts = PAT.filter(p => !used.includes(p[0]));
    const p = opts[rnd(opts.length)]; used.push(p[0]);
    return { dis: d, p, st: 'wait', res: null };
  });
  const T0 = timeOf(S.shift);
  G = { pts, t: T0, T: T0, tier, pool, open: -1, modal: false, done: false, last: 0 };
  show('scrPlay'); renderPlay(); PF.setPlaying(true); closeModal();
  if (S.shift === 1 && !S.seenTutorial) { S.seenTutorial = 1; save(); howTo(); }
}
let lastTick = performance.now();
setInterval(function () {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (!G || G.done || G.modal || PF.paused() || $('scrPlay').hidden) return;
  G.t -= dt * (G.tier === 1 ? 0.75 : 1);
  if (G.t <= 0) { G.t = 0; timeUp(); } else updateBar();
}, 100);
function updateBar() { const b = $('bar'); if (!b) return; const f = Math.max(0, G.t / G.T); b.firstChild.style.width = f * 100 + '%'; b.classList.toggle('low', f < 0.25); $('tl').textContent = Math.ceil(G.t) + ' ' + t('unit.sec'); }
function timeUp() {
  closeModal();
  G.pts.forEach(p => { if (p.st === 'wait') { p.st = 'gone'; p.res = { v: 'timeout' }; S.rep = Math.max(0, S.rep - 4); S.total++; note(p, [], -1, 'timeout'); } });
  toast(t('toast.timeup')); endShift();
}
function note(p, acts, diag, verdict) { S.notes.unshift({ s: S.shift, di: p.dis.i, pick: diag, acts: acts, v: verdict }); if (S.notes.length > 60) S.notes.length = 60; }

function renderPlay() {
  const el = $('scrPlay');
  el.innerHTML =
    '<div class="top"><span class="pill">' + t('play.shift', { n: S.shift, m: SEASON }) + '</span><div class="bar" id="bar"><i></i></div><span class="pill" id="tl"></span></div>' +
    '<div class="top" style="background:var(--teal2);padding:4px 10px;font-size:14px"><span>' + img('ic_star', '⭐', 'ic') + ' ' + S.rep + '</span><span class="sp"></span><span>' + rankName() + '</span><span class="sp"></span><span>' + img('ic_book', '📖', 'ic') + ' ' + G.pool.length + '</span></div>' +
    '<div class="body" id="pl"></div>' +
    '<div style="display:flex;gap:8px;padding:8px 10px;background:#fff"><button class="btn alt sm" style="flex:1" id="bBook">' + img('ic_book', '📖', 'ic') + ' ' + t('btn.book') + '</button><button class="btn alt sm" style="flex:1" id="bNote">' + img('ic_notes', '📓', 'ic') + ' ' + t('btn.notes') + '</button></div>';
  $('bBook').onclick = () => openBook(); $('bNote').onclick = () => openNotes();
  const pl = $('pl');
  if (ART.bg_office) pl.style.background = 'url(img/bg_office.webp) center top/cover no-repeat';
  pl.innerHTML = G.pts.map((q, i) => ptCard(q, i)).join('');
  pl.querySelectorAll('.pt').forEach(b => b.onclick = () => { const q = G.pts[+b.dataset.i]; if (q.st === 'wait') openTreat(+b.dataset.i); });
  updateBar();
}
function avatar(q) {
  const mood = q.st === 'wait' ? '😷' : q.st === 'cured' ? '😊' : q.st === 'worse' ? '😣' : '🚶';
  const k = 'pat_' + q.p[0] + '_' + (q.st === 'wait' ? 'sick' : q.st === 'cured' ? 'happy' : q.st === 'worse' ? 'worse' : 'neutral');
  return '<div class="av">' + (ART[k] ? img(k, q.p[3]) : q.p[3] + '<b>' + mood + '</b>') + '</div>';
}
function ptCard(q, i) {
  const tag = q.st === 'wait' ? '<span class="tag wait">' + t('tag.wait') + '</span>' : q.st === 'cured' ? '<span class="tag ok">' + t('tag.ok') + '</span>' : q.st === 'worse' ? '<span class="tag bad">' + t('tag.worse') + '</span>' : '<span class="tag bad">' + t('tag.gone') + '</span>';
  return '<div class="card"><button class="pt' + (q.st === 'wait' ? '' : ' done') + '" data-i="' + i + '">' + avatar(q) +
    '<div style="flex:1"><h3>' + esc(pname(q.p)) + ', ' + q.p[1] + '</h3><div class="say">«' + esc(q.dis.c) + '»</div><div class="sym">' + q.dis.s.map(s => '<span>' + esc(s) + '</span>').join('') + '</div></div></button>' + tag + '</div>';
}

/* ---------- Лечение ---------- */
let T = null;   // { i, diag, acts, hintAct }
function openTreat(i) {
  T = { i, diag: -1, acts: [], hint: null, q: '' };
  G.modal = true; drawTreat();
}
function actList() { // Л1: только назначения, нужные для 10 состояний уровня; дальше все
  if (G.tier > 1) return Object.keys(ACT);
  const set = new Set(); G.pool.forEach(d => d.d.concat(d.b).forEach(a => set.add(a))); return Object.keys(ACT).filter(a => set.has(a));
}
function drawTreat() {
  const q = G.pts[T.i], m = $('mdl'); m.hidden = false; m.className = 'modal';
  m.innerHTML = '<div class="sheet"><div class="hd"><span class="hdav">' + (ART['pat_' + q.p[0] + '_neutral'] ? img('pat_' + q.p[0] + '_neutral', q.p[3]) : q.p[3]) + '</span><span>' + esc(pname(q.p)) + '</span><span class="sp"></span><button class="x" id="tClose" aria-label="' + esc(t('btn.close')) + '">✕</button></div><div class="bd" id="tBd"></div><div class="ft"><div class="row2"><button class="btn alt sm" id="tBook">' + img('ic_book', '📖', 'ic') + ' ' + t('btn.book') + '</button><button class="btn sm" id="tGo">' + t('treat.go') + '</button></div></div></div>';
  $('tClose').onclick = () => { T = null; closeModal(); };
  $('tBook').onclick = () => openBook(true);
  $('tGo').onclick = submitTreat;
  drawTreatBody();
}
function drawTreatBody() {
  const q = G.pts[T.i];
  $('tBd').innerHTML = '<div class="say mut">«' + esc(q.dis.c) + '»</div><div class="sym" style="margin-bottom:6px">' + q.dis.s.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' +
    '<div class="step">' + t('treat.step1') + '</div><input type="search" id="tQ" placeholder="' + esc(t('treat.search')) + '" value="' + esc(T.q) + '"><div class="lst" id="tDx"></div>' +
    '<div class="step">' + t('treat.step2', { n: MAXPICK }) + ' <span id="tCnt" class="mut"></span></div>' +
    '<div class="chips" id="tAc"></div><div style="margin-top:8px"><button class="btn alt sm" id="tHint">' + img('ic_bulb', '💡', 'ic') + ' ' + t('treat.hint', { n: S.hints }) + '</button></div>';
  $('tQ').oninput = e => { T.q = e.target.value; drawDx(); };
  $('tHint').onclick = useHint;
  drawDx(); drawAc();
}
function drawDx() {
  if (T.diag >= 0 && !T.change) {
    const d = DIS[T.diag]; $('tQ').hidden = true;
    $('tDx').innerHTML = '<button class="opt sel">' + d.e + ' ' + esc(d.n) + '</button><button class="btn alt sm" id="tChg">' + t('treat.change') + '</button>';
    $('tChg').onclick = () => { T.change = true; $('tQ').hidden = false; drawDx(); }; updGo(); return;
  }
  const q = T.q.trim().toLowerCase();
  const list = G.pool.filter(d => !q || d.n.toLowerCase().includes(q)).sort(byName);
  $('tDx').innerHTML = list.map(d => '<button class="opt' + (T.diag === d.i ? ' sel' : '') + '" data-i="' + d.i + '">' + d.e + ' ' + esc(d.n) + '</button>').join('') || '<div class="mut">' + t('treat.none') + '</div>';
  $('tDx').querySelectorAll('.opt').forEach(b => b.onclick = () => { T.diag = +b.dataset.i; T.change = false; drawDx(); updGo(); });
  updGo();
}
function drawAc() {
  $('tAc').innerHTML = actList().map(a => '<button class="chip' + (T.acts.includes(a) ? ' sel' : '') + (T.hint === a ? ' hint' : '') + '" data-a="' + a + '">' + ico(a) + ' ' + esc(ACT[a][0]) + '</button>').join('');
  $('tAc').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const a = b.dataset.a, k = T.acts.indexOf(a);
    if (k >= 0) T.acts.splice(k, 1); else if (T.acts.length < MAXPICK) T.acts.push(a); else toast(t('toast.max', { n: MAXPICK }));
    drawAc(); updGo();
  });
  $('tCnt').textContent = T.acts.length + '/' + MAXPICK;
}
function updGo() { const b = $('tGo'); if (b) b.disabled = T.diag < 0 || !T.acts.length; }
function useHint() {
  if (S.hints <= 0) { PF.rewarded(ok => { if (ok) { S.hints++; save(); drawTreatBody(); } else toast(t('toast.nohints')); }); return; }
  const d = G.pts[T.i].dis, left = d.d.filter(a => !T.acts.includes(a) && actList().includes(a));
  if (!left.length) { toast(t('toast.allchosen')); return; }
  T.hint = left[0]; S.hints--; save(); drawTreatBody();
}
function submitTreat() {
  const q = G.pts[T.i], acts = T.acts.slice(), diag = T.diag, frac = G.t / G.T;
  const r = judge(q.dis, diag, acts);
  G.modal = true;
  if (r.v === 'half') rollDie(q, r, diag, acts, frac); else finishPt(q, r.v === 'full' ? 'cured' : 'gone', r, diag, acts, frac, null);
}
function rollDie(q, r, diag, acts, frac) {
  const freeRe = PF.premium() && (S.freeRe || 0) > 0;
  const m = $('mdl'); m.className = 'modal mid';
  m.innerHTML = '<div class="sheet"><div class="bd center">' + img('doctor_think', '', 'docimg') + '<h2>' + t('die.title') + '</h2><p>' + t('die.text') + '</p><div class="die" id="die">' + dieFace(6) + '</div><div id="dieTx" class="mut">&nbsp;</div></div><div class="ft"><button class="btn" id="dieGo">' + t('die.roll') + '</button></div></div>';
  $('dieGo').insertAdjacentHTML('afterend', '<button class="btn alt" id="dieRe" hidden>' + (freeRe ? t('die.reroll.gift') : t('die.reroll')) + '</button>');
  let rerolled = false;
  const roll = () => {
    $('dieGo').disabled = true; $('dieRe').hidden = true;
    const die = $('die'); die.classList.add('roll');
    const iv = setInterval(() => { die.innerHTML = dieFace(1 + rnd(6)); }, 90);
    setTimeout(() => {
      clearInterval(iv); die.classList.remove('roll');
      const n = 1 + rnd(6); die.innerHTML = dieFace(n);
      const ok = n % 2 === 0;
      $('dieTx').innerHTML = '<b class="' + (ok ? 'good' : 'badc') + '">' + t(ok ? 'die.even' : 'die.odd', { n }) + '</b>';
      $('dieGo').disabled = false; $('dieGo').textContent = t('die.next');
      $('dieGo').onclick = () => finishPt(q, ok ? 'cured' : 'worse', r, diag, acts, frac, n);
      /* второй бросок за ролик: только если площадка даёт рекламу и бросок не удался */
      if (!ok && !rerolled && (freeRe || PF.canReward())) {
        $('dieRe').hidden = false;
        if (freeRe) $('dieRe').onclick = () => { S.freeRe = Math.max(0, (S.freeRe || 0) - 1); save(); rerolled = true; roll(); };
        else $('dieRe').onclick = () => PF.rewarded(got => { if (got) { rerolled = true; roll(); } });
      }
    }, 1300);
  };
  $('dieGo').onclick = roll;
}
function finishPt(q, st, r, diag, acts, frac, die) {
  const d = q.dis, half = r.v === 'half', full = r.v === 'full';
  q.st = st; q.res = r; S.total++; S.speedSum += frac;
  let dr = 0;
  if (st === 'cured') { S.cured++; dr = full ? 3 + (frac >= 0.5 ? 1 : 0) : 1; }
  else if (st === 'worse') dr = -3; else dr = -5;
  S.rep = Math.max(0, Math.min(100, S.rep + dr));
  if (st !== 'cured' || half) note(q, acts, diag, st === 'cured' ? 'half-ok' : st === 'worse' ? 'worse' : 'wrong');
  if (!S.seen.includes(d.i)) S.seen.push(d.i);
  save();
  showFeedback(q, st, r, diag, acts, dr);
}
function showFeedback(q, st, r, diag, acts, dr) {
  const d = q.dis, m = $('mdl'); m.hidden = false; m.className = 'modal mid';
  const head = st === 'cured' ? t(r.v === 'full' ? 'fb.full' : 'fb.lucky') : st === 'worse' ? t('fb.worse') : t('fb.gone');
  const diagTx = diag === d.i ? '<span class="good">' + t('fb.diagok', { name: esc(d.n) }) + '</span>' : '<span class="badc">' + t('fb.diagbad') + '</span> ' + t('fb.was', { name: esc(d.n) }) + (diag >= 0 ? ' ' + t('fb.chosen', { name: esc(DIS[diag].n) }) : '');
  const need = d.d.map(a => '<span class="chip ' + (acts.includes(a) ? 'sel' : '') + '">' + (acts.includes(a) ? '✔ ' : '') + ico(a) + ' ' + esc(ACT[a][0]) + '</span>').join('');
  const wrong = acts.filter(a => !d.d.includes(a)).map(a => ACT[a][1] + ' ' + ACT[a][0]);
  m.innerHTML = '<div class="sheet"><div class="bd">' + (st === 'cured' ? img('doctor_smile', '', 'docimg') : '') + '<h2 class="center">' + head + '</h2><div class="center mut">' + t('fb.rep', { n: (dr >= 0 ? '+' : '') + dr }) + '</div><p>' + diagTx + '</p>' +
    '<div class="step">' + t('fb.need') + '</div><div class="chips">' + need + '</div>' +
    (wrong.length ? '<p class="mut">' + t('fb.extra', { list: esc(wrong.join('; ')) }) + '</p>' : '') +
    '<p><b>' + t('fb.dont') + '</b> ' + esc(d.x) + '</p><p class="mut">💡 ' + esc(d.f) + '</p></div><div class="ft"><button class="btn" id="fbNext">' + t('fb.next') + '</button></div></div>';
  $('fbNext').onclick = () => { T = null; closeModal(); renderPlay(); if (G.pts.every(p => p.st !== 'wait')) endShift(); };
}
function closeModal() { const m = $('mdl'); m.hidden = true; m.innerHTML = ''; if (G) G.modal = false; }

/* ---------- Конец смены ---------- */
function endShift() {

  const last = S.shift === SEASON;

}

    G.pts.map(p => '<div class="ent"><b>' + p.p[3] + ' ' + esc(pname(p.p)) + ' — ' + esc(p.dis.n) + '</b><span class="' + (p.st === 'cured' ? 'good' : 'badc') + '">' + VS[p.st] + '</span></div>').join('') +

function finalScr() {
  const r = rankIdx(), el = $('scrEnd');

    giftBtn() +
    (has ? '<button class="btn" id="sCont">' + t('start.cont', { n: S.shift }) + '</button><button class="btn alt" id="sNew">' + t('start.new') + '</button>' : '<button class="btn" id="sNew">' + t('start.play') + '</button>') +
    '<div class="row3"><button class="btn alt" id="sBook">' + img('ic_book', '📖', 'ic') + ' ' + t('btn.book') + '</button><button class="btn alt" id="sNote">' + img('ic_notes', '📓', 'ic') + ' ' + t('btn.notes') + '</button><button class="btn alt" id="sHow">' + t('btn.how') + '</button></div>' +
    '<div class="note">' + t('start.note') + '</div>';
  if (has) $('sCont').onclick = () => startShift();
  if ($('sGift')) $('sGift').onclick = () => { claimGift(); };
  $('sNew').onclick = () => { S = fresh(); save(); startShift(); };
  $('sBook').onclick = () => openBook(); $('sNote').onclick = () => openNotes(); $('sHow').onclick = () => howTo();
  bindLang(startScr);
  const sc = $('scrStart');
  if (ART.cover) { sc.className = 'scr start art'; sc.style.backgroundImage = 'url(img/cover.webp)'; sc.insertAdjacentHTML('afterbegin', '<div class="stt">' + t('title') + '</div>'); }
  show('scrStart');
}
PF.onPause = function () {};

PF.init().then(function () { LANG = pickLang(); applyLang(); startScr(); PF.ready(); initPremium(); });
})();
</script>
</body>
</html>
