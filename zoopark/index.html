<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Зоопарк</title>
<style>
:root{--ink:#3b2a1a;--paper:#fff4d6;--paper2:#ffe9b0;--sun:#ffcf4a;--red:#e8604c;--blue:#4aa8d8;--green:#5cb85c;--bg:#f6e7c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:5px 7px 6px;gap:5px}
#hud{display:flex;gap:5px;flex:none}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:4px 8px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;white-space:nowrap;color:var(--ink);font-family:inherit}
#hDay{flex:1.1}#hMoney{flex:1.5;justify-content:center;color:#1e6b2c;font-size:15px}#hRep{flex:.9;justify-content:center;color:#b8860b}#hCoin{flex:.7;justify-content:center;color:#7a4db3;cursor:pointer}
#btnMenu{font-size:19px;padding:2px 11px;cursor:pointer}
#info{flex:none;background:var(--paper2);border:3px solid var(--ink);border-radius:11px;padding:4px 9px;font-size:12.5px;line-height:1.3;min-height:44px}
#info .warn{color:#b8321f;font-weight:800}
#mapWrap{flex:0 0 27dvh;min-height:150px;overflow-y:auto;overflow-x:hidden;border:3px solid var(--ink);border-radius:13px;background:#a6d874;-webkit-overflow-scrolling:touch}
canvas#map{display:block;width:100%;height:auto}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#pcontent{flex:1;min-height:0;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:13px;padding:7px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.35}
#pfoot{flex:none;display:flex;gap:6px}#pfoot .btn{flex:1}#pfoot .btn.go{flex:1.6}
#tabs{flex:none;display:flex;gap:4px}
.tab{flex:1;font:inherit;font-weight:800;font-size:12px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:7px 0;min-height:40px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.tab.on{background:var(--sun);transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.btn{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:13px;padding:8px 12px;min-height:44px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:17px}
.btn.alt{background:var(--paper2)}.btn.red{background:var(--red);color:#fff}.btn.sm{min-height:34px;padding:3px 10px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:6px;align-items:center}.row>.grow{flex:1}
.head{font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed #d9c48a;padding:2px 0}.kv b{text-align:right}
.hint{font-size:12.5px;opacity:.85;line-height:1.35}
.warn{color:#b8321f;font-weight:800}.good{color:#1e6b2c;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.item{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:11px;padding:2px 1px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1.12;box-shadow:0 3px 0 var(--ink)}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.item canvas{width:40px;height:40px}.item b{font-size:10.5px}.item span{font-size:10.5px;font-weight:800;color:#1e6b2c}.item small{font-size:9px;opacity:.8}
.item.no{opacity:.5}
.elist{display:flex;flex-direction:column;gap:5px}
.erow{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:3px 8px;cursor:pointer}
.erow.on{background:#fff2b8}.erow canvas{width:34px;height:34px;flex:none}
.step{display:flex;align-items:center;gap:6px}.step b{min-width:22px;text-align:center;font-size:16px}
.step .btn{min-height:34px;width:38px;padding:0;font-size:18px;box-shadow:0 3px 0 var(--ink)}
#ov{position:fixed;inset:0;background:rgba(59,42,26,.55);display:flex;align-items:center;justify-content:center;padding:8px;z-index:10;overflow:auto}
#ov.hidden{display:none}
#card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:12px;width:100%;max-width:400px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px}
#card h2{margin:0;font-size:21px}#card p{margin:0;line-height:1.4;font-size:14.5px}
.q{font-size:16px;line-height:1.4;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:1px 8px}
.fld{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:5px 9px;cursor:pointer;min-height:42px}
.fld.on{background:#fff2b8;box-shadow:0 0 0 3px var(--sun)}.fld span{flex:1;font-size:13.5px;font-weight:700}.fld b{font-size:22px;min-width:60px;text-align:right}.fld small{width:26px;opacity:.7}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad .btn{font-size:20px;padding:4px 0;min-height:44px}
.ok{background:#dff3d2;border:3px solid var(--ink);border-radius:11px;padding:8px}.bad{background:#ffdcd3;border:3px solid var(--ink);border-radius:11px;padding:8px}
.sum{width:100%;border-collapse:collapse;font-size:14px}.sum td{padding:2px 0;border-bottom:2px dashed #cdb57d}.sum td:last-child{text-align:right;font-weight:800}
.sum tr.sub td{font-weight:800;border-bottom:2px solid var(--ink)}
.stars{font-size:36px;text-align:center;letter-spacing:6px;color:#e5a600;text-shadow:0 2px 0 var(--ink)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:800}.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 4px 1px}.fr b{padding-top:1px}
.ic{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.tic{width:26px;height:26px;object-fit:contain}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1;padding:3px 0}
.evi{width:56px;height:56px;object-fit:contain;flex:none}.evrow{display:flex;gap:8px;align-items:center}
.pic{width:42px;height:42px;object-fit:contain;flex:none}
.hero{position:relative}.hero h2{position:absolute;top:5%;left:0;right:0;text-align:center;color:#fff;margin:0;line-height:1.05;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.cover{width:100%;max-height:52dvh;object-fit:cover;object-position:center top;border-radius:12px;border:3px solid var(--ink);display:block}
#toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:92%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="hDay">День 1/60</div>
    <div class="chip" id="hMoney">0 ₽</div>
    <div class="chip" id="hRep">★ 2,5</div>
    <button class="chip" id="hCoin" aria-label="Монеты знаний">◎ 0</button>
    <button class="chip" id="btnMenu" aria-label="Меню">≡</button>
  </div>
  <div id="info"></div>
  <div id="mapWrap"><canvas id="map" width="720" height="720"></canvas></div>
  <div id="panel">
    <div id="pcontent"></div>
    <div id="pfoot"></div>
    <div id="tabs"></div>
  </div>
</div>
<div id="ov" class="hidden"><div id="card"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= ДАННЫЕ ================= */
const DAYS=60, COLS=20, CP=18;
const SAVE_KEY='zoopark-save-v2', BEST_KEY='zoopark-best-v2';
let START_MONEY=60000, START_ROWS=20, ROW_STEP=1;
let P_FOOD=30, P_BAG=2400, BAG=100, P_FENCE=100, P_FENCE_X=150, P_WATER=20, P_MEAL_COST=60;
let SAL_W=900, SAL_V=1600, N_FEED=8, N_CLEAN=120, N_KASSA=60, N_CAFE=40, N_VET=15, REP_A=.6, REP_B=.6;
let BASE_A=120, BASE_C=60, BASE_M=90, CAFE_PRICE=15000, SELL_K=.7, LOAN_MAX=60000, LOAN_RATE=.1, LOAN_DAYS=10;
let REWARD=[300,500,700,1000], GRADE=['4 класс','5 класс','5–6 класс','6 класс'];
const ANI={
 rab:{name:'Кролик',pl:['кролик','кролика','кроликов'],price:2000,area:2,kg:1,vis:3,gr:'#b9dc8a'},
 goat:{name:'Коза',pl:['коза','козы','коз'],price:4000,area:6,kg:3,vis:5,gr:'#a8d57a'},
 peng:{name:'Пингвин',pl:['пингвин','пингвина','пингвинов'],price:7000,area:4,kg:2,vis:8,gr:'#cfe9f2'},
 monk:{name:'Обезьяна',pl:['обезьяна','обезьяны','обезьян'],price:12000,area:10,kg:4,vis:11,gr:'#8fcf7a'},
 zebra:{name:'Зебра',pl:['зебра','зебры','зебр'],price:20000,area:24,kg:10,vis:16,gr:'#d9d58a'},
 lion:{name:'Лев',pl:['лев','льва','львов'],price:30000,area:30,kg:8,vis:24,gr:'#e3cf8e'},
 giraf:{name:'Жираф',pl:['жираф','жирафа','жирафов'],price:40000,area:50,kg:15,vis:30,gr:'#c9d98c'},
 slon:{name:'Слон',pl:['слон','слона','слонов'],price:60000,area:60,kg:120,vis:70,gr:'#d8cba0'}
};
const AIDS=Object.keys(ANI);

/* ================= УТИЛИТЫ ================= */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const num=n=>String(n).replace('.',',');
const plur=(n,f)=>{const a=n%100,b=n%10;return(a>10&&a<15)?f[2]:b===1?f[0]:(b>1&&b<5)?f[1]:f[2];};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400);}
function lsGet(k){try{const v=PF.get(k);return v==null?null:JSON.parse(v);}catch(e){return null;}}
function lsSet(k,v){try{PF.put(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{PF.del(k);}catch(e){}}
const INK='#3b2a1a';

/* Слой платформы (как в «Кругосветке»): Яндекс Игры SDK, если страница запущена на площадке; иначе заглушки.
   Хранилище идёт через PF.get/put/del: localStorage + зеркало в памяти + облако (player.setData). */
const PF=(function(){
  "use strict";
  var ysdk=null,player=null,sdkOk=false,cloudOk=false,gaveUp=false,wantReady=false,readyDone=false;
  var adBusy=false,tabHidden=false,apiPaused=false,gpOn=false,wantGp=false,lastAdAt=0,bornAt=Date.now();
  var AD_FIRST_MS=120000,AD_GAP_MS=180000,INIT_TIMEOUT_MS=4000,SYNC_DELAY_MS=2500,T_KEY="zoopark-syncT";
  var mem={},dirty=false,syncTimer=0,self={onPause:function(){}};
  function isSynced(k){return k!==T_KEY&&k.indexOf("zoopark-")===0;}
  function lsSetRaw(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsDelRaw(k){try{localStorage.removeItem(k);}catch(e){}}
  function seedMem(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(isSynced(k)||k===T_KEY)mem[k]=localStorage.getItem(k);}}catch(e){}}
  function localT(){return Number(mem[T_KEY])||0;}
  function schedule(){if(!syncTimer&&player&&cloudOk)syncTimer=setTimeout(function(){flush(false);},SYNC_DELAY_MS);}
  function touch(){var t=String(Date.now());mem[T_KEY]=t;lsSetRaw(T_KEY,t);dirty=true;schedule();}
  self.get=function(k){if(Object.prototype.hasOwnProperty.call(mem,k))return mem[k];try{return localStorage.getItem(k);}catch(e){return null;}};
  self.put=function(k,raw){mem[k]=raw;lsSetRaw(k,raw);if(isSynced(k))touch();};
  self.del=function(k){delete mem[k];lsDelRaw(k);if(isSynced(k))touch();};
  function importCloud(data){
    var d=data&&typeof data==="object"?data:{},ct=Number(d._t)||0,blob=d.d&&typeof d.d==="object"?d.d:null;
    if(blob&&ct>localT()){
      Object.keys(mem).forEach(function(k){if(isSynced(k)){delete mem[k];lsDelRaw(k);}});
      Object.keys(blob).forEach(function(k){if(isSynced(k)&&typeof blob[k]==="string"){mem[k]=blob[k];lsSetRaw(k,blob[k]);}});
      mem[T_KEY]=String(ct);lsSetRaw(T_KEY,String(ct));dirty=false;
    }else if(localT()>ct){dirty=true;}
    cloudOk=true;if(dirty)schedule();
  }
  function flush(now){
    clearTimeout(syncTimer);syncTimer=0;
    if(!dirty||!player||!cloudOk)return;
    var d={};Object.keys(mem).forEach(function(k){if(isSynced(k)&&mem[k]!=null)d[k]=mem[k];});
    dirty=false;
    try{var p=player.setData({v:1,_t:localT(),d:d},!!now);if(p&&p.catch)p.catch(function(){dirty=true;});}catch(e){dirty=true;}
  }
  self.paused=function(){tabHidden=!!document.hidden;return adBusy||tabHidden||apiPaused;};
  function applyGp(){
    if(!sdkOk||!readyDone)return;
    var should=wantGp&&!self.paused();if(should===gpOn)return;gpOn=should;
    try{var g=ysdk.features&&ysdk.features.GameplayAPI;if(g){if(should)g.start();else g.stop();}}catch(e){}
  }
  function changed(){applyGp();try{self.onPause(self.paused());}catch(e){}}
  function onVis(){tabHidden=!!document.hidden;if(tabHidden)flush(true);changed();}
  self.setPlaying=function(on){wantGp=!!on;applyGp();};
  function tryReady(){
    if(readyDone||!wantReady||!sdkOk)return;readyDone=true;
    try{var l=ysdk.features&&ysdk.features.LoadingAPI;if(l)l.ready();}catch(e){}
    applyGp();
  }
  self.ready=function(){wantReady=true;tryReady();};
  self.init=function(){
    seedMem();
    try{document.addEventListener("visibilitychange",onVis);window.addEventListener("pagehide",function(){flush(true);});}catch(e){}
    if(!window.YaGames||!window.YaGames.init)return Promise.resolve();
    return new Promise(function(resolve){
      var timer=setTimeout(function(){gaveUp=true;resolve();},INIT_TIMEOUT_MS);
      function fin(){clearTimeout(timer);resolve();}
      window.YaGames.init().then(function(sdk){
        ysdk=sdk;sdkOk=true;
        try{sdk.on("game_api_pause",function(){apiPaused=true;changed();});sdk.on("game_api_resume",function(){apiPaused=false;changed();});}catch(e){}
        tryReady();
        return sdk.getPlayer({scopes:false}).then(function(p){player=p;return p.getData();}).then(function(data){if(!gaveUp)importCloud(data);},function(){});
      }).then(fin,fin);
    });
  };
  self.hasSdk=function(){return sdkOk;};
  function adBegin(){adBusy=true;changed();}
  function adEnd(){adBusy=false;changed();}
  /* Полноэкранная реклама между днями: не чаще раза в 3 минуты, первая не раньше 2 минут после загрузки. done вызывается один раз. */
  self.interstitial=function(done){
    if(adBusy)return;
    var now=Date.now(),allowedAt=lastAdAt?lastAdAt+AD_GAP_MS:bornAt+AD_FIRST_MS;
    if(!sdkOk||!ysdk.adv||!ysdk.adv.showFullscreenAdv||now<allowedAt){done();return;}
    var fin=false;
    function end(shown){if(fin)return;fin=true;if(shown)lastAdAt=Date.now();adEnd();done();}
    adBegin();
    try{ysdk.adv.showFullscreenAdv({callbacks:{onClose:function(w){end(w);},onError:function(){end(false);},onOffline:function(){end(false);}}});}catch(e){end(false);}
  };
  /* Ролик за награду. done(got): true, только если досмотрен. Без платформы (сайт, демо) награда засчитывается сразу. */
  self.rewarded=function(done){
    if(!sdkOk){var demo=!window.YaGames;setTimeout(function(){done(demo);},demo?700:0);return;}
    if(adBusy||!ysdk.adv||!ysdk.adv.showRewardedVideo){done(false);return;}
    var fin=false,got=false;
    function end(){if(fin)return;fin=true;if(got)lastAdAt=Date.now();adEnd();done(got);}
    adBegin();
    try{ysdk.adv.showRewardedVideo({callbacks:{onRewarded:function(){got=true;},onClose:end,onError:end}});}catch(e){end();}
  };
  return self;
})();

function watchAd(){PF.rewarded(got=>{if(got){coin(1);toast('+1 монета знаний');}else toast('Реклама сейчас недоступна');});}
let YN=null;
function yesNo(msg,fn){YN=fn;mode='over';card(`<h2>Подтверди</h2><p>${msg}</p><div class="row"><button class="btn red grow" data-act="yes">Да</button><button class="btn alt grow" data-act="no">Нет</button></div>`);}

/* картинки (WebP в img/, нарезаны tools/make_art.py). Нет файла — рисуется кодом */
const IMGN=/*IMGN*/['an_giraf','an_goat','an_lion','an_monk','an_peng','an_rab','an_slon','an_zebra','bg_grass','bg_path','cafe','coin_know','cover_start','ev_epi','ev_exc','ev_heat','ev_insp','fence_h','fence_post','final_win','food_bag','ic_bank','ic_enc','ic_price','ic_staff','ic_stock','kassa','vet','vis_boy','vis_girl','vis_man','vis_woman','worker']/*END*/;
const IMG={},PAT={};
IMGN.forEach(n=>{const i=new Image();i.onload=()=>{IMG[n]=i;delete PAT[n];if(typeof S!=='undefined'&&S&&typeof renderHud==='function'){renderHud();if(mode!=='sim')renderPanel();}};i.src='img/'+n+'.webp';});
const imgTag=(n,cls,fb)=>!IMGN.includes(n)?(fb||''):`<img class="${cls||'ic'}" src="img/${n}.webp" alt="" onerror="this.outerHTML='${fb||''}'">`;
const SPR={rab:.85,goat:1,peng:1,monk:1,zebra:1.02,lion:1.05,giraf:1.3,slon:1.2};

/* ================= СОСТОЯНИЕ ================= */
let S=null,mode='over',tab='enc',selId=0,sim=null;
function newState(){
  const s={v:2,day:1,money:START_MONEY,rep:50,coins:2,rows:START_ROWS,landBuys:0,landPaid:0,
    enc:[],cafe:null,staff:{w:2,v:0},duty:{feed:1,clean:0,kassa:1,cafe:0},
    stock:{food:100,foodVal:100*P_FOOD,fence:0},price:{a:BASE_A,c:BASE_C,m:BASE_M},loan:null,
    heat:0,epi:false,insp:0,exc:null,task:null,taskDone:false,lastTask:'',nid:1,
    stats:{right:0,wrong:0,skip:0,vis:0,profit:0,maxGuests:0,repQ:0},goals:{d10:null,d30:null},morning:false};
  s.enc.push({id:s.nid++,k:'rab',n:3,w:3,h:2,x:1,y:0,sick:0});
  s.enc.push({id:s.nid++,k:'goat',n:2,w:4,h:3,x:5,y:0,sick:0});
  s.enc.push({id:s.nid++,k:'peng',n:2,w:3,h:3,x:1,y:4,sick:0});
  return s;
}
function save(){if(S)lsSet(SAVE_KEY,S);}
const animalsN=()=>S.enc.reduce((a,e)=>a+e.n,0);
const areaTot=()=>S.enc.reduce((a,e)=>a+e.w*e.h,0);
const tier=()=>{const d=S.day;return d<=12?1:d<=28?2:d<=45?3:4;};
const isWeekend=d=>{const r=d%7;return r===6||r===0;};
const tutor=()=>S.day<=10;
const crowded=e=>e.w*e.h<e.n*ANI[e.k].area;
const landPrice=()=>200+50*S.landBuys;
const foodAvg=()=>S.stock.food>0?S.stock.foodVal/S.stock.food:P_FOOD;
const foodNeed=()=>S.enc.reduce((a,e)=>a+e.n*ANI[e.k].kg,0);
function capital(){
  const an=S.enc.reduce((a,e)=>a+e.n*ANI[e.k].price,0);
  return Math.round(S.money+an+(S.cafe?CAFE_PRICE:0)+S.landPaid+S.stock.foodVal+S.stock.fence*P_FENCE-(S.loan?S.loan.total:0));
}
const STAR_AT=[100000,200000,300000]; // автоигрок test\\bot.js: неумелый ≈226k, умелый ≈360k
const starsOf=c=>STAR_AT.filter(x=>c>=x).length;

/* ================= ГЕОМЕТРИЯ ================= */
function occGrid(){
  const g=[];for(let y=0;y<S.rows;y++)g.push(Array(COLS).fill(0));
  S.enc.forEach(e=>{for(let y=e.y;y<e.y+e.h;y++)for(let x=e.x;x<e.x+e.w;x++)g[y][x]=e.id;});
  if(S.cafe)for(let y=S.cafe.y;y<S.cafe.y+3;y++)for(let x=S.cafe.x;x<S.cafe.x+4;x++)g[y][x]=-1;
  return g;
}
function rectFree(g,x,y,w,h){
  for(let yy=y-1;yy<=y+h;yy++)for(let xx=x-1;xx<=x+w;xx++){
    if(yy<0||xx<0||yy>=S.rows||xx>=COLS)continue;
    if(g[yy][xx])return false;
  }
  return true;
}
function findSpot(w,h){
  const g=occGrid();
  for(let y=0;y+h<=S.rows-2;y++)for(let x=1;x+w<=COLS;x++)if(rectFree(g,x,y,w,h))return{x,y};
  return null;
}
function bfs(g,from,to){
  const key=(x,y)=>y*COLS+x,prev=new Map([[key(from.x,from.y),null]]),q=[from];
  while(q.length){
    const c=q.shift();
    if(c.x===to.x&&c.y===to.y){const p=[];let k=key(c.x,c.y);while(k!==null){p.push({x:k%COLS,y:Math.floor(k/COLS)});k=prev.get(k);}return p.reverse();}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=S.rows||g[ny][nx])continue;
      const k=key(nx,ny);if(prev.has(k))continue;
      prev.set(k,key(c.x,c.y));q.push({x:nx,y:ny});
    }
  }
  return null;
}

/* ================= ЭКОНОМИКА ДНЯ ================= */
function binom(n,p){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k;}
function computeDay(det){
  const r={};
  const animals=animalsN(),area=areaTot(),need=foodNeed();
  const d=S.duty;
  // кормление
  const fcov=animals?Math.min(1,d.feed*N_FEED/animals):1;
  const consumed=Math.min(S.stock.food,need*fcov);
  const fedFrac=need?consumed/need:1;
  r.consumed=consumed;r.hungry=Math.round(animals*(1-fedFrac));
  r.foodCost=consumed*foodAvg();
  // уборка
  const ccov=area?Math.min(1,d.clean*N_CLEAN/area):1,dirty=1-ccov;r.dirty=dirty;
  // болезни
  r.crowded=S.enc.filter(crowded).length;
  const inspToday=S.insp===S.day;
  let sickNew=[],totalSick=0;
  S.enc.forEach(e=>{
    const healthy=e.n-e.sick;
    const p=.02+(crowded(e)?.25:0)+.2*dirty+(S.epi?.4:0);
    const nw=det?Math.round(healthy*p):binom(healthy,p);
    sickNew.push(nw);totalSick+=e.sick+nw;
  });
  const treat=Math.min(totalSick,S.staff.v*N_VET);
  let left=treat;const sickAfter=[];
  S.enc.forEach((e,i)=>{const s=e.sick+sickNew[i];const t=Math.min(s,left);left-=t;sickAfter.push(s-t);});
  r.sickNew=sickNew;r.sickAfter=sickAfter;r.sickN=sickAfter.reduce((a,b)=>a+b,0);r.treated=treat;
  // привлекательность
  const cnt={};S.enc.forEach(e=>cnt[e.k]=(cnt[e.k]||0)+e.n);
  let A=0;for(const k in cnt)A+=ANI[k].vis*(2-Math.pow(2,1-cnt[k]));
  if(animals){A*=1-.5*r.sickN/animals;A*=1-.6*r.hungry/animals;}
  const repMult=REP_A+REP_B*S.rep/100,wk=isWeekend(S.day)?1.4:1,heat=S.heat>0?.9:1;
  r.A=A;r.repMult=repMult;r.wk=wk;
  r.G0=A*repMult*wk*heat;
  r.a0=r.G0*.6;r.c0=r.G0*.4;
  const fa=clamp(1-.8*(S.price.a/BASE_A-1),.2,1.6),fc=clamp(1-.8*(S.price.c/BASE_C-1),.2,1.6);
  r.fa=fa;r.fc=fc;
  let aD=r.a0*fa,cD=r.c0*fc,grp=S.exc?S.exc.n:0;
  const dem=aD+cD+grp;r.demand=Math.round(dem);
  r.cap=d.kassa*N_KASSA;
  const sc=dem>0?Math.min(1,r.cap/dem):1;
  r.adults=Math.round(aD*sc);r.kids=Math.round(cD*sc);r.grp=Math.round(grp*sc);
  r.served=r.adults+r.kids+r.grp;r.lost=Math.max(0,r.demand-r.served);
  const grpPrice=S.exc?Math.round(S.price.c*(1-S.exc.p/100)):0;
  r.revTick=r.adults*S.price.a+r.kids*S.price.c+r.grp*grpPrice;
  // кафе
  r.meals=0;r.revCafe=0;r.costMeals=0;
  if(S.cafe&&d.cafe>=1){
    const fm=clamp(1-.8*(S.price.m/BASE_M-1),.2,1.6);
    r.meals=Math.min(Math.round(r.served*.5*fm),d.cafe*N_CAFE);
    r.revCafe=r.meals*S.price.m;r.costMeals=r.meals*P_MEAL_COST;
  }
  r.rev=r.revTick+r.revCafe;
  r.sal=S.staff.w*SAL_W+S.staff.v*SAL_V;
  r.water=animals*P_WATER*(S.heat>0?2:1);
  r.interest=(S.loan&&S.loan.due===S.day)?Math.round(S.loan.total-S.loan.amt):0;
  r.fine=0;r.inspN=0;
  if(inspToday){r.inspN=r.crowded;r.fine=r.crowded*5000;}
  r.exp=r.foodCost+r.sal+r.water+r.costMeals+r.interest+r.fine;
  r.profit=r.rev-r.exp;
  // репутация
  const why=[];let dr=1;why.push(['Работа зоопарка',1]);
  const add=(t,v)=>{if(v){dr+=v;why.push([t,v]);}};
  add('Голодные животные',-.8*r.hungry);
  add('Больные животные',-1*r.sickN);
  add('Тесные вольеры',-2*r.crowded);
  add('Очередь у кассы',-r.lost/20);
  if(inspToday){add(r.crowded?'Инспектор: нарушения':'Инспектор: всё в порядке',r.crowded?-5*r.crowded:5);}
  r.dRep=dr;r.why=why;r.insp=inspToday;r.holiday=wk>1;r.heat=S.heat>0;r.epi=S.epi;
  return r;
}
function commitDay(r){
  S.money+=r.rev-r.sal-r.water-r.costMeals-r.fine;
  S.stock.food-=r.consumed;S.stock.foodVal=Math.max(0,S.stock.foodVal-r.foodCost);
  if(S.stock.food<=0.0001){S.stock.food=0;S.stock.foodVal=0;}
  S.enc.forEach((e,i)=>{e.sick=r.sickAfter[i];});
  S.rep=clamp(S.rep+r.dRep,0,100);
  S.stats.vis+=r.served;S.stats.profit+=r.profit;S.stats.maxGuests=Math.max(S.stats.maxGuests,r.served);
  // кредит
  r.loanNote='';
  if(S.loan&&S.loan.due===S.day){
    if(S.money>=S.loan.total){S.money-=S.loan.total;r.loanNote=`Кредит возвращён: ${money(S.loan.total)}`;S.loan=null;}
    else{S.rep=clamp(S.rep-10,0,100);S.loan.total=Math.round(S.loan.total+S.loan.amt*LOAN_RATE);S.loan.due+=LOAN_DAYS;r.loanNote=`Нечем платить по кредиту! Срок продлён на ${LOAN_DAYS} дней, долг вырос до ${money(S.loan.total)}, репутация −10`;}
  }
  // цели
  r.goalNote='';
  const g=(key,ok,txt)=>{S.goals[key]=ok;if(ok){S.money+=5000;S.rep=clamp(S.rep+5,0,100);r.goalNote=`Цель выполнена: ${txt}! +5 000 ₽ и +5 к репутации`;}else{S.rep=clamp(S.rep-5,0,100);r.goalNote=`Цель не выполнена: ${txt}. Репутация −5`;}};
  if(S.day===10)g('d10',S.stats.maxGuests>=30,'30 гостей за день к 10-му дню');
  if(S.day===30)g('d30',animalsN()>=15,'15 животных к 30-му дню');
  S.heat=Math.max(0,S.heat-1);S.epi=false;S.exc=null;
  S.day++;
}

const PCOL=['#e8604c','#4aa8d8','#f2b632','#7ac26b','#b57edc','#f08cb0'];
function mkAgent(g,targets){
  const gate={x:10,y:S.rows-1};let cur=gate;const wp=[];
  const n=Math.min(targets.length,ri(1,3));
  for(let i=0;i<n;i++){
    const t=pick(targets),p=bfs(g,cur,t);
    if(!p)continue;p.forEach((c,k)=>wp.push({x:(c.x+.5)*CP,y:(c.y+.5)*CP,wait:k===p.length-1?ri(8,14)/10:0}));cur=t;
  }
  const back=bfs(g,cur,gate);if(back)back.forEach(c=>wp.push({x:(c.x+.5)*CP,y:(c.y+.5)*CP,wait:0}));
  return{x:(gate.x+.5)*CP,y:(gate.y+.5)*CP,col:pick(PCOL),spr:pick(['vis_man','vis_woman','vis_boy','vis_girl']),dir:1,wp,i:0,wait:0};
}
function targetsList(g){
  const out=[];
  const ring=(x,y,w,h)=>{const c=[];for(let xx=x-1;xx<=x+w;xx++)for(let yy=y-1;yy<=y+h;yy++){if(xx<0||yy<0||xx>=COLS||yy>=S.rows)continue;if(xx>=x&&xx<x+w&&yy>=y&&yy<y+h)continue;if(!g[yy][xx])c.push({x:xx,y:yy});}return c;};
  S.enc.forEach(e=>{const c=ring(e.x,e.y,e.w,e.h);if(c.length)out.push(pick(c));});
  if(S.cafe){const c=ring(S.cafe.x,S.cafe.y,4,3);if(c.length)out.push(pick(c));}
  return out;
}
function startSim(){
  if(!S.cafe&&S.duty.cafe>0)S.duty.cafe=0;
  const r=computeDay(false);
  sim={t:0,T:10,r,entered:0,agents:[],pops:[],speed:1,cash:0,g:occGrid()};
  mode='sim';selId=0;
  renderAll();
}
function updateSim(dt){
  const s=sim,d=dt*s.speed;s.t+=d;
  const tgt=Math.min(s.r.served,Math.floor(s.r.served*Math.min(1,s.t/s.T)));
  while(s.entered<tgt){
    s.entered++;
    const pr=s.entered<=s.r.adults?S.price.a:S.price.c;
    s.cash+=pr;if(s.pops.length<10)s.pops.push({x:(10+ (Math.random()*2-1))*CP,y:(S.rows-2)*CP,age:0,txt:'+'+pr});
    const every=Math.max(1,Math.ceil(s.r.served/40));
    if(s.entered%every===0&&s.agents.length<40){const tl=targetsList(s.g);if(tl.length)s.agents.push(mkAgent(s.g,tl));}
  }
  s.pops.forEach(p=>p.age+=d);s.pops=s.pops.filter(p=>p.age<1.2);
  s.agents.forEach(a=>{
    let left=75*d;
    while(left>0&&a.i<a.wp.length){
      if(a.wait>0){const w=Math.min(a.wait,left/75);a.wait-=w;left-=w*75;if(a.wait>0)break;a.i++;continue;}
      const p=a.wp[a.i],dx=p.x-a.x,dy=p.y-a.y,dist=Math.hypot(dx,dy);
      if(dist<=left){a.x=p.x;a.y=p.y;left-=dist;a.wait=p.wait||0;if(!a.wait)a.i++;}
      else{a.x+=dx/dist*left;a.y+=dy/dist*left;left=0;}
      if(Math.abs(dx)>.5)a.dir=dx>0?1:-1;
    }
  });
  s.agents=s.agents.filter(a=>a.i<a.wp.length);
  const bar=$('#simBar');if(bar)bar.style.width=Math.min(100,s.t/s.T*100)+'%';
  const live=$('#simLive');if(live)live.innerHTML=`Гостей: <b>${s.entered}</b> из ${s.r.served} · билеты: <b>${money(s.cash)}</b>`;
  if(s.t>=s.T&&s.entered>=s.r.served)finishDay();
}
function finishDay(){
  const r=sim.r,dayNo=S.day;
  commitDay(r);sim=null;mode='over';save();renderAll();showReport(r,dayNo);
}

let AK=null;
function ask(cfg){
  AK={cfg,vals:{},act:cfg.fields[0].id};
  cfg.fields.forEach(f=>AK.vals[f.id]=f.val!==undefined?String(f.val):'');
  mode='over';
  const flds=cfg.fields.map(f=>`<div class="fld" data-act="fld" data-f="${f.id}" id="fld_${f.id}"><span>${f.label}</span><b id="fv_${f.id}">—</b><small>${f.unit||''}</small></div>`).join('');
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-act="key" data-k="${n}">${n}</button>`).join('')
    +`<button class="btn alt" data-act="kback">⌫</button><button class="btn" data-act="key" data-k="0">0</button><button class="btn alt" data-act="knext">${cfg.fields.length>1?'→':'C'}</button>`;
  card(`<div class="head"><span>${cfg.title}</span>${cfg.tag?`<span class="tag">${cfg.tag}</span>`:''}</div>
    ${cfg.preview?'<canvas id="askPrev" width="720" height="260" style="width:100%;height:130px;border:3px solid var(--ink);border-radius:10px;background:#fff"></canvas>':''}
    <div class="q" id="askInfo" style="font-size:14.5px"></div>${flds}
    <div class="pad">${keys}</div>
    <div class="row"><button class="btn go grow" data-act="kok">${cfg.ok||'Готово'}</button>${cfg.cancel===false?'':'<button class="btn alt grow" data-act="kcancel">'+(cfg.cancelText||'Отмена')+'</button>'}</div>
    ${(cfg.extra||[]).map((x,i)=>`<button class="btn alt" data-act="kextra" data-i="${i}" style="min-height:38px;font-size:14px">${x.label}</button>`).join('')}`);
  updateAsk();
}
function askNums(){const o={};for(const k in AK.vals)o[k]=AK.vals[k]===''?NaN:Number(AK.vals[k]);return o;}
function updateAsk(){
  const c=AK.cfg,v=askNums();
  c.fields.forEach(f=>{$('#fv_'+f.id).textContent=AK.vals[f.id]||'—';$('#fld_'+f.id).classList.toggle('on',f.id===AK.act);});
  const inf=$('#askInfo');inf.innerHTML=typeof c.info==='function'?c.info(v):(c.info||'');inf.style.display=inf.innerHTML?'':'none';
  if(c.preview){const cc=$('#askPrev'),g=cc.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cc.width,cc.height);c.preview(g,v,cc.width,cc.height);}
}
function askKey(d){const f=AK.cfg.fields.find(x=>x.id===AK.act);const cur=AK.vals[AK.act];if(cur.length>=(f.max||7))return;AK.vals[AK.act]=(cur==='0'?'':cur)+d;updateAsk();}

function coin(n=1){S.coins+=n;renderHud();}

function renderHud(){
  if(!S)return;
  $('#hDay').textContent=`День ${Math.min(S.day,DAYS)}/${DAYS}`;
  $('#hMoney').textContent=money(S.money);
  $('#hRep').textContent='★ '+num((S.rep/20).toFixed(1));
  $('#hCoin').innerHTML=imgTag('coin_know','ic','◎')+' '+S.coins;
}
function renderInfo(){
  if(!S)return;const el=$('#info');
  if(mode==='sim'){el.innerHTML=`<b>Идёт день ${S.day}</b>${isWeekend(S.day)?' · выходной':''}<br>Гости ходят по дорожкам, у ворот звенят монеты.`;return;}
  const parts=[];
  parts.push(`<b>День ${S.day}</b>${isWeekend(S.day)?' · <b>выходной: гостей ×1,4</b>':''}`);
  if(S.heat>0)parts.push('Жара: вода ×2, гостей −10 %');
  if(S.epi)parts.push('<span class="warn">Эпидемия!</span>');
  if(S.insp===S.day)parts.push('<span class="warn">Сегодня инспектор!</span>');
  else if(S.insp===S.day+1)parts.push('<span class="warn">Завтра проверка инспектора</span>');
  const a=animalsN(),r=computeDay(true);
  let l2=`Животных: <b>${a}</b> · вольеры: <b>${areaTot()} м²</b> · свободно земли: ${freeArea()} м²`;
  if(!tutor()||true)l2+=` · база гостей: <b>${Math.round(r.a0)}</b> взр. + <b>${Math.round(r.c0)}</b> дет.`;
  el.innerHTML=parts.join(' · ')+'<br>'+l2;
}
function freeArea(){return Math.max(0,(S.rows-2)*(COLS-1)-areaTot()-(S.cafe?12:0));}

    h+=`<div class="row">${imgTag('vet','pic','')}<div class="grow"><b>Ветеринары: ${S.staff.v}</b><br><span class="hint">${money(SAL_V)} в день каждому</span></div><div class="step"><button class="btn" data-act="fire" data-t="v">−</button><button class="btn" data-act="hire" data-t="v">+</button></div></div>`;
    h+=`<div class="head"><span>Поручения на сегодня</span><span class="${free<0?'warn':''}">свободно: ${free}</span></div>`;
    const duties=[['feed','Кормление',`1 раб. = ${N_FEED} животных`],['clean','Уборка',`1 раб. = ${N_CLEAN} м² вольеров`],['kassa','Касса',`1 раб. = ${N_KASSA} гостей`],['cafe','Кафе',`1 раб. = ${N_CAFE} гостей`]];
    duties.forEach(x=>{h+=`<div class="row"><div class="grow"><b>${x[1]}</b><br><span class="hint">${x[2]}</span></div><div class="step"><button class="btn" data-act="dm" data-d="${x[0]}">−</button><b>${d[x[0]]}</b><button class="btn" data-act="dp" data-d="${x[0]}">+</button></div></div>`;});
    h+=`<div class="hint">Лечение: 1 ветеринар = ${N_VET} больных. Сегодня животных: <b>${animalsN()}</b>, площадь вольеров: <b>${areaTot()} м²</b>. Посчитай, хватит ли людей!${S.cafe?'':' Кафе не построено.'}</div>`;
  }
  else if(tab==='price'){
    h+=`<div class="head"><span>Цены</span><button class="btn sm go" data-act="setprice">Изменить</button></div>`;

    const r=computeDay(true);
    h+=kv('База гостей',`взр. ${Math.round(r.a0)} · дет. ${Math.round(r.c0)}`)+kv('Репутация',`×${num(r.repMult.toFixed(2))}`);

/* ================= ДЕЙСТВИЯ ================= */
function openBuilder(k){
  const A=ANI[k];
  ask({title:`Вольер: ${A.name}`,tag:`норма ${A.area} м²`,
    fields:[{id:'w',label:'Ширина',unit:'м',max:2},{id:'h',label:'Длина',unit:'м',max:2},{id:'n',label:'Животных',unit:'шт',max:2},{id:'s',label:'Площадь (сам посчитай)',unit:'м²',max:4},{id:'f',label:'Заказ забора (сам посчитай)',unit:'м',max:4}],
    info:v=>`Животное: ${money(A.price)} · корм ${A.kg} кг/день · забор ${P_FENCE} ₽/м (на складе ${S.stock.fence} м, нехватка — ${P_FENCE_X} ₽/м)${tutor()&&v.w>0&&v.h>0&&v.n>0?`<br>На особь: ${num((v.w*v.h/v.n).toFixed(1))} м² — ${v.w*v.h>=v.n*A.area?'<span class="good">хватает</span>':'<span class="warn">тесно!</span>'}`:''}`,
    preview:(g,v,W,H)=>{
      g.fillStyle='#f3ead0';g.fillRect(0,0,W,H);
      if(!(v.w>0&&v.h>0))return;
      const sc=Math.min((W-80)/v.w,(H-60)/v.h,40),w=v.w*sc,h=v.h*sc,x=(W-w)/2,y=(H-h)/2+6;
      g.fillStyle=A.gr;g.fillRect(x,y,w,h);g.strokeStyle='rgba(59,42,26,.18)';g.lineWidth=1;
      for(let i=1;i<v.w;i++){g.beginPath();g.moveTo(x+i*sc,y);g.lineTo(x+i*sc,y+h);g.stroke();}
      for(let j=1;j<v.h;j++){g.beginPath();g.moveTo(x,y+j*sc);g.lineTo(x+w,y+j*sc);g.stroke();}
      g.lineWidth=6;g.strokeStyle=INK;g.strokeRect(x,y,w,h);
      g.fillStyle=INK;g.font='bold 24px sans-serif';g.textAlign='center';g.fillText(v.w+' м',W/2,y-8);g.save();g.translate(x-14,y+h/2);g.rotate(-Math.PI/2);g.fillText(v.h+' м',0,0);g.restore();
      if(v.n>0)drawAnimal(g,k,W/2,y+h/2+6,Math.min(1.6,sc*Math.min(v.w,v.h)/60));
    },
    ok:'Построить',
    onOk:v=>{
      if(!(v.w>=1&&v.h>=1&&v.n>=1)){toast('Укажи ширину, длину и число животных');return false;}
      if(!(v.f>=0)||isNaN(v.f)||isNaN(v.s)){toast('Посчитай площадь и забор и впиши их');return false;}
      if(v.w>18||v.h>18){toast('Не больше 18 м по стороне');return false;}
      const res=doBuild(k,v.n,v.w,v.h,v.s,v.f);
      if(res.err){toast(res.err);return false;}
      showBuildResult(res);return true;
    }});
}
function doBuild(k,n,w,h,sTyped,fOrd){
  const A=ANI[k],spot=findSpot(w,h);
  if(!spot)return{err:'Нет места такого размера: докупи землю или уменьши вольер'};
  const area=w*h,P=2*(w+h),have=S.stock.fence+fOrd,miss=Math.max(0,P-have);
  const cost=n*A.price+fOrd*P_FENCE+miss*P_FENCE_X;
  if(cost>S.money)return{err:`Не хватает ${money(cost-S.money)}`};
  S.money-=cost;S.stock.fence=have+miss-P;
  S.enc.push({id:S.nid++,k,n,w,h,x:spot.x,y:spot.y,sick:0});
  return{ok:true,k,n,w,h,area,P,miss,fOrd,cost,areaOk:sTyped===area,fenceOk:fOrd===P,crowd:area<n*A.area};
}
function showBuildResult(r){
  const A=ANI[r.k];let coinGot=false;
  if(r.areaOk&&r.miss===0){coinGot=true;coin(1);}
  save();renderAll();
  card(`<h2>Вольер построен</h2><table class="sum">
    <tr><td>Площадь</td><td>${r.area} м² ${r.areaOk?'✓ верно':'(ты написал другое)'}</td></tr>
    <tr><td>Периметр (забор)</td><td>${r.P} м</td></tr>
    <tr><td>Заказано забора</td><td>${r.fOrd} м ${r.miss?`· не хватило ${r.miss} м, докупили по ${P_FENCE_X} ₽`:r.fOrd>r.P?`· осталось на складе`:'· ровно'}</td></tr>
    <tr><td>Потрачено</td><td>${money(r.cost)}</td></tr></table>
    ${r.crowd?`<div class="bad">Тесно! Норма ${A.area} м² на особь, а у тебя ${num((r.area/r.n).toFixed(1))}. Животные будут болеть.</div>`:`<div class="ok">Места хватает: ${num((r.area/r.n).toFixed(1))} м² на особь (норма ${A.area}).</div>`}
    ${coinGot?'<div class="ok">+1 монета знаний: площадь верна, забор заказан без доплаты.</div>':''}
    <button class="btn go" data-act="close">Хорошо</button>`);
}
function openShop(){
  const g=AIDS.map(k=>{const A=ANI[k];return `<button class="item ${S.money<A.price?'no':''}" data-act="shopk" data-k="${k}"><canvas width="80" height="80" data-k="${k}"></canvas><b>${A.name}</b><span>${A.price.toLocaleString('ru-RU')}</span><small>${A.area} м² · ${A.kg} кг · +${A.vis}</small></button>`;}).join('');
  card(`<div class="head"><span>Какое животное?</span><button class="btn sm alt" data-act="close">Закрыть</button></div><div class="grid">${g}</div><div class="hint">Под ценой: норма м² на особь · корм кг в день · гостей в день.</div>`);
  $('#card').querySelectorAll('canvas[data-k]').forEach(c=>c.getContext('2d').drawImage(iconCanvas(c.dataset.k),0,0));
}
function simpleAsk(title,label,unit,info,onOk,extra){
  ask({title,fields:[{id:'x',label,unit,max:6}],info,ok:'Готово',onOk:v=>{if(!(v.x>0)){toast('Введи число больше нуля');return false;}return onOk(v.x);},...extra});
}
function doAct(a,b){
  switch(a){
  case 'tab':tab=b.dataset.t;selId=0;renderPanel();break;
  case 'selenc':selId=+b.dataset.id;tab='enc';renderPanel();break;
  case 'unsel':selId=0;renderPanel();break;
  case 'newenc':openShop();break;
  case 'shopk':openBuilder(b.dataset.k);break;
  case 'close':closeCard();mode='idle';renderAll();break;
  case 'buycafe':
    if(S.money<CAFE_PRICE){toast(`Не хватает ${money(CAFE_PRICE-S.money)}`);break;}
    {const sp=findSpot(4,3);if(!sp){toast('Нет места 4×3 м');break;}S.money-=CAFE_PRICE;S.cafe={x:sp.x,y:sp.y};save();renderAll();toast('Кафе построено: поставь повара в «Люди»');}
    break;
  case 'addan':{const e=S.enc.find(x=>x.id===selId);if(!e)break;const A=ANI[e.k];
    simpleAsk(`Добавить: ${A.name}`,'Сколько животных','шт',`${money(A.price)} за штуку. Сейчас ${e.n}, вольер ${e.w*e.h} м², норма ${A.area} м² на особь.`,x=>{const c=x*A.price;if(c>S.money){toast(`Не хватает ${money(c-S.money)}`);return false;}S.money-=c;e.n+=x;save();renderAll();closeCard();mode='idle';return true;});break;}
  case 'sellan':{const e=S.enc.find(x=>x.id===selId);if(!e)break;const A=ANI[e.k];
    simpleAsk(`Продать: ${A.name}`,'Сколько животных','шт',`Возврат 70 % цены: ${money(A.price*SELL_K)} за штуку. Сейчас ${e.n}.`,x=>{if(x>e.n){toast('Столько нет');return false;}S.money+=Math.round(x*A.price*SELL_K);e.n-=x;e.sick=Math.min(e.sick,e.n);if(e.n===0){S.enc=S.enc.filter(z=>z!==e);selId=0;}save();renderAll();closeCard();mode='idle';return true;});break;}
  case 'demol':{const e=S.enc.find(x=>x.id===selId);if(!e)break;yesNo('Снести вольер? Животные продаются за 70 %, забор вернётся на склад.',()=>{S.money+=Math.round(e.n*ANI[e.k].price*SELL_K);S.stock.fence+=2*(e.w+e.h);S.enc=S.enc.filter(z=>z!==e);selId=0;save();renderAll();});break;}
  case 'hire':{const t=b.dataset.t;if(S.staff.w+S.staff.v>=14){toast('Не больше 14 сотрудников');break;}S.staff[t]++;save();renderAll();break;}
  case 'fire':{const t=b.dataset.t;if(S.staff[t]<=0)break;const d=S.duty;if(t==='w'&&S.staff.w-1<d.feed+d.clean+d.kassa+d.cafe){toast('Сначала сними человека с поручения');break;}S.staff[t]--;save();renderAll();break;}
  case 'dp':{const d=S.duty,k=b.dataset.d;if(k==='cafe'&&!S.cafe){toast('Сначала построй кафе');break;}if(d.feed+d.clean+d.kassa+d.cafe>=S.staff.w){toast('Нет свободных работников — найми ещё');break;}d[k]++;save();renderAll();break;}
  case 'dm':{const d=S.duty,k=b.dataset.d;if(d[k]>0)d[k]--;save();renderAll();break;}
  case 'setprice':
    ask({title:'Цены',fields:[{id:'a',label:'Взрослый',unit:'₽',val:S.price.a,max:4},{id:'c',label:'Детский',unit:'₽',val:S.price.c,max:4},{id:'m',label:'Обед',unit:'₽',val:S.price.m,max:4}],
      info:v=>`Базовые цены: ${BASE_A} / ${BASE_C} / ${BASE_M} ₽.<br>+10 % к цене → −8 % гостей. Подсчитай сам, что выгоднее.`,
      ok:'Сохранить',onOk:v=>{if(!(v.a>=10&&v.c>=10&&v.m>=10)){toast('Цены от 10 ₽');return false;}S.price={a:v.a,c:v.c,m:v.m};save();closeCard();mode='idle';renderAll();return true;}});break;
  case 'buyfood':simpleAsk('Корм в розницу','Сколько кг','кг',`${P_FOOD} ₽ за кг. На складе ${Math.round(S.stock.food)} кг.`,x=>{const c=x*P_FOOD;if(c>S.money){toast(`Не хватает ${money(c-S.money)}`);return false;}S.money-=c;S.stock.food+=x;S.stock.foodVal+=c;save();closeCard();mode='idle';renderAll();toast(`Куплено ${x} кг за ${money(c)}`);return true;});break;
  case 'buybag':simpleAsk('Корм оптом','Сколько мешков','меш.',`Мешок ${BAG} кг = ${money(P_BAG)} (${P_BAG/BAG} ₽/кг, розница ${P_FOOD}).`,x=>{const c=x*P_BAG;if(c>S.money){toast(`Не хватает ${money(c-S.money)}`);return false;}S.money-=c;S.stock.food+=x*BAG;S.stock.foodVal+=c;save();closeCard();mode='idle';renderAll();toast(`Куплено ${x*BAG} кг за ${money(c)}`);return true;});break;
  case 'buyfence':simpleAsk('Забор','Сколько метров','м',`${P_FENCE} ₽ за метр. На складе ${S.stock.fence} м.`,x=>{const c=x*P_FENCE;if(c>S.money){toast(`Не хватает ${money(c-S.money)}`);return false;}S.money-=c;S.stock.fence+=x;save();closeCard();mode='idle';renderAll();return true;});break;
  case 'buyland':{const maxR=Math.floor((44-S.rows)/ROW_STEP);if(maxR<=0){toast('Земля закончилась');break;}
    ask({title:'Купить землю',fields:[{id:'x',label:'Сколько рядов',unit:'ряд',max:2}],info:v=>`1 ряд = ${COLS} м² (${COLS} × 1 м). Цена: ${landPrice()} ₽ за м².${v.x>0?`<br>Итого: ${v.x*COLS} м² за ${money(v.x*COLS*landPrice())}`:''}`,ok:'Купить',
      onOk:v=>{if(!(v.x>0)||v.x>maxR){toast(`От 1 до ${maxR} рядов`);return false;}const c=v.x*COLS*landPrice();if(c>S.money){toast(`Не хватает ${money(c-S.money)}`);return false;}S.money-=c;S.landPaid+=c;S.rows+=v.x*ROW_STEP;S.landBuys++;save();closeCard();mode='idle';renderAll();toast(`Участок вырос до ${COLS*S.rows} м²`);return true;}});break;}
  case 'takeloan':
    simpleAsk('Кредит','Сумма','₽',`До ${money(LOAN_MAX)} под ${LOAN_RATE*100} % на ${LOAN_DAYS} дней. Вернуть нужно будет сумму плюс проценты — сам посчитай, сколько.`,x=>{
      if(x>LOAN_MAX){toast(`Не больше ${money(LOAN_MAX)}`);return false;}S.loan={amt:x,total:Math.round(x*(1+LOAN_RATE)),due:S.day+LOAN_DAYS};S.money+=x;save();closeCard();mode='idle';renderAll();toast(`Кредит взят. Вернуть ${money(S.loan.total)} на ${S.loan.due}-й день`);return true;});break;
  case 'repay':if(S.money<S.loan.total){toast(`Не хватает ${money(S.loan.total-S.money)}`);break;}S.money-=S.loan.total;S.loan=null;save();renderAll();toast('Кредит погашен');break;
  case 'check':runCheck();break;

    if(S.duty.kassa<1){yesNo('На кассе никого нет — гостей не будет. Всё равно открыть день?',()=>startSim());break;}

function runCheck(){
  if(!tutor()){if(S.coins<1){card(`<h2>Проверка-калькулятор</h2><p>Нужна 1 монета знаний. Получи монету за верный ответ на задачу или посмотри ролик.</p><button class="btn go" data-act="ad">Ролик → ◎1</button><button class="btn alt" data-act="close">Закрыть</button>`);return;}S.coins--;renderHud();}
  const r=computeDay(true),an=animalsN(),need=foodNeed();
  const lines=[];
  lines.push(['Гостей ждём',`${r.demand}`]);
  lines.push(['Касса пропустит',`${r.cap} (${S.duty.kassa} × ${N_KASSA})`+(r.lost?` — не войдут ${r.lost}`:'')]);
  lines.push(['Корм: нужно / есть',`${need} кг / ${Math.round(S.stock.food)} кг`+(S.stock.food<need?' — не хватит!':'')]);
  lines.push(['Кормят',`${S.duty.feed*N_FEED} из ${an} животных`]);
  lines.push(['Убирают',`${Math.min(areaTot(),S.duty.clean*N_CLEAN)} из ${areaTot()} м²`]);
  lines.push(['Тесных вольеров',r.crowded]);
  lines.push(['Ожидаемая прибыль',money(r.profit)]);
  card(`<h2>Проверка-калькулятор</h2><table class="sum">${lines.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`).join('')}</table><p class="hint">Прогноз приблизительный: болезни и случайности в нём не учтены.</p><button class="btn go" data-act="close">Понятно</button>`);
}

/* ================= ДЕНЬ: утро, события, задача ================= */
function startDay(){
  PF.setPlaying(true);
  if(S.day>DAYS){showFinal();return;}
  if(S.day>=3&&!S.morning){
    // события
    const wk=isWeekend(S.day),r=Math.random();
    if(r<.07&&animalsN()>=3)S.epi=true;
    else if(r<.14&&S.heat<=0)S.heat=2;
    else if(r<.26&&!wk&&S.insp!==S.day){const n=ri(20,50),p=pick([10,15,20,25,30]);S.exc={n,p};}
    if(S.insp<S.day&&Math.random()<.08&&S.day<DAYS)S.insp=S.day+1;
  }
  S.morning=true;
  if(!S.task||S.taskDone)S.task=genTask();
  S.taskDone=false;
  save();renderAll();showMorning();
}
function showMorning(){
  mode='over';
  const ev=[];
  if(S.day===1)ev.push(['','<b>Добро пожаловать, директор!</b> У тебя ' + money(START_MONEY) + ', участок 20×20 м и маленький зоопарк: кролики, козы и пингвины. Купи животных, найми людей, поставь цены и открой день. Цели: 30 гостей к дню 10, 15 животных к дню 30, прибыль 100 000 ₽ к дню 60. Задачи — это счёт зоопарка: верный ответ приносит деньги и монеты знаний.']);
  if(S.epi)ev.push(['ev_epi','<b>Эпидемия!</b> Заболеют до 40 % животных. Ветеринар лечит 15 больных в день.']);
  if(S.heat>0)ev.push(['ev_heat','<b>Жара.</b> Воды нужно вдвое больше, гостей на 10 % меньше.']);
  if(S.insp===S.day)ev.push(['ev_insp','<b>Сегодня проверка инспектора!</b> За каждый тесный вольер — штраф 5 000 ₽ и −5 репутации.']);
  else if(S.insp===S.day+1)ev.push(['ev_insp','<b>Завтра придёт инспектор.</b> Проверь, хватает ли каждому зверю места по норме!']);
  if(isWeekend(S.day))ev.push(['','<b>Выходной:</b> гостей на 40 % больше. Хватит ли касс?']);
  if(S.exc)ev.push(['ev_exc',`<b>Школьная экскурсия:</b> придут ${S.exc.n} детей со скидкой ${S.exc.p} % на детский билет.`]);
  card(`<h2>Утро, день ${S.day}</h2>${ev.map(x=>`<div class="q evrow" style="font-size:14px">${x[0]?imgTag(x[0],'evi',''):''}<div>${x[1]}</div></div>`).join('')||'<p>Всё спокойно. Время работать!</p>'}<button class="btn go" data-act="${S.exc?'excask':'taskgo'}">Дальше ▶</button>`);
}
function excAsk(){
  const e=S.exc,pr=Math.round(S.price.c*(1-e.p/100));
  ask({title:'Школьная экскурсия',tag:'проценты',fields:[{id:'x',label:'Школа заплатит',unit:'₽',max:7}],
    info:`Приходят ${e.n} детей. Детский билет сегодня ${S.price.c} ₽, школе скидка ${e.p} %. Сколько рублей заплатит вся школа?`,ok:'Ответить',cancelText:'Пропустить',
    onOk:v=>{
      const right=e.n*pr;
      if(v.x===right){coin(1);S.rep=clamp(S.rep+2,0,100);toast('Верно! +1 монета, репутация +2');}else toast(`Верно было: ${e.n} × ${pr} = ${money(right)}`);
      save();renderAll();showMorning2();return true;
    },extra:[]});
  AK.cancelFn=()=>{showMorning2();};
}
function showMorning2(){card(`<h2>Экскурсия записана</h2><p>Группа придёт сегодня. Не забудь про кассу: детей станет больше.</p><button class="btn go" data-act="taskgo">Дальше ▶</button>`);}
function showTask(){
  const t=S.task;
  ask({title:`День ${S.day}: задача директора`,tag:GRADE[t.tier-1],fields:[{id:'x',label:'Ответ',unit:t.u,max:8}],info:t.q,ok:'Ответить',cancelText:'Пропустить',
    onOk:v=>{if(isNaN(v.x)){toast('Сначала введи ответ');return false;}answerTask(v.x,false);return true;}});
  AK.cancelFn=()=>answerTask(null,true);
}
function answerTask(x,skip){
  const t=S.task;let html,ok=false;
  if(skip){S.stats.skip++;html=`<div class="bad"><b>Пропущено.</b><br>Верный ответ: <b>${num(t.a)} ${t.u}</b><br><small>${t.sol}</small></div>`;}
  else if(Math.abs(x-t.a)<1e-6){ok=true;S.stats.right++;S.money+=t.reward;coin(1);html=`<div class="ok"><b>Верно! +${money(t.reward)} и ◎1</b><br>${pick(['Директор доволен!','Так держать!','Бухгалтерия аплодирует!'])}<br><small>${t.sol}</small></div>`;}
  else{const fine=Math.min(S.money,Math.round(t.reward/2/10)*10);S.stats.wrong++;S.money-=fine;html=`<div class="bad"><b>Не совсем. −${money(fine)}</b><br>Верный ответ: <b>${num(t.a)} ${t.u}</b><br><small>${t.sol}</small></div>`;}
  S.taskDone=true;save();renderAll();
  card(`<h2>${ok?'Отлично!':'Разбор задачи'}</h2><div class="q" style="font-size:14px">${t.q}</div>${html}<button class="btn go" data-act="close">К делам ▶</button>`);
}

/* ================= ОТЧЁТ ДНЯ ================= */
function reportQuestion(r){
  const qs=[];
  if(r.rev>0&&r.foodCost>0)qs.push({q:`Выручка за день ${money(r.rev)}, на корм ушло ${money(r.foodCost)}. Сколько процентов выручки ушло на корм? (округли до целого)`,a:Math.round(r.foodCost/r.rev*100),tol:1,u:'%',sol:`${Math.round(r.foodCost)} ÷ ${Math.round(r.rev)} × 100 ≈ ${Math.round(r.foodCost/r.rev*100)} %`});
  if(r.rev>0&&r.sal>0)qs.push({q:`Выручка ${money(r.rev)}, зарплаты ${money(r.sal)}. Сколько процентов выручки составили зарплаты? (округли до целого)`,a:Math.round(r.sal/r.rev*100),tol:1,u:'%',sol:`${r.sal} ÷ ${Math.round(r.rev)} × 100 ≈ ${Math.round(r.sal/r.rev*100)} %`});
  if(r.served>0)qs.push({q:`Пришло ${r.served} гостей, выручка ${money(r.rev)}. Сколько рублей выручки в среднем на одного гостя? (округли до целого)`,a:Math.round(r.rev/r.served),tol:2,u:'₽',sol:`${Math.round(r.rev)} ÷ ${r.served} ≈ ${Math.round(r.rev/r.served)}`});
  if(r.adults+r.kids>0)qs.push({q:`Из ${r.adults+r.kids} гостей детей было ${r.kids}. Сколько процентов гостей — дети? (округли до целого)`,a:Math.round(r.kids/(r.adults+r.kids)*100),tol:1,u:'%',sol:`${r.kids} ÷ ${r.adults+r.kids} × 100 ≈ ${Math.round(r.kids/(r.adults+r.kids)*100)} %`});
  qs.push({q:`Расходы за день: корм ${money(r.foodCost)}, зарплаты ${money(r.sal)}, вода ${money(r.water)}. Сколько рублей это всего? (округли до целого)`,a:Math.round(r.foodCost+r.sal+r.water),tol:1,u:'₽',sol:`${Math.round(r.foodCost)} + ${r.sal} + ${r.water}`});
  return pick(qs);
}
function showReport(r,dayNo){
  const rows=[['Гостей обслужено',`${r.served} (взр. ${r.adults}, дет. ${r.kids}${r.grp?`, школа ${r.grp}`:''})`],
    ...(r.lost?[['Ушли из-за очереди',r.lost]]:[]),
    ['Выручка: билеты',money(r.revTick)],['Выручка: кафе',money(r.revCafe)],
    ['Корм',money(-r.foodCost)],['Зарплаты',money(-r.sal)],['Вода',money(-r.water)],...(r.costMeals?[['Продукты кафе',money(-r.costMeals)]]:[])];
  if(r.interest)rows.push(['Проценты по кредиту',money(-r.interest)]);
  if(r.fine)rows.push(['Штраф инспектора',money(-r.fine)]);
  const why=r.why.map(w=>`${w[0]}: ${w[1]>0?'+':''}${num(w[1].toFixed(1))}`).join(' · ');
  const q=reportQuestion(r);r._q=q;
  card(`<h2>Отчёт дня ${dayNo}</h2><table class="sum">${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}<tr class="sub"><td>Прибыль</td><td class="${r.profit>=0?'good':'warn'}">${money(r.profit)}</td></tr></table>
   <div class="hint">Репутация ${r.dRep>=0?'+':''}${num(r.dRep.toFixed(1))}: ${why}</div>
   ${r.loanNote?`<div class="bad">${r.loanNote}</div>`:''}${r.goalNote?`<div class="${r.goalNote.includes('не')?'bad':'ok'}">${r.goalNote}</div>`:''}
   <button class="btn go" data-act="repq">Вопрос по отчёту ▶</button><button class="btn alt" data-act="nextday" style="min-height:38px;font-size:14px">Пропустить вопрос</button>`);
  showReport.last=r;
}
function askReportQ(){
  const q=showReport.last._q;
  ask({title:'Вопрос по отчёту',tag:'проценты и деньги',fields:[{id:'x',label:'Ответ',unit:q.u,max:7}],info:q.q,ok:'Ответить',cancelText:'Пропустить',
    onOk:v=>{if(isNaN(v.x)){toast('Введи число');return false;}
      if(Math.abs(v.x-q.a)<=q.tol){S.rep=clamp(S.rep+3,0,100);S.stats.repQ++;coin(1);save();card(`<h2>Верно!</h2><div class="ok">Репутация +3 и ◎1.<br><small>${q.sol}</small></div><button class="btn go" data-act="nextday">Следующий день ▶</button>`);}
      else card(`<h2>Не совсем</h2><div class="bad">Верный ответ: <b>${q.a} ${q.u}</b><br><small>${q.sol}</small></div><button class="btn go" data-act="nextday">Следующий день ▶</button>`);
      renderHud();return true;}});
  AK.cancelFn=()=>nextDay();
}
function nextDay(){

/* ================= СОБЫТИЯ ВВОДА ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  switch(a){
  case 'fld':AK.act=b.dataset.f;updateAsk();return;
  case 'key':askKey(b.dataset.k);return;
  case 'kback':AK.vals[AK.act]=AK.vals[AK.act].slice(0,-1);updateAsk();return;
  case 'knext':{const ids=AK.cfg.fields.map(f=>f.id),i=ids.indexOf(AK.act);if(ids.length>1)AK.act=ids[(i+1)%ids.length];else AK.vals[AK.act]='';updateAsk();return;}
  case 'kok':{const r=AK.cfg.onOk(askNums());if(r===true){/* закрытие внутри onOk */}return;}
  case 'kcancel':{const f=AK.cfg.cancelFn||AK.cancelFn;if(f)f();else{closeCard();mode=S?'idle':'over';if(S)renderAll();}return;}
  case 'kextra':AK.cfg.extra[+b.dataset.i].fn();return;
  case 'taskgo':showTask();return;
  case 'excask':excAsk();return;
  case 'repq':askReportQ();return;
  case 'nextday':nextDay();return;
  case 'ad':watchAd();return;
  case 'new':startGame();return;
  case 'continue':{const sv=lsGet(SAVE_KEY);if(sv&&sv.v===2){S=sv;PF.setPlaying(true);fitCanvas();renderAll();if(!S.taskDone)showMorning();else{closeCard();mode='idle';renderAll();}}else startGame();return;}
  case 'restart':yesNo('Начать заново? Весь прогресс будет потерян.',startGame);return;
  case 'yes':{const f=YN;YN=null;closeCard();mode='idle';if(f)f();return;}
  case 'no':YN=null;closeCard();mode=S?'idle':'over';if(S)renderAll();return;
  }
  doAct(a,b);
});
$('#btnMenu').addEventListener('click',()=>{if(S&&mode!=='sim')showMenu();});
$('#hCoin').addEventListener('click',()=>{if(S&&mode!=='sim')watchAd();});
cv.addEventListener('click',ev=>{
  if(!S||mode==='sim'||mode==='over')return;
  const r=cv.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)/r.width*COLS),y=Math.floor((ev.clientY-r.top)/r.height*S.rows);
  const e=S.enc.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h);
  if(e){selId=e.id;tab='enc';renderPanel();}else if(selId){selId=0;renderPanel();}
});

/* ================= ЦИКЛ ================= */
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(sim&&!PF.paused())updateSim(dt);render(ts/1000);}
window.addEventListener('resize',()=>{if(S)fitCanvas();});
requestAnimationFrame(frame);

/* Отладка: window.__zoo (в публикационной сборке вырезать) */
window.__zoo={get S(){return S;},set S(v){S=v;},ANI,TK,genTask,computeDay,commitDay,capital,doBuild,findSpot,startGame,tier,newState,reportQuestion,
  day(){const r=computeDay(false);commitDay(r);return r;},fast(){if(sim)sim.T=.2;},showFinal,startDay};
PF.init().then(()=>{showStart();PF.ready();});
</script>
