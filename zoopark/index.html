<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Зоопарк</title>
<style>
:root{--ink:#3b2a1a;--paper:#fff4d6;--paper2:#ffe9b0;--sun:#ffcf4a;--red:#e8604c;--blue:#4aa8d8;--green:#5cb85c;--bg:#f6e7c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:5px 7px 6px;gap:5px}
#hud{display:flex;gap:5px;flex:none}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:4px 8px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;white-space:nowrap;color:var(--ink);font-family:inherit}
#hDay{flex:1.1}#hMoney{flex:1.5;justify-content:center;color:#1e6b2c;font-size:15px}#hRep{flex:.9;justify-content:center;color:#b8860b}#hCoin{flex:.7;justify-content:center;color:#7a4db3;cursor:pointer}
#btnMenu{font-size:19px;padding:2px 11px;cursor:pointer}
#info{flex:none;background:var(--paper2);border:3px solid var(--ink);border-radius:11px;padding:4px 9px;font-size:12.5px;line-height:1.3;min-height:44px}
#info .warn{color:#b8321f;font-weight:800}
#mapWrap{flex:0 0 27dvh;min-height:150px;overflow-y:auto;overflow-x:hidden;border:3px solid var(--ink);border-radius:13px;background:#a6d874;-webkit-overflow-scrolling:touch}
canvas#map{display:block;width:100%;height:auto}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#pcontent{flex:1;min-height:0;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:13px;padding:7px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.35}
#pfoot{flex:none;display:flex;gap:6px}#pfoot .btn{flex:1}#pfoot .btn.go{flex:1.6}
#tabs{flex:none;display:flex;gap:4px}
.tab{flex:1;font:inherit;font-weight:800;font-size:12px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:7px 0;min-height:40px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.tab.on{background:var(--sun);transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.btn{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:13px;padding:8px 12px;min-height:44px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:17px}
.btn.alt{background:var(--paper2)}.btn.red{background:var(--red);color:#fff}.btn.sm{min-height:34px;padding:3px 10px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:6px;align-items:center}.row>.grow{flex:1}
.head{font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed #d9c48a;padding:2px 0}.kv b{text-align:right}
.hint{font-size:12.5px;opacity:.85;line-height:1.35}
.warn{color:#b8321f;font-weight:800}.good{color:#1e6b2c;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.item{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:11px;padding:2px 1px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1.12;box-shadow:0 3px 0 var(--ink)}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.item canvas{width:40px;height:40px}.item b{font-size:10.5px}.item span{font-size:10.5px;font-weight:800;color:#1e6b2c}.item small{font-size:9px;opacity:.8}
.item.no{opacity:.5}
.elist{display:flex;flex-direction:column;gap:5px}
.erow{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:3px 8px;cursor:pointer}
.erow.on{background:#fff2b8}.erow canvas{width:34px;height:34px;flex:none}
.step{display:flex;align-items:center;gap:6px}.step b{min-width:22px;text-align:center;font-size:16px}
.step .btn{min-height:34px;width:38px;padding:0;font-size:18px;box-shadow:0 3px 0 var(--ink)}
#ov{position:fixed;inset:0;background:rgba(59,42,26,.55);display:flex;align-items:center;justify-content:center;padding:8px;z-index:10;overflow:auto}
#ov.hidden{display:none}
#card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:12px;width:100%;max-width:400px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px}
#card h2{margin:0;font-size:21px}#card p{margin:0;line-height:1.4;font-size:14.5px}
.q{font-size:16px;line-height:1.4;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:1px 8px}
.fld{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:5px 9px;cursor:pointer;min-height:42px}
.fld.on{background:#fff2b8;box-shadow:0 0 0 3px var(--sun)}.fld span{flex:1;font-size:13.5px;font-weight:700}.fld b{font-size:22px;min-width:60px;text-align:right}.fld small{flex:none;min-width:26px;font-size:12px;opacity:.7;white-space:nowrap}.fld b{min-width:40px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad .btn{font-size:20px;padding:4px 0;min-height:44px}
.ok{background:#dff3d2;border:3px solid var(--ink);border-radius:11px;padding:8px}.bad{background:#ffdcd3;border:3px solid var(--ink);border-radius:11px;padding:8px}
.sum{width:100%;border-collapse:collapse;font-size:14px}.sum td{padding:2px 0;border-bottom:2px dashed #cdb57d}.sum td:last-child{text-align:right;font-weight:800}
.sum tr.sub td{font-weight:800;border-bottom:2px solid var(--ink)}
.stars{font-size:36px;text-align:center;letter-spacing:6px;color:#e5a600;text-shadow:0 2px 0 var(--ink)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:800}.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 4px 1px}.fr b{padding-top:1px}
.ic{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.tic{width:26px;height:26px;object-fit:contain}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1;padding:3px 0}
.evi{width:56px;height:56px;object-fit:contain;flex:none}.evrow{display:flex;gap:8px;align-items:center}
.pic{width:42px;height:42px;object-fit:contain;flex:none}
.hero{position:relative}.hero h2{position:absolute;top:5%;left:0;right:0;text-align:center;color:#fff;margin:0;line-height:1.05;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.cover{width:100%;max-height:52dvh;object-fit:cover;object-position:center top;border-radius:12px;border:3px solid var(--ink);display:block}
#toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:92%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="hDay">День 1/60</div>
    <div class="chip" id="hMoney">0 ₽</div>
    <div class="chip" id="hRep">★ 2,5</div>
    <button class="chip" id="hCoin" aria-label="Монеты знаний" data-i18n-aria="meta_002">◎ 0</button>
    <button class="chip" id="btnMenu" aria-label="Меню" data-i18n-aria="meta_003">≡</button>
  </div>
  <div id="info"></div>
  <div id="mapWrap"><canvas id="map" width="720" height="720"></canvas></div>
  <div id="panel">
    <div id="pcontent"></div>
    <div id="pfoot"></div>
    <div id="tabs"></div>
  </div>
</div>
<div id="ov" class="hidden"><div id="card"></div></div>
<div id="toast"></div>
<script>/* Премиум: общий модуль для браузерных игр на Яндекс Играх.
   Платный Премиум на срок (30 дней или год), без автопродления: «используемая» покупка, срок считается по серверному
   времени Яндекса и хранится в облачных данных игрока. Подробно: README.md рядом с этим файлом.
   Модуль ничего не знает об игре: хранилище, звук и реклама подключаются через init() и несколько вызовов хозяина.
   Без SDK, без покупок или без созданных товаров в консоли кнопка и карточки скрыты, игра работает как раньше. */
window.Premium = (function () {
  "use strict";
  var DAY = 86400000;

  /* ---- Настройки: все числа и товары в одном месте ---- */
  var config = {
    adGapMs: 5 * 60 * 1000,     // интервал полноэкранной рекламы; хозяин читает его при показе (решение владельца 8 ноября: 5 минут)
    cardEvery: 3,               // карточка «Надоела реклама?» после каждой 3-й показанной полноэкранной рекламы
    remindDays: 3,              // напоминание о конце Премиума за столько дней и меньше (раз в сутки)
    pollMs: 60000,              // как часто сверять срок с серверным временем
    tokensKeep: 20,             // сколько токенов последних покупок помнить
    products: {                 // id товара в консоли Яндекса → срок
      premium_30: { days: 30 },
      premium_365: { days: 365 }
    },
    order: ["premium_30", "premium_365"],
    corner: true,               // кнопка «Премиум» в углу экрана
    zIndex: 50
  };

  /* ---- Тексты (временные, их заменит сессия «Тексты»). Подмена: Premium.init({ texts: { ru: {...}, en: {...} } }) ---- */
  var TEXTS = {
    ru: {
      btn: "Премиум", btnOn: "Премиум · {0} д.", title: "Премиум",
      activeUntil: "Активен до {0}. Осталось {1}.",
      notActive: "Сейчас Премиум не включён.",
      perks: ["Без полноэкранной рекламы и баннеров.", "Награды за ролики выдаются сразу, без просмотра.", "Правила и сложность игры не меняются: Премиум не помогает выигрывать."],
      p30: "Премиум на 30 дней", p365: "Премиум на год",
      validTo: "Будет действовать до {0}", buy: "Купить", extend: "Продлить",
      note: "Один платёж, без автопродления: больше ничего не спишется. Если Премиум уже идёт, новый срок добавится к концу.",
      close: "Закрыть", later: "Не сейчас",
      adTitle: "Надоела реклама?", adText: "Премиум: без роликов и баннеров, 30 дней за {0}, не продлевается сам.", adMore: "Узнать про Премиум",
      soonTitle: "Премиум скоро закончится", soonText: "Осталось {0}. Продлить?",
      endTitle: "Премиум закончился", endText: "Реклама вернулась. Можно включить Премиум снова.",
      busy: "Ждём подтверждения оплаты…", done: "Готово! Премиум активен до {0}.",
      fail: "Покупка не прошла. Деньги не списаны.", saveFail: "Оплата принята, но срок пока не сохранился. Не закрывайте игру, мы повторим при следующем запуске.",
      d1: "{0} день", d2: "{0} дня", d5: "{0} дней", free: "Ян", lang: "ru-RU"
    },
    en: {
      btn: "Premium", btnOn: "Premium · {0} d", title: "Premium",
      activeUntil: "Active until {0}. {1} left.",
      notActive: "Premium is not active.",
      perks: ["No full-screen ads or banners.", "Rewards for videos are given instantly, no watching.", "The rules and difficulty stay the same: Premium does not help you win."],
      p30: "Premium for 30 days", p365: "Premium for a year",
      validTo: "Will be active until {0}", buy: "Buy", extend: "Extend",
      note: "One payment, no auto-renewal: nothing else will be charged. If Premium is already running, the new period is added to the end.",
      close: "Close", later: "Not now",
      adTitle: "Tired of ads?", adText: "Premium: no videos or banners, 30 days for {0}, does not renew by itself.", adMore: "About Premium",
      soonTitle: "Premium ends soon", soonText: "{0} left. Extend?",
      endTitle: "Premium has ended", endText: "Ads are back. You can turn Premium on again.",
      busy: "Waiting for payment confirmation…", done: "Done! Premium is active until {0}.",
      fail: "The purchase did not go through. You were not charged.", saveFail: "Payment accepted, but the period is not saved yet. Keep the game open, we will retry on the next start.",
      d1: "{0} day", d2: "{0} days", d5: "{0} days", free: "Yan", lang: "en-GB"
    }
  };

  /* ---- Состояние ---- */
  var sdk = null, payments = null, store = null;
  var lang = "ru", texts = TEXTS.ru;
  var catalog = {};                   // id → описание товара из консоли
  var st = blank();
  var off = 0;                        // запасная поправка серверного времени, если serverTime() недоступен
  var ready = false, canBuy = false, busy = false, chain = Promise.resolve();
  var listeners = [], pollTimer = 0, lastActive = false;
  var ui = { corner: null, ov: null, box: null, status: "", mode: "", style: null, lastFocus: null };

  function blank() { return { until: 0, tokens: [], ads: 0, cardAt: 0, remindDay: 0, endShown: 0 }; }
  function clean(o) {
    var r = blank();
    if (!o || typeof o !== "object") return r;
    r.until = Math.max(0, Number(o.until) || 0);
    r.tokens = Array.isArray(o.tokens) ? o.tokens.filter(function (t) { return typeof t === "string"; }).slice(-config.tokensKeep) : [];
    r.ads = Math.max(0, Math.floor(Number(o.ads) || 0));
    r.cardAt = Math.max(0, Math.floor(Number(o.cardAt) || 0));
    r.remindDay = Math.max(0, Math.floor(Number(o.remindDay) || 0));
    r.endShown = Math.max(0, Number(o.endShown) || 0);
    return r;
  }
  function parse(raw) { try { return clean(typeof raw === "string" ? JSON.parse(raw) : raw); } catch (e) { return blank(); } }
  /* Слияние двух снимков (облако и устройство): срок и счётчики берём большие, токены объединяем.
     Хозяин вызывает при импорте облака, иначе срок мог бы пропасть при конфликте двух устройств. */
  function mergeState(a, b) {
    var x = parse(a), y = parse(b), r = blank(), seen = {};
    r.until = Math.max(x.until, y.until); r.ads = Math.max(x.ads, y.ads); r.cardAt = Math.max(x.cardAt, y.cardAt);
    r.remindDay = Math.max(x.remindDay, y.remindDay); r.endShown = Math.max(x.endShown, y.endShown);
    y.tokens.concat(x.tokens).forEach(function (t) { if (!seen[t]) { seen[t] = 1; r.tokens.push(t); } });
    r.tokens = r.tokens.slice(-config.tokensKeep);
    return JSON.stringify(r);
  }
  function persist() { try { if (store && store.set) store.set(JSON.stringify(st)); } catch (e) {} }
  function loadState() { try { st = parse(store && store.get ? store.get() : null); } catch (e) { st = blank(); } }

  /* ---- Серверное время: часы устройства не используем ---- */
  function now() {
    if (sdk && typeof sdk.serverTime === "function") {
      try { var t = sdk.serverTime(); if (typeof t === "number" && t > 0) { off = t - Date.now(); return t; } } catch (e) {}
    }
    return Date.now() + off;
  }
  function active() { return st.until > now(); }
  function daysLeft() { var ms = st.until - now(); return ms > 0 ? Math.ceil(ms / DAY) : 0; }
  function available() { return !!(ready && canBuy); }

  /* ---- Утилиты текста ---- */
  function fmt(s) { var a = arguments; return String(s).replace(/\{(\d)\}/g, function (m, i) { var v = a[Number(i) + 1]; return v == null ? "" : v; }); }
  function tx(k) { var v = texts[k]; return v != null ? v : (TEXTS.ru[k] != null ? TEXTS.ru[k] : k); }
  function plural(n) {
    if (lang === "en") return fmt(n === 1 ? tx("d1") : tx("d2"), n);
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return fmt(tx("d1"), n);
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return fmt(tx("d2"), n);
    return fmt(tx("d5"), n);
  }
  function dateStr(ms) {
    try { return new Date(ms).toLocaleDateString(tx("lang"), { day: "numeric", month: "long", year: "numeric" }).replace(/\s*г\.$/, ""); }   // без «г.», чтобы в конце фразы не было «г..»
    catch (e) { return new Date(ms).toISOString().slice(0, 10); }
  }
  function priceOf(id) { var c = catalog[id]; return c && c.price ? String(c.price) : ""; }
  function dayIdx() { return Math.floor(now() / DAY); }
  function emit() { var a = active(); lastActive = a; listeners.slice().forEach(function (f) { try { f(a); } catch (e) {} }); renderCorner(); if (ui.ov && ui.mode === "shop") renderShop(); }

  /* ---- Покупка и начисление: запись в облако подтверждена, и только потом consumePurchase ---- */
  function grant(p) {
    var id = p && p.productID, tok = p && p.purchaseToken, prod = config.products[id];
    if (!prod || !tok) return Promise.resolve(false);
    if (st.tokens.indexOf(tok) < 0) {
      var base = Math.max(now(), st.until);
      st.until = base + prod.days * DAY;
      st.tokens.push(tok); if (st.tokens.length > config.tokensKeep) st.tokens.shift();
      persist();
    }
    return Promise.resolve(store && store.save ? store.save() : false).then(function (ok) {
      if (!ok) { var e = new Error("save"); e.code = "save"; throw e; }
      // срок уже сохранён: если закрыть покупку не вышло, её закроют при следующем запуске, второй раз срок не начислится
      return Promise.resolve(payments.consumePurchase(tok)).then(function () {}, function () {});
    }).then(function () { emit(); return true; });
  }
  function queue(f) { var r = chain.then(f, f); chain = r.then(function () {}, function () {}); return r; }
  function checkPurchases() {
    return queue(function () {
      return payments.getPurchases().then(function (list) {
        list = Array.isArray(list) ? list : (list && list.purchases) || [];
        return list.reduce(function (p, item) { return p.then(function () { return grant(item).catch(function () {}); }); }, Promise.resolve());
      });
    }).catch(function () {}).then(function () { emit(); });
  }
  function buy(id) {
    if (busy || !canBuy || !config.products[id]) return Promise.resolve(false);
    busy = true; setStatus(tx("busy")); renderShop();
    return queue(function () {
      return payments.purchase({ id: id, developerPayload: "pm" }).then(function (p) {
        return grant(p).then(function () { setStatus(fmt(tx("done"), dateStr(st.until))); return true; }, function (e) {
          setStatus(e && e.code === "save" ? tx("saveFail") : tx("fail")); return false;
        });
      }, function () { setStatus(tx("fail")); return false; });
    }).then(function (r) { busy = false; renderShop(); return r; }, function () { busy = false; renderShop(); return false; });
  }

  /* ---- Вызовы хозяина ---- */
  function noteFullscreen() { st.ads++; persist(); }
  /* Показать карточку на спокойном экране (меню, результат). Возвращает true, если карточка открыта. */
  function maybeCard() {
    if (!available() || ui.ov) return false;
    if (active()) {
      if (daysLeft() <= config.remindDays && st.remindDay !== dayIdx()) { st.remindDay = dayIdx(); persist(); openCard("soon"); return true; }
      return false;
    }
    if (st.until > 0 && st.endShown !== st.until) { st.endShown = st.until; persist(); openCard("end"); return true; }
    if (config.cardEvery > 0 && Math.floor(st.ads / config.cardEvery) > Math.floor(st.cardAt / config.cardEvery)) { st.cardAt = st.ads; persist(); openCard("ad"); return true; }
    return false;
  }

  /* ---- Интерфейс ---- */
  var CSS = ".pm-corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));z-index:var(--pm-z,50);display:inline-flex;align-items:center;gap:5px;" +
    "min-height:40px;padding:0 12px;border-radius:20px;border:1.5px solid var(--pm-ink,var(--fg,#22304a));background:var(--pm-gold,#f2c14e);color:#2a2110;font:600 14px/1 var(--f-display,system-ui,sans-serif);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)}" +
    ".pm-corner[hidden]{display:none}.pm-corner.on{background:var(--pm-paper,var(--paper,#f4edd9));color:var(--pm-ink,var(--fg,#22304a))}" +

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ensureUi() {
    if (ui.style) return;
    ui.style = el("style"); ui.style.textContent = CSS; document.head.appendChild(ui.style);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ui.ov) closeOv(); });
  }
  function renderCorner() {
    if (!config.corner || typeof document === "undefined") return;
    var show = ready && (canBuy || active());
    try { document.documentElement.classList.toggle("pm-on", !!show); } catch (e) {}
    if (!show) { if (ui.corner) ui.corner.hidden = true; return; }
    ensureUi();
    if (!ui.corner) {
      ui.corner = el("button", "pm-corner"); ui.corner.type = "button"; ui.corner.id = "pmCorner";
      ui.corner.addEventListener("click", function () { openShop(); });
      document.body.appendChild(ui.corner);
    }
    var on = active();
    ui.corner.hidden = false;
    ui.corner.classList.toggle("on", on);
    // звезда и подпись отдельными элементами: хозяин может скрыть подпись на тесном экране (.pm-lbl), кнопка остаётся звездой
    ui.corner.textContent = "";
    ui.corner.appendChild(el("span", "pm-st", "★"));
    ui.corner.appendChild(el("span", "pm-lbl", on ? fmt(tx("btnOn"), daysLeft()) : tx("btn")));

  }
  function setStatus(s) { ui.status = s || ""; var n = ui.box && ui.box.querySelector(".pm-status"); if (n) n.textContent = ui.status; }

    ui.ov = el("div", "pm-ov"); ui.ov.setAttribute("role", "dialog"); ui.ov.setAttribute("aria-modal", "true");
    ui.box = el("div", "pm-box"); ui.ov.appendChild(ui.box);
    ui.ov.addEventListener("click", function (e) { if (e.target === ui.ov) closeOv(); });
    document.body.appendChild(ui.ov);

  function closeOv(quiet) {

    mountOv(); ui.mode = "card:" + kind;

  };

/* T(ключ, русский текст, [аргументы]): в режиме EN берёт перевод из EN, иначе русский; {0},{1} — подстановки */
function T(k,ru,a){var s=(LANG==='en'&&EN[k]!=null)?EN[k]:ru;return a?s.replace(/\{(\d+)\}/g,function(m,i){return a[i];}):s;}
function hasEN(){for(var k in EN)return true;return false;}
function pickLang(){
  var v=PF.get('zoopark-lang');
  if(v==='ru'||v==='en')return(v==='en'&&!hasEN())?'ru':v;
  if(!hasEN())return 'ru';
  var l=(PF.lang()||navigator.language||'ru').toLowerCase().slice(0,2);
  return['ru','be','kk','uk','uz','hy','az','ka','ky','tg','tk','mo','tt'].indexOf(l)>=0?'ru':'en';
}
/* Слой платформы (как в «Кругосветке»): Яндекс Игры SDK, если страница запущена на площадке; иначе заглушки.

const PF=(function(){

  function lsSetRaw(k,v){try{localStorage.setItem(k,v);}catch(e){}}

    try{localStorage.setItem("zoopark-probe","1");lsOk=localStorage.getItem("zoopark-probe")==="1";localStorage.removeItem("zoopark-probe");}catch(e){lsOk=false;}

     Пустой ответ облака (гость) ничего не стирает; ключ, которого нет на устройстве, не затирается. Снимок v1 без времён ключей: время ключа = _t снимка. */

function rectFree(g,x,y,w,h){

function bfs(g,from,to){

  while(q.length){

/* ================= ЭКОНОМИКА ДНЯ ================= */
function binom(n,p){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k;}
function computeDay(det){
  const r={};
  const animals=animalsN(),area=areaTot(),need=foodNeed();
  const d=S.duty;
  // кормление
  const fcov=animals?Math.min(1,d.feed*N_FEED/animals):1;
  const consumed=Math.min(S.stock.food,need*fcov);
  const fedFrac=need?consumed/need:1;
  r.consumed=consumed;r.hungry=Math.round(animals*(1-fedFrac));
  r.foodCost=consumed*foodAvg();
  // уборка
  const ccov=area?Math.min(1,d.clean*N_CLEAN/area):1,dirty=1-ccov;r.dirty=dirty;
  // болезни
  r.crowded=S.enc.filter(crowded).length;

  let sickNew=[],totalSick=0;

  r.sickNew=sickNew;r.sickAfter=sickAfter;r.sickN=sickAfter.reduce((a,b)=>a+b,0);r.treated=treat;
  // привлекательность
  const cnt={};S.enc.forEach(e=>cnt[e.k]=(cnt[e.k]||0)+e.n);
  let A=0;for(const k in cnt)A+=ANI[k].vis*(2-Math.pow(2,1-cnt[k]));
  if(animals){A*=1-.5*r.sickN/animals;A*=1-.6*r.hungry/animals;}

  r.G0=A*repMult*wk*heat;
  r.a0=r.G0*.6;r.c0=r.G0*.4;
  const fa=clamp(1-.8*(S.price.a/BASE_A-1),.2,1.6),fc=clamp(1-.8*(S.price.c/BASE_C-1),.2,1.6);
  r.fa=fa;r.fc=fc;
  let aD=r.a0*fa,cD=r.c0*fc,grp=S.exc?S.exc.n:0;
  const dem=aD+cD+grp;r.demand=Math.round(dem);
  r.cap=d.kassa*N_KASSA;
  const sc=dem>0?Math.min(1,r.cap/dem):1;
  r.adults=Math.round(aD*sc);r.kids=Math.round(cD*sc);r.grp=Math.round(grp*sc);
  r.served=r.adults+r.kids+r.grp;r.lost=Math.max(0,r.demand-r.served);
  const grpPrice=S.exc?Math.round(S.price.c*(1-S.exc.p/100)):0;
  r.revTick=r.adults*S.price.a+r.kids*S.price.c+r.grp*grpPrice;
  // кафе
  r.meals=0;r.revCafe=0;r.costMeals=0;
  if(S.cafe&&d.cafe>=1){
    const fm=clamp(1-.8*(S.price.m/BASE_M-1),.2,1.6);
    r.meals=Math.min(Math.round(r.served*.5*fm),d.cafe*N_CAFE);
    r.revCafe=r.meals*S.price.m;r.costMeals=r.meals*P_MEAL_COST;
  }
  r.rev=r.revTick+r.revCafe;
  r.sal=S.staff.w*SAL_W+S.staff.v*SAL_V;
  r.water=animals*P_WATER*(S.heat>0?2:1);
  r.interest=(S.loan&&S.loan.due===S.day)?Math.round(S.loan.total-S.loan.amt):0;
  r.fine=0;r.inspN=0;
  if(inspToday){r.inspN=r.crowded;r.fine=r.crowded*5000;}
  r.exp=r.foodCost+r.sal+r.water+r.costMeals+r.interest+r.fine;
  r.profit=r.rev-r.exp;
  // репутация
  const why=[];let dr=1;why.push([T("econ_001","Работа зоопарка"),1]);
  const add=(t,v)=>{if(v){dr+=v;why.push([t,v]);}};

  add(T("econ_004","Тесные вольеры"),-2*r.crowded);
  add(T("econ_005","Очередь у кассы"),-r.lost/20);
  if(inspToday){add(r.crowded?T("econ_006","Инспектор: нарушения"):T("econ_007","Инспектор: всё в порядке"),r.crowded?-5*r.crowded:5);}
  r.dRep=dr;r.why=why;r.insp=inspToday;r.holiday=wk>1;r.heat=S.heat>0;r.epi=S.epi;
  return r;
}
function commitDay(r){
  S.money+=r.rev-r.sal-r.water-r.costMeals-r.fine;
  S.stock.food-=r.consumed;S.stock.foodVal=Math.max(0,S.stock.foodVal-r.foodCost);

    if(S.money>=S.loan.total){S.money-=S.loan.total;r.loanNote=T("econ_008","Кредит возвращён: {0}",[money(S.loan.total)]);S.loan=null;}

  }

function drawEnc(c,e,time){
  const x=e.x*CP,y=e.y*CP,w=e.w*CP,h=e.h*CP,A=ANI[e.k];

  for(let i=1;i<e.w;i++){c.beginPath();c.moveTo(x+i*CP,y);c.lineTo(x+i*CP,y+h);c.stroke();}
  for(let j=1;j<e.h;j++){c.beginPath();c.moveTo(x,y+j*CP);c.lineTo(x+w,y+j*CP);c.stroke();}
  // звери
  const cols=Math.max(1,Math.ceil(Math.sqrt(e.n*e.w/e.h))),rows=Math.ceil(e.n/cols),cw=w/cols,ch=h/rows;

    const cx=x+(i%cols+.5)*cw,cy=y+(Math.floor(i/cols)+.55)*ch,bob=Math.sin(time*3+i*1.7+e.id)*1.2;

  else{c.lineWidth=5;c.strokeStyle=INK;c.strokeRect(x,y,w,h);c.lineWidth=2.6;c.strokeStyle='#d9a066';c.strokeRect(x,y,w,h);}
  [[0,0],[w,0],[0,h],[w,h]].forEach(p=>rect(c,x+p[0]-3,y+p[1]-3,6,6,'#b9783a',2));

/* ================= СИМУЛЯЦИЯ ДНЯ ================= */
const PCOL=['#e8604c','#4aa8d8','#f2b632','#7ac26b','#b57edc','#f08cb0'];
function mkAgent(g,targets){
  const gate={x:10,y:S.rows-1};let cur=gate;const wp=[];
  const n=Math.min(targets.length,ri(1,3));
  for(let i=0;i<n;i++){
    const t=pick(targets),p=bfs(g,cur,t);
    if(!p)continue;p.forEach((c,k)=>wp.push({x:(c.x+.5)*CP,y:(c.y+.5)*CP,wait:k===p.length-1?ri(8,14)/10:0}));cur=t;
  }
  const back=bfs(g,cur,gate);if(back)back.forEach(c=>wp.push({x:(c.x+.5)*CP,y:(c.y+.5)*CP,wait:0}));
  return{x:(gate.x+.5)*CP,y:(gate.y+.5)*CP,col:pick(PCOL),spr:pick(['vis_man','vis_woman','vis_boy','vis_girl']),dir:1,wp,i:0,wait:0};
}
function targetsList(g){
  const out=[];
  const ring=(x,y,w,h)=>{const c=[];for(let xx=x-1;xx<=x+w;xx++)for(let yy=y-1;yy<=y+h;yy++){if(xx<0||yy<0||xx>=COLS||yy>=S.rows)continue;if(xx>=x&&xx<x+w&&yy>=y&&yy<y+h)continue;if(!g[yy][xx])c.push({x:xx,y:yy});}return c;};
  S.enc.forEach(e=>{const c=ring(e.x,e.y,e.w,e.h);if(c.length)out.push(pick(c));});
  if(S.cafe){const c=ring(S.cafe.x,S.cafe.y,4,3);if(c.length)out.push(pick(c));}
  return out;
}
function startSim(){
  if(!S.cafe&&S.duty.cafe>0)S.duty.cafe=0;
  const r=computeDay(false);
  sim={t:0,T:10,r,entered:0,agents:[],pops:[],speed:1,cash:0,g:occGrid()};
  mode='sim';selId=0;
  renderAll();
}
function updateSim(dt){
  const s=sim,d=dt*s.speed;s.t+=d;
  const tgt=Math.min(s.r.served,Math.floor(s.r.served*Math.min(1,s.t/s.T)));
  while(s.entered<tgt){
    s.entered++;
    const pr=s.entered<=s.r.adults?S.price.a:S.price.c;
    s.cash+=pr;if(s.pops.length<10)s.pops.push({x:(10+ (Math.random()*2-1))*CP,y:(S.rows-2)*CP,age:0,txt:'+'+pr});
    const every=Math.max(1,Math.ceil(s.r.served/40));
    if(s.entered%every===0&&s.agents.length<40){const tl=targetsList(s.g);if(tl.length)s.agents.push(mkAgent(s.g,tl));}
  }
  s.pops.forEach(p=>p.age+=d);s.pops=s.pops.filter(p=>p.age<1.2);
  s.agents.forEach(a=>{
    let left=75*d;
    while(left>0&&a.i<a.wp.length){
      if(a.wait>0){const w=Math.min(a.wait,left/75);a.wait-=w;left-=w*75;if(a.wait>0)break;a.i++;continue;}
      const p=a.wp[a.i],dx=p.x-a.x,dy=p.y-a.y,dist=Math.hypot(dx,dy);
      if(dist<=left){a.x=p.x;a.y=p.y;left-=dist;a.wait=p.wait||0;if(!a.wait)a.i++;}
      else{a.x+=dx/dist*left;a.y+=dy/dist*left;left=0;}
      if(Math.abs(dx)>.5)a.dir=dx>0?1:-1;
    }
  });
  s.agents=s.agents.filter(a=>a.i<a.wp.length);
  const bar=$('#simBar');if(bar)bar.style.width=Math.min(100,s.t/s.T*100)+'%';
  const live=$('#simLive');if(live)live.innerHTML=T("sim_001","Гостей: <b>{0}</b> из {1} · билеты: <b>{2}</b>",[s.entered,s.r.served,money(s.cash)]);
  if(s.t>=s.T&&s.entered>=s.r.served)finishDay();
}
function finishDay(){
  const r=sim.r,dayNo=S.day;
  commitDay(r);sim=null;mode='over';save();renderAll();showReport(r,dayNo);
}

let AK=null;
function ask(cfg){
  AK={cfg,vals:{},act:cfg.fields[0].id};
  cfg.fields.forEach(f=>AK.vals[f.id]=f.val!==undefined?String(f.val):'');
  mode='over';
  const flds=cfg.fields.map(f=>`<div class="fld" data-act="fld" data-f="${f.id}" id="fld_${f.id}"><span>${f.label}</span><b id="fv_${f.id}">—</b><small>${f.unit||''}</small></div>`).join('');
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-act="key" data-k="${n}">${n}</button>`).join('')
    +`<button class="btn alt" data-act="kback">⌫</button><button class="btn" data-act="key" data-k="0">0</button><button class="btn alt" data-act="knext">${cfg.fields.length>1?'→':'C'}</button>`;
  card(`<div class="head"><span>${cfg.title}</span>${cfg.tag?`<span class="tag">${cfg.tag}</span>`:''}</div>
    ${cfg.preview?'<canvas id="askPrev" width="720" height="260" style="width:100%;height:130px;border:3px solid var(--ink);border-radius:10px;background:#fff"></canvas>':''}
    <div class="q" id="askInfo" style="font-size:14.5px"></div>${flds}
    <div class="pad">${keys}</div>
    <div class="row"><button class="btn go grow" data-act="kok">${cfg.ok||T("card_001","Готово")}</button>${cfg.cancel===false?'':'<button class="btn alt grow" data-act="kcancel">'+(cfg.cancelText||T("card_002","Отмена"))+'</button>'}</div>
    ${(cfg.extra||[]).map((x,i)=>`<button class="btn alt" data-act="kextra" data-i="${i}" style="min-height:38px;font-size:14px">${x.label}</button>`).join('')}`);
  updateAsk();
}
function askNums(){const o={};for(const k in AK.vals)o[k]=AK.vals[k]===''?NaN:Number(AK.vals[k]);return o;}
function updateAsk(){
  const c=AK.cfg,v=askNums();
  c.fields.forEach(f=>{$('#fv_'+f.id).textContent=AK.vals[f.id]||'—';$('#fld_'+f.id).classList.toggle('on',f.id===AK.act);});
  const inf=$('#askInfo');inf.innerHTML=typeof c.info==='function'?c.info(v):(c.info||'');inf.style.display=inf.innerHTML?'':'none';

function askKey(d){const f=AK.cfg.fields.find(x=>x.id===AK.act);const cur=AK.vals[AK.act];if(cur.length>=(f.max||7))return;AK.vals[AK.act]=(cur==='0'?'':cur)+d;updateAsk();}

function openBuilder(k){
  const A=ANI[k];

    info:v=>T("x_011","Животное: {0} · корм {1} кг/день · забор {2} ₽/м (на складе {3} м, нехватка — {4} ₽/м){5}",[money(A.price),A.kg,P_FENCE,S.stock.fence,P_FENCE_X,tutor()&&v.w>0&&v.h>0&&v.n>0?T("x_010","<br>На особь: {0} м² — {1}",[num((v.w*v.h/v.n).toFixed(1)),v.w*v.h>=v.n*A.area?T("x_008","<span class=\"good\">хватает</span>"):T("x_009","<span class=\"warn\">тесно!</span>")]):'']),
    preview:(g,v,W,H)=>{
      g.fillStyle='#f3ead0';g.fillRect(0,0,W,H);
      if(!(v.w>0&&v.h>0))return;
      const sc=Math.min((W-80)/v.w,(H-60)/v.h,40),w=v.w*sc,h=v.h*sc,x=(W-w)/2,y=(H-h)/2+6;
      g.fillStyle=A.gr;g.fillRect(x,y,w,h);g.strokeStyle='rgba(59,42,26,.18)';g.lineWidth=1;
      for(let i=1;i<v.w;i++){g.beginPath();g.moveTo(x+i*sc,y);g.lineTo(x+i*sc,y+h);g.stroke();}
      for(let j=1;j<v.h;j++){g.beginPath();g.moveTo(x,y+j*sc);g.lineTo(x+w,y+j*sc);g.stroke();}
      g.lineWidth=6;g.strokeStyle=INK;g.strokeRect(x,y,w,h);
      g.fillStyle=INK;g.font='bold 24px sans-serif';g.textAlign='center';g.fillText(v.w+T("x_012"," м"),W/2,y-8);g.save();g.translate(x-14,y+h/2);g.rotate(-Math.PI/2);g.fillText(v.h+T("x_012"," м"),0,0);g.restore();
      if(v.n>0)drawAnimal(g,k,W/2,y+h/2+6,Math.min(1.6,sc*Math.min(v.w,v.h)/60));
    },
    ok:T("x_013","Построить"),
    onOk:v=>{
      if(!(v.w>=1&&v.h>=1&&v.n>=1)){toast(T("x_014","Укажи ширину, длину и число животных"));return false;}
      if(!(v.f>=0)||isNaN(v.f)||isNaN(v.s)){toast(T("x_015","Посчитай площадь и забор и впиши их"));return false;}
      if(v.w>18||v.h>18){toast(T("x_016","Не больше 18 м по стороне"));return false;}
      const res=doBuild(k,v.n,v.w,v.h,v.s,v.f);
      if(res.err){toast(res.err);return false;}
      showBuildResult(res);return true;
    }});
}
function doBuild(k,n,w,h,sTyped,fOrd){
  const A=ANI[k],spot=findSpot(w,h);
  if(!spot)return{err:T("x_017","Нет места такого размера: докупи землю или уменьши вольер")};
  const area=w*h,P=2*(w+h),have=S.stock.fence+fOrd,miss=Math.max(0,P-have);
  const cost=n*A.price+fOrd*P_FENCE+miss*P_FENCE_X;
  if(cost>S.money)return{err:T("x_018","Не хватает {0}",[money(cost-S.money)])};
  S.money-=cost;S.stock.fence=have+miss-P;
  S.enc.push({id:S.nid++,k,n,w,h,x:spot.x,y:spot.y,sick:0});
  return{ok:true,k,n,w,h,area,P,miss,fOrd,cost,areaOk:sTyped===area,fenceOk:fOrd===P,crowd:area<n*A.area};
}

function startDay(){
  PF.setPlaying(true);
  if(S.day>DAYS){showFinal();return;}
  if(S.day>=3&&!S.morning){
    // события
    const wk=isWeekend(S.day),r=Math.random();
    if(r<.07&&animalsN()>=3)S.epi=true;
    else if(r<.14&&S.heat<=0)S.heat=2;
    else if(r<.26&&!wk&&S.insp!==S.day){const n=ri(20,50),p=pick([10,15,20,25,30]);S.exc={n,p};}
    if(S.insp<S.day&&Math.random()<.08&&S.day<DAYS)S.insp=S.day+1;
  }
  S.morning=true;
  if(!S.task||S.taskDone)S.task=genTask();
  S.taskDone=false;
  save();renderAll();showMorning();
}

function showMenu(){
  if(mode==='sim')return;
  card(T("x_160","<h2>Меню</h2><p><b>Как играть.</b> Каждый день: задача → вольеры, люди, цены, корм → «Открыть день». Гостей приходит тем больше, чем интереснее животные и выше репутация, и тем меньше, чем дороже билет. Касса пропускает 60 гостей на кассира. Тесно животным — болеют. Считай сам: площадь, забор, корм, зарплаты, проценты.</p>\n    <div class=\"row\"><button class=\"btn alt grow\" data-act=\"ad\">Ролик → ◎1</button><button class=\"btn go grow\" data-act=\"close\">Играть</button></div><button class=\"btn red\" data-act=\"restart\">Начать заново</button>")+(hasEN()?'<button class="btn sm alt" data-act="lang">RU ⇄ EN</button>':''));
  premUi();
}
function startGame(){S=newState();save();fitCanvas();startDay();}

/* ================= СОБЫТИЯ ВВОДА ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  switch(a){
  case 'fld':AK.act=b.dataset.f;updateAsk();return;
  case 'key':askKey(b.dataset.k);return;
  case 'kback':AK.vals[AK.act]=AK.vals[AK.act].slice(0,-1);updateAsk();return;
  case 'knext':{const ids=AK.cfg.fields.map(f=>f.id),i=ids.indexOf(AK.act);if(ids.length>1)AK.act=ids[(i+1)%ids.length];else AK.vals[AK.act]='';updateAsk();return;}
  case 'kok':{const r=AK.cfg.onOk(askNums());if(r===true){/* закрытие внутри onOk */}return;}
  case 'kcancel':{const f=AK.cfg.cancelFn||AK.cancelFn;if(f)f();else{closeCard();mode=S?'idle':'over';if(S)renderAll();}return;}
  case 'kextra':AK.cfg.extra[+b.dataset.i].fn();return;
  case 'taskgo':showTask();return;
  case 'excask':excAsk();return;
  case 'repq':askReportQ();return;
  case 'nextday':nextDay();return;
  case 'ad':watchAd();return;
  case 'new':startGame();return;
  case 'continue':{const sv=lsGet(SAVE_KEY);if(sv&&sv.v===2){S=sv;PF.setPlaying(true);fitCanvas();renderAll();if(!S.taskDone)showMorning();else{closeCard();mode='idle';renderAll();}}else startGame();return;}
  case 'restart':yesNo(T("x_161","Начать заново? Весь прогресс будет потерян."),startGame);return;
  case 'yes':{const f=YN;YN=null;closeCard();mode='idle';if(f)f();return;}
  case 'no':YN=null;closeCard();mode=S?'idle':'over';if(S)renderAll();return;
  }
  doAct(a,b);
});
$('#btnMenu').addEventListener('click',()=>{if(S&&mode!=='sim')showMenu();});
$('#hCoin').addEventListener('click',()=>{if(S&&mode!=='sim')watchAd();});
cv.addEventListener('click',ev=>{
  if(!S||mode==='sim'||mode==='over')return;
  const r=cv.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)/r.width*COLS),y=Math.floor((ev.clientY-r.top)/r.height*S.rows);
  const e=S.enc.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h);
  if(e){selId=e.id;tab='enc';renderPanel();}else if(selId){selId=0;renderPanel();}
});

/* ================= ЦИКЛ ================= */
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(sim&&!PF.paused())updateSim(dt);render(ts/1000);}
window.addEventListener('resize',()=>{if(S)fitCanvas();});
requestAnimationFrame(frame);


document.title=T("meta_001","Зоопарк");
document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.i18nAria,e.getAttribute('aria-label'))));
window.__premUi=premUi;
PF.onCloud=function(){try{premInit();}catch(e){}if(mode==='over'&&!S&&!$('#ov').classList.contains('hidden'))showStart();};
showStart();PF.ready();
}
</script>
<script>

var PREM_TEXTS={
  ru:{perks:["Без полноэкранной рекламы.","Награда за ролик выдаётся сразу, без просмотра (не чаще раза в 45 секунд).","Правила и сложность не меняются: Премиум не помогает выигрывать и не продаёт монеты знаний."],
      adTitle:"Надоела реклама?",adText:"Строй вольеры и управляй бюджетом зоопарка без рекламных пауз! Премиум убирает полноэкранную рекламу, а награды за ролики выдаёт сразу.",
      endText:"Полноэкранная реклама вернулась, а для наград снова нужны ролики. Твой зоопарк продолжает работать!"},
  en:{perks:["No full-screen ads.","Video rewards are given instantly, without watching (no more than once every 45 seconds).","Rules and difficulty stay the same: Premium does not help you win and does not sell knowledge coins."],
      adTitle:"Tired of ads?",adText:"Build animal habitats and manage your zoo budget without ad breaks! Premium removes full-screen ads and gives video rewards instantly.",
      endText:"Full-screen ads are back, and video rewards require watching ads again. Your zoo is still open!"}
};

/* Правила слияния облака и устройства: побеждает больший прогресс, а не более поздняя запись. */
function jp(x){try{return JSON.parse(x);}catch(e){return null;}}
PF.mergers['zoopark-save-v2']=function(a,b){var x=jp(a),y=jp(b);if(!x||!y)return null;if((x.day||0)!==(y.day||0))return(x.day||0)>(y.day||0)?a:b;return null;};
PF.mergers['zoopark-best-v2']=function(a,b){var x=jp(a),y=jp(b);if(!x||!y)return null;return(x.capital||0)>=(y.capital||0)?a:b;};
PF.mergers['zoopark-premium']=function(a,b){return window.Premium&&Premium.mergeState?Premium.mergeState(a,b):null;};
function premInit(){
try{Premium.init({sdk:PF.sdk(),lang:LANG,texts:PREM_TEXTS,config:{corner:false},store:{get:function(){return PF.get('zoopark-premium');},set:function(r){PF.put('zoopark-premium',r);},save:function(){return PF.save();}}}).then(function(){try{if(!document.getElementById('ov').classList.contains('hidden'))window.__premUi();}catch(e){}});}catch(e){}
}
PF.init().then(function(){LANG=pickLang();document.documentElement.lang=LANG;__start();
  premInit();
});
</script>
