<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Лунная база</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{--bg:#070b1a;--panel:#111a38;--panel2:#18234a;--line:#2b3a70;--txt:#eaf0ff;--dim:#9fb0e0;--ok:#5be28a;--bad:#ff6b6b;--warn:#ffc857;--warm:#ffb14a;--blue:#4aa8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#03050d;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;
 padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
#hud b{font-size:15px}
#phase{flex:1;text-align:center;line-height:1.15}
#phase small{display:block;color:var(--dim);font-size:11px}
#bar{height:5px;background:#0b1128}
#bar i{display:block;height:100%;width:0;background:var(--warm);transition:width .3s}
#bar.n i{background:var(--blue)}
canvas{display:block;width:100%;aspect-ratio:375/200;background:#05070f}
#main{flex:1;overflow-y:auto;padding:8px 10px;-webkit-overflow-scrolling:touch}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 7px;font-size:12px;line-height:1.2;position:relative;overflow:hidden}
.chip b{font-size:14px;display:block}
.chip em{font-style:normal;color:var(--dim);font-size:10.5px}
.chip.low{border-color:var(--bad)}.chip.low b{color:var(--bad)}
.chip i{position:absolute;left:0;bottom:0;height:3px;background:var(--blue)}
.crew{display:grid;gap:6px}
.card{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.av{width:42px;height:42px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;overflow:hidden;border:2px solid var(--c,#4aa8ff)}
.av img{width:100%;height:100%;object-fit:cover}
.toast .evi{display:inline-block;width:40px;height:40px;margin:0 8px 0 0;vertical-align:middle}
.evi{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 6px}
.chip img.ic{width:16px;height:16px;vertical-align:-3px}
.card .nm{flex:1;min-width:0;font-size:13px}
.card .nm b{font-size:14px}
.hp{height:6px;background:#0b1128;border-radius:3px;margin-top:3px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--ok)}
select{font:inherit;font-size:13px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 4px;max-width:150px;min-height:40px}
#bottom{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));background:var(--panel);border-top:1px solid var(--line)}
button{font:inherit;font-weight:600;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 10px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.dim{opacity:.4}
button.go{background:linear-gradient(#ffb14a,#e8832a);border-color:#ffd49a;color:#2a1600}
#bottom button.go{flex:1.6}
button.blue{background:linear-gradient(#4aa8ff,#2a74d0);border-color:#9bd0ff;color:#04162e}
#bottom button{flex:1;font-size:13px}
button.pulse{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 5px rgba(255,177,74,.35)}}
#ov{position:absolute;inset:0;background:rgba(3,5,13,.82);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.on{display:flex}
#sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0))}
#sheet h2{margin:0 0 8px;font-size:18px}
#sheet p{margin:6px 0;font-size:14px;line-height:1.4}
#sheet .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#sheet .btns button{flex:1;min-width:120px}
.row{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:13px}
.row .l{flex:1}
input[type=text]{width:64px;font:inherit;font-size:16px;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:#0b1128;color:var(--txt);text-align:center}
input.ok{border-color:var(--ok);background:#0f2b1b}input.no{border-color:var(--bad)}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:var(--panel2);color:var(--dim)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.w{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:4px 3px;border-bottom:1px solid var(--line);text-align:left}
.q{display:grid;gap:6px;margin-top:8px}
.q button{text-align:left;min-height:44px}
.q button.right{background:#124a2a;border-color:var(--ok)}.q button.wrong{background:#4a1a1a;border-color:var(--bad)}
#menu{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 30% 20%,#14306b 0,#070b1a 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#menu h1{margin:0;font-size:34px;letter-spacing:1px;text-shadow:0 0 18px #4aa8ff}
#menu p{margin:0;color:var(--dim);font-size:14px;max-width:300px;line-height:1.4}
#menu button{width:240px}
#menu .cover{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d7d9df,#7b7e88 70%);box-shadow:0 0 40px rgba(74,168,255,.5);position:relative;display:flex;align-items:center;justify-content:center;font-size:54px}
#menu .cover img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.small{font-size:12px;color:var(--dim)}
.toast{position:absolute;left:10px;right:10px;top:50px;background:#1c2b5c;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;z-index:15;display:none}
:root{--pm-paper:#16224a;--pm-paper2:#1c2b5c;--pm-ink:#e8eefc;--pm-gold:#f7b34a;--pm-red:#f7b34a;--pm-redink:#1a1205;--pm-muted:#9fb0dd;--pm-line:#2d3f7a}
.pm-corner{opacity:.55}.pm-corner .pm-lbl{display:none}.pm-on #hud{padding-right:58px}
html.inmenu .pm-corner{opacity:1}html.inmenu .pm-corner .pm-lbl{display:inline}
</style></head>
<body>
<div id="app">
 <div id="hud"><div>🌙 <b id="hcy">1/12</b></div><div id="phase">День<small>сутки 0/14</small></div><div>₵ <b id="hcr">0</b> <button id="hLang" style="min-height:26px;padding:1px 7px;font-size:11px;width:auto;margin-left:4px">RU</button></div></div>
 <div id="bar"><i></i></div>
 <canvas id="cv" width="750" height="400"></canvas>
 <div id="main"><div class="chips" id="chips"></div><div class="crew" id="crew"></div></div>
 <div id="bottom">
  <button id="bMod">🏗 Модули</button>
  <button id="bShop">📦 Закупки</button>
  <button id="bCalc">📐 Расчёт</button>
  <button id="bGo" class="go">Дальше ▶</button>
 </div>
 <div class="toast" id="toast"></div>
 <div id="ov"><div id="sheet"></div></div>
 <div id="menu">
  <div class="cover" id="coverBox">🌕</div>
  <h1 id="mTitle">Лунная база</h1>
  <p id="mDesc">14 суток дня, 14 суток ночи, −170°. Посчитай запасы — или база замёрзнет.</p>
  <button class="go" id="mNew">Новая игра</button>
  <button id="mCont" style="display:none">Продолжить</button>
  <button id="mHow">Как играть</button>
  <button id="mLang" style="width:auto;min-height:34px;padding:4px 14px;font-size:12px">RU ▸ EN</button>
 </div>
</div>
<script>
/* Премиум: общий модуль для браузерных игр на Яндекс Играх.
   Платный Премиум на срок (30 дней или год), без автопродления: «используемая» покупка, срок считается по серверному
   времени Яндекса и хранится в облачных данных игрока. Подробно: README.md рядом с этим файлом.
   Модуль ничего не знает об игре: хранилище, звук и реклама подключаются через init() и несколько вызовов хозяина.
   Без SDK, без покупок или без созданных товаров в консоли кнопка и карточки скрыты, игра работает как раньше. */
window.Premium = (function () {
  "use strict";
  var DAY = 86400000;

  /* ---- Настройки: все числа и товары в одном месте ---- */
  var config = {
    adGapMs: 5 * 60 * 1000,     // интервал полноэкранной рекламы; хозяин читает его при показе (решение владельца 8 ноября: 5 минут)
    cardEvery: 3,               // карточка «Надоела реклама?» после каждой 3-й показанной полноэкранной рекламы
    remindDays: 3,              // напоминание о конце Премиума за столько дней и меньше (раз в сутки)
    pollMs: 60000,              // как часто сверять срок с серверным временем
    tokensKeep: 20,             // сколько токенов последних покупок помнить
    products: {                 // id товара в консоли Яндекса → срок
      premium_30: { days: 30 },
      premium_365: { days: 365 }
    },
    order: ["premium_30", "premium_365"],
    corner: true,               // кнопка «Премиум» в углу экрана
    zIndex: 50
  };

  /* ---- Тексты (временные, их заменит сессия «Тексты»). Подмена: Premium.init({ texts: { ru: {...}, en: {...} } }) ---- */
  var TEXTS = {
    ru: {
      btn: "Премиум", btnOn: "Премиум · {0} д.", title: "Премиум",
      activeUntil: "Активен до {0}. Осталось {1}.",
      notActive: "Сейчас Премиум не включён.",
      perks: ["Без полноэкранной рекламы и баннеров.", "Подарок каждый день.", "Правила и сложность игры не меняются: Премиум не помогает выигрывать."],
      p30: "Премиум на 30 дней", p365: "Премиум на год",
      validTo: "Будет действовать до {0}", buy: "Купить", extend: "Продлить",
      note: "Один платёж, без автопродления: больше ничего не спишется. Если Премиум уже идёт, новый срок добавится к концу.",
      close: "Закрыть", later: "Не сейчас",
      adTitle: "Надоела реклама?", adText: "Премиум: без роликов и баннеров, 30 дней за {0}, не продлевается сам.", adMore: "Узнать про Премиум",
      soonTitle: "Премиум скоро закончится", soonText: "Осталось {0}. Продлить?",
      endTitle: "Премиум закончился", endText: "Реклама вернулась. Можно включить Премиум снова.",
      busy: "Ждём подтверждения оплаты…", done: "Готово! Премиум активен до {0}.",
      fail: "Покупка не прошла. Деньги не списаны.", saveFail: "Оплата принята, но срок пока не сохранился. Не закрывайте игру, мы повторим при следующем запуске.",
      d1: "{0} день", d2: "{0} дня", d5: "{0} дней", free: "Ян", lang: "ru-RU"
    },
    en: {
      btn: "Premium", btnOn: "Premium · {0} d", title: "Premium",
      activeUntil: "Active until {0}. {1} left.",
      notActive: "Premium is not active.",
      perks: ["No full-screen ads or banners.", "A gift every day.", "The rules and difficulty stay the same: Premium does not help you win."],
      p30: "Premium for 30 days", p365: "Premium for a year",
      validTo: "Will be active until {0}", buy: "Buy", extend: "Extend",
      note: "One payment, no auto-renewal: nothing else will be charged. If Premium is already running, the new period is added to the end.",
      close: "Close", later: "Not now",
      adTitle: "Tired of ads?", adText: "Premium: no videos or banners, 30 days for {0}, does not renew by itself.", adMore: "About Premium",
      soonTitle: "Premium ends soon", soonText: "{0} left. Extend?",
      endTitle: "Premium has ended", endText: "Ads are back. You can turn Premium on again.",
      busy: "Waiting for payment confirmation…", done: "Done! Premium is active until {0}.",
      fail: "The purchase did not go through. You were not charged.", saveFail: "Payment accepted, but the period is not saved yet. Keep the game open, we will retry on the next start.",
      d1: "{0} day", d2: "{0} days", d5: "{0} days", free: "Yan", lang: "en-GB"
    }
  };

  /* ---- Состояние ---- */
  var sdk = null, payments = null, store = null;
  var lang = "ru", texts = TEXTS.ru;
  var catalog = {};                   // id → описание товара из консоли
  var st = blank();
  var off = 0;                        // запасная поправка серверного времени, если serverTime() недоступен
  var ready = false, canBuy = false, busy = false, chain = Promise.resolve();
  var listeners = [], pollTimer = 0, lastActive = false;
  var ui = { corner: null, ov: null, box: null, status: "", mode: "", style: null, lastFocus: null };

  function blank() { return { until: 0, tokens: [], ads: 0, cardAt: 0, remindDay: 0, endShown: 0 }; }
  function clean(o) {
    var r = blank();
    if (!o || typeof o !== "object") return r;
    r.until = Math.max(0, Number(o.until) || 0);
    r.tokens = Array.isArray(o.tokens) ? o.tokens.filter(function (t) { return typeof t === "string"; }).slice(-config.tokensKeep) : [];
    r.ads = Math.max(0, Math.floor(Number(o.ads) || 0));
    r.cardAt = Math.max(0, Math.floor(Number(o.cardAt) || 0));
    r.remindDay = Math.max(0, Math.floor(Number(o.remindDay) || 0));
    r.endShown = Math.max(0, Number(o.endShown) || 0);
    return r;
  }
  function parse(raw) { try { return clean(typeof raw === "string" ? JSON.parse(raw) : raw); } catch (e) { return blank(); } }
  /* Слияние двух снимков (облако и устройство): срок и счётчики берём большие, токены объединяем.
     Хозяин вызывает при импорте облака, иначе срок мог бы пропасть при конфликте двух устройств. */
  function mergeState(a, b) {
    var x = parse(a), y = parse(b), r = blank(), seen = {};
    r.until = Math.max(x.until, y.until); r.ads = Math.max(x.ads, y.ads); r.cardAt = Math.max(x.cardAt, y.cardAt);
    r.remindDay = Math.max(x.remindDay, y.remindDay); r.endShown = Math.max(x.endShown, y.endShown);
    y.tokens.concat(x.tokens).forEach(function (t) { if (!seen[t]) { seen[t] = 1; r.tokens.push(t); } });
    r.tokens = r.tokens.slice(-config.tokensKeep);
    return JSON.stringify(r);
  }
  function persist() { try { if (store && store.set) store.set(JSON.stringify(st)); } catch (e) {} }
  function loadState() { try { st = parse(store && store.get ? store.get() : null); } catch (e) { st = blank(); } }

  /* ---- Серверное время: часы устройства не используем ---- */
  function now() {
    if (sdk && typeof sdk.serverTime === "function") {
      try { var t = sdk.serverTime(); if (typeof t === "number" && t > 0) { off = t - Date.now(); return t; } } catch (e) {}
    }
    return Date.now() + off;
  }
  function active() { return st.until > now(); }
  function daysLeft() { var ms = st.until - now(); return ms > 0 ? Math.ceil(ms / DAY) : 0; }
  function available() { return !!(ready && canBuy); }

  /* ---- Утилиты текста ---- */
  function fmt(s) { var a = arguments; return String(s).replace(/\{(\d)\}/g, function (m, i) { var v = a[Number(i) + 1]; return v == null ? "" : v; }); }
  function tx(k) { var v = texts[k]; return v != null ? v : (TEXTS.ru[k] != null ? TEXTS.ru[k] : k); }
  function plural(n) {
    if (lang === "en") return fmt(n === 1 ? tx("d1") : tx("d2"), n);
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return fmt(tx("d1"), n);
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return fmt(tx("d2"), n);
    return fmt(tx("d5"), n);
  }
  function dateStr(ms) {
    try { return new Date(ms).toLocaleDateString(tx("lang"), { day: "numeric", month: "long", year: "numeric" }).replace(/\s*г\.$/, ""); }   // без «г.», чтобы в конце фразы не было «г..»
    catch (e) { return new Date(ms).toISOString().slice(0, 10); }
  }
  function priceOf(id) { var c = catalog[id]; return c && c.price ? String(c.price) : ""; }
  function dayIdx() { return Math.floor(now() / DAY); }
  function emit() { var a = active(); lastActive = a; listeners.slice().forEach(function (f) { try { f(a); } catch (e) {} }); renderCorner(); if (ui.ov && ui.mode === "shop") renderShop(); }

  /* ---- Покупка и начисление: запись в облако подтверждена, и только потом consumePurchase ---- */
  function grant(p) {
    var id = p && p.productID, tok = p && p.purchaseToken, prod = config.products[id];
    if (!prod || !tok) return Promise.resolve(false);
    if (st.tokens.indexOf(tok) < 0) {
      var base = Math.max(now(), st.until);
      st.until = base + prod.days * DAY;
      st.tokens.push(tok); if (st.tokens.length > config.tokensKeep) st.tokens.shift();
      persist();
    }
    return Promise.resolve(store && store.save ? store.save() : false).then(function (ok) {
      if (!ok) { var e = new Error("save"); e.code = "save"; throw e; }
      // срок уже сохранён: если закрыть покупку не вышло, её закроют при следующем запуске, второй раз срок не начислится
      return Promise.resolve(payments.consumePurchase(tok)).then(function () {}, function () {});
    }).then(function () { emit(); return true; });
  }
  function queue(f) { var r = chain.then(f, f); chain = r.then(function () {}, function () {}); return r; }
  function checkPurchases() {
    return queue(function () {
      return payments.getPurchases().then(function (list) {
        list = Array.isArray(list) ? list : (list && list.purchases) || [];
        return list.reduce(function (p, item) { return p.then(function () { return grant(item).catch(function () {}); }); }, Promise.resolve());
      });
    }).catch(function () {}).then(function () { emit(); });
  }
  function buy(id) {
    if (busy || !canBuy || !config.products[id]) return Promise.resolve(false);
    busy = true; setStatus(tx("busy")); renderShop();
    return queue(function () {
      return payments.purchase({ id: id, developerPayload: "pm" }).then(function (p) {
        return grant(p).then(function () { setStatus(fmt(tx("done"), dateStr(st.until))); return true; }, function (e) {
          setStatus(e && e.code === "save" ? tx("saveFail") : tx("fail")); return false;
        });
      }, function () { setStatus(tx("fail")); return false; });
    }).then(function (r) { busy = false; renderShop(); return r; }, function () { busy = false; renderShop(); return false; });
  }

  /* ---- Вызовы хозяина ---- */
  function noteFullscreen() { st.ads++; persist(); }
  /* Показать карточку на спокойном экране (меню, результат). Возвращает true, если карточка открыта. */
  function maybeCard() {
    if (!available() || ui.ov) return false;
    if (active()) {
      if (daysLeft() <= config.remindDays && st.remindDay !== dayIdx()) { st.remindDay = dayIdx(); persist(); openCard("soon"); return true; }
      return false;
    }
    if (st.until > 0 && st.endShown !== st.until) { st.endShown = st.until; persist(); openCard("end"); return true; }
    if (config.cardEvery > 0 && Math.floor(st.ads / config.cardEvery) > Math.floor(st.cardAt / config.cardEvery)) { st.cardAt = st.ads; persist(); openCard("ad"); return true; }
    return false;
  }

  /* ---- Интерфейс ---- */
  var CSS = ".pm-corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));z-index:var(--pm-z,50);display:inline-flex;align-items:center;gap:5px;" +
    "min-height:40px;padding:0 12px;border-radius:20px;border:1.5px solid var(--pm-ink,var(--fg,#22304a));background:var(--pm-gold,#f2c14e);color:#2a2110;font:600 14px/1 var(--f-display,system-ui,sans-serif);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)}" +
    ".pm-corner[hidden]{display:none}.pm-corner.on{background:var(--pm-paper,var(--paper,#f4edd9));color:var(--pm-ink,var(--fg,#22304a))}" +
    ".pm-corner:focus-visible,.pm-btn:focus-visible,.pm-x:focus-visible{outline:3px solid var(--pm-focus,var(--focus,#1d5cc0));outline-offset:2px}" +

function newState(){
 var s={v:1,cycle:1,phase:'day',step:0,day:0,credits:100,energy:40,temp:20,stars:0,flare:0,
  res:{o2:40,water:50,food:85,parts:2,cells:0},
  mods:[{t:'hab'},{t:'store'},{t:'power'},{t:'power'},{t:'drill'}],
  crew:[],trip:null,calc:{},st:{ice:0,flareHurt:0},log:[]};
 for(var i=0;i<3;i++)s.crew.push(mkCrew(i));
 s.crew[0].task='drillO';s.crew[1].task='roverA';s.crew[2].task='rest';
 return s;
}
function mkCrew(i){return {i:i,name:NAMES[i],hp:100,task:'rest'}}
function cnt(t){return S.mods.filter(function(m){return m.t===t}).length}
function cntOk(t){return S.mods.filter(function(m){return m.t===t&&!m.dmg}).length}
function capE(){return 40*cntOk('power')}
function capR(){return 50*cnt('hab')+100*cnt('store')}
function beds(){return 3*cnt('hab')}
function useDay(){return S.mods.reduce(function(a,m){return a+T[m.t].d},0)}
function useNight(){return S.mods.reduce(function(a,m){return a+T[m.t].nt},0)}
function avgHp(){return S.crew.reduce(function(a,c){return a+c.hp},0)/Math.max(1,S.crew.length)}
function recyF(){return cntOk('recy')>0?0.5:1}
function needs(){var n=S.crew.length;return {energy:useNight()*14,water:r1(n*2.5*14*recyF()),o2:n*14,food:n*14}}
function stocks(){return {energy:Math.min(S.energy,capE()),water:S.res.water,o2:S.res.o2,food:S.res.food}}
function log(m){S.log.push(m);if(S.log.length>40)S.log.shift();toast(m)}
function save(){if(!S||(S.phase!=='day'&&S.phase!=='prep'))return;PF.put('lunabaza-save',JSON.stringify(S))}

/* ---------- Симуляция суток ---------- */
function simDay(isDay){
 var crew=S.crew,n=crew.length,res=S.res,out={lack:[],powered:true};
 if(isDay)S.energy=Math.min(capE(),S.energy+16*cntOk('power'));
 else S.energy=Math.min(S.energy,capE());
 var ops=drillOps(isDay);
 var use=(isDay?useDay():useNight())+6*ops.length;
 if(S.energy>=use)S.energy-=use;
 else{var need=use-S.energy;S.energy=0;if(res.cells>=need)res.cells-=need;else{res.cells=0;out.powered=false}}
 S.temp=out.powered?Math.min(20,S.temp+10):Math.max(-40,S.temp-8);
 var cap=capR();
 function add(k,v){res[k]=r1(Math.min(cap,Math.max(0,res[k]+v)))}
 if(out.powered){
  if(cntOk('green')>0&&res.water>=2){add('food',3);add('o2',2);add('water',-2)}
  ops.forEach(function(c){if(c.task==='drillO')add('o2',6);else add('water',3)});
 }
 var leak=S.mods.some(function(m){return m.t==='hab'&&m.dmg})?3:0;
 function eat(k,need){if(res[k]>=need){res[k]=r1(res[k]-need);return true}res[k]=0;return false}
 var okO=eat('o2',n+leak),okW=eat('water',r1(n*2.5*(out.powered?recyF():1))),okF=eat('food',n);
 if(!okO)out.lack.push('кислород');if(!okW)out.lack.push('вода');if(!okF)out.lack.push('еда');
 if(S.temp<10)out.lack.push('холод');
 var dead=[];
 crew.forEach(function(c){
  var d=0;if(!okO)d-=30;if(!okW)d-=20;if(!okF)d-=10;if(S.temp<0)d-=20;else if(S.temp<10)d-=8;
  if(d===0&&S.temp>=15)d=c.task==='rest'?10:5;
  c.hp=Math.max(0,Math.min(100,c.hp+d));
  if(c.hp<=0)dead.push(c);
 });
 dead.forEach(function(c){S.crew.splice(S.crew.indexOf(c),1);log('☠ '+cn(c)+L(' погиб(ла)',' has died'))});
 out.dead=dead.length;
 return out;
}
function drillOps(isDay){
 var k=cntOk('drill'),r=[];
 S.crew.forEach(function(c){if((c.task==='drillO'||c.task==='drillW')&&r.length<k)r.push(c)});
 return r;
}
function tryRepair(){
 var m=S.mods.filter(function(x){return x.dmg})[0];
 if(!m)return false;
 if(S.res.parts<1||S.energy<5)return false;
 S.res.parts--;S.energy-=5;m.dmg=false;log('🔧 '+TN(m.t)+L(' отремонтирован',' repaired'));return true;
}
function eventRoll(isDay){
 if(S.cycle===1)return null;
 var k=S.cycle,m=S.cycle===12?2:1;
 var r=Math.random();
 var pm=(0.03+0.005*k)*m,pb=0.03*m,pf=(k>=2?0.02:0)*m;
 if(r<pm)return 'meteor';
 if(r<pm+pb)return 'break';
 if(r<pm+pb+pf)return 'flare';
 return null;
}

/* Прогон N суток с остановкой на событиях */
function runDays(n,isDay,delay,done){
 var left=n;
 (function next(){
  if(left<=0){done();return}
  left--;S.day++;
  var o=simDay(isDay);
  refresh();
  if(S.crew.length<2){gameOver();return}
  var ev=eventRoll(isDay);
  var cont=function(){(function w(){if(PF.paused())setTimeout(w,200);else setTimeout(next,delay)})()};
  var after=function(){if(ev)showEvent(ev,isDay,cont);else cont()};
  var w=warnNeed(o);
  if(w)alertShortage(w,after);else after();
 })();
}

function doStep(){
 if(busy||S.phase!=='day')return;
 busy=true;lockUI(true);S.warned={};
 /* старт задач */
 var roverBusy=!!S.trip;
 S.crew.forEach(function(c){
  if(c.task==='repair'){tryRepair();c.task='rest'}
  else if(c.task==='roverA'||c.task==='roverB'){
   var cr=CRATER[c.task];
   if(S.trip&&S.trip.who===c.i){}
   else if(S.trip||S.step+cr.steps>7){c.task='rest';toast(L('Ровер сейчас не может выехать','The rover can\'t head out right now'))}
   else{
    var e=cr.km*0.1;
    if(S.energy>=e+12){S.energy-=e;S.trip={who:c.i,key:c.task,left:cr.steps}}
    else{c.task='rest';toast(L('Мало энергии для рейса','Not enough energy for the trip'))}
   }
  }
 });
 runDays(2,true,260,function(){
  if(S.trip){S.trip.left--;if(S.trip.left<=0){var cr=CRATER[S.trip.key];var add=Math.min(cr.ice,capR()-S.res.water);if(add<0)add=0;S.res.water=r1(S.res.water+add);S.st.ice+=cr.ice;
   var who=S.crew.filter(function(c){return c.i===S.trip.who})[0];S.trip=null;log(L('🚙 Ровер привёз лёд: +'+RU(add)+' л воды','🚙 The rover returned with ice: +'+RU(add)+' L of water'));if(art.crater_ice)toast('',EVI('crater_ice')+L('Лёд из кратера: +'+RU(add)+' л','Crater ice: +'+RU(add)+' L'))}}
  S.step++;
  busy=false;
  if(S.step>=7){S.phase='prep';save();refresh();nightPrep()}
  else{save();lockUI(false);refresh()}
 });
}
function lockUI(b){['bMod','bShop','bCalc','bGo'].forEach(function(i){$(i).disabled=b});document.querySelectorAll('select').forEach(function(s){s.disabled=b})}

 var nd=needs(),st=stocks(),rows='';
 [['energy',L('⚡ Энергия','⚡ Energy'),L('кВт·ч','kWh')],['water',L('💧 Вода','💧 Water'),L('л','L')],['o2',L('🫁 Кислород','🫁 Oxygen'),L('кг','kg')],['food',L('🍲 Еда','🍲 Food'),L('пайков','rations')]].forEach(function(r){

  [{t:L('📐 Расчёт','📐 Calculate'),f:function(){closeModal();calcModal(true)}},{t:L('📦 Закупки','📦 Supplies'),f:function(){closeModal();shopModal(nightPrep)}},{t:L('🏗 Модули','🏗 Modules'),f:function(){closeModal();modsModal(nightPrep)}},{t:L('🌙 Начать ночь','🌙 Start the night'),c:'go',f:function(){closeModal();confirmNight()}}]);
}
function nightLacks(){
 var nd=needs(),st=stocks(),ops=drillOps(false).length,out=[];
 if(st.energy+S.res.cells<nd.energy+ops*84)out.push(L('энергии на '+RU(nd.energy+ops*84-st.energy-S.res.cells)+' кВт·ч','energy: '+RU(nd.energy+ops*84-st.energy-S.res.cells)+' kWh'));
 if(st.water<nd.water)out.push(L('воды на '+RU(nd.water-st.water)+' л','water: '+RU(nd.water-st.water)+' L'));
 if(st.o2+ops*84<nd.o2)out.push(L('кислорода на '+RU(nd.o2-st.o2-ops*84)+' кг','oxygen: '+RU(nd.o2-st.o2-ops*84)+' kg'));
 if(st.food<nd.food)out.push(L('еды на '+RU(nd.food-st.food)+' пайков','food: '+RU(nd.food-st.food)+' rations'));

function dawn(){

 if(!survived){gameOver();return}
 var g=GOALS[S.cycle-1],ok=g.chk();
 if(ok)S.credits+=g.b;

 else ph.innerHTML=L('☀ День +120°<small>сутки ','☀ Day +120 °C<small>day ')+S.step*2+'/14 · '+L('шаг ','step ')+(S.step+1)+'/7</small>';
 var pr=isN?S.day/14:(S.phase==='prep'?1:S.step/7);
 $('bar').className=isN?'n':'';$('bar').firstChild.style.width=(pr*100)+'%';
 var nd=needs(),st=stocks(),R=S.res;
 function chip(ic,v,sub,low,pct){return '<div class="chip'+(low?' low':'')+'">'+IC(ic)+' <b>'+v+'</b><em>'+sub+'</em>'+(pct!=null?'<i style="width:'+Math.min(100,pct*100)+'%"></i>':'')+'</div>'}
 $('chips').innerHTML=
  chip('⚡',RU(S.energy),L('из ','of ')+capE()+L(' кВт·ч',' kWh'),S.energy<useNight()*3,capE()?S.energy/capE():0)+
  chip('🫁',RU(R.o2),L('кг · ','kg · ')+S.crew.length+L('/сут','/day'),R.o2<S.crew.length*3,R.o2/capR())+
  chip('💧',RU(R.water),L('л · ','L · ')+RU(S.crew.length*2.5*recyF())+L('/сут','/day'),R.water<S.crew.length*8,R.water/capR())+
  chip('🍲',RU(R.food),L('пайков · ','rations · ')+S.crew.length+L('/сут','/day'),R.food<S.crew.length*3,R.food/capR())+
  chip('🔧',R.parts,L('запчастей · ячейки ','spares · cells ')+R.cells,R.parts<1)+
  chip('🌡',Math.round(S.temp)+'°',L('в базе','in the base'),S.temp<10);
 renderCrew();
 $('bCalc').classList.toggle('pulse',(S.step>=3||S.phase==='prep')&&S.phase!=='night'&&!(S.calc.energy&&S.calc.water&&S.calc.o2&&S.calc.food));
 $('bGo').textContent=S.phase==='night'?'🌙 …':L('Дальше ▶','Next ▶');
}
function renderCrew(){
 var box=$('crew'),isN=S.phase==='night';
 if(box.dataset.sig===sig()){ // обновить только полоски здоровья
  S.crew.forEach(function(c,i){var e=box.children[i];if(e){e.querySelector('.hp i').style.width=c.hp+'%';e.querySelector('.hp').nextSibling&&0}});
  return;
 }
 box.dataset.sig=sig();box.innerHTML='';
 S.crew.forEach(function(c){
  var d=document.createElement('div');d.className='card';
  var a=art['astro_'+(c.i%4)];
  d.innerHTML='<div class="av" style="--c:'+COLS[c.i]+'">'+(a?'':'🧑‍🚀')+'</div><div class="nm"><b>'+cn(c)+'</b><div class="hp"><i style="width:'+c.hp+'%"></i></div></div>';
  if(a)d.firstChild.appendChild(a.cloneNode());
  var sel=document.createElement('select');
  Object.keys(TASKS).forEach(function(k){
   if(isN&&(k==='roverA'||k==='roverB'))return;
   var o=document.createElement('option');o.value=k;o.textContent=tk(k)+(CRATER[k]?' '+CRATER[k].km+L(' км',' km'):'');if(c.task===k)o.selected=true;sel.appendChild(o);
  });
  sel.disabled=busy;
  sel.onchange=function(){c.task=sel.value;save();if((c.task==='drillO'||c.task==='drillW')&&cntOk('drill')<1)toast(L('Для бура нужна рабочая буровая. Построй её в «Модулях» (70 ₵).','Drilling needs a working Drilling Rig. Build one in Modules (70 ₵).'));else if(c.task==='repair'&&!S.mods.some(function(m){return m.dmg}))toast(L('Пока ничего не сломано — ремонт не понадобится.','Nothing is broken right now, so no repair is needed.'))};
  d.appendChild(sel);box.appendChild(d);
 });
}
function sig(){return S.crew.map(function(c){return c.i+c.task}).join('|')+S.phase+busy+LANG}

/* ---------- Сцена ---------- */
var cv=$('cv'),cx=cv.getContext('2d'),STARS=[];
for(var si=0;si<70;si++)STARS.push([Math.random()*375,Math.random()*135,Math.random()*1.4+.3,Math.random()*6]);
var SLOT=[];for(var sj=0;sj<12;sj++)SLOT.push(sj<6?[10+sj*60,106]:[40+(sj-6)*60,140]);
function drawScene(t){
 cx.setTransform(2,0,0,2,0,0);
 var W=375,H=200,night=S&&(S.phase==='night'||S.phase==='prep');
 if(art.bg_moon){cx.drawImage(art.bg_moon,0,0,W,H)}
 else{
  var g=cx.createLinearGradient(0,0,0,150);g.addColorStop(0,'#03050d');g.addColorStop(1,night?'#0b1230':'#14264f');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  STARS.forEach(function(s){cx.globalAlpha=.5+.5*Math.sin(t/700+s[3]);cx.fillStyle='#fff';cx.fillRect(s[0],s[1],s[2],s[2])});cx.globalAlpha=1;
  if(art.earth)cx.drawImage(art.earth,30,18,50,50);
  else{var e=cx.createRadialGradient(52,38,3,58,44,26);e.addColorStop(0,'#8fd0ff');e.addColorStop(.6,'#2a74d0');e.addColorStop(1,'#0b2a66');cx.fillStyle=e;cx.beginPath();cx.arc(58,44,24,0,7);cx.fill();
   cx.fillStyle='#4cc26a';cx.beginPath();cx.ellipse(52,40,9,6,.5,0,7);cx.ellipse(66,52,6,8,0,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();cx.ellipse(60,34,10,3,-.3,0,7);cx.fill()}
  if(!night){var sg=cx.createRadialGradient(325,34,2,325,34,40);sg.addColorStop(0,'#fff6c0');sg.addColorStop(.3,'rgba(255,214,102,.6)');sg.addColorStop(1,'rgba(255,214,102,0)');cx.fillStyle=sg;cx.fillRect(280,0,95,80)}
  var gr=cx.createLinearGradient(0,105,0,H);gr.addColorStop(0,night?'#4a4d58':'#9a9ca6');gr.addColorStop(1,night?'#2a2c35':'#60636d');
  cx.fillStyle=gr;cx.beginPath();cx.moveTo(0,112);cx.quadraticCurveTo(190,98,375,112);cx.lineTo(375,H);cx.lineTo(0,H);cx.fill();
  cx.fillStyle='rgba(0,0,0,.18)';[[40,178,22,6],[300,184,28,7],[200,190,16,4],[120,172,10,3]].forEach(function(c){cx.beginPath();cx.ellipse(c[0],c[1],c[2],c[3],0,0,7);cx.fill()});
 }
 if(!S){return}
 S.mods.forEach(function(m,i){drawMod(m,SLOT[i]||SLOT[11],night,t,i)});
 /* ровер и люди */
 var ry=170;
 if(S.trip){cx.fillStyle='#ffd166';cx.font='11px sans-serif';cx.fillText(L('🚙 ровер в рейсе…','🚙 rover on a trip…'),270,ry)}
 else if(art.rover)cx.drawImage(art.rover,298,ry-26,40,30);
 else{cx.fillStyle='#d8dbe2';cx.fillRect(300,ry-8,34,10);cx.fillStyle='#4aa8ff';cx.fillRect(316,ry-14,14,7);cx.fillStyle='#222';cx.beginPath();cx.arc(306,ry+3,4,0,7);cx.arc(328,ry+3,4,0,7);cx.fill()}
 S.crew.forEach(function(c,i){
  var x=24+i*30+(night?0:Math.sin(t/500+i)*6),y=176+Math.abs(Math.sin(t/300+i))*(night?0:2);
  var ai=art['astro_'+(c.i%4)];if(ai){cx.drawImage(ai,x-4,y-26,20,27);return}
  cx.fillStyle=COLS[c.i];cx.fillRect(x,y-12,8,12);cx.fillStyle='#f4f6fb';cx.beginPath();cx.arc(x+4,y-15,5,0,7);cx.fill();cx.fillStyle='#223';cx.beginPath();cx.arc(x+5,y-15,3,0,7);cx.fill();
 });
 if(night){cx.fillStyle='rgba(2,4,20,.28)';cx.fillRect(0,0,W,H)}
 if(S.flare){cx.fillStyle='rgba(255,140,40,'+(.15+.1*Math.sin(t/120))+')';cx.fillRect(0,0,W,H)}
 if(S.temp<5){cx.fillStyle='rgba(120,190,255,'+Math.min(.35,(5-S.temp)/120)+')';cx.fillRect(0,0,W,H)}
}
function drawMod(m,p,night,t,i){
 var x=p[0],y=p[1],w=48,h=30,d=T[m.t],img=art['mod_'+m.t];
 if(img){cx.drawImage(img,x,y-18,w+6,h+18)}
 else{
  cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(x+w/2,y+h+2,w/2,4,0,0,7);cx.fill();
  if(m.t==='power'){
   cx.fillStyle='#555';cx.fillRect(x+22,y+10,4,20);cx.fillStyle=d.col;cx.save();cx.translate(x+24,y+8);cx.rotate(-.35);cx.fillRect(-22,-10,44,14);cx.strokeStyle='#9bd0ff';cx.lineWidth=.7;for(var k=-14;k<=14;k+=7){cx.beginPath();cx.moveTo(k,-10);cx.lineTo(k,4);cx.stroke()}cx.restore();
   cx.fillStyle='#e8e8ee';cx.fillRect(x+34,y+20,10,10);
  }else if(m.t==='drill'){
   cx.fillStyle=d.col;cx.fillRect(x+4,y+14,30,16);cx.fillStyle='#444';cx.fillRect(x+36,y-10+Math.sin(t/200)*2*(opsActive()?1:0),4,36);cx.fillRect(x+30,y-12,16,4);
  }else{
   cx.fillStyle=d.col;cx.strokeStyle='#2b3350';cx.lineWidth=1;
   if(m.t==='hab'||m.t==='green'){cx.beginPath();cx.moveTo(x,y+h);cx.lineTo(x,y+12);cx.quadraticCurveTo(x+w/2,y-14,x+w,y+12);cx.lineTo(x+w,y+h);cx.closePath();cx.fill();cx.stroke()}
   else{cx.fillRect(x,y+6,w,h-6);cx.strokeRect(x,y+6,w,h-6)}
   cx.fillStyle=night?'#ffd36b':'#7fb7ff';if(night){cx.shadowColor='#ffb14a';cx.shadowBlur=8}
   cx.fillRect(x+8,y+16,9,8);cx.fillRect(x+w-17,y+16,9,8);cx.shadowBlur=0;
  }
 }
 cx.font='11px sans-serif';cx.fillStyle='#fff';cx.fillText(d.ic,x+w/2-6,y+h+12);
 if(m.dmg){cx.strokeStyle='#ff4d4d';cx.lineWidth=2;cx.strokeRect(x-2,y-2,w+4,h+4);cx.fillStyle='rgba(120,120,120,.6)';for(var q=0;q<3;q++){cx.beginPath();cx.arc(x+w/2+Math.sin(t/300+q)*4,y-6-q*7-(t/60)%6,3+q,0,7);cx.fill()}}
}
function opsActive(){return S&&S.crew.some(function(c){return c.task==='drillO'||c.task==='drillW'})}
function loop(t){if(!document.hidden)drawScene(t);requestAnimationFrame(loop)}

 modal(L('Цель — 12 ночей','Goal — 12 nights'),L('<p>Ты командуешь базой «Селена». <b>Первая ночь</b> уже через 14 суток. Назначь экипаж: бур даёт кислород, ровер возит лёд (воду), а в «Модулях» построй всё, что нужно для выживания. Не забудь про <b>📐 Расчёт</b>!</p>','<p>You command base “Selena”. The <b>first night</b> is only 14 days away. Assign the crew: the drill makes oxygen, the rover hauls ice (water), and in “Modules” build everything you need to survive. Do not forget <b>📐 Calculate</b>!</p>'),[{t:L('Поехали','Let’s go'),c:'go',f:function(){closeModal()}}]);

 document.documentElement.lang=LANG;document.title=L('Лунная база','Moon Base');
 $('mTitle').textContent=L('Лунная база','Moon Base');
 $('mDesc').textContent=L('14 суток дня, 14 суток ночи, −170°. Посчитай запасы — или база замёрзнет.','14 days of daylight, 14 days of night, −170°. Calculate your supplies, or the base will freeze.');
 $('mNew').textContent=L('Новая игра','New game');$('mCont').textContent=L('Продолжить','Continue');$('mHow').textContent=L('Как играть','How to play');
 $('bMod').textContent=L('🏗 Модули','🏗 Modules');$('bShop').textContent=L('📦 Закупки','📦 Supplies');$('bCalc').textContent=L('📐 Расчёт','📐 Calculate');

 else{var pl=String(PF.hasSdk()?PF.lang():(navigator.language||'ru')).toLowerCase().slice(0,2);LANG=['ru','be','kk','uk','uz'].indexOf(pl)>=0?'ru':'en'}
