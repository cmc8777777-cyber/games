<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>Планетарий</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{--bg:#0b1034;--bg2:#1a2160;--card:#1f2a6e;--card2:#2a378c;--ink:#fff;--muted:#a9b4ff;--gold:#ffd23f;--orange:#ff7a45;--cyan:#5ee0ff;--good:#5ce08a;--bad:#ff6b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050820;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.scroll{overflow-y:auto;flex:1;padding:12px 14px 20px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{background:linear-gradient(#ffdc5c,#ffb21f);color:#4a2a00;font-weight:800;border-radius:16px;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 #b97500}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b97500}
.btn.alt{background:linear-gradient(#5b6bff,#3a47d6);color:#fff;box-shadow:0 4px 0 #222c93}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4}
h1,h2{margin:0}
/* заставка */
#scrTitle{align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
#scrTitle .logo{font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #b97500,0 0 30px rgba(255,210,63,.5);letter-spacing:1px}
#scrTitle .sub{color:var(--muted);margin-bottom:10px}
#scrTitle .planet{font-size:92px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
#scrTitle .btn{width:240px}
/* карта уровней */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:50px}
.top h2{flex:1;font-size:18px}
.ib{background:rgba(255,255,255,.14);border-radius:12px;min-width:40px;height:40px;font-size:18px;padding:0 10px}
.world{background:var(--card);border-radius:18px;padding:12px;margin-bottom:12px}
.world h3{margin:0 0 2px;font-size:17px}
.world p{margin:0 0 10px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:14px;background:var(--card2);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv small{font-size:11px;color:var(--gold);letter-spacing:-1px;min-height:13px}
.lv.boss{background:linear-gradient(#ff8a5c,#e0452c)}
.lv.lock{opacity:.35}
.lv.next{outline:3px solid var(--gold)}
.world.soon{opacity:.5}
/* игра */
#gTop{display:flex;align-items:center;gap:8px;padding:8px 10px}
#gTitle{flex:1;font-weight:800;font-size:15px}
#bubble{display:flex;gap:8px;align-items:center;margin:0 10px;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 10px;min-height:76px}
#bubble .av{font-size:34px;line-height:1;width:64px;text-align:center}#bubble .av img{width:64px;height:72px;object-fit:contain;display:block}.pane .hero{height:110px;margin:-4px auto 0;display:block}#scrTitle.cov{background-size:cover;background-position:center;justify-content:flex-start;gap:10px;padding-top:34px}#scrTitle.cov .planet{display:none}#scrTitle.cov .sub{margin-bottom:auto;text-shadow:0 2px 6px #000}#scrTitle.cov .btn.ghost{background:rgba(10,14,60,.7)}
#bubble .tx{flex:1;font-size:15px;line-height:1.25}
#bubble .tx b{color:var(--gold)}
#stage{position:relative;flex:1;min-height:0;margin:4px 0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ctl{padding:6px 10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;justify-content:center;align-items:center}
.row .btn{padding:10px 12px;font-size:15px}
.sm{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 11px;font-weight:700;font-size:14px}
#hintBtn.on{background:var(--gold);color:#4a2a00}
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ccard{background:var(--card);border-radius:16px;padding:8px;width:156px;text-align:center}
.ccard .cn{font-weight:800;font-size:14px}
.ccard .dg{font-size:28px;font-weight:900;color:var(--gold)}
.ccard svg{width:70px;height:70px}
.ccard .cr{display:flex;gap:6px;justify-content:center;margin-top:4px}
.ccard .cr button{background:rgba(255,255,255,.18);border-radius:10px;width:44px;height:36px;font-size:20px;font-weight:900}
.ccard .dy{margin-top:5px;background:rgba(255,255,255,.1);border-radius:10px;font-size:12px;padding:5px 8px;width:100%}
.ccard.ok{outline:3px solid var(--good)}.ccard.no{outline:3px solid var(--bad)}
/* результат */
.modal{background:rgba(5,8,32,.86);align-items:center;justify-content:center;padding:18px;z-index:5}
.pane{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:380px;text-align:center}
.stars{font-size:46px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.6)}
.stars i{opacity:.25;font-style:normal}
.pane .fact{background:rgba(255,255,255,.1);border-radius:14px;padding:10px;margin:12px 0;font-size:14px;text-align:left}
.pane .fact b{color:var(--cyan)}
/* викторина */
#scrQuiz .qq{font-size:20px;font-weight:800;margin:10px 4px 16px;line-height:1.25}
.opt{display:block;width:100%;background:var(--card2);border-radius:16px;padding:14px;margin-bottom:10px;font-size:16px;font-weight:700;text-align:left}
.opt.ok{background:#1f9d57}.opt.no{background:#b3304f}
#qExp{margin:6px 4px;color:var(--muted);font-size:14px;min-height:40px}
/* журнал */
.fc{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.fc b{color:var(--cyan);display:block;margin-bottom:2px}
.fc.lock{opacity:.4}
.pm-hide .pm-corner{display:none!important}
#toast{position:absolute;left:14px;right:14px;bottom:24px;z-index:9;background:#ffd23f;color:#4a2a00;font-weight:800;border-radius:14px;padding:12px 14px;text-align:center;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#toast[hidden]{display:none}
@supports(padding:max(0px)){.top,#gTop{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}#ctl{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}#scrTitle{padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}.scroll{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}}
#pks .opt{padding:10px 12px;font-size:14px;margin-bottom:6px}
.world .lh{color:var(--gold);font-weight:700}
.world.wlock{opacity:.85}
.pm-on .top{padding-right:128px}
.pm-corner{--pm-paper:#1f2a6e;--pm-ink:#fff;--paper:#1f2a6e;--fg:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:88vw;background:#101a3a;color:#fff;border:1px solid #6fd3ff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}#toast.on{opacity:1}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1034"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"></head><body><div id="toast"></div>
<div id="app">
 <div id="toast" hidden></div>
 <div class="screen" id="scrTitle">
  <div class="planet">🌍</div>
  <div class="logo" data-t="logo">ПЛАНЕТАРИЙ</div>
  <div class="sub" data-t="title.sub">Крути Землю — разгадывай космос</div>
  <button class="btn" id="bPlay" data-t="title.play">Играть</button>
  <button class="btn alt" id="bRepeat" data-t="title.repeat">Повторение</button>

  <button class="btn ghost" id="bReset" data-t="title.reset" style="font-size:13px;padding:8px 14px;width:auto">Сбросить прогресс</button>

 <div class="screen" id="scrMap" hidden>
  <div class="top"><button class="ib" data-go="title">←</button><h2 data-t="map.title">Миры</h2><span id="mapStars" style="color:var(--gold);font-weight:800"></span></div>
  <div class="scroll" id="worlds"></div>
 </div>

 <div class="screen" id="scrGame" hidden>
  <div id="gTop"><button class="ib" id="gBack">←</button><div id="gTitle"></div><button class="ib" id="gHint">💡 <span id="hn">3</span></button></div>
  <div id="bubble"><div class="av" id="av">🧑‍🚀</div><div class="tx" id="msg"></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="ctl"></div>
 </div>

 <div class="screen" id="scrQuiz" hidden>
  <div class="top"><button class="ib" id="qBack">←</button><h2 id="qTitle" data-t="quiz.title">Викторина</h2><span id="qProg" style="color:var(--gold);font-weight:800"></span></div>
  <div class="scroll"><div class="qq" id="qq"></div><div id="qo"></div><div id="qExp"></div><button class="btn" id="qNext" hidden style="width:100%" data-t="res.next">Дальше</button></div>
 </div>

 <div class="screen" id="scrJournal" hidden>
  <div class="top"><button class="ib" data-go="title">←</button><h2 data-t="journal.title">Журнал наблюдений</h2><span id="jCnt" style="color:var(--gold);font-weight:800"></span></div>
  <div class="scroll" id="jList"></div>
 </div>

 <div class="screen modal" id="scrRes" hidden>
  <div class="pane">
   <div id="rHero"></div><h2 id="rTitle"></h2>
   <div class="stars" id="rStars"></div>
   <div class="fact" id="rFact"></div>
   <div class="row"><button class="btn ghost" id="rAgain" data-t="res.again">Ещё раз</button><button class="btn" id="rNext" data-t="res.next">Дальше</button></div>
   <div class="row" style="margin-top:8px"><button class="btn ghost" id="rMap" style="font-size:14px" data-t="res.map">К уровням</button></div>
  </div>
 </div>
</div>

<script>window.I18N_EN={"logo": "PLANETARIUM", "title.sub": "Spin Earth — explore space", "title.play": "Play", "title.repeat": "Practice", "title.journal": "Observation Journal", "title.reset": "Reset Progress", "title.reset_ask": "Erase progress? Tap again", "title.reset_done": "Progress erased", "map.title": "Worlds", "map.world": "World {n}. {name}", "map.soon": "{sub} — coming soon", "quiz.title": "Quiz", "quiz.boss": "Boss {n}", "quiz.right": "Correct!", "quiz.wrong": "Not quite.", "journal.title": "Observation Journal", "journal.obs": "Observation {n}", "journal.locked": "Unlocks after you finish the level.", "game.title": "Level {n} · {w}", "game.w1": "Day and Night", "game.w2": "Time Zones", "ctl.rew": "🎬 Watch an ad for the answer", "ctl.m1h": "⟲ −1 hr", "ctl.m15": "−15 min", "ctl.p15": "+15 min", "ctl.p1h": "+1 hr ⟳", "ctl.ok": "Done ✓", "day.m1": "yesterday", "day.0": "today", "day.1": "tomorrow", "day.label": "day: {d}", "rew.spin": "🎬 Comet spun Earth for you. Tap \"Done\".", "rew.clock": "🎬 Comet showed the answer. Tap \"Done\".", "hint.ring": "💡 The golden ring on Earth shows where the city should be.", "hint.clock2": "💡 You can now see the time in the right cities on Earth. Set the clocks to match.", "hint.auto.spin": "💡 Comet spun Earth for you. Tap \"Done\".", "hint.auto.clock": "💡 Comet gave you a hint. Tap \"Done\".", "err.spin": "🐱 Not quite. In {city}, it's <b>{now}<\/b>, but it should be <b>{need}<\/b>. Keep spinning!", "err.between": "between {a} and {b}", "err.clock": "🐱 Something's not right. Look at Earth: farther east means a later time. Move east, add an hour.", "res.great": "Great job!", "res.boss_win": "Boss defeated! {n} out of 5", "res.boss_lose": "Correct answers: {n} out of 5. You need 4", "res.lose_text": "That's okay! Play the levels again and try once more. You'll get new questions each time.", "res.journal": "📖 Observation Journal:", "res.next": "Next", "res.next_repeat": "Next (Practice)", "res.again": "Try Again", "res.map": "Levels", "scene.rot": "rotation", "scene.day": "☀ day", "city.msk": "Moscow", "city.lon": "London", "city.ber": "Berlin", "city.cai": "Cairo", "city.ekb": "Yekaterinburg", "city.omsk": "Omsk", "city.vl": "Vladivostok", "city.tok": "Tokyo", "city.ny": "New York", "city.la": "L.A.", "world.1.name": "Day and Night", "world.1.sub": "Day, night, and Earth's rotation", "world.2.name": "Time Zones", "world.2.sub": "Time zones and trains", "world.3.name": "Seasons", "world.3.sub": "Earth's orbit and tilt", "world.4.name": "Polar Day", "world.4.sub": "Latitude and daylight hours", "world.5.name": "Moon", "world.5.sub": "Moon phases and eclipses", "world.6.name": "Planets", "world.6.sub": "The Solar System and planet years", "world.7.name": "Starry Sky", "world.7.sub": "Constellations and the North Star", "lv.1.txt": "Hi! I'm Mira, and this is my cat, Comet. Spin Earth with your finger until <b>it's noon in Moscow<\/b> — when the Sun is directly above the city.", "lv.1.fact": "Earth spins on its axis. That's why day turns into night.", "lv.1.h1": "Noon is when a city faces the Sun. Spin Earth until Moscow is on the right.", "lv.2.txt": "Now <b>it's midnight in Moscow<\/b>. Where is the Sun?", "lv.2.fact": "Night happens on the side of Earth facing away from the Sun. When it's midnight here, it's noon on the other side.", "lv.2.h1": "At midnight, Moscow is on the darkest side, on the left.", "lv.3.txt": "<b>It's sunrise in Moscow<\/b> (6:00). Earth spins counterclockwise. Which way should Moscow move?", "lv.3.fact": "Earth spins from west to east. That's why the Sun rises in the east.", "lv.3.h1": "At sunrise, a city moves out of the dark and into the light. Moscow should be at the bottom, where day meets night.", "lv.4.txt": "<b>It's sunset in Moscow<\/b> (18:00).", "lv.4.fact": "Sunset happens when a city moves into Earth's shadow as Earth spins. The Sun seems to go down.", "lv.4.h1": "At sunset, Moscow is at the top, where day meets night.", "lv.5.txt": "<b>It's daytime in Tokyo, but nighttime in London.<\/b> Yes, that can happen!", "lv.5.fact": "When it's daytime on one side of Earth, it's nighttime on the other. That's why people in different countries have different times.", "lv.5.h1": "Tokyo and London are far apart, almost on opposite sides of Earth.", "lv.6.txt": "<b>It's noon in New York.<\/b> Look at the time in London!", "lv.6.fact": "The farther east a city is, the later its time. The Sun appears to move from east to west.", "lv.6.h1": "New York should be on the right, facing the Sun. London is farther east, so it's already evening there.", "lv.7.txt": "<b>It's noon in London.<\/b> Look at Moscow: it's already past 13:00 there!", "lv.7.fact": "Every 15° of longitude makes about one hour of difference in solar time. Moscow is 37.6° east of London. That's about 2.5 hours.", "lv.7.h1": "London should be on the right, facing the Sun.", "lv.8.txt": "<b>It's midnight in London.<\/b> London is on the prime (Greenwich) meridian.", "lv.8.fact": "The prime (Greenwich) meridian passes through Greenwich, an area of London. We use it to measure longitude and count time zones.", "lv.8.h1": "London should be on the darkest side, on the left.", "lv.9.txt": "<b>It's sunset in Moscow and morning in Los Angeles.<\/b> Set Moscow to sunset and look at Los Angeles.", "lv.9.fact": "Earth makes one full turn in 24 hours: 360° ÷ 24 = 15° per hour.", "lv.9.h1": "Moscow should be at the top, where day meets night.", "lv.10.txt": "<b>Boss quiz!<\/b> Five questions about day and night. Get at least 4 right.", "lv.10.fact": "You know how day and night work: Earth spins, and the Sun lights up one side.", "lv.11.txt": "It's <b>12:00<\/b> in Moscow. Set the clock in <b>London<\/b>.", "lv.11.fact": "Time zones help large areas use the same time.", "lv.11.h1": "London is 3 hours behind Moscow. Look at Earth to see which city is closer to the Sun.", "lv.12.txt": "It's <b>12:00<\/b> in Moscow. What time is it in <b>Vladivostok<\/b>?", "lv.12.fact": "Vladivostok is 7 hours ahead of Moscow. It's already evening there.", "lv.12.h1": "Vladivostok is farther east, so its time is later.", "lv.13.txt": "It's <b>12:00<\/b> in Moscow. What time is it in <b>New York<\/b>?", "lv.13.fact": "Earth has 24 main time zones. Each zone is 15° wide.", "lv.13.h1": "New York is 8 hours behind Moscow.", "lv.14.txt": "It's <b>12:00<\/b> in Moscow. What time is it in <b>Yekaterinburg<\/b>?", "lv.14.fact": "Russia has 11 time zones, more than any other country.", "lv.14.h1": "Yekaterinburg is 2 hours ahead of Moscow.", "lv.15.txt": "It's <b>8:00<\/b> in London. Set the clocks in <b>Berlin<\/b> and <b>Cairo<\/b>.", "lv.15.fact": "Greenwich in London is the starting point for time zones. Berlin is 1 hour ahead, and Cairo is 2 hours ahead.", "lv.15.h1": "Berlin is one time zone east of London. Cairo is two.", "lv.16.txt": "A train leaves Moscow at <b>10:00<\/b> and crosses <b>3 time zones east<\/b> to Omsk. What time is it in Omsk?", "lv.16.fact": "When you travel east, clocks move forward. Each time zone adds one hour.", "lv.16.h1": "Each time zone east adds one hour. Three zones add three hours.", "lv.17.txt": "A train leaves Moscow at <b>15:00<\/b> Moscow time. What time is it in <b>Vladivostok<\/b> at that moment?", "lv.17.fact": "The Trans-Siberian Railway crosses 7 time zones. The trip from Moscow to Vladivostok takes 7 days.", "lv.17.h1": "Vladivostok is 7 hours ahead of Moscow.", "lv.18.txt": "It's <b>8:00<\/b> in Tokyo. Set the clock in <b>Los Angeles<\/b>. Don't forget the day!", "lv.18.fact": "The International Date Line is between Tokyo and Los Angeles. Los Angeles is 17 hours behind Tokyo, so it's still yesterday there.", "lv.18.h1": "Tokyo is 17 hours ahead of L.A. Subtract 17 hours. You'll go back past midnight.", "lv.19.txt": "Spin Earth until <b>it's 9:00 in Moscow<\/b> by the clock (time zone time).", "lv.19.fact": "Moscow uses UTC+3. That's 3 hours ahead of Greenwich.", "lv.19.h1": "It's morning in Moscow. The city is still near the dark side, close to sunrise, at the bottom.", "lv.20.txt": "<b>Boss quiz!<\/b> Day, night, and time zones. Get at least 4 right.", "lv.20.fact": "Now you can find the time in different cities and understand how time zones work.", "q.1.q": "Why do we have day and night on Earth?", "q.1.a0": "Earth spins on its axis", "q.1.a1": "The Sun circles Earth", "q.1.a2": "The Moon blocks the Sun", "q.1.e": "Earth spins on its axis, so the Sun lights up different sides of Earth.", "q.2.q": "How long does Earth take to spin once?", "q.2.a0": "12 hours", "q.2.a1": "24 hours", "q.2.a2": "365 days", "q.2.e": "One full spin takes one day, or 24 hours.", "q.3.q": "Which way does Earth spin?", "q.3.a0": "East to west", "q.3.a1": "North to south", "q.3.a2": "West to east", "q.3.e": "Earth spins from west to east. That's why the Sun rises in the east.", "q.4.q": "How many degrees does Earth turn in 1 hour?", "q.4.a0": "15°", "q.4.a1": "24°", "q.4.a2": "60°", "q.4.e": "360° ÷ 24 hours = 15° per hour.", "q.5.q": "If it's noon in Moscow, on the opposite side of Earth it's…", "q.5.a0": "Noon too", "q.5.a1": "Midnight", "q.5.a2": "Sunrise", "q.5.e": "The opposite side faces away from the Sun, so it's nighttime there.", "q.6.q": "Where does the Sun rise first?", "q.6.a0": "Moscow", "q.6.a1": "Vladivostok", "q.6.a2": "London", "q.6.e": "Earth spins east. Vladivostok is farther east, so it sees the sunrise first.", "q.7.q": "What line do we use to measure longitude?", "q.7.a0": "Equator", "q.7.a1": "Tropic", "q.7.a2": "Prime (Greenwich) meridian", "q.7.e": "The prime (Greenwich) meridian passes through Greenwich, an area of London.", "q.8.q": "How many main time zones are there on Earth?", "q.8.a0": "12", "q.8.a1": "24", "q.8.a2": "60", "q.8.e": "360° ÷ 15° = 24 time zones.", "q.9.q": "How wide is one time zone in longitude?", "q.9.a0": "15°", "q.9.a1": "10°", "q.9.a2": "30°", "q.9.e": "One time zone equals one hour of Earth's rotation, or 15°.", "q.10.q": "It's 12:00 in Moscow. What time is it in London?", "q.10.a0": "15:00", "q.10.a1": "12:00", "q.10.a2": "9:00", "q.10.e": "London is 3 hours behind Moscow.", "q.11.q": "You're traveling east by train. What happens to your clock?", "q.11.a0": "Move it forward", "q.11.a1": "Move it back", "q.11.a2": "Nothing", "q.11.e": "Time is later to the east. Cross one time zone and add one hour.", "q.12.q": "How many time zones does Russia have?", "q.12.a0": "3", "q.12.a1": "11", "q.12.a2": "24", "q.12.e": "Russia has 11 time zones, from Kaliningrad to Kamchatka.", "lv.locked": "🔒 Unlocks after level {n}", "map.lockworld": "🔒 Opens after you beat the boss of world {n}", "date.fmt": "{m} {d}", "u.d": "d", "u.mo": "mo", "u.y": "yr", "u.h": "h", "season.0": "winter", "season.1": "spring", "season.2": "summer", "season.3": "fall", "ro.north": "North: {s}", "ro.south": "South: {s}", "dir.n": "N", "dir.s": "S", "ro.sunlat": "Sun overhead: {v}", "ro.day": "Day: {h} h", "ro.day24": "Day: 24 h, the Sun never sets", "ro.day0": "Day: 0 h, the Sun never rises", "ro.day24s": "24 h, never sets", "ro.day0s": "0 h, never rises", "ro.age": "Moon age: {d} days", "ro.view": "View from Earth", "ro.ecl.sun": "☀ Solar eclipse", "ro.ecl.moon": "🌑 Lunar eclipse", "ph.0": "New Moon", "ph.1": "Waxing Crescent", "ph.2": "First Quarter", "ph.3": "Waxing Gibbous", "ph.4": "Full Moon", "ph.5": "Waning Gibbous", "ph.6": "Last Quarter", "ph.7": "Waning Crescent", "ro.years": "Elapsed: {y} years", "ro.start": "start", "ro.laps": "{p}: {n} orbits", "pl.merc": "Mercury", "pl.venus": "Venus", "pl.earth": "Earth", "pl.mars": "Mars", "pl.jup": "Jupiter", "pl.sat": "Saturn", "pl.ura": "Uranus", "pl.nep": "Neptune", "ro.sky": "The sky turned {d}° ({h} h)", "sk.pol": "Polaris", "sk.uma": "Big Dipper", "sk.umi": "Little Dipper", "sk.cas": "Cassiopeia", "hint.sol": "💡 Look near this value: {v}.", "hint.ring2": "💡 The golden ring shows the right spot.", "hint.tap2": "💡 The golden ring is what you need!", "hint.pick2": "💡 One wrong answer was removed.", "hint.auto.dial": "💡 The comet set everything. Press \"Done.\"", "hint.auto.tap": "💡 The comet showed the right one. Tap it.", "hint.auto.pick": "💡 The comet showed the right answer.", "rew.dial": "🎬 The comet set everything. Press \"Done.\"", "rew.tap": "🎬 The comet showed the right one. Tap it.", "rew.pick": "🎬 The comet showed the right answer.", "err.dial": "🐱 Not yet. Right now: {ro} Think again!", "err.tap": "🐱 That's not it. Try another object!", "err.pick": "🐱 Not quite. Pick another answer.", "mon.1": "January", "mon.2": "February", "mon.3": "March", "mon.4": "April", "mon.5": "May", "mon.6": "June", "mon.7": "July", "mon.8": "August", "mon.9": "September", "mon.10": "October", "mon.11": "November", "mon.12": "December", "lv.21.txt": "Earth travels around the Sun for a whole year. <b>It's summer in the Northern Hemisphere<\/b> in June, July and August. Drag Earth along its orbit so it's summer in the north.", "lv.21.fact": "Winter and summer happen because Earth's axis is tilted: in summer our half of the world leans toward the Sun.", "lv.21.h1": "In summer the Northern Hemisphere leans toward the Sun. Look at the \"North: …\" label at the top.", "lv.22.txt": "<b>It's summer in Australia<\/b> while we have winter. Find that position of Earth.", "lv.22.fact": "When it's winter in the north, it's summer in the south: the two halves of Earth take turns leaning toward the Sun.", "lv.22.h1": "Australia is in the Southern Hemisphere. When we have winter, they have summer.", "lv.23.txt": "<b>June 21 is the longest day of the year.<\/b> Set Earth to that date.", "lv.23.fact": "On the summer solstice, June 21, the north has its longest day and shortest night.", "lv.23.h1": "June 21 is the solstice: the North Pole leans toward the Sun the most.", "lv.24.txt": "<b>Day equals night<\/b>: this happens on March 20 and September 23. Find one of these dates.", "lv.24.fact": "The equinox happens twice a year, on March 20 and September 23. Day and night are then 12 hours each.", "lv.24.h1": "On these days Earth's axis is sideways to the Sun, and light is shared equally between the two halves.", "lv.25.txt": "Here is Earth on <b>December 21<\/b>. What season is it in the north now?", "lv.25.fact": "On December 21 the North Pole leans away from the Sun. The north has winter and the shortest day.", "lv.25.h1": "Look: does the North Pole lean toward the Sun or away from it?", "lv.25.a0": "Summer", "lv.25.a1": "Winter", "lv.25.a2": "Spring", "lv.26.txt": "<b>New Year's Day, January 1.<\/b> Set Earth to that date. Surprising: that's exactly when Earth is closest to the Sun!", "lv.26.fact": "Earth is closest to the Sun in early January, and that's winter for us. So winter and summer depend on the tilt of the axis, not on distance.", "lv.26.h1": "The start of the year is the start of January, right after December.", "lv.27.txt": "<b>Fall in the north<\/b> is September, October and November. Find this time on the orbit.", "lv.27.fact": "In fall the days get shorter: Earth turns its northern half away from the Sun.", "lv.27.h1": "In fall the North Pole starts to turn away from the Sun.", "lv.28.txt": "<b>On January 3 Earth is closest to the Sun<\/b>, but it's winter for us. Why?", "lv.28.fact": "In winter the north leans away from the Sun, so the rays hit at a slant and warm less, even though Earth is close to it.", "lv.28.h1": "Look at the tilt of the axis: where does the North Pole point?", "lv.28.a0": "The north leans away from the Sun", "lv.28.a1": "In January Earth is farther from the Sun", "lv.28.a2": "In winter the Sun shines weaker", "lv.29.txt": "<b>Spring in the north<\/b> is March, April and May. Place Earth.", "lv.29.fact": "In spring the days get longer, and the Sun climbs higher.", "lv.29.h1": "In spring the days grow: the north starts turning toward the Sun.", "lv.30.txt": "<b>Boss quiz!<\/b> Five questions about the seasons. You need at least 4 right.", "lv.30.fact": "You know why the seasons change: it's all about the tilt of Earth's axis.", "lv.31.txt": "Here is <b>Murmansk<\/b>, north of the Arctic Circle (69° N). Find the date when <b>the Sun never sets<\/b>: the polar day.", "lv.31.fact": "North of the Arctic Circle there is a polar day in summer: the Sun doesn't dip below the horizon for many days in a row.", "lv.31.h1": "You need a day that is 24 hours long. Look at the summer dates and check \"Day: … h.\"", "lv.32.txt": "In Murmansk it's now <b>polar night<\/b>: the Sun doesn't rise above the horizon. Find this date.", "lv.32.fact": "In winter north of the Arctic Circle there is a polar night: the Sun doesn't rise for many days.", "lv.32.h1": "These are winter dates, when the north leans away from the Sun.", "lv.33.txt": "<b>June 21.<\/b> Find the latitude where the day lasts about 17–18 hours, like in Moscow.", "lv.33.fact": "The farther north a city is, the longer its summer day: in Moscow it's about 17 hours.", "lv.33.h1": "Moscow is at about 56° north latitude.", "lv.34.txt": "<b>December 21.<\/b> In winter, Moscow has only about 7 hours of daylight. Find this latitude.", "lv.34.fact": "The farther north a city is, the shorter its winter day: in Moscow it's about 7 hours.", "lv.34.h1": "Moscow is at about 56° north latitude.", "lv.35.txt": "This is the <b>equator<\/b>, 0° latitude. What happens to the length of the day through the year?", "lv.35.fact": "At the equator, day and night are almost always 12 hours each, and there are no seasons like ours.", "lv.35.h1": "The equator lies halfway between the poles: the Sun stays high above it all year.", "lv.35.a0": "Always about 12 hours", "lv.35.a1": "24 hours in summer, 0 in winter", "lv.35.a2": "17 hours in summer, 7 in winter", "lv.36.txt": "Here is <b>Saint Petersburg<\/b> (60° N). Find the dates of the <b>white nights<\/b>: the day lasts more than 18 hours.", "lv.36.fact": "In Saint Petersburg, from late May to July the night is almost bright: the Sun sets only briefly and not very deep.", "lv.36.h1": "White nights are in summer, around June 21.", "lv.37.txt": "<b>Antarctica<\/b> (75° S). Find the date when it has a polar day.", "lv.37.fact": "In Antarctica the polar day comes in December and January. It's summer there when we have winter.", "lv.37.h1": "When we have winter, the south has summer.", "lv.38.txt": "<b>The North Pole.<\/b> Find the date when it's daytime there and the Sun shines around the clock.", "lv.38.fact": "At the North Pole there are six months of day and six months of night: the Sun rises around March 20 and sets around September 23.", "lv.38.h1": "At the pole it's day when the North Pole leans toward the Sun: in spring and summer.", "lv.39.txt": "<b>June 21.<\/b> Find the latitude where the Sun doesn't set at all.", "lv.39.fact": "The Arctic Circle is at 66.5° N. North of it, on the summer solstice, the Sun doesn't set.", "lv.39.h1": "It's north of the Arctic Circle. It runs along 66.5° north latitude.", "lv.40.txt": "<b>Boss quiz!<\/b> Five questions about polar day and the length of the day. You need at least 4 right.", "lv.40.fact": "Now you understand why north of the Arctic Circle the Sun sometimes never sets and sometimes never rises.", "lv.41.txt": "The Moon travels around Earth. <b>New Moon<\/b>: the Moon is between Earth and the Sun, and we can't see it. Drag the Moon.", "lv.41.fact": "At New Moon the Moon turns its dark side toward us, so we can't see it.", "lv.41.h1": "The Moon should be on the line between Earth and the Sun, closer to the Sun (on the left).", "lv.42.txt": "<b>Full Moon<\/b>: Earth is between the Sun and the Moon, and the whole disk glows.", "lv.42.fact": "At Full Moon the Moon shines as a full circle, and it's bright all night.", "lv.42.h1": "The Moon should be on the side of Earth that has no Sun.", "lv.43.txt": "<b>First Quarter<\/b>: the right half of the disk is lit. Find it.", "lv.43.fact": "At First Quarter the Moon is growing. In the Northern Hemisphere the right half is lit.", "lv.43.h1": "A waxing Moon is lit on the right. Look at \"View from Earth.\"", "lv.44.txt": "<b>Last Quarter<\/b>: the left half is lit, and the Moon is getting old.", "lv.44.fact": "At Last Quarter the Moon is waning: the left half is lit, and then only a thin crescent is left.", "lv.44.h1": "A waning Moon is lit on the left.", "lv.45.txt": "<b>A thin waxing crescent<\/b>, shaped like a backwards C. Find it.", "lv.45.fact": "A waxing crescent looks like a backwards C, and a waning one looks like a C. This rule works for the Northern Hemisphere.", "lv.45.h1": "It's between New Moon and First Quarter. A narrow strip is lit on the right.", "lv.46.txt": "Here is the Moon on its orbit. What will we see in the sky?", "lv.46.fact": "After Full Moon the Moon wanes: less and less of it is lit, until New Moon comes.", "lv.46.h1": "Look at \"View from Earth\": is it lit on the left or on the right?", "lv.46.a0": "Waning crescent, like a C", "lv.46.a1": "Waxing crescent, like a backwards C", "lv.46.a2": "Full Moon", "lv.47.txt": "<b>Lunar eclipse<\/b>: the Moon enters Earth's shadow. Place the Moon exactly behind Earth.", "lv.47.fact": "A lunar eclipse happens only at Full Moon: the Moon passes through Earth's shadow and turns red.", "lv.47.h1": "An eclipse happens when the Sun, Earth and Moon are in one line, with Earth in the middle.", "lv.48.txt": "<b>Solar eclipse<\/b>: the Moon covers the Sun. Place the Moon exactly between Earth and the Sun.", "lv.48.fact": "A solar eclipse happens only at New Moon: the Moon's shadow falls on a small patch of Earth.", "lv.48.h1": "The Moon should be on the line joining Earth and the Sun, closer to the Sun.", "lv.49.txt": "The Moon makes a full circle in <b>29.5 days<\/b>. Set the Moon to day 29: the last night before New Moon.", "lv.49.fact": "From one New Moon to the next takes 29.5 days. This time is called a lunar month.", "lv.49.h1": "Each day the Moon moves about 12° along its orbit. Look at \"Moon age.\"", "lv.50.txt": "<b>Boss quiz!<\/b> Five questions about the Moon. You need at least 4 right.", "lv.50.fact": "The Moon shines with reflected light, and its phases are just how we see the lit half.", "lv.51.txt": "The planets travel around the Sun. <b>Tap the planet closest to the Sun.<\/b>", "lv.51.fact": "Mercury is closest to the Sun. A year there is only 88 Earth days.", "lv.51.h1": "The closest to the Sun is the smallest and fastest planet.", "lv.52.txt": "<b>The biggest planet<\/b> is a real giant. Tap it.", "lv.52.fact": "Jupiter is bigger than all the other planets put together: more than a thousand Earths would fit inside it.", "lv.52.h1": "This planet is bigger than all the others put together.", "lv.53.txt": "<b>The planet with beautiful rings.<\/b> Find it.", "lv.53.fact": "Saturn has the most visible rings: they are made of ice and rocks.", "lv.53.h1": "It's the second biggest and comes after Jupiter.", "lv.54.txt": "<b>The red planet<\/b>, where people look for signs of water. Tap it.", "lv.54.fact": "Mars is red because of rusty dust. There may once have been water there.", "lv.54.h1": "It comes right after Earth.", "lv.55.txt": "<b>Our planet<\/b> is the only one where life is sure to exist. Find it.", "lv.55.fact": "Earth is the third planet from the Sun and the only one where life is known.", "lv.55.h1": "It's third from the Sun.", "lv.56.txt": "<b>A year on Mercury.<\/b> Spin time: let Mercury make a full orbit and return to the golden line.", "lv.56.fact": "A year is the time of one trip around the Sun. On Mercury it lasts 88 Earth days.", "lv.56.h1": "Mercury circles the Sun in 88 days, which is a bit less than three months.", "lv.57.txt": "<b>A year on Venus.<\/b> Spin time until Venus returns to the golden line.", "lv.57.fact": "A year on Venus lasts 225 Earth days.", "lv.57.h1": "A Venus year is 225 Earth days, about seven months.", "lv.58.txt": "<b>A year on Mars.<\/b> Spin time until Mars makes a full orbit.", "lv.58.fact": "A year on Mars is 687 Earth days, almost two Earth years.", "lv.58.h1": "A Mars year is almost twice as long as an Earth year.", "lv.59.txt": "<b>A year on Jupiter.<\/b> Jupiter is far away, and its orbit takes a long time. Spin time until it returns to the golden line.", "lv.59.fact": "Jupiter circles the Sun in 12 Earth years: while Earth makes 12 laps, it makes one.", "lv.59.h1": "Jupiter goes around the Sun in almost 12 Earth years. The \"+1 yr\" buttons will help.", "lv.60.txt": "<b>Boss quiz!<\/b> Five questions about the planets. You need at least 4 right.", "lv.60.fact": "You know the planets of the Solar System and what a year is on different planets.", "lv.61.txt": "This is the night sky facing north. <b>Find the North Star<\/b>, which barely moves.", "lv.61.fact": "The North Star barely moves and always points north.", "lv.61.h1": "All the stars circle around it. It's right in the center of the sky.", "lv.62.txt": "<b>The Big Dipper<\/b> is a ladle of seven bright stars. Find it.", "lv.62.fact": "The Big Dipper helps you find the North Star: extend the edge of its bowl five times.", "lv.62.h1": "Look for seven stars shaped like a big ladle with a handle.", "lv.63.txt": "<b>Cassiopeia<\/b> is stars shaped like the letter W (or M). Find it.", "lv.63.fact": "Cassiopeia is on the opposite side of the North Star from the Big Dipper.", "lv.63.h1": "It's on the other side of the North Star from the Big Dipper.", "lv.64.txt": "<b>The Little Dipper<\/b> is a small ladle. The North Star is the end of its handle. Tap it.", "lv.64.fact": "The North Star belongs to the Little Dipper: it's at the end of the small ladle's handle.", "lv.64.h1": "It's the small ladle around the most motionless star.", "lv.65.txt": "The sky spins around the North Star. <b>Turn the sky so the Big Dipper is above the North Star.<\/b>", "lv.65.fact": "Because Earth spins, the stars seem to circle around the North Star.", "lv.65.h1": "\"Above\" means at the top of the screen, closer to the top edge.", "lv.66.txt": "Now turn the sky so that <b>Cassiopeia is at the bottom<\/b>, below the North Star.", "lv.66.fact": "Cassiopeia and the Big Dipper seem to ride a seesaw around the North Star.", "lv.66.h1": "Cassiopeia and the Big Dipper are always on opposite sides of the North Star.", "lv.67.txt": "In one day the sky makes a full turn: 360° in 24 hours. <b>Turn the sky forward by exactly 4 hours.<\/b>", "lv.67.fact": "The sky turns 15° every hour: it only seems that way because Earth is spinning.", "lv.67.h1": "1 hour is 15°, so 4 hours is 60°.", "lv.68.txt": "The star in the center barely moves. <b>Where does it point?<\/b>", "lv.68.fact": "The North Star points north: travelers use it to find their way.", "lv.68.h1": "The North Star stands above Earth's North Pole.", "lv.68.a0": "North", "lv.68.a1": "South", "lv.68.a2": "East", "lv.69.txt": "Turn the sky by <b>12 hours<\/b>: Cassiopeia and the Big Dipper will swap places.", "lv.69.fact": "After 12 hours Cassiopeia and the Big Dipper swap places: the sky has turned 180°.", "lv.69.h1": "12 hours is half a turn of the sky, 180°.", "lv.70.txt": "<b>Final boss!<\/b> Five questions from all the worlds. You need at least 4 right.", "lv.70.fact": "You're a real astronomer: you know days, time zones, seasons, the Moon, planets and stars!", "q.13.q": "Why does Earth have seasons?", "q.13.a0": "Because Earth's axis is tilted", "q.13.a1": "Earth moves closer to the Sun and then farther away", "q.13.a2": "The Sun gets brighter and then dimmer", "q.13.e": "Earth's axis is tilted, so the two halves take turns facing the Sun's direct rays.", "q.14.q": "How long does Earth take to go around the Sun?", "q.14.a0": "One day", "q.14.a1": "One year", "q.14.a2": "One month", "q.14.e": "One trip around the Sun is one year, about 365 days.", "q.15.q": "On what date is the longest day in the north?", "q.15.a0": "June 21", "q.15.a1": "December 21", "q.15.a2": "March 20", "q.15.e": "June 21 is the summer solstice.", "q.16.q": "When it's winter in Moscow, in Australia it's…", "q.16.a0": "Winter too", "q.16.a1": "Summer", "q.16.a2": "Always fall", "q.16.e": "The two halves take turns leaning toward the Sun, so their seasons are opposite.", "q.17.q": "When is day equal to night?", "q.17.a0": "Only on June 21", "q.17.a1": "March 20 and September 23", "q.17.a2": "Every day", "q.17.e": "These are the equinox days: day and night are 12 hours each.", "q.18.q": "When is Earth closest to the Sun?", "q.18.a0": "In June, that's why it's summer", "q.18.a1": "In early January", "q.18.a2": "It's always the same distance", "q.18.e": "It's closest in early January, but that's winter for us: it's all about the tilt of the axis.", "q.19.q": "How many seasons are there in a year?", "q.19.a0": "Two", "q.19.a1": "Four", "q.19.a2": "Six", "q.19.e": "Spring, summer, fall and winter.", "q.20.q": "What season is it in the north in October?", "q.20.a0": "Spring", "q.20.a1": "Summer", "q.20.a2": "Fall", "q.20.e": "September, October and November are fall.", "q.21.q": "What is a polar day?", "q.21.a0": "A time when the Sun doesn't set for many days", "q.21.a1": "A day that lasts one hour", "q.21.a2": "A day when it's cold on Earth", "q.21.e": "North of the Arctic Circle in summer, the Sun doesn't go below the horizon.", "q.22.q": "Where does polar night happen?", "q.22.a0": "At the equator", "q.22.a1": "North of the Arctic Circle", "q.22.a2": "In Moscow", "q.22.e": "In winter north of the Arctic Circle, the Sun doesn't rise for many days.", "q.23.q": "At what latitude is the Arctic Circle?", "q.23.a0": "23.4° N", "q.23.a1": "66.5° N", "q.23.a2": "90° N", "q.23.e": "It's 90° minus the tilt of Earth's axis.", "q.24.q": "How long is the day at the equator?", "q.24.a0": "About 12 hours all year", "q.24.a1": "24 hours in summer", "q.24.a2": "6 hours in winter", "q.24.e": "At the equator, day and night are almost equal all year round.", "q.25.q": "What are white nights?", "q.25.a0": "Nights with snow", "q.25.a1": "Nights when the sky is almost bright", "q.25.a2": "Nights without stars and Moon", "q.25.e": "In summer the Sun se function dnum(N){N=Math.round(mod(N-1,365))+1;return N-CUM[mon(N)];}
function decl(N){return -23.44*Math.cos(2*Math.PI*(N+10)/365);}
function dayLen(N,lat){var d=decl(N)*Math.PI/180;
 if(Math.abs(lat)>=89.9){var s=lat>0?1:-1;return d*s>0.001?24:(d*s<-0.001?0:12);}
 var x=-Math.tan(lat*Math.PI/180)*Math.tan(d);if(x<=-1)return 24;if(x>=1)return 0;return 2*Math.acos(x)*180/Math.PI/15;}
function inN(N,a,b){N=mod(N-1,365)+1;return a<=b?(N>=a&&N<=b):(N>=a||N<=b);}
function dN(a,b,m){var d=mod(a-b,m);return Math.min(d,m-d);}
