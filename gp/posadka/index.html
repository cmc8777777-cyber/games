<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0830">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<script src="gp-adapter.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Посадка на планету</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#05031a;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff}
#app{position:absolute;left:0;top:0;width:375px;height:812px;transform-origin:0 0;overflow:hidden;background:#0b0830}
canvas{position:absolute;left:0;top:0;width:375px;height:812px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:22px 16px;background:radial-gradient(ellipse at 50% 0,#3b2a8c 0,#150f4d 55%,#07041f 100%);overflow:hidden}
.screen.on{display:flex}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#ffe9a8,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 250px 60px,#bfe6ff,transparent),radial-gradient(2px 2px at 330px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 140px,#fff,transparent),radial-gradient(2px 2px at 300px 120px,#ffd1f2,transparent);background-size:360px 160px;opacity:.8}
h1{font-size:34px;margin:6px 0 0;text-align:center;line-height:1.05;color:#ffd84a;text-shadow:0 4px 0 #b34a00,0 8px 14px rgba(0,0,0,.5)}
h2{font-size:26px;margin:4px 0 10px;text-align:center;color:#ffd84a;text-shadow:0 3px 0 #b34a00}
.btn{display:block;border:0;border-radius:22px;padding:15px 18px;font:700 20px "Trebuchet MS",Arial,sans-serif;color:#fff;background:linear-gradient(#41d36b,#1fa04a);box-shadow:0 5px 0 #11662f,0 8px 14px rgba(0,0,0,.45);margin:8px 0;min-width:220px;text-align:center;cursor:pointer;position:relative;z-index:2}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #11662f}
.btn.blue{background:linear-gradient(#4fb6ff,#2276d6);box-shadow:0 5px 0 #124b8f,0 8px 14px rgba(0,0,0,.45)}
.btn.org{background:linear-gradient(#ffb43a,#f07a12);box-shadow:0 5px 0 #a24a05,0 8px 14px rgba(0,0,0,.45)}
.btn.small{font-size:16px;padding:10px 14px;min-width:0}
.sub{font-size:15px;color:#cfd6ff;text-align:center;margin:2px 0 8px;line-height:1.25;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;z-index:2}
.card{border-radius:20px;padding:10px 8px;text-align:center;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);position:relative;cursor:pointer}
.card.lock{opacity:.5;cursor:default}
.card .pl{width:70px;height:70px;border-radius:50%;margin:2px auto 6px;box-shadow:inset -10px -10px 18px rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.2)}
.card b{display:block;font-size:18px}.card i{font-style:normal;font-size:12px;color:#cfd6ff;display:block}
#mapgrid{gap:8px}#mapgrid .card{padding:6px 6px}#mapgrid .pl{width:44px;height:44px;margin:0 auto 3px}#mapgrid .card b{font-size:15px}#mapgrid .card i{font-size:11px;min-height:28px;line-height:14px}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:10px;z-index:2}
.lv{border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 28px Arial;background:linear-gradient(#5b8cff,#2c47b8);box-shadow:0 5px 0 #1a2a78;cursor:pointer}
.lv small{font-size:14px;color:#ffd84a;letter-spacing:1px}
.lv.lock{background:#3a3a63;box-shadow:0 5px 0 #25254a;opacity:.55;cursor:default}
.panel{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:20px;padding:14px;width:100%;z-index:2;margin:6px 0}
.q{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:6px}
.ans{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;font-size:17px;border-radius:16px;background:#fff;color:#1c1c4a;font-weight:700;border:0;box-shadow:0 4px 0 #9aa;cursor:pointer;font-family:inherit}
.ans.ok{background:#7be08f;box-shadow:0 4px 0 #2b8a41}.ans.bad{background:#ff9a9a;box-shadow:0 4px 0 #b34}
.hint{font-size:16px;line-height:1.35;color:#fff}
#hud-pause{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;z-index:5;display:none}
#ctl{position:absolute;left:0;right:0;bottom:0;height:150px;display:none;z-index:4;background:linear-gradient(transparent,rgba(5,3,26,.85) 40%)}
#thrust{position:absolute;left:14px;bottom:16px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffb347,#ff5a1f 70%);border:4px solid #fff3;box-shadow:0 6px 0 #9c2a05,0 0 18px #ff7a2a88;font:700 20px Arial;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#thrust.d{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #9c2a05,0 0 28px #ffcc44}
#tilt{position:absolute;right:14px;bottom:16px;width:196px;height:104px;border-radius:52px;background:linear-gradient(#5aa7ff,#2a55c9);border:4px solid #fff3;box-shadow:0 6px 0 #17307f;display:flex}
#tilt .h{flex:1;display:flex;align-items:center;justify-content:center;font-size:44px;border-radius:52px;transition:background .05s}
#tilt .h.d{background:rgba(255,255,255,.35)}
#chute{position:absolute;left:14px;bottom:160px;margin:0;z-index:6;display:none}
#toast{position:absolute;left:16px;right:16px;top:150px;text-align:center;z-index:7;font-size:20px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:16px;padding:10px;display:none}
#pause{background:rgba(5,3,26,.85);z-index:9}
.cov{background-color:#150f4d;background-repeat:no-repeat}.cov h1{margin-top:2px}.cov .sub{display:none}.cov #m-total{display:block;margin-top:0;font-size:13px}.cov #b-play{margin-top:auto;margin-bottom:4px;font-size:24px;min-width:260px}.big{font-size:56px;letter-spacing:6px;color:#ffd84a;text-shadow:0 3px 0 #b34a00;margin:6px 0}
.ship{width:72px;height:72px;flex:none}
.row{display:flex;gap:10px;align-items:center;width:100%;z-index:2}
:root{--pm-paper:#1c1850;--pm-ink:#fff;--pm-red:#ff8a1f;--pm-redink:#1a1030;--pm-gold:#ffd84a;--pm-muted:#c6c2f0;--pm-line:#5b55b0;--pm-focus:#7fd0ff;--pm-scrim:rgba(5,3,26,.78);--pm-z:60}
body.playing .pm-corner{display:none!important}
.pm-corner{border-radius:18px!important;font-weight:800}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="750" height="1624"></canvas>
  <div id="toast"></div>
  <button id="hud-pause" data-ia="ui.pause" aria-label="Пауза">❚❚</button>
  <button id="chute" class="btn org small"><span class="ic">🪂</span> <span data-i="ui.chute">Парашют</span></button>
  <div id="ctl">
    <div id="thrust"><span style="font-size:34px">🔥</span><span data-i="ui.thrust">ТЯГА</span></div>
    <div id="tilt"><div class="h" id="tl">◀</div><div class="h" id="tr">▶</div></div>
  </div>

  <div class="screen on" id="s-menu"><div class="stars"></div>
    <div style="height:30px"></div>
    <svg width="150" height="150" viewBox="-40 -50 80 100" id="menuShip"></svg>
    <h1 data-h="menu.title">ПОСАДКА<br>НА ПЛАНЕТУ</h1>
    <div class="sub" style="margin-top:12px" data-h="menu.sub">Посади модуль мягко на площадку.<br>У каждой планеты свой вес и свой воздух!</div>
    <button class="btn" id="b-play" data-i="menu.play">▶ Играть</button>
    <div class="row" style="justify-content:center;gap:12px"><button class="btn blue small" id="b-ships" data-i="menu.ships">🚀 Корабли</button><button class="btn blue small" id="b-snd">🔊 Звук: вкл</button><button class="btn blue small" id="b-lang" style="display:none">EN</button></div>
    <div class="sub" id="m-total"></div>
  </div>

  <div class="screen" id="s-map"><div class="stars"></div>
    <h2 data-i="map.title">Куда летим?</h2>
    <div class="grid" id="mapgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="menu" data-i="nav.menu">← В меню</button>
  </div>

  <div class="screen" id="s-lv"><div class="stars"></div>
    <h2 id="lv-title"></h2>
    <div class="sub" id="lv-sub"></div>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="map" data-i="nav.planets">← К планетам</button>
  </div>

  <div class="screen" id="s-brief"><div class="stars"></div>
    <h2 data-i="brief.title">Брифинг</h2>
    <div class="sub" id="br-sub"></div>
    <div class="panel"><div class="q" id="br-q"></div><div id="br-ans"></div></div>
    <div class="panel hint" id="br-hint" style="display:none"></div>
    <button class="btn" id="b-go" style="display:none" data-i="brief.go">🚀 К посадке!</button>
    <button class="btn org small" id="b-reward" style="display:none" data-i="brief.reward">📺 Ролик: +25 % топлива</button>
    <button class="btn blue small" id="b-skip" style="margin-top:auto" data-i="brief.skip">Пропустить вопрос</button>
  </div>

  <div class="screen" id="s-res"><div class="stars"></div>
    <h2 id="r-title"></h2>
    <div class="big" id="r-stars"></div>
    <div class="panel hint" id="r-text"></div>
    <button class="btn" id="r-next">Дальше ▶</button>
    <button class="btn org" id="r-retry" data-i="res.retry">↻ Ещё раз</button>
    <button class="btn" id="r-reward" style="display:none" data-i="res.rewardRetry">📺 Ещё раз с +25 % топлива</button>
    <button class="btn blue small" data-go="lv" data-i="res.toLv">☰ К площадкам</button>
  </div>

  <div class="screen" id="s-ships"><div class="stars"></div>
    <h2 data-i="ships.title">Корабли</h2>
    <div class="sub" id="sh-sub"></div>
    <div class="grid" id="shgrid"></div>
    <button class="btn blue small" style="margin-top:auto" data-go="menu" data-i="nav.menu">← В меню</button>
  </div>

  <div class="screen" id="pause"><h2 data-i="ui.pause">Пауза</h2>
    <button class="btn" id="p-res" data-i="pause.resume">▶ Продолжить</button>
    <button class="btn blue small" id="p-quit" data-i="res.toLv">☰ К площадкам</button>
  </div>
</div>

<script>
'use strict';
/* ===== Платформа: заглушка Яндекс Игр (без SDK всё работает как есть) ===== */
var PF = (function () {
  var ys = null, ok = false, adBusy = false, tabHidden = false, apiPaused = false, lastAdAt = Date.now(), gpOn = false, wantGp = false, readyDone = false, wantReady = false;
  var AD_GAP_MS = 300000;   // полноэкранная реклама не чаще раза в 5 минут
  var self = { onPause: function () {}, onLang: function () {}, onSdk: function () {} };
  var player = null, cloud = {}, cloudLoaded = false, pendingSave = null, saveTm = 0;
  function initPlayer() {
    try { if (!ys.getPlayer) return Promise.resolve(); } catch (e) { return Promise.resolve(); }
    return ys.getPlayer({ scopes: false }).then(function (p) { player = p; return p.getData(['premium', 'save']); })
      .then(function (d) { cloud = (d && typeof d === 'object') ? d : {}; cloudLoaded = true; }).catch(function () { player = null; });
  }
  /* прогресс в облако: пишем только после того, как облако прочитано и слито (иначе новое устройство затёрло бы чужой прогресс) */
  function flushSave(now) {
    clearTimeout(saveTm); saveTm = 0;
    if (!player || !cloudLoaded || pendingSave == null) return;
    cloud.save = pendingSave; pendingSave = null;
    try { var pr = player.setData(cloud, !!now); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  }
  self.pushSave = function (raw) { pendingSave = raw; if (player && cloudLoaded && !saveTm) saveTm = setTimeout(function () { flushSave(false); }, 2500); };
  self.flushSave = flushSave;
  self.cloudGet = function (k) { return cloud[k] == null ? null : cloud[k]; };
  /* запись в облако: Promise<true> только когда облако подтвердило запись (flush) */
  self.cloudSave = function (k, v) {
    if (!player) return Promise.resolve(false);
    cloud[k] = v;
    return Promise.resolve(player.setData(cloud, true)).then(function () { return true; }, function () { return false; });
  };
  self.lang = function () { try { return ys && ys.environment && ys.environment.i18n && ys.environment.i18n.lang || ''; } catch (e) { return ''; } };
  self.get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  self.put = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  self.paused = function () { return adBusy || tabHidden || apiPaused; };
  function applyGp() {
    if (!ok || !readyDone) return;
    var should = wantGp && !self.paused(); if (should === gpOn) return; gpOn = should;
    try { var g = ys.features && ys.features.GameplayAPI; if (g) { if (should) g.start(); else g.stop(); } } catch (e) {}
  }
  function changed() { applyGp(); try { self.onPause(self.paused()); } catch (e) {} }
  function tryReady() { if (readyDone || !wantReady || !ok) return; readyDone = true; try { var l = ys.features && ys.features.LoadingAPI; if (l) l.ready(); } catch (e) {} applyGp(); }
  self.init = function () {
    try {
      if (!window.YaGames || !window.YaGames.init) return;
      window.YaGames.init().then(function (s) {
        ys = s; ok = true;
        try { if (ys.on) { ys.on('game_api_pause', function () { apiPaused = true; changed(); }); ys.on('game_api_resume', function () { apiPaused = false; changed(); }); } } catch (e) {}
        tryReady(); changed();
        try { var L = self.lang(); if (L) self.onLang(L); } catch (e) {}
        initPlayer().then(function () { try { self.onSdk(ys); } catch (e) {} });
      }).catch(function () {});
    } catch (e) {}
  };
  self.ready = function () { wantReady = true; tryReady(); };
  self.gameplay = function (on) { wantGp = !!on; applyGp(); };
  /* межстраничная: вызывать в естественной паузе (после итога уровня); по окончании вызывается done */
  self.fullscreen = function (done) {
    var fin = false;
    if (window.Premium && Premium.active()) { done(); return; }
    function end(shown) { if (fin) return; fin = true; adBusy = false; lastAdAt = Date.now(); changed(); if (shown === true && window.Premium) { try { Premium.noteFullscreen(); } catch (e) {} } done(); }
    if (!ok || adBusy || Date.now() - lastAdAt < (window.Premium ? Premium.config.adGapMs : AD_GAP_MS) || !ys.adv || !ys.adv.showFullscreenAdv) { done(); return; }
    adBusy = true; changed();
    try { ys.adv.showFullscreenAdv({ callbacks: { onClose: function (w) { end(w !== false); }, onError: function () { end(false); }, onOffline: function () { end(false); } } }); } catch (e) { end(false); }
  };
  self.canReward = function () { return !!(ok && !adBusy && ys.adv && ys.adv.showRewardedVideo); };
  /* ролик за награду: cb(true) только если игрок досмотрел */
  self.reward = function (cb) {
    if (!self.canReward()) { cb(false); return; }
    var got = false, fin = false;
    function end() { if (fin) return; fin = true; adBusy = false; lastAdAt = Date.now(); changed(); cb(got); }
    adBusy = true; changed();
    try { ys.adv.showRewardedVideo({ callbacks: { onRewarded: function () { got = true; }, onClose: end, onError: end } }); } catch (e) { end(); }
  };
  document.addEventListener('visibilitychange', function () { tabHidden = !!document.hidden; if (tabHidden) flushSave(true); changed(); });
  window.addEventListener('pagehide', function () { flushSave(true); });
  self.init();
  return self;
})();

/* слияние с облаком: звёзды по площадкам — максимум; корабль/звук/язык — от более поздней стороны; пустое облако ничего не стирает.
   Открытые планеты и корабли считаются из звёзд, поэтому объединяются сами. */
function mergeSave(a, b) {
  if (!b || typeof b !== 'object') return a;
  var st = {}, k;
  [a.stars || {}, b.stars || {}].forEach(function (o) { for (k in o) st[k] = Math.max(st[k] || 0, o[k] || 0); });
  var later = (b._t || 0) > (a._t || 0) ? b : a, other = later === a ? b : a, out = {};
  for (k in other) out[k] = other[k];
  for (k in later) out[k] = later[k];
  out.stars = st;
  var tot = 0; for (k in st) tot += st[k];
  if (SHIPS[out.ship | 0] && SHIPS[out.ship | 0].need > tot) out.ship = 0;
  out._t = Math.max(a._t || 0, b._t || 0);
  return out;
}
function applyCloudSave() {
  try {
    var cs = PF.cloudGet('save'), cj = cs ? JSON.parse(cs) : null, m = mergeSave(save, cj);
    if (m !== save) { Object.keys(save).forEach(function (k) { delete save[k]; }); Object.keys(m).forEach(function (k) { save[k] = m[k]; }); }
    PF.put(SAVE_KEY, JSON.stringify(save)); PF.pushSave(JSON.stringify(save));
    if (save.langSet && save.lang && save.lang !== LANG) setLang(save.lang, false);
    drawMenuShip(); if (cur === 'map') buildMap(); else if (cur === 'lv') buildLv(); else if (cur === 'ships') buildShips();
    console.info('[posadka-save] облако слито, звёзд:', totalStars());
  } catch (e) {}
}

/* ===== Звук (простые сигналы WebAudio, включается после первого касания) ===== */
var Snd = (function () {
  var ac = null, eng = null, engG = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      var n = ac.createBufferSource(), buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      n.buffer = buf; n.loop = true;
      var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
      engG = ac.createGain(); engG.gain.value = 0;
      n.connect(f); f.connect(engG); engG.connect(ac.destination); n.start();
    } catch (e) { ac = null; }
  }
  function tone(f, t, type, vol, slide) {
    if (!ac || !save.snd || PF.paused()) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      if (slide) o.frequency.linearRampToValueAtTime(slide, ac.currentTime + t);
      g.gain.value = vol || 0.15; g.gain.linearRampToValueAtTime(0.0001, ac.currentTime + t);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + t);
    } catch (e) {}
  }
  return {
    init: init,
    engine: function (on) { if (engG) engG.gain.value = (on && save.snd && !PF.paused()) ? 0.18 : 0; },
    ok: function () { tone(523, .15, 'triangle'); setTimeout(function () { tone(659, .15, 'triangle'); }, 140); setTimeout(function () { tone(784, .3, 'triangle'); }, 280); },
    boom: function () { tone(160, .6, 'sawtooth', .25, 30); },
    click: function () { tone(660, .06, 'square', .06); },
    warn: function () { tone(880, .08, 'square', .05); }
  };
})();
