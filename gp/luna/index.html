#phase{flex:1;text-align:center;line-height:1.15}
#phase small{display:block;color:var(--dim);font-size:11px}

#bar.n i{background:var(--blue)}
canvas{display:block;width:100%;aspect-ratio:375/200;background:#05070f}
#main{flex:1;overflow-y:auto;padding:8px 10px;-webkit-overflow-scrolling:touch}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 7px;font-size:12px;line-height:1.2;position:relative;overflow:hidden}
.chip b{font-size:14px;display:block}
.chip em{font-style:normal;color:var(--dim);font-size:10.5px}
.chip.low{border-color:var(--bad)}.chip.low b{color:var(--bad)}

.crew{display:grid;gap:6px}
.card{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.av{width:42px;height:42px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;overflow:hidden;border:2px solid var(--c,#4aa8ff)}
.av img{width:100%;height:100%;object-fit:cover}
.toast .evi{display:inline-block;width:40px;height:40px;margin:0 8px 0 0;vertical-align:middle}
.evi{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 6px}
.chip img.ic{width:16px;height:16px;vertical-align:-3px}
.card .nm{flex:1;min-width:0;font-size:13px}
.card .nm b{font-size:14px}
.hp{height:6px;background:#0b1128;border-radius:3px;margin-top:3px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--ok)}
select{font:inherit;font-size:13px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 4px;max-width:150px;min-height:40px}
#bottom{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));background:var(--panel);border-top:1px solid var(--line)}
button{font:inherit;font-weight:600;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 10px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.dim{opacity:.4}
button.go{background:linear-gradient(#ffb14a,#e8832a);border-color:#ffd49a;color:#2a1600}
#bottom button.go{flex:1.6}
button.blue{background:linear-gradient(#4aa8ff,#2a74d0);border-color:#9bd0ff;color:#04162e}
#bottom button{flex:1;font-size:13px}
button.pulse{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 5px rgba(255,177,74,.35)}}
#ov{position:absolute;inset:0;background:rgba(3,5,13,.82);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.on{display:flex}
#sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0))}
#sheet h2{margin:0 0 8px;font-size:18px}
#sheet p{margin:6px 0;font-size:14px;line-height:1.4}
#sheet .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#sheet .btns button{flex:1;min-width:120px}
.row{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:13px}
.row .l{flex:1}
input[type=text]{width:64px;font:inherit;font-size:16px;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:#0b1128;color:var(--txt);text-align:center}
input.ok{border-color:var(--ok);background:#0f2b1b}input.no{border-color:var(--bad)}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:var(--panel2);color:var(--dim)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.w{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:4px 3px;border-bottom:1px solid var(--line);text-align:left}
.q{display:grid;gap:6px;margin-top:8px}
.q button{text-align:left;min-height:44px}
.q button.right{background:#124a2a;border-color:var(--ok)}.q button.wrong{background:#4a1a1a;border-color:var(--bad)}
#menu{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 30% 20%,#14306b 0,#070b1a 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#menu h1{margin:0;font-size:34px;letter-spacing:1px;text-shadow:0 0 18px #4aa8ff}
#menu p{margin:0;color:var(--dim);font-size:14px;max-width:300px;line-height:1.4}
#menu button{width:240px}
#menu .cover{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d7d9df,#7b7e88 70%);box-shadow:0 0 40px rgba(74,168,255,.5);position:relative;display:flex;align-items:center;justify-content:center;font-size:54px}
#menu .cover img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.small{font-size:12px;color:var(--dim)}
.toast{position:absolute;left:10px;right:10px;top:50px;background:#1c2b5c;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;z-index:15;display:none}
:root{--pm-paper:#16224a;--pm-paper2:#1c2b5c;--pm-ink:#e8eefc;--pm-gold:#f7b34a;--pm-red:#f7b34a;--pm-redink:#1a1205;--pm-muted:#9fb0dd;--pm-line:#2d3f7a}
.pm-corner{opacity:.55}.pm-corner .pm-lbl{display:none}.pm-on #hud{padding-right:58px}
html.inmenu .pm-corner{opacity:1}html.inmenu .pm-corner .pm-lbl{display:inline}

['What is regolith?',['Lunar water','Lunar dust and rubble','Lunar gas','A crater'],1,'Regolith is the dust and small rocks on the Moon’s surface.'],
['What are the lunar “seas”?',['Bodies of water','Dark plains of solidified lava','Craters with ice','Clouds'],1,'They are huge dark plains; there is no water in them.'],
['The Moon is a…',['star','planet','satellite of Earth','comet'],2,'The Moon is Earth’s natural satellite.'],
['How many minutes does sunlight take to reach Earth?',['≈ 8','≈ 80','≈ 1','≈ 800'],0,'About 8 minutes: the distance is ≈ 150 million km.'],
['The distance to the Moon is about…',['38 thousand km','384 thousand km','3 million km','150 million km'],1,'About 384,000 km.'],
['A rover drives 10 km/h. How many hours to cover 80 km?',['6','8','10','80'],1,'80 ÷ 10 = 8 hours.'],
['The base uses 8 kWh a day. How much in 14 days?',['22','98','112','120'],2,'8 × 14 = 112 kWh.'],
['The recycler returns half of the water. 40 L were drunk: how much comes back?',['10 L','20 L','30 L','40 L'],1,'Half of 40 is 20.'],
['How many kilograms are in one tonne?',['10','100','1000','10,000'],2,'1 t = 1000 kg.'],
['Which side of the Moon faces Earth?',['Different sides','The same side','Its north pole','No side'],1,'The Moon always shows the same side to Earth.'],
['What causes the tides on Earth?',['Wind','The Moon','Mars','Currents'],1,'Tides are mainly caused by the Moon\'s gravity. The Sun\'s gravity also plays an important role.'],
['When does a lunar eclipse happen?',['The Moon enters Earth’s shadow','The Sun goes out','The Moon gets closer to the Sun','Earth is in the Moon’s shadow'],0,'The Moon passes through Earth’s shadow.'],
['The temperature on the Moon at night is about…',['+20 °C','0 °C','−170 °C','−20 °C'],2,'About −170 °C. With almost no atmosphere to hold in heat, the lunar surface gets extremely cold at night.'],
['Which gas do people need to breathe?',['Nitrogen','Oxygen','Hydrogen','Helium'],1,'Oxygen. Scientists are developing ways to extract oxygen from lunar soil, but this is not yet done on a large scale.'],
['Where is ice found on the Moon?',['On sunlit plains','In dark craters near the poles','Under the seas','Nowhere'],1,'In the permanent shadow of polar craters.'],
['How many days does a lunar night last?',['7','14','28','1'],1,'About 14 Earth days.'],
['New Moon is when the Moon is…',['fully visible','not visible','half visible','hidden by Earth'],1,'During a new moon, the side facing away from Earth is lit by the Sun, while the side facing Earth is mostly dark.'],
['The first artificial satellite of Earth was launched in…',['1941','1957','1969','1991'],1,'Sputnik 1, on 4 October 1957.'],
['How many hours are in 2 days?',['24','36','48','60'],2,'24 × 2 = 48 hours.'],
['The Sun is a…',['planet','satellite','star','comet'],2,'The Sun is a star, the one nearest to Earth.'],
['If 3 people need 7.5 L of water a day, how much does 1 person need?',['2 L','2.5 L','3 L','3.5 L'],1,'7.5 ÷ 3 = 2.5 L.'],
['Which of these objects orbits the Earth?',['The ISS','Mars','Jupiter','The Sun'],0,'The ISS flies in orbit around the Earth.'],
['What do plants in a greenhouse need to grow?',['Water, light, warmth','Only ice','Only dust','Nothing'],0,'Water, light, warmth and air (carbon dioxide).'],
['How many days are in 2 weeks?',['10','12','14','16'],2,'2 × 7 = 14 days: about as long as daylight lasts on the Moon.']
];

var S=null,busy=false,usedQ=[],art={};
var ARTNAMES=['bg_moon','earth','rover','mod_hab','mod_store','mod_power','mod_green','mod_drill','mod_recy','astro_0','astro_1','astro_2','astro_3','cover','crater_ice','ev_meteor','ev_break','ev_flare','ic_energy','ic_o2','ic_water','ic_food','ic_parts','ic_temp'];
var ICN={'⚡':'ic_energy','🫁':'ic_o2','💧':'ic_water','🍲':'ic_food','🔧':'ic_parts','🌡':'ic_temp'};
function EVI(n){return art[n]?'<img class="evi" src="'+IMGDATA[n]+'" alt="">':''}
function IC(e){var n=ICN[e];return n&&art[n]?'<img class="ic" src="'+IMGDATA[n]+'" alt="">':e}
/* картинки: список готовых файлов лежит в img/index.json (пустой список — всё рисуется кодом, запросов к несуществующим файлам нет) */
Promise.resolve(Object.keys(IMGDATA)).then(function(list){
 list.forEach(function(n){if(ARTNAMES.indexOf(n)<0)return;var im=new Image();im.onload=function(){art[n]=im;if(n==='cover')setCover();if(S){$('crew').dataset.sig='';if(n.indexOf('ic_')===0)try{refresh()}catch(e){}}};im.onerror=function(){};im.src=IMGDATA[n]});
}).catch(function(){});
function TN(k){return L(T[k].n,T[k].ne)}
function TI(k){return L(T[k].info,T[k].ie)}
function tk(k){return L(TASKS[k],TASKS_EN[k])}
function cn(c){return L(NAMES[c.i],NAMES_EN[c.i])}
function setCover(){var b=$('coverBox');if(art.cover){b.innerHTML='';b.appendChild(art.cover.cloneNode())}}

function newState(){
 var s={v:1,cycle:1,phase:'day',step:0,day:0,credits:100,energy:40,temp:20,stars:0,flare:0,
  res:{o2:40,water:50,food:85,parts:2,cells:0},
  mods:[{t:'hab'},{t:'store'},{t:'power'},{t:'power'},{t:'drill'}],
  crew:[],trip:null,calc:{},st:{ice:0,flareHurt:0},log:[]};
 for(var i=0;i<3;i++)s.crew.push(mkCrew(i));
 s.crew[0].task='drillO';s.crew[1].task='roverA';s.crew[2].task='rest';
 return s;
}
function mkCrew(i){return {i:i,name:NAMES[i],hp:100,task:'rest'}}
function cnt(t){return S.mods.filter(function(m){return m.t===t}).length}
function cntOk(t){return S.mods.filter(function(m){return m.t===t&&!m.dmg}).length}
function capE(){return 40*cntOk('power')}
function capR(){return 50*cnt('hab')+100*cnt('store')}
function beds(){return 3*cnt('hab')}
function useDay(){return S.mods.reduce(function(a,m){return a+T[m.t].d},0)}
function useNight(){return S.mods.reduce(function(a,m){return a+T[m.t].nt},0)}
function avgHp(){return S.crew.reduce(function(a,c){return a+c.hp},0)/Math.max(1,S.crew.length)}
function recyF(){return cntOk('recy')>0?0.5:1}
function needs(){var n=S.crew.length;return {energy:useNight()*14,water:r1(n*2.5*14*recyF()),o2:n*14,food:n*14}}
function stocks(){return {energy:Math.min(S.energy,capE()),water:S.res.water,o2:S.res.o2,food:S.res.food}}
function log(m){S.log.push(m);if(S.log.length>40)S.log.shift();toast(m)}
function save(){if(!S||(S.phase!=='day'&&S.phase!=='prep'))return;PF.put('lunabaza-save',JSON.stringify(S))}

/* ---------- Симуляция суток ---------- */
function simDay(isDay){
 var crew=S.crew,n=crew.length,res=S.res,out={lack:[],powered:true};
 if(isDay)S.energy=Math.min(capE(),S.energy+16*cntOk('power'));
 else S.energy=Math.min(S.energy,capE());
 var ops=drillOps(isDay);
 var use=(isDay?useDay():useNight())+6*ops.length;
 if(S.energy>=use)S.energy-=use;
 else{var need=use-S.energy;S.energy=0;if(res.cells>=need)res.cells-=need;else{res.cells=0;out.powered=false}}
 S.temp=out.powered?Math.min(20,S.temp+10):Math.max(-40,S.temp-8);
 var cap=capR();
 function add(k,v){res[k]=r1(Math.min(cap,Math.max(0,res[k]+v)))}
 if(out.powered){
  if(cntOk('green')>0&&res.water>=2){add('food',3);add('o2',2);add('water',-2)}
  ops.forEach(function(c){if(c.task==='drillO')add('o2',6);else add('water',3)});
 }
 var leak=S.mods.some(function(m){return m.t==='hab'&&m.dmg})?3:0;
 function eat(k,need){if(res[k]>=need){res[k]=r1(res[k]-need);return true}res[k]=0;return false}
 var okO=eat('o2',n+leak),okW=eat('water',r1(n*2.5*(out.powered?recyF():1))),okF=eat('food',n);
 if(!okO)out.lack.push('кислород');if(!okW)out.lack.push('вода');if(!okF)out.lack.push('еда');
 if(S.temp<10)out.lack.push('холод');
 var dead=[];
 crew.forEach(function(c){
  var d=0;if(!okO)d-=30;if(!okW)d-=20;if(!okF)d-=10;if(S.temp<0)d-=20;else if(S.temp<10)d-=8;
  if(d===0&&S.temp>=15)d=c.task==='rest'?10:5;
  c.hp=Math.max(0,Math.min(100,c.hp+d));
  if(c.hp<=0)dead.push(c);
 });
 dead.forEach(function(c){S.crew.splice(S.crew.indexOf(c),1);log('☠ '+cn(c)+L(' погиб(ла)',' has died'))});
 out.dead=dead.length;
 return out;
}
function drillOps(isDay){
 var k=cntOk('drill'),r=[];
 S.crew.forEach(function(c){if((c.task==='drillO'||c.task==='drillW')&&r.length<k)r.push(c)});
 return r;
}
function tryRepair(){
 var m=S.mods.filter(function(x){return x.dmg})[0];
 if(!m)return false;
 if(S.res.parts<1||S.energy<5)return false;
 S.res.parts--;S.energy-=5;m.dmg=false;log('🔧 '+TN(m.t)+L(' отремонтирован',' repaired'));return true;
}
function eventRoll(isDay){
 if(S.cycle===1)return null;
 var k=S.cycle,m=S.cycle===12?2:1;
 var r=Math.random();
 var pm=(0.03+0.005*k)*m,pb=0.03*m,pf=(k>=2?0.02:0)*m;
 if(r<pm)return 'meteor';
 if(r<pm+pb)return 'break';
 if(r<pm+pb+pf)return 'flare';
 return null;
}

/* Прогон N суток с остановкой на событиях */
function runDays(n,isDay,delay,done){
 var left=n;
 (function next(){
  if(left<=0){done();return}
  left--;S.day++;
  var o=simDay(isDay);
  refresh();
  if(S.crew.length<2){gameOver();return}
  var ev=eventRoll(isDay);
  var cont=function(){(function w(){if(PF.paused())setTimeout(w,200);else setTimeout(next,delay)})()};
  var after=function(){if(ev)showEvent(ev,isDay,cont);else cont()};
  var w=warnNeed(o);
  if(w)alertShortage(w,after);else after();
 })();
}

function doStep(){
 if(busy||S.phase!=='day')return;
 busy=true;lockUI(true);S.warned={};
 /* старт задач */
 var roverBusy=!!S.trip;
 S.crew.forEach(function(c){
  if(c.task==='repair'){tryRepair();c.task='rest'}
  else if(c.task==='roverA'||c.task==='roverB'){
   var cr=CRATER[c.task];
   if(S.trip&&S.trip.who===c.i){}
   else if(S.trip||S.step+cr.steps>7){c.task='rest';toast(L('Ровер сейчас не может выехать','The rover can\'t head out right now'))}
   else{
    var e=cr.km*0.1;
    if(S.energy>=e+12){S.energy-=e;S.trip={who:c.i,key:c.task,left:cr.steps}}
    else{c.task='rest';toast(L('Мало энергии для рейса','Not enough energy for the trip'))}
   }
  }
 });
 runDays(2,true,260,function(){
  if(S.trip){S.trip.left--;if(S.trip.left<=0){var cr=CRATER[S.trip.key];var add=Math.min(cr.ice,capR()-S.res.water);if(add<0)add=0;S.res.water=r1(S.res.water+add);S.st.ice+=cr.ice;
   var who=S.crew.filter(function(c){return c.i===S.trip.who})[0];S.trip=null;log(L('🚙 Ровер привёз лёд: +'+RU(add)+' л воды','🚙 The rover returned with ice: +'+RU(add)+' L of water'));if(art.crater_ice)toast('',EVI('crater_ice')+L('Лёд из кратера: +'+RU(add)+' л','Crater ice: +'+RU(add)+' L'))}}
  S.step++;
  busy=false;
  if(S.step>=7){S.phase='prep';save();refresh();nightPrep()}
  else{save();lockUI(false);refresh()}
 });
}
function lockUI(b){['bMod','bShop','bCalc','bGo'].forEach(function(i){$(i).disabled=b});document.querySelectorAll('select').forEach(function(s){s.disabled=b})}

/* ---------- Ночь, рассвет ---------- */
function nightPrep(){
 lockUI(false);
 var nd=needs(),st=stocks(),rows='';
 [['energy',L('⚡ Энергия','⚡ Energy'),L('кВт·ч','kWh')],['water',L('💧 Вода','💧 Water'),L('л','L')],['o2',L('🫁 Кислород','🫁 Oxygen'),L('кг','kg')],['food',L('🍲 Еда','🍲 Food'),L('пайков','rations')]].forEach(function(r){
  var solved=S.calc[r[0]];
  rows+='<div class="row"><span class="l">'+r[1]+'</span>'+(solved?(st[r[0]]>=nd[r[0]]?'<span class="tag ok">'+L('хватит (','enough (')+RU(st[r[0]])+L(' из ',' of ')+RU(nd[r[0]])+')</span>':'<span class="tag bad">'+L('не хватает ','short by ')+RU(nd[r[0]]-st[r[0]])+' '+r[2]+'</span>'):'<span class="tag w">'+L('не рассчитано','not calculated')+'</span>')+'</div>';
 });
 var dr=drillOps(false).length;
 modal(L('Заход Солнца!','Sunset!'),L('<p>Через мгновение начнётся ночь: <b>14 суток</b>, снаружи −170°, панели не дают энергии. Запасы можно ещё пополнить в «Закупках» и «Модулях», расчёт — в «📐 Расчёт».</p>','<p>The night is about to begin! It will last <b>14 days</b>. Outside, it\'s −170 °C, and the solar panels produce no power. You can still restock in “Supplies” and “Modules”; do the maths in “📐 Calc”.</p>')+(dr?'<p class="tag w">'+L('⚠ Бур работает: ещё +6 кВт·ч в сутки на каждый (за ночь +'+dr*84+'). Можно отправить оператора отдыхать.','⚠ Drills are running: each one uses an extra 6 kWh per day (+'+dr*84+' over the night). You can send the operator to rest.')+'</p>':'')+rows,
  [{t:L('📐 Расчёт','📐 Calculate'),f:function(){closeModal();calcModal(true)}},{t:L('📦 Закупки','📦 Supplies'),f:function(){closeModal();shopModal(nightPrep)}},{t:L('🏗 Модули','🏗 Modules'),f:function(){closeModal();modsModal(nightPrep)}},{t:L('🌙 Начать ночь','🌙 Start the night'),c:'go',f:function(){closeModal();confirmNight()}}]);
}
function nightLacks(){
 var nd=needs(),st=stocks(),ops=drillOps(false).length,out=[];
 if(st.energy+S.res.cells<nd.energy+ops*84)out.push(L('энергии на '+RU(nd.energy+ops*84-st.energy-S.res.cells)+' кВт·ч','energy: '+RU(nd.energy+ops*84-st.energy-S.res.cells)+' kWh'));
 if(st.water<nd.water)out.push(L('воды на '+RU(nd.water-st.water)+' л','water: '+RU(nd.water-st.water)+' L'));
 if(st.o2+ops*84<nd.o2)out.push(L('кислорода на '+RU(nd.o2-st.o2-ops*84)+' кг','oxygen: '+RU(nd.o2-st.o2-ops*84)+' kg'));
 if(st.food<nd.food)out.push(L('еды на '+RU(nd.food-st.food)+' пайков','food: '+RU(nd.food-st.food)+' rations'));
 return out;
}
function confirmNight(){
 var lk=nightLacks();
 if(!lk.length){startNight();return}
 modal(L('⚠ Запасов не хватит','⚠ Not enough supplies'),L('<p>На ночь не хватает: <b>'+lk.join('; ')+'</b>. Без этого экипаж замёрзнет или останется без еды. Докупи в «Закупках», построй энергоблок или сделай расчёт.</p>','<p>You are short for the night: <b>'+lk.join('; ')+'</b>. The crew will freeze or go hungry without it. Buy more in “Supplies”, build a power unit, or do the calculation.</p>'),
  [{t:L('↩ Вернуться','↩ Go back'),c:'go',f:function(){closeModal();nightPrep()}},{t:L('Всё равно начать','Start anyway'),f:function(){closeModal();startNight()}}]);
}
function startNight(){
 S.phase='night';S.day=0;S.warned={};busy=true;lockUI(true);S.crew.forEach(function(c){if(c.task==='roverA'||c.task==='roverB')c.task='rest'});
 refresh();
 runDays(14,false,420,function(){busy=false;dawn()});
}
function dawn(){
 var survived=S.crew.length>=2;
 if(!survived){gameOver();return}
 var g=GOALS[S.cycle-1],ok=g.chk();
 if(ok)S.credits+=g.b;
 var lowest=S.crew.reduce(function(a,c){return Math.min(a,c.hp)},100);
 var html=L('<p>Рассвет! Ночь пережили <b>'+S.crew.length+'</b> из экипажа. Самое низкое здоровье: '+Math.round(lowest)+'.</p>','<p>Sunrise! <b>'+S.crew.length+'</b> crew members survived the night. Lowest health: '+Math.round(lowest)+'.</p>')+
  '<p>'+L('Цель цикла: ','Cycle goal: ')+'<b>'+L(g.t,g.e)+'</b> — '+(ok?'<span class="tag ok">'+L('выполнена +','completed +')+g.b+' ₵</span>':'<span class="tag bad">'+L('не выполнена','not completed')+'</span>')+'</p>';
 if(S.cycle>=12){S.phase='end';modal(L('Финал','Finale'),html,[{t:L('Дальше','Next'),c:'go',f:function(){closeModal();finale()}}]);return}
 PF.interstitial(function(){
  modal(L('Рассвет, цикл ','Dawn, cycle ')+S.cycle,html,[{t:L('📡 Связь с Землёй','📡 Contact Earth'),c:'go',f:function(){closeModal();earthCall(2)}}]);
 });
}
function earthCall(n){
 if(n<=0){nextCycle();return}
 var free=[];QS.forEach(function(_,i){if(usedQ.indexOf(i)<0)free.push(i)});if(!free.length){usedQ=[];QS.forEach(function(_,i){free.push(i)})}
 var idx=pick(free);usedQ.push(idx);
 var q=(LANG==='en'?QS_EN:QS)[idx];
 var h='<p>📡 <b>'+L('Центр управления:','Mission Control:')+'</b> '+q[0]+'</p><div class="q" id="qa"></div><div id="qres"></div>';
 modal(L('Связь с Землёй','Contact with Earth'),h,[]);
 var box=$('qa');
 q[1].forEach(function(a,i){
  var b=document.createElement('button');b.textContent=a;
  b.onclick=function(){
   if(box.dataset.done)return;box.dataset.done=1;
   var right=i===q[2];b.classList.add(right?'right':'wrong');
   if(!right)box.children[q[2]].classList.add('right');
   if(right)S.credits+=10;
   $('qres').innerHTML='<p>'+(right?'<span class="tag ok">'+L('Верно! +10 ₵','Correct! +10 ₵')+'</span> ':'<span class="tag bad">'+L('Не совсем.','Not quite.')+'</span> ')+q[3]+'</p><div class="btns"><button class="go" id="qn">'+L('Дальше','Next')+'</button></div>';
   $('qn').onclick=function(){closeModal();earthCall(n-1)};
   refresh();
  };
  box.appendChild(b);
 });
}
function nextCycle(){
 S.cycle++;S.phase='day';S.step=0;S.day=0;S.calc={};S.st={ice:0,flareHurt:0};
 var target=3+(S.cycle>=4?1:0)+(S.cycle>=7?1:0)+(S.cycle>=10?1:0),msg='';
 while(S.crew.length<target){
  if(beds()>S.crew.length){var i=S.crew.length;var used=S.crew.map(function(c){return c.i});var id=0;while(used.indexOf(id)>=0)id++;S.crew.push(mkCrew(id));msg+=L('Прилетел(а) '+NAMES[id]+'. ',NAMES_EN[id]+' has arrived. ')}
  else{msg+=L('Земля задержала новичка: нет свободной койки (нужен ещё жилой модуль). ','Earth held back a newcomer: no free bed (build another habitat). ');break}
 }
 var grant=S.cycle>=4?60:40;
 S.credits+=grant;
 var cap=capR();
 S.res.food=r1(Math.min(cap,S.res.food+30));S.res.o2=r1(Math.min(cap,S.res.o2+20));S.res.water=r1(Math.min(cap,S.res.water+40));S.res.parts+=2;
 busy=false;lockUI(false);refresh();save();
 var g=GOALS[S.cycle-1];
 modal(L('Цикл '+S.cycle+' из 12','Cycle '+S.cycle+' of 12'),
  '<p>'+msg+'</p><p>'+L('Контейнер с Земли: 30 пайков, 20 кг O₂, 40 л воды, 2 запчасти, грант '+grant+' ₵ (всё, что влезло в склады).','Supply container from Earth: 30 rations, 20 kg O₂, 40 L water, 2 spare parts, a grant of '+grant+' ₵ (whatever fits in storage).')+'</p><p>🎯 '+L('Цель: ','Goal: ')+'<b>'+L(g.t,g.e)+'</b> (+'+g.b+' ₵)</p>'+(S.cycle===12?'<p>'+L('⚠ Главная ночь: события вдвое чаще.','⚠ Final night: events happen twice as often.')+'</p>':''),
  [{t:L('К работе','Get to work'),c:'go',f:function(){closeModal();if(giftReady())toast(L('🎁 Подарок Премиума ждёт в «Закупках»','🎁 Your Premium gift is waiting in “Supplies”'));try{Premium.maybeCard()}catch(e){}}}]);
}
function finale(){
 var alive=S.crew.length,stars=S.stars;
 var rank=alive>=5&&stars>=30?L('Командир базы','Base Commander'):alive>=4?L('Старший инженер','Senior Engineer'):L('Выживший','Survivor');
 PF.del('lunabaza-save');
 modal(L('🌕 12 циклов позади!','🌕 12 Cycles Complete!'),L('<p>База «Селена» выдержала 12 лунных ночей.</p><p>Живы: <b>'+alive+'</b> из экипажа · Звёзд точности: <b>'+stars+'</b> · ₵: <b>'+S.credits+'</b></p><p>Звание: <b>'+rank+'</b></p>','<p>Base “Selena” survived 12 lunar nights.</p><p>Alive: <b>'+alive+'</b> · Accuracy Stars: <b>'+stars+'</b> · ₵: <b>'+S.credits+'</b></p><p>Rank: <b>'+rank+'</b></p>'),[{t:L('В меню','Menu'),c:'go',f:function(){closeModal();showMenu()}}]);
}
function gameOver(){
 S.phase='over';busy=false;PF.del('lunabaza-save');
 modal(L('Миссия провалена','Mission Failed'),L('<p>На базе осталось меньше двух человек. Земля отзывает экспедицию.</p><p class="small">Цикл '+S.cycle+'. Главное — считать ночной запас заранее.</p>','<p>Fewer than two people are left on the base. Earth recalls the expedition.</p><p class="small">Cycle '+S.cycle+'. Remember to calculate the supplies you need for the night ahead of time.</p>'),[{t:L('В меню','Menu'),c:'go',f:function(){closeModal();showMenu()}}]);
}


function warnNeed(o){
 if(!S.warned)S.warned={};
 var list=[];
 if(o.lack.indexOf('кислород')>=0&&!S.warned.o2){S.warned.o2=1;list.push(L('кислород','oxygen'))}
 if(o.lack.indexOf('вода')>=0&&!S.warned.w){S.warned.w=1;list.push(L('вода','water'))}
 if(o.lack.indexOf('еда')>=0&&!S.warned.f){S.warned.f=1;list.push(L('еда','food'))}
 if(!o.powered&&!S.warned.e){S.warned.e=1;list.push(L('энергия (батареи пусты, в базе холодает)','energy (batteries empty, the base is getting cold)'))}
 return list.length?list:null;
}
function alertShortage(list,after){
 modal(L('⚠ Запас закончился!','⚠ Supplies Have Run Out!'),L('<p>Не хватает: <b>'+list.join(', ')+'</b>. Экипаж страдает. Срочно закажи с Земли (дорого, но спасает жизни).</p>','<p>Short of: <b>'+list.join(', ')+'</b>. The crew is in trouble. Order supplies from Earth now (expensive, but it can save lives).</p>'),
  [{t:L('📦 Закупки','📦 Supplies'),c:'go',f:function(){shopModal(after)}}].concat(PF.canReward()?[{t:L('🎬 Аварийная батарея (ролик, +20 кВт·ч)','🎬 Emergency battery (video, +20 kWh)'),c:'go',f:function(){PF.rewarded(function(got){if(got){S.res.cells+=20;refresh();toast(L('🔋 +20 кВт·ч в аварийные ячейки','🔋 Added 20 kWh to emergency power cells'))}else toast(L('Ролик не показан','The video was not shown'))});return false}}]:[],[{t:L('Дальше','Next'),f:function(){closeModal();after()}}]));
}

/* ---------- События ---------- */
function showEvent(ev,isDay,cont){
 if(ev==='flare'){
  var out=S.trip||S.crew.some(function(c){return c.task==='repair'});
  modal(L('☀ Солнечная вспышка!','☀ Solar flare!'),L(EVI('ev_flare')+'<p>Земля предупреждает: поток частиц. Те, кто снаружи ('+(out?'ровер идёт в рейс':'сейчас никого')+'), получат дозу радиации.</p>',EVI('ev_flare')+'<p>Earth warns: a stream of particles. Anyone outside ('+(out?'the rover is on a trip':'nobody right now')+') will get a dose of radiation.</p>'),
   [{t:L('🛡 Укрыться (рейс +1 шаг)','🛡 Take shelter (trip +1 step)'),f:function(){closeModal();if(S.trip)S.trip.left++;cont()}},
    {t:L('Работать дальше','Keep working'),f:function(){closeModal();if(S.trip){var w=S.crew.filter(function(c){return c.i===S.trip.who})[0];if(w){w.hp=Math.max(1,w.hp-30);S.st.flareHurt++;log('☢ '+cn(w)+L(' получил(а) дозу',' was exposed to radiation'))}}cont()}}]);
  return;
 }
 var cands=ev==='meteor'?S.mods.filter(function(m){return !m.dmg}):S.mods.filter(function(m){return !m.dmg&&(m.t==='drill'||m.t==='green'||m.t==='recy'||m.t==='power')});
 if(!cands.length){cont();return}
 var m=pick(cands);m.dmg=true;
 if(ev==='meteor')S.res.o2=Math.max(0,r1(S.res.o2-5));
 refresh();
 var can=S.res.parts>=1&&S.energy>=5;
 modal(ev==='meteor'?L('☄ Метеорит!','☄ Meteoroid Impact!'):L('⚠ Поломка','⚠ Breakdown'),
  L(EVI(ev==='meteor'?'ev_meteor':'ev_break')+'<p>'+(ev==='meteor'?'Микрометеорит попал в модуль «':'Отказало оборудование: «')+T[m.t].n+'». Он не работает'+(ev==='meteor'?', утечка 5 кг кислорода':'')+'.</p><p class="small">Ремонт: 1 запчасть и 5 кВт·ч. Запчастей: '+S.res.parts+'.</p>',EVI(ev==='meteor'?'ev_meteor':'ev_break')+'<p>'+(ev==='meteor'?'A micrometeoroid hit the module “':'Equipment failure: “')+T[m.t].ne+'”. It is no longer working'+(ev==='meteor'?', 5 kg of oxygen leaked':'')+'.</p><p class="small">Repair: 1 spare part and 5 kWh. Spare parts: '+S.res.parts+'.</p>'),
  [{t:can?L('🔧 Ремонт','🔧 Repair'):L('🔧 Нет ресурсов','🔧 No resources'),c:can?'go':'',f:function(){if(!can)return false;tryRepair();closeModal();refresh();cont()}},
   {t:L('Отложить','Later'),f:function(){closeModal();cont()}}]);
}

/* ---------- Окна ---------- */
function modal(title,body,btns){
 var sh=$('sheet');sh.innerHTML='<h2>'+title+'</h2>'+body+'<div class="btns" id="mb"></div>';
 var mb=$('mb');
 btns.forEach(function(b){var e=document.createElement('button');e.innerHTML=b.t;if(b.c)e.className=b.c;e.onclick=function(){if(b.f()===false)return};mb.appendChild(e)});
 if(!btns.length)mb.remove();
 $('ov').classList.add('on');sh.scrollTop=0;gp();
}
function closeModal(){$('ov').classList.remove('on');gp()}
function gp(){try{PF.setPlaying(!!S&&S.phase!=='over'&&S.phase!=='end'&&!$('ov').classList.contains('on')&&$('menu').style.display==='none')}catch(e){}}
function toast(m,h){var t=$('toast');if(h)t.innerHTML=h;else t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2200)}
