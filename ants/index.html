<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Муравейник</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b1d12;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3b2a1a;overflow:hidden}
#app{position:relative;width:100%;max-width:375px;height:100%;max-height:812px;margin:0 auto;display:flex;flex-direction:column;background:#fff4d6;overflow:hidden}
#top{display:flex;gap:4px;padding:6px 8px;background:#6b4423;color:#fff;font-size:13px;font-weight:700;align-items:center;justify-content:space-between;flex:0 0 auto}
#top span{background:rgba(0,0,0,.25);padding:4px 7px;border-radius:10px;white-space:nowrap}
#cv{display:block;width:100%;flex:0 0 auto;aspect-ratio:375/250;background:#8bd3ff}
#banner{flex:0 0 auto;font-size:12px;padding:4px 8px;background:#ffe9a8;border-bottom:2px solid #e0c26a;min-height:26px;line-height:1.25}
#tabs{display:flex;flex:0 0 auto;background:#e8c98f}
#tabs button{flex:1;border:0;padding:10px 0;font-size:14px;font-weight:700;background:transparent;color:#5a3a1a}
#tabs button.on{background:#fff4d6;color:#b3410a;box-shadow:inset 0 -3px #ff8a1f}
#panel{flex:1 1 auto;overflow-y:auto;padding:8px 10px;font-size:14px}
#nextwrap{flex:0 0 auto;padding:8px;background:#6b4423}
#next{width:100%;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(#ff9a2f,#f06a00);box-shadow:0 3px #a64400}
#next:active{transform:translateY(2px);box-shadow:0 1px #a64400}
.row{display:flex;align-items:center;gap:6px;margin:6px 0}
.row .nm{flex:1;font-weight:600}
.row .v{width:84px;text-align:center;font-weight:700;font-size:13px}
.sb{width:38px;height:34px;border:0;border-radius:10px;background:#ff9a2f;color:#fff;font-size:20px;font-weight:800}
.sb:disabled{background:#d8c9a8}
h3{margin:10px 0 4px;font-size:15px;color:#b3410a}
.card{background:#fff;border:2px solid #e0c26a;border-radius:12px;padding:8px;margin:6px 0}
.small{font-size:12px;color:#7a5a38}
.bar{height:10px;background:#e8d8b0;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#4caf50}
.bad{color:#c62828;font-weight:700}.good{color:#2e7d32;font-weight:700}
.btn{border:0;border-radius:10px;padding:9px 12px;background:#ff9a2f;color:#fff;font-weight:800;font-size:14px}
.btn:disabled{background:#d8c9a8}
.btn.alt{background:#7a5a38}
#modal{position:absolute;inset:0;background:rgba(30,15,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#mcard{background:#fff4d6;border:4px solid #6b4423;border-radius:18px;padding:14px;width:100%;max-height:96%;overflow-y:auto}
#mcard h2{margin:0 0 8px;font-size:19px;color:#b3410a}
#mcard p{margin:6px 0;font-size:15px;line-height:1.35}
#mcard .opt{display:block;width:100%;margin:6px 0;text-align:left}
#mcard input{width:100%;font-size:20px;padding:8px;border:2px solid #6b4423;border-radius:10px;margin:6px 0}
.opt.ok{background:#2e9e44!important}.opt.no{background:#d33!important}
#cover{width:100%;aspect-ratio:2/3;max-height:260px;object-fit:cover;border-radius:12px;display:none;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <canvas id="cv" width="375" height="250"></canvas>
  <div id="banner"></div>
  <div id="tabs"><button data-t="tasks" class="on">Задачи</button><button data-t="build">Стройка</button><button data-t="info">Сводка</button></div>
  <div id="panel"></div>
  <div id="nextwrap"><button id="next">Следующий день ▶</button></div>
  <div id="modal"><div id="mcard"></div></div>
</div>
<script>

var CH={
 store:{n:'Склад',ico:'🌾',cm:12,e:'+300 крошек вместимости',max:9},

};
var GOALS=[50,100,160];
var QUIZ=[
 ['Сколько ног у муравья?',['4','6','8','10'],1,'Муравей — насекомое, у всех насекомых 6 ног. У паука их 8, он не насекомое.'],
 ['Из каких частей состоит тело муравья?',['голова, грудь, брюшко','голова и туловище','только голова и хвост','панцирь и лапы'],0,'Тело насекомого делится на голову, грудь и брюшко.'],
 ['Что получают муравьи от тли?',['кровь','сладкую падь','шерсть','яйца'],1,'Тля пьёт сок растений и выделяет сладкую жидкость — падь. Муравьи её «доят» и охраняют тлю.'],
 ['Кто в муравейнике откладывает яйца?',['солдат','рабочий','королева (матка)','нянька'],2,'Яйца откладывает королева. Остальные заняты добычей, охраной и уходом.'],
 ['Какие стадии развития у муравья?',['яйцо → взрослый','яйцо → личинка → куколка → взрослый','личинка → яйцо → взрослый','куколка → яйцо → личинка'],1,'Развитие с полным превращением: яйцо, личинка, куколка, взрослое насекомое.'],
 ['Для чего муравью усики?',['для запаха и осязания','для полёта','для дыхания','для жевания'],0,'Усики — орган обоняния и осязания: муравей «читает» запахи и ощупывает мир.'],
 ['Как муравьи «разговаривают» друг с другом?',['песнями','с помощью запахов (феромонов)','светом','стуком по земле'],1,'Муравьи оставляют пахучие следы-феромоны и обмениваются ими при встрече.'],
 ['Как зимуют муравьи умеренного пояса?',['улетают на юг','впадают в оцепенение глубоко в гнезде','строят новые гнёзда на снегу','погибают все, кроме королевы'],1,'Зимой они почти не двигаются в глубине гнезда и расходуют запасы очень экономно.'],
 ['Какая польза от лесных муравьёв?',['едят листья деревьев','уничтожают вредных насекомых','опыляют ёлки','строят дороги'],1,'Лесные муравьи — «санитары леса»: съедают множество гусениц и других вредителей.'],
 ['Кто из них НЕ насекомое?',['пчела','жук','паук','муха'],2,'Паук — паукообразное: у него 8 ног и два отдела тела.'],
 ['Кем была бабочка до того, как стать бабочкой?',['куколкой, а до неё — гусеницей','головастиком','червём-нематодой','муравьём'],0,'Гусеница — личинка бабочки. Потом она окукливается и становится взрослой бабочкой.'],
 ['Что защищает тело муравья снаружи?',['шерсть','чешуя','хитиновый покров (наружный скелет)','кожа как у человека'],2,'Хитиновый покров — прочный наружный скелет, к нему изнутри прикреплены мышцы.'],
 ['Зачем солдатам нужны крупная голова и челюсти?',['для защиты гнезда','для полёта','для плавания','для пения'],0,'Солдаты охраняют гнездо и сражаются с врагами.'],
 ['Когда у муравьёв бывают крылья?',['у всех всегда','у самцов и молодых цариц для брачного полёта','никогда','только у рабочих'],1,'Крылатые самцы и молодые самки вылетают, чтобы основать новые колонии.'],
 ['Чем дышат насекомые?',['лёгкими','жабрами','дыхальцами и трахеями','кожей головы'],2,'Воздух проходит через дыхальца на боках тела по трубочкам-трахеям.'],
 ['Какой органический продукт муравьи используют для защиты?',['муравьиную кислоту','мёд','молоко','смолу сосны только'],0,'Многие муравьи могут брызгать муравьиной кислотой — она отпугивает врагов.']
];
/* ---------- картинки-слоты (запасной вариант — код) ---------- */
var IMG={},USE_ART=true;/* false — всё рисуется кодом; картинки: game/img/*.webp (tools/make_art.py) */
function imgSrc(n){return IMGDATA?IMGDATA[n]:'img/'+n+'.webp'}
function art(n){if(!USE_ART)return null;var o=IMG[n];if(!o){o=IMG[n]={i:new Image(),ok:false};o.i.onload=function(){o.ok=true};o.i.onerror=function(){o.ok=false};o.i.src=imgSrc(n);}return o.ok?o.i:null}
/* ---------- Слой платформы: Яндекс Игры SDK (без SDK — заглушки) ---------- */
var YANDEX=false,IMGDATA=null;/*BUILD-FLAGS: сборка подставляет значения*/
var PF=(function(){var y=null,ok=false,ready=false,wantReady=false,adBusy=false,hid=false,apiP=false,gp=false,wantGp=false,lastAd=0,born=Date.now(),AD1=120000,GAP=180000,self={onPause:function(){}};
 function paused(){return adBusy||hid||apiP}
 function applyGp(){if(!ok||!ready)return;var sh=wantGp&&!paused();if(sh===gp)return;gp=sh;try{var g=y.features&&y.features.GameplayAPI;if(g){if(sh)g.start();else g.stop()}}catch(e){}}
 function ch(){applyGp();try{self.onPause(paused())}catch(e){}}
 function tryReady(){if(ready||!wantReady||!ok)return;ready=true;try{var l=y.features&&y.features.LoadingAPI;if(l)l.ready()}catch(e){}applyGp()}
 self.paused=paused;self.hasSdk=function(){return ok};
 self.setPlaying=function(on){wantGp=!!on;applyGp()};
 self.ready=function(){wantReady=true;tryReady()};
 self.init=function(){try{document.addEventListener('visibilitychange',function(){hid=!!document.hidden;ch()})}catch(e){}
  if(!window.YaGames||!window.YaGames.init)return Promise.resolve();
  return new Promise(function(res){var tm=setTimeout(res,4000);
   try{window.YaGames.init().then(function(sdk){y=sdk;ok=true;try{sdk.on('game_api_pause',function(){apiP=true;ch()});sdk.on('game_api_resume',function(){apiP=false;ch()})}catch(e){}tryReady();clearTimeout(tm);res()},function(){clearTimeout(tm);res()})}catch(e){clearTimeout(tm);res()}})};
 function adEnd(){adBusy=false;ch()}
 /* полноэкранная реклама: первая не раньше 2 мин после загрузки, дальше не чаще раза в 3 мин; done — ровно один раз */
 self.interstitial=function(done){var now=Date.now(),at=lastAd?lastAd+GAP:born+AD1;if(adBusy)return;if(!ok||!y.adv||!y.adv.showFullscreenAdv||now<at){done();return}
  var fin=false;function end(sh){if(fin)return;fin=true;if(sh)lastAd=Date.now();adEnd();done()}
  adBusy=true;ch();try{y.adv.showFullscreenAdv({callbacks:{onClose:function(w){end(w)},onError:function(){end(false)},onOffline:function(){end(false)}}})}catch(e){end(false)}};
 self.canReward=function(){return ok?!!(!adBusy&&y.adv&&y.adv.showRewardedVideo):!YANDEX};
 /* ролик за награду: done(true) только если награда засчитана; вне Яндекса (сайт, артефакт) — заглушка с мгновенной наградой */
 self.rewarded=function(done){if(!ok){done(!YANDEX);return}if(!self.canReward()){done(false);return}
  var fin=false,got=false;function end(){if(fin)return;fin=true;if(got)lastAd=Date.now();adEnd();done(got)}
  adBusy=true;ch();try{y.adv.showRewardedVideo({callbacks:{onRewarded:function(){got=true},onClose:end,onError:end}})}catch(e){end()}};
 return self})();
/* ---------- состояние ---------- */
var s,tab='tasks',Q=[],busy=false,over=false,rnd=Math.random;
function fresh(){return{day:1,food:150,ants:{work:18,sold:5,nurse:7},brood:[0,0,0,0],
 alloc:{forage:70,build:30,milk:0},hatch:{work:50,sold:20,nurse:30},
 ch:{store:1,nursery:1,dorm:1,barracks:0,farm:0},project:null,forecast:null,knowl:1,hedge:{},winters:0,
 last:null,log:[],ads:0,goalsOk:[]}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(s))}catch(e){}}
function load(){try{var t=localStorage.getItem(SAVE);if(!t)return null;var o=JSON.parse(t);if(o&&o.ants&&o.day)return o}catch(e){}return null}
function sOf(d){return Math.floor(((d-1)%40)/10)}
function yOf(d){return Math.floor((d-1)/40)+1}
function adults(){return s.ants.work+s.ants.sold+s.ants.nurse}
function broodN(){return s.brood[0]+s.brood[1]+s.brood[2]+s.brood[3]}
function capStore(){return 250+300*(s.ch.store-1)}
function capNurs(){return 40*s.ch.nursery}
function capDorm(){return 10+50*s.ch.dorm}
function sp(){return s.ch.barracks?3:2}
function split(){var W=s.ants.work,a=s.alloc,se=sOf(s.day);if(se==3)return{f:0,b:0,m:0,idle:W};
 var m=Math.min(Math.floor(W*a.milk/100),s.ch.farm*8),b=Math.floor(W*a.build/100),f=W-m-b;if(s.alloc.milk>0&&m<Math.floor(W*a.milk/100)){}
 return{f:f,b:b,m:m,idle:0}}
function needDay(){var w=sOf(s.day)==3;return Math.ceil(adults()*(w?.5:2)+(w?1:4)+broodN()*(w?.5:1))}
function nextCm(){return s.project?s.project.left:0}
function toast(t){s.log.unshift(t);if(s.log.length>12)s.log.pop()}
/* ---------- модальные окна и очередь ---------- */
function enq(f){Q.push(f);if(!busy)pump()}
function pump(){if(over)return;if(!Q.length){busy=false;$('modal').style.display='none';PF.setPlaying(true);render();return}busy=true;PF.setPlaying(false);var f=Q.shift();f(pump)}
function show(html,btns,done){$('mcard').innerHTML=html+'<div id="mb"></div>';$('modal').style.display='flex';var c=$('mb');
 btns.forEach(function(b){var e=document.createElement('button');e.className='btn opt'+(b.alt?' alt':'');e.textContent=b.t;if(b.off)e.disabled=true;e.onclick=function(){if(b.f)b.f();done()};c.appendChild(e)})}
function pimg(n){return USE_ART?'<img src="'+imgSrc(n)+'" alt="" style="display:block;margin:0 auto 6px;height:96px" onerror="this.style.display=\'none\'">':''}
function info(h,t,done,label){show('<h2>'+h+'</h2><p>'+t+'</p>',[{t:label||'Дальше'}],done)}
function quiz(i,onres){return function(done){var q=QUIZ[i],idx=[0,1,2,3].sort(function(){return rnd()-.5});
 $('mcard').innerHTML='<h2>🔬 Урок природоведа</h2><p><b>'+q[0]+'</b></p><div id="mb"></div>';$('modal').style.display='flex';var c=$('mb'),answered=false;
 idx.forEach(function(k){var e=document.createElement('button');e.className='btn opt';e.textContent=q[1][k];e.onclick=function(){if(answered)return;answered=true;var ok=k==q[2];e.classList.add(ok?'ok':'no');
  if(!ok)[].forEach.call(c.children,function(x){if(x.textContent==q[1][q[2]])x.classList.add('ok')});
  var p=document.createElement('p');p.innerHTML=(ok?'<span class="good">Верно!</span> ':'<span class="bad">Не совсем.</span> ')+q[3];c.appendChild(p);
  var n=document.createElement('button');n.className='btn opt alt';n.textContent='Дальше';n.onclick=function(){onres(ok);done()};c.appendChild(n)};c.appendChild(e)})}}
/* ---------- расчётные задачи из данных колонии ---------- */
function mathQ(){var t=Math.floor(rnd()*5),W=s.ants.work,A=adults(),q,ans,sol;
 if(t==0){q='Зимой (спячка) взрослые муравьи едят по полкрошки в день, королева — 1. В колонии '+A+' взрослых. Сколько крошек нужно на зиму (10 дней)?';ans=(A*0.5+1)*10;sol='(взрослые × 0,5 + королева 1) × 10 = ('+A+' × 0,5 + 1) × 10 = '+ans}
 else if(t==1){var b=Math.max(2,Math.floor(W*s.alloc.build/100));var cm=[10,12,15,18][Math.floor(rnd()*4)];ans=Math.ceil(cm/(b*0.5));q='Строителей: '+b+', каждый копает 0,5 см в день. Туннель к камере — '+cm+' см. За сколько дней его выкопают (с округлением вверх)?';sol='скорость = '+b+' × 0,5 = '+(b*0.5)+' см/день; '+cm+' ÷ '+(b*0.5)+' ≈ '+(cm/(b*0.5)).toFixed(1)+' → '+ans+' дн.'}
 else if(t==2){var p=[10,20,25,40,50,60][Math.floor(rnd()*6)],W2=Math.max(20,Math.round(W/10)*10||20);ans=W2*p/100;q='Из '+W2+' рабочих '+p+' % отправили на добычу. Сколько это муравьёв?';sol=W2+' × '+p+' ÷ 100 = '+ans}
 else if(t==3){ans=A*2+4;q='Каждый взрослый ест 2 крошки в день, королева — 4. Взрослых: '+A+'. Сколько крошек нужно колонии в день?';sol=A+' × 2 + 4 = '+ans}
 else{var pw=[8,16,20,32][Math.floor(rnd()*4)];ans=Math.ceil(pw/sp());q='Сила врага — '+pw+'. Сила одного солдата — '+sp()+'. Сколько солдат нужно, чтобы выстоять?';sol=pw+' ÷ '+sp()+' = '+(pw/sp()).toFixed(1)+' → '+ans+' (округляем вверх)'}
 return function(done){$('mcard').innerHTML='<h2>🧮 Расчёт сезона</h2><p>'+q+'</p><input id="ai" type="number" inputmode="numeric" placeholder="ответ"><div id="mb"></div>';$('modal').style.display='flex';
  var b=document.createElement('button');b.className='btn opt';b.textContent='Проверить';b.onclick=function(){var v=parseFloat($('ai').value);if(isNaN(v))return;b.remove();var ok=Math.abs(v-ans)<0.01;
   if(ok){s.food+=30;toast('Расчёт верный: +30 крошек')}

   var n=document.createElement('button');n.className='btn opt alt';n.textContent='Дальше';n.onclick=done;$('mb').appendChild(n)};$('mb').appendChild(b)}}
/* ---------- ход ---------- */
function nextDay(){if(busy||over||PF.paused())return;var d=s.day,se=sOf(d),yr=yOf(d),mods={forage:1,hide:false};
 if(d%10==1)enq(mathQ());
 if(se<3&&rnd()<.12){mods.forage=.3;toast('🌧 Дождь: добыча ×0,3')}
 if(se==1&&rnd()<.08)enq(function(done){show(pimg('en_lens')+'<h2>🔍 Дети с лупой!</h2><p>На поверхности дети разглядывают насекомых. Что делать?</p>',[{t:'Затаиться (день без добычи)',f:function(){mods.hide=true}},{t:'Рискнуть (−4 добытчика, добыча как обычно)',f:function(){s.ants.work=Math.max(0,s.ants.work-4);toast('Дети поймали 4 добытчиков')}}],done)});
 if(se==2&&!s.hedge[yr]&&rnd()<.15){s.hedge[yr]=1;enq(function(done){show(pimg('en_hedgehog')+'<h2>🦔 Ёж!</h2><p>Ёж бродит у входа и давит муравьёв. Бороться с ним нельзя.</p>',[{t:'Спрятаться (день без добычи)',f:function(){mods.hide=true}},{t:'Не обращать внимания (−15 % рабочих)',f:function(){var l=Math.ceil(s.ants.work*.15);s.ants.work-=l;toast('Ёж унёс '+l+' рабочих')}}],done)})}

function simDay(mods){var d=s.day,se=sOf(d),yr=yOf(d),r={d:d,lines:[]},c=split(),W=s.ants.work;
